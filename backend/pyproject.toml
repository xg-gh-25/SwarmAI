[project]
name = "swarmai-backend"
version = "1.25.0"
description = "SwarmAI Backend - Human directs. AI delivers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # FastAPI and server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.12",
    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Claude Agent SDK
    "claude-agent-sdk==0.2.109",
    # SQLite
    "aiosqlite>=0.20.0",
    # Authentication
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # AWS SDK (credential validation via STS, credential chain probing)
    "boto3>=1.35.0",
    # System monitoring
    "psutil>=5.9.0",
    # Vector search for hybrid memory retrieval
    "sqlite-vec>=0.1.6",
    # Utilities
    "pyyaml>=6.0.0",
    "anyio>=4.0.0",
    "altgraph",
    "macholib",
    "pyinstaller>=6.18.0",
    "pyinstaller-hooks-contrib==2025.11",
    "setuptools>=80.9.0",
    # Slack Socket Mode adapter
    "slack-bolt>=1.27.0",
    # Voice transcription (Amazon Transcribe Streaming)
    "amazon-transcribe>=0.6.0",
    # Skill dependencies — used by s_pptx, s_docx, s_xlsx scripts
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.0",
    "Pillow>=10.0.0",
    "markitdown[pptx]>=0.1.0",
    "six>=1.16.0",
    # MCP server (for channel file sending tool)
    # "mcp>=1.0.0,<2.0.0",
    # Code Intelligence — tree-sitter AST parsing (falls back to regex if unavailable)
    "tree-sitter>=0.24.0",
    "tree-sitter-language-pack>=0.5.0,!=1.6.3",
    # Code Intelligence — FS watcher for auto-refresh (Rust-based, async-native)
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "hypothesis>=6.151.6",
    # Code-security boundary gate (scripts/security_scan.py). Pinned EXACT:
    # detect-secrets embeds a plugin set + version in .secrets.baseline; a version
    # drift silently degrades detection (fails open), so the baseline generator and
    # the CI checker MUST run the identical version. bandit pinned for parity.
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
python_files = ["test_*.py"]
# Cache last-run results so --lf (last-failed) works out of the box
cache_dir = ".pytest_cache"
# Default: SERIAL (-n 0). xdist parallelism is OPT-IN, not default, because the
# subprocess-/event-loop-/flock-heavy suites (recovery, healing, lifecycle,
# session_unit, context_health) DEADLOCK under xdist: a worker crashes with an
# execnet gateway read error and the controller hangs waiting on it — the
# "30-min hang bug" documented in tests/conftest.py. Serial-by-default makes the
# safe behavior the default so a careless/agent multi-file run can't wedge.
# For a large, known-safe batch run, opt in explicitly: `pytest -n 4`
# (conftest still clamps to a memory-safe worker count). Targeted single-file
# runs during coding are already fast serial.
# Per-test timeout: conftest SIGALRM at 30s (override with @pytest.mark.timeout(N)).
# For coding loops: `make test-changed` (serial, only changed files).
addopts = "-n 0 --maxfail=3 --tb=short -q"
markers = [
    "pbt: property-based tests using Hypothesis (auto-applied by conftest)",
    "slow: marks tests as slow-running (deselect with '-m not slow')",
    "integration: tests requiring external resources",
    "timeout: override per-test timeout in seconds (e.g. @pytest.mark.timeout(60))",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "hypothesis>=6.151.6",
    # Kept in sync with [project.optional-dependencies].dev — see note there.
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
]
