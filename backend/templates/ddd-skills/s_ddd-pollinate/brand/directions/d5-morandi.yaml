# D5: Morandi (莫兰迪)
# Mood: 柔和叙事 — "咖啡店里跟朋友分享一个故事"
# Use for: 叙事、故事、人文主题、情感表达、个人经历
# Key trait: Muted warm tones, soft gradients, large radius, NO hard borders

id: d5
name: Morandi
name_cn: 莫兰迪
mood: "咖啡店里跟朋友分享一个故事"

# ─── Semantic Tokens ───────────────────────────────────────
tokens:
  bg-deep: "#F2EDE8"                     # Warm linen
  bg-elevated: "#FFFFFF"                  # White card
  bg-surface: "rgba(180,160,140,0.05)"   # Warm surface
  border: "rgba(180,160,140,0.12)"       # Soft warm border
  accent: "#B08D6B"                      # Warm camel
  accent-dim: "rgba(176,141,107,0.10)"   # Camel at low opacity
  accent-glow: "none"                    # No glow — shadows only
  text-primary: "#3D3530"               # Warm dark brown
  text-secondary: "rgba(61,53,48,0.65)" # Muted brown
  text-muted: "rgba(61,53,48,0.4)"      # Faint brown
  accent-secondary: "#7B9E89"            # Sage green for variety

# ─── Morandi Gradient Cards (rotate, never repeat) ─────────
palette_cards:
  - "linear-gradient(160deg, #E8DDD4, #F5EDE5)"   # Cream
  - "linear-gradient(160deg, #D4DDE8, #E5EDF5)"   # Powder blue
  - "linear-gradient(160deg, #DDE8D4, #EDF5E5)"   # Sage
  - "linear-gradient(160deg, #E8D4DD, #F5E5ED)"   # Rose
  - "linear-gradient(160deg, #E8E4D4, #F5F1E5)"   # Sand
  - "linear-gradient(160deg, #D4D8E8, #E5E9F5)"   # Lavender
  - "linear-gradient(160deg, #D4E8E4, #E5F5F1)"   # Mint

# ─── Typography ────────────────────────────────────────────
typography:
  headline-font: "PingFang SC"
  headline-weight: 500                   # Medium — not heavy
  body-font: "PingFang SC"
  body-weight: 400
  code-font: "SF Mono"
  en-display: "Manrope"                  # Rounded, warm
  en-display-weight: 600

# ─── Visual Elements ───────────────────────────────────────
visual_elements:
  - "Morandi gradient cards (32px radius, soft shadow)"
  - "NO hard borders — only shadows define card boundaries"
  - "Large border-radius everywhere (24-32px)"
  - "Frosted glass badges (backdrop-filter: blur(8px), white at 80%)"
  - "Pill-shaped CTAs (border-radius: 999px)"
  - "Gradient direction: always 160deg (consistent across all cards)"

# ─── Divider Alternation ──────────────────────────────────
dividers:
  - type: gradient_fade
    spec: "48px height, linear-gradient(to bottom, bg-deep, transparent)"
  - type: space
    spec: "96px vertical spacing (generous breathing room)"

# ─── Card Variety ──────────────────────────────────────────
card_styles:
  1: "Gradient card — Morandi palette, 32px radius, soft shadow"
  2: "Frosted badge — white at 80%, blur(8px), pill shape"
  3: "Two-tone — accent-secondary left bar, body right"
  4: "Quote float — large italic text, centered, no container"
  5: "Stacked pills — key points as pill-shaped badges"
  6: "Full bleed gradient — edge-to-edge Morandi, white text"

# ─── Content Affinity ─────────────────────────────────────
content_triggers:
  strong:
    - "is_narrative"
    - "is_personal_story"
    - "is_human_interest"
  moderate:
    - "is_emotional_expression"
    - "needs_warmth_approachability"
    - "is_lifestyle_content"
  weak:
    - "is_technical_deep_dive"
    - "has_code_blocks"
    - "is_data_heavy"

# ─── CSS Quick Reference ──────────────────────────────────
css_snippet: |
  :root {
    --bg-deep: #F2EDE8;
    --bg-elevated: #FFFFFF;
    --bg-surface: rgba(180,160,140,0.05);
    --border: rgba(180,160,140,0.12);
    --accent: #B08D6B;
    --accent-dim: rgba(176,141,107,0.10);
    --accent-glow: none;
    --accent-secondary: #7B9E89;
    --text-primary: #3D3530;
    --text-secondary: rgba(61,53,48,0.65);
    --text-muted: rgba(61,53,48,0.4);
  }
