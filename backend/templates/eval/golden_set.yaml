  purpose:
    en: A subprocess that dies mid-turn is respawned and the turn resumes, and a silent spawn is caught
      while a young one is left alone. If this breaks, a crash ends your conversation or a tab spins forever.
    zh: 子进程中途挂掉会被重启并继续这一轮，不出声的子进程会被发现，刚启动的不误杀。坏了意味着一次崩溃就中断对话，或标签页一直转圈。
