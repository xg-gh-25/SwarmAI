# SwarmAI product golden set — shipped with the backend, the same on every install.
#
# Read-only at runtime: nothing on a user's machine writes this file. A user's own
# cases live in <workspace>/Eval/golden_set.private.yaml. Every case here must run
# on a fresh install (no project, no source checkout, no user data): BVT probes run
# as `"$SWARM_BACKEND_BIN" py -m scripts.<probe>` with a temporary data dir,
# workspace and HOME (eval_runner._run_case_command). Each case says in `purpose`
# what it protects and what breaks for the user if it fails.
#
# Editing a case changes its content stamp: re-stamp it (validated_by_4gate =
# golden_case_validator.compute_case_stamp) in the same change, or it drops out of
# the BVT. tests/test_eval_product_set.py checks this.
version: 2
categories:
- decision
- refusal
- recall
- compliance
- action
- recovery
- knowledge
- ddd_informed
- code_aware
- quality
- loop_active
- cultivation
- safety
- memory
- runtime_health
- context
- ingestion
- ddd
- pipeline
- eval
- judgment
eval_methods:
- llm
- programmatic
- behavior
evaluator_types:
  programmatic:
  - canary_pass
  - file_contains
  - keyword_match
  - trajectory_exact
  - trajectory_in_order
  - trajectory_any_order
  llm_judge:
  - goal_success
  - quality_score
  behavior:
  - trajectory_capture
dimensions:
- cognition
- quality
- responsibility
- cost
- performance
cases:
- id: CTX_CORE
  category: context
  dimension: cognition
  level: tool_call
  title: Every session carries the full identity and rules files
  purpose:
    en: Every session starts with the full identity and rules files, and a failing extra section does
      not drop them. If this breaks, the agent forgets its own rules.
    zh: 每次会话都带着完整的身份和规则文件，某个附加段落出错也不会把它们一起丢掉。坏了意味着 agent 忘掉自己的规则。
  verification:
    command: '"$SWARM_BACKEND_BIN" py -m scripts.probe_context core'
    expected_contains: CTX_CORE_OK
    negative_command: '"$SWARM_BACKEND_BIN" py -m scripts.probe_context core negative'
    negative_expected_contains: CTX_CORE_TEETH
  evaluators:
  - canary_pass
  affected_by:
  - backend/core/context_directory_loader.py
  - backend/core/prompt_builder.py
  tier: stable
  gating: gate
  eval_method: programmatic
  validated_by_4gate: 703afa15b5ccd001
