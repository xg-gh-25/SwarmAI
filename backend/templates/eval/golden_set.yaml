  decision_rubric: 'Judge the JSON entries in the answer against repos/ledgerd. Their sections, sources and format
    are checked by code: do not judge those. This is everything the material says; a claim outside it is unsupported.
    repos/ledgerd/README.md: a double-entry ledger of transfers between accounts, every transfer two postings that
    sum to zero, a balance the sum of an account''s postings; an HTTP+JSON API on port 9180; everything in Postgres;
    make run needs DATABASE_URL. repos/ledgerd/docs/ARCHITECTURE.md: cmd/ledgerd starts the server (internal/api),
    which calls internal/ledger for the transfer rules; internal/store is the only package that talks to Postgres;
    amounts are int64 minor units (cents), never float64, or rounding breaks the zero sum and the ledger refuses
    the transfer; a transfer locks both accounts before reading balances, always the lower account id first, else
    two opposite transfers deadlock. repos/ledgerd/docs/RUNBOOK.md: migrations run before the new binary starts
    and the old binary serves until the rolling deploy ends, so a migration never drops or renames a column the
    old binary reads (add, deploy, remove in a later release). repos/ledgerd/docs/adr/0001-postgres-advisory-locks.md:
    Accepted: per-account transaction-scoped Postgres advisory locks (pg_advisory_xact_lock) before reading balances,
    because concurrent transfers could overdraw an account; why: Postgres is already the source of truth, the lock
    ends with the transaction, no other service; rejected: Redis locks (another service, timing assumptions) and
    SERIALIZABLE for every transfer (most failed and retried under load). repos/ledgerd/docs/adr/0002-idempotency-keys.md:
    Accepted: POST /transfers requires an Idempotency-Key, the response stored 24 hours and replayed, because retried
    requests created second transfers; rejected: treating the same (from, to, amount) within 60 seconds as a duplicate
    (genuine identical transfers were dropped). repos/ledgerd/docs/adr/0003-grpc-api.md: Rejected: gRPC; the API
    stays HTTP+JSON because partner banks can only make HTTPS JSON requests. repos/ledgerd/Makefile: make test runs
    go test -race ./..., make lint runs golangci-lint. repos/ledgerd/cmd/ledgerd/main.go: the server listens on
    :9180. repos/ledgerd/internal/api/transfers.go: POST /transfers answers 400 when the Idempotency-Key header
    is missing, else 201; a stored response for the key is kept 24 hours. repos/ledgerd/internal/ledger/ledger.go:
    a Posting is an account and an int64 amount in minor units; Transfer builds the two postings and returns ErrUnbalanced
    when they do not sum to zero. repos/ledgerd/internal/store/locks.go: LockAccounts sorts the account ids ascending
    and takes pg_advisory_xact_lock on each. repos/ledgerd/go.mod: module example.com/ledgerd, Go 1.22. repos/ledgerd/notes/sprint-14.md
    is a status log, not a fact: an entry built from it is unsupported too. PASS only if all of: (1) an entry: a
    decision for the per-account advisory locks, with its why and Redis locks or SERIALIZABLE as a rejected alternative;
    (2) an entry: a decision for the Idempotency-Key, with the duplicate-transfer why and the 60-second amount-window
    dedupe as rejected; (3) an entry: a transfer locks the lower account id first; (4) an entry: a migration must
    stay compatible with the old binary during a rolling deploy. FAIL if any of: (a) a claim outside the facts above
    or contradicting them; (b) an entry that falls for the trap in repos/ledgerd/docs/adr/0003-grpc-api.md, which
    a rejected ADR; an entry that presents gRPC as used or planned, or Redis as used, takes a rejected option for
    the plan. In notes give exactly: must-haves found x/4; unsupported claims n; traps followed n.'
  bootstrap_check:
    brain: Ledgerd
    empty_sections:
    - Strategic Priorities
    - Success Criteria
    status_sources:
    - repos/ledgerd/notes/sprint-14.md
    repo: repos/ledgerd
