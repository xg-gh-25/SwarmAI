    email link) can be checked when it comes back, and loads() refuses a changed value; it does not encrypt, a signed
    value is readable, never put a secret in one; unlike JWT, a token has no algorithm field, so the server alone
    picks the digest and a forged token cannot ask for none or a weaker algorithm. repos/tokensign/docs/design.md:
    HMAC, default digest SHA-1 kept for 1.x tokens; changing the digest makes every token signed before fail unless
