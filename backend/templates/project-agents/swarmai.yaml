# Project Agent definition: how a Hive run does this Brain's work.
# The agent keeps it current; a dispatch uses the latest. Nothing in it is confirmed.
# Fields: templates/project-agents/STANDARD.md.
# Shipped with SwarmAI: the Project Agent of the default SwarmAI Brain. It names only what a fresh
# install has (the four seed documents); with the SwarmAI repo bound, `artifact_cli project-agent-draft
# --project SwarmAI` drafts the full definition (with a code-change mode).
schema: 2
identity:
  summary: 'SwarmAI itself, the self-evolving Agent OS: how it works and how to use it'
  source: PRODUCT.md
intake:
  handles:
  - explain how a SwarmAI feature works
  - investigate why SwarmAI behaved a certain way
  - write a note or a design about SwarmAI
modes:
- id: research
  when: a question or an investigation, answered in the conversation
- id: write
  when: a document or a report as the deliverable
default_mode: research
gates:
  enforce: []
