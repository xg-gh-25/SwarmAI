# Pollinate Brand Defaults
# The neutral default for every Pollinate output. A user's own brand lives in
# ~/.swarm-ai/pollinate-brand.yaml (same keys, any subset) and is deep-merged on top;
# scripts/brand_config.py prints the effective brand. Never edit this file to brand
# one user's outputs.

brand:
  name: ""            # brand / author name shown on outputs; empty = none
  tagline: ""
  tagline_en: ""
  emoji: ""
  logo:
    primary: ""
    compact: ""
    full: ""

# What every output carries and the delivery gates check (see scripts/brand_config.py).
# Unset = not drawn and not required.
signature:
  watermark: null
  link: null
  link_text: null
  qr:
    dark_on_light: null
    light_on_dark: null
  footer:
    mark: null
    name: null
    tagline: null

colors:
  primary: "#FF6B35"        # Orange — energy, action
  secondary: "#1B2838"      # Deep Navy — depth, professional
  accent: "#4ECDC4"         # Teal — innovation, fresh
  background_light: "#FAFAFA"  # Off-white
  background_dark: "#1A1A2E"   # Charcoal
  text: "#2D3436"           # Near-black
  success: "#00B894"        # Green
  warning: "#FDCB6E"        # Amber

typography:
  chinese: "PingFang SC"
  chinese_fallback: "Noto Sans SC"
  english: "Inter"
  code: "SF Mono, JetBrains Mono, Menlo, Monaco"
  data: "DIN Pro Bold"
  sizes:
    hero: 96          # Video hero title
    section: 80       # Section title
    card_title: 38    # Card heading
    body: 32          # Body text
    caption: 24       # Small text / caption
    code: 28          # Code font size

voice:
  default_backend: "polly"   # Amazon Polly
  default_voice_zh: "Zhiyu"  # neural, cmn-CN (generative not available for Chinese)
  default_voice_en: "Ruth"   # generative, en-US
  fallback_backend: "edge"   # Free fallback when AWS credentials unavailable
  default_rate: "+0%"
  style: "professional-casual, direct, opinionated"
  note: "Keep one voice across all audio and video content"

audio:
  bgm_volume: 0.05          # relative gain applied to BGM track during mix
  bgm_target_lufs: -23      # C5: YouTube integrated loudness standard (LUFS)
  bgm_note: "0.05 is relative gain on top of master. Target -23 LUFS for YouTube compliance."
  default_bgm: "calm-piano"

# Domain-specific visual overrides
# C6: Domain themes apply to poster backgrounds and video accent colors.
# The primary color (#FF6B35 by default) is ALWAYS present in hero text and CTA.
# When a domain theme is active, primary_override replaces the accent color only.
domain_themes:
  aidlc:
    theme: "light"
    primary_override: "#FF6B35"  # the default primary
    visual_note: "Flow diagrams, clear structure, methodology feel"

  ai_architecture:
    theme: "dark"
    primary_override: "#7C3AED"  # Purple
    visual_note: "Architecture diagrams, code blocks, deep technical"

  industry_insights:
    theme: "light"
    primary_override: "#E17055"  # Coral
    visual_note: "Comparison charts, data visualization, trend analysis"

  build_log:
    theme: "light"
    primary_override: "#00CEC9"  # Cyan
    visual_note: "Screenshots, terminal output, real interface captures"

# Content series naming
series:
  deep_dive:
    name: "Deep Dive"
    format: "long video"
    platforms: ["bilibili", "youtube"]
  quick_bite:
    name: "Quick Bite"
    format: "short video"
    platforms: ["xiaohongshu", "douyin", "weixin_video"]
  build_log:
    name: "Build Log"
    format: "mixed"
    platforms: ["bilibili", "xiaohongshu"]
  signal:
    name: "Signal"
    format: "mixed"
    platforms: ["all"]
