<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture deck</title>
<link rel="stylesheet" href="https://fonts.example.test/css2?family=Pollinate+Test+Blocks">
<link rel="stylesheet" href="shared.css">
<style>
  .accent { color: #c2410c; }
</style>
</head>
<body>
<section class="cover">
  <h1>Fixture deck</h1>
  <p class="accent">Five slides for the work tests</p>
</section>
<section class="blocks">
  <h1>Web font</h1>
  <p>This slide uses a linked web font.</p>
</section>
<SECTION class='dark'  data-note="third">
  <h1>Third slide</h1>
  <p>Upper-case tag &amp; single quotes stay as they are.</p>
  <section class="inner"><p>A nested section is part of this slide.</p></section>
</SECTION>
<section class="photo">
  <h1>Image</h1>
  <img src="assets/photo.png" alt="sun">
</section>
<section>
  <h1>The end</h1>
  <p>Thank you.</p>
</section>
</body>
</html>
