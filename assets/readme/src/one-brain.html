<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div class="wrap"><div class="card">
<h2>One brain, many hands</h2>
<div class="sub">Every engine and every Hive reads the same brain and sends what it learns back to it. Only what really needs a person reaches you.</div>
<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
  <defs>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0953a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fbf7f"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa7ff"/></marker>
  </defs>

  <!-- person -->
  <g>
    <rect x="16" y="150" width="150" height="86" rx="43" fill="#1a1d23" stroke="#2c313a"/>
    <text x="91" y="188" font-size="15" font-weight="600" fill="#e6e8eb" text-anchor="middle">You</text>
    <text x="91" y="208" font-size="12" fill="#8a919c" text-anchor="middle">direct, decide</text>
    <rect x="16" y="390" width="150" height="104" rx="10" fill="#1a1d23" stroke="#6aa7ff"/>
    <text x="30" y="414" font-size="14" font-weight="600" fill="#e6e8eb">Needs You</text>
    <text x="30" y="434" font-size="11.5" fill="#8a919c">one queue: only what</text>
    <text x="30" y="451" font-size="11.5" fill="#8a919c">a person must decide</text>
    <text x="30" y="468" font-size="11.5" fill="#8a919c">(off-machine or</text>
    <text x="30" y="482" font-size="11.5" fill="#8a919c">irreversible acts)</text>
    <path d="M166,193 L198,193" stroke="#f0953a" stroke-width="2" marker-end="url(#aO)"/>
    <text x="168" y="220" font-size="11" fill="#f0953a">intent</text>
  </g>

  <!-- ONE BRAIN -->
  <rect x="200" y="20" width="580" height="500" rx="14" fill="#18211c" stroke="#3fbf7f" stroke-width="1.6"/>
  <text x="222" y="50" font-size="12" font-weight="600" fill="#3fbf7f" letter-spacing="1.4">ONE BRAIN</text>
  <text x="760" y="50" font-size="12" fill="#8a919c" text-anchor="end">one mind, one set of rules</text>

  <g>
    <rect x="222" y="66" width="536" height="72" rx="9" fill="#1a1d23" stroke="#2c313a"/>
    <text x="238" y="90" font-size="14" font-weight="600" fill="#e6e8eb">Context &amp; Memory</text>
    <text x="238" y="110" font-size="12" fill="#8a919c">governed files: principles, rules, your profile and standing rules</text>
    <text x="238" y="127" font-size="12" fill="#8a919c">Memory (lasting facts) · Evolution (its own corrections) · Timeline</text>

    <rect x="222" y="150" width="536" height="72" rx="9" fill="#1a1d23" stroke="#2c313a"/>
    <text x="238" y="174" font-size="14" font-weight="600" fill="#e6e8eb">Brains (DDDs)</text>
    <text x="238" y="194" font-size="12" fill="#8a919c">one per project: product, tech, improvement, project · code graph</text>
    <text x="238" y="211" font-size="12" fill="#8a919c">plus the General Brain for what belongs to no single project</text>

    <rect x="222" y="236" width="262" height="170" rx="9" fill="#1a1d23" stroke="#3fbf7f"/>
    <text x="238" y="260" font-size="14" font-weight="600" fill="#3fbf7f">Read side</text>
    <text x="238" y="282" font-size="12" fill="#c9cdd3">every-turn context</text>
    <text x="238" y="301" font-size="12" fill="#c9cdd3">automatic recall</text>
    <text x="238" y="320" font-size="12" fill="#c9cdd3">DDD recall (file:line pointers)</text>
    <text x="238" y="339" font-size="12" fill="#c9cdd3">cognition CLI: the agent asks</text>
    <text x="238" y="358" font-size="12" fill="#c9cdd3">repository guidance</text>
    <text x="238" y="377" font-size="12" fill="#c9cdd3">a run's knowledge files</text>
    <text x="238" y="396" font-size="11" fill="#8a919c">each unit arrives whole</text>

    <rect x="496" y="236" width="262" height="170" rx="9" fill="#1a1d23" stroke="#3fbf7f"/>
    <text x="512" y="260" font-size="14" font-weight="600" fill="#3fbf7f">Write side: CDF</text>
    <text x="512" y="282" font-size="12" fill="#c9cdd3">every session reviewed by</text>
    <text x="512" y="299" font-size="12" fill="#c9cdd3">the agent that did the work</text>
    <text x="512" y="320" font-size="12" fill="#c9cdd3">code checks the facts</text>
    <text x="512" y="341" font-size="12" fill="#c9cdd3">add · override · withdraw</text>
    <text x="512" y="362" font-size="12" fill="#c9cdd3">your words guard every-turn files</text>
    <text x="512" y="396" font-size="11" fill="#8a919c">nothing decays on a timer</text>

    <rect x="222" y="420" width="536" height="82" rx="9" fill="#14161b" stroke="#6aa7ff"/>
    <text x="238" y="444" font-size="14" font-weight="600" fill="#6aa7ff">North star: is it needing you less?</text>
    <text x="238" y="465" font-size="12" fill="#c9cdd3">share of sessions you had to correct ↓ · corrections that repeat → 0</text>
    <text x="238" y="484" font-size="12" fill="#8a919c">where each mistake came from: missing · not delivered · misused · out of date</text>
  </g>

  <!-- MANY HANDS -->
  <text x="830" y="50" font-size="12" font-weight="600" fill="#f0953a" letter-spacing="1.4">MANY HANDS</text>
  <g font-size="12">
    <rect x="830" y="66" width="350" height="76" rx="9" fill="#1a1d23" stroke="#f0953a"/>
    <text x="846" y="90" font-size="14" font-weight="600" fill="#e6e8eb">Native agent</text>
    <text x="846" y="110" fill="#8a919c">chat, code, research, deliver; the default</text>
    <text x="846" y="127" fill="#8a919c">many tabs in parallel, steer a running turn</text>

    <rect x="830" y="152" width="350" height="76" rx="9" fill="#1a1d23" stroke="#f0953a"/>
    <text x="846" y="176" font-size="14" font-weight="600" fill="#e6e8eb">Autonomous Pipeline</text>
    <text x="846" y="196" fill="#8a919c">intent to a landed commit; owns the two ends,</text>
    <text x="846" y="213" fill="#8a919c">deterministic checks decide when it is done</text>

    <rect x="830" y="238" width="350" height="76" rx="9" fill="#1a1d23" stroke="#f0953a"/>
    <text x="846" y="262" font-size="14" font-weight="600" fill="#e6e8eb">Hives on AWS</text>
    <text x="846" y="282" fill="#8a919c">run tasks in parallel; worker role, no cognition</text>
    <text x="846" y="299" fill="#8a919c">of their own; every result and lesson comes home</text>

    <rect x="830" y="324" width="350" height="76" rx="9" fill="#1a1d23" stroke="#2c313a"/>
    <text x="846" y="348" font-size="14" font-weight="600" fill="#e6e8eb">Review experts</text>
    <text x="846" y="368" fill="#8a919c">fresh context, no memory, no identity:</text>
    <text x="846" y="385" fill="#8a919c">they find, deterministic checks decide</text>

    <rect x="830" y="410" width="350" height="76" rx="9" fill="#1a1d23" stroke="#2c313a"/>
    <text x="846" y="434" font-size="14" font-weight="600" fill="#e6e8eb">Pollinate · Eval</text>
    <text x="846" y="454" fill="#8a919c">one message to a media package;</text>
    <text x="846" y="471" fill="#8a919c">Eval scores the deployed system</text>
  </g>
  <!-- brain <-> hands -->
  <path d="M780,150 L826,150" stroke="#3fbf7f" stroke-width="2" marker-end="url(#aG)"/>
  <text x="784" y="140" font-size="11" fill="#3fbf7f">knowledge</text>
  <path d="M826,330 L784,330" stroke="#3fbf7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aG)"/>
  <text x="788" y="320" font-size="11" fill="#3fbf7f">lessons</text>
  <!-- hands -> needs you -->
  <path d="M1005,486 C1005,578 91,578 91,498" fill="none" stroke="#6aa7ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aB)"/>
  <text x="470" y="572" font-size="11.5" fill="#6aa7ff">only what a person must decide</text>

  <!-- harness -->
  <rect x="16" y="584" width="1164" height="80" rx="12" fill="#171a20" stroke="#2c313a"/>
  <text x="34" y="610" font-size="12" font-weight="600" fill="#8a919c" letter-spacing="1.4">AGENT OS HARNESS</text>
  <text x="34" y="636" font-size="12.5" fill="#c9cdd3">sessions and tabs · hooks between sessions · product gates (dangerous, off-machine, person-only) · scheduled jobs</text>
  <text x="34" y="654" font-size="12.5" fill="#c9cdd3">the desktop app as its body: it senses and drives its own UI · usage ledger · one authorization model and operations registry</text>
</svg>
<div class="legend"><span><i style="border-color:#f0953a"></i>work</span><span><i style="border-color:#3fbf7f"></i>knowledge out</span><span><i style="border-color:#3fbf7f;border-top-style:dashed"></i>lessons back</span><span><i style="border-color:#6aa7ff;border-top-style:dashed"></i>what reaches you</span></div>
</div></div></body></html>
