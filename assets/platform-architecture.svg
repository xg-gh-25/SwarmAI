<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7ee787"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#58a6ff"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f78166"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">SwarmAI Platform Architecture</text>
  <text x="450" y="46" text-anchor="middle" fill="#8b949e" font-size="10">Three Layers: Harness → Knowledge → Delivery Engines</text>

  <!-- ============ LAYER 3: DELIVERY ENGINES (top) ============ -->
  <rect x="20" y="60" width="560" height="120" rx="10" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="35" y="80" fill="#d2a8ff" font-size="11" font-weight="bold">DELIVERY ENGINES</text>

  <rect x="35" y="88" width="125" height="50" rx="6" fill="#1c1029" stroke="#d2a8ff" stroke-width="1"/>
  <text x="97" y="106" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="bold">Pipeline</text>
  <text x="97" y="120" fill="#e6edf3" font-size="8" text-anchor="middle">9 stages, 2 gates</text>
  <text x="97" y="132" fill="#8b949e" font-size="7" text-anchor="middle">→ Push-ready code</text>

  <rect x="170" y="88" width="125" height="50" rx="6" fill="#1c1029" stroke="#d2a8ff" stroke-width="1"/>
  <text x="232" y="106" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="bold">Pollinate</text>
  <text x="232" y="120" fill="#e6edf3" font-size="8" text-anchor="middle">8 stages, 8L gate</text>
  <text x="232" y="132" fill="#8b949e" font-size="7" text-anchor="middle">→ Brand content</text>

  <rect x="305" y="88" width="125" height="50" rx="6" fill="#1c1029" stroke="#d2a8ff" stroke-width="1"/>
  <text x="367" y="106" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="bold">OS Eval</text>
  <text x="367" y="120" fill="#e6edf3" font-size="8" text-anchor="middle">Golden set + scoring</text>
  <text x="367" y="132" fill="#8b949e" font-size="7" text-anchor="middle">→ Self-awareness</text>

  <rect x="440" y="88" width="125" height="50" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="502" y="106" fill="#8b949e" font-size="10" text-anchor="middle">Future</text>
  <text x="502" y="120" fill="#8b949e" font-size="8" text-anchor="middle">Analyst, Operator</text>

  <text x="300" y="162" text-anchor="middle" fill="#7ee787" font-size="8">↓ Reads DDD → domain-correct output · ↑ REFLECT writes lessons back</text>

  <!-- ============ LAYER 2: KNOWLEDGE (middle) ============ -->
  <rect x="20" y="185" width="560" height="155" rx="10" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <text x="35" y="205" fill="#7ee787" font-size="11" font-weight="bold">KNOWLEDGE LAYER</text>

  <!-- DDD docs -->
  <rect x="35" y="213" width="250" height="40" rx="6" fill="#0d1f0d" stroke="#7ee787" stroke-width="0.8"/>
  <text x="45" y="228" fill="#7ee787" font-size="9" font-weight="bold">DDD (4 docs × N projects)</text>
  <text x="45" y="244" fill="#e6edf3" font-size="8">PRODUCT · TECH · IMPROVEMENT · PROJECT</text>

  <!-- Memory -->
  <rect x="295" y="213" width="130" height="40" rx="6" fill="#0d1f0d" stroke="#7ee787" stroke-width="0.8"/>
  <text x="305" y="228" fill="#7ee787" font-size="9" font-weight="bold">Memory (4 tiers)</text>
  <text x="305" y="244" fill="#e6edf3" font-size="8">L0→L1→L2→L3</text>

  <!-- Evolution -->
  <rect x="435" y="213" width="130" height="40" rx="6" fill="#0d1f0d" stroke="#7ee787" stroke-width="0.8"/>
  <text x="445" y="228" fill="#7ee787" font-size="9" font-weight="bold">Evolution</text>
  <text x="445" y="244" fill="#e6edf3" font-size="8">37 corrections</text>

  <!-- Knowledge services -->
  <rect x="35" y="265" width="530" height="32" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="0.6"/>
  <text x="45" y="284" fill="#58a6ff" font-size="8" font-weight="bold">Services:</text>
  <text x="105" y="284" fill="#e6edf3" font-size="8">Auto-Refresh (3-layer) · Cultivation Engine · Darwinian Decay · Health Scoring · 7-type Ontology</text>

  <!-- Feed channels -->
  <rect x="35" y="305" width="530" height="25" rx="5" fill="#161b22" stroke="#f78166" stroke-width="0.6"/>
  <text x="45" y="322" fill="#f78166" font-size="8" font-weight="bold">Fed by:</text>
  <text x="85" y="322" fill="#e6edf3" font-size="8">8 channels (code commits · REFLECT · corrections · signals · conversations · code intel · research · industry)</text>

  <!-- ============ LAYER 1: HARNESS (bottom) ============ -->
  <rect x="20" y="355" width="560" height="130" rx="10" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="35" y="375" fill="#58a6ff" font-size="11" font-weight="bold">AGENT HARNESS</text>

  <rect x="35" y="383" width="105" height="40" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.7"/>
  <text x="87" y="398" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">Context</text>
  <text x="87" y="412" fill="#8b949e" font-size="7" text-anchor="middle">11 files, 100K budget</text>

  <rect x="148" y="383" width="105" height="40" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.7"/>
  <text x="200" y="398" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">Sessions</text>
  <text x="200" y="412" fill="#8b949e" font-size="7" text-anchor="middle">Multi-tab, 5-state</text>

  <rect x="261" y="383" width="105" height="40" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.7"/>
  <text x="313" y="398" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">Hooks</text>
  <text x="313" y="412" fill="#8b949e" font-size="7" text-anchor="middle">17 RT + 4 lifecycle</text>

  <rect x="374" y="383" width="95" height="40" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.7"/>
  <text x="421" y="398" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">Jobs</text>
  <text x="421" y="412" fill="#8b949e" font-size="7" text-anchor="middle">13 signals, cron</text>

  <rect x="477" y="383" width="95" height="40" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.7"/>
  <text x="524" y="398" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">Skills</text>
  <text x="524" y="412" fill="#8b949e" font-size="7" text-anchor="middle">86, lazy/always</text>

  <rect x="35" y="432" width="165" height="35" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="117" y="452" fill="#e6edf3" font-size="8" text-anchor="middle">Self-Healing · MessageStore</text>
  <text x="117" y="464" fill="#8b949e" font-size="7" text-anchor="middle">HealthSensor + phase-gated writes</text>

  <rect x="208" y="432" width="165" height="35" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="290" y="452" fill="#e6edf3" font-size="8" text-anchor="middle">Code Intelligence · MCP</text>
  <text x="290" y="464" fill="#8b949e" font-size="7" text-anchor="middle">AST graph, 14K symbols</text>

  <rect x="381" y="432" width="190" height="35" rx="5" fill="#0d1420" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="476" y="452" fill="#e6edf3" font-size="8" text-anchor="middle">4-Platform · Channels</text>
  <text x="476" y="464" fill="#8b949e" font-size="7" text-anchor="middle">macOS daemon · Hive · Slack</text>

  <!-- ============ RIGHT SIDE: COMPOUND FLYWHEEL ============ -->
  <rect x="600" y="60" width="280" height="425" rx="10" fill="none" stroke="#e6edf3" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="740" y="82" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">COMPOUND FLYWHEEL</text>
  <text x="740" y="97" text-anchor="middle" fill="#8b949e" font-size="9">Why 1+1+1+1 > 4</text>

  <!-- Flywheel nodes -->
  <rect x="650" y="115" width="180" height="35" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="740" y="136" text-anchor="middle" fill="#58a6ff" font-size="10">Context assembles smarter</text>

  <path d="M740,150 L740,165" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#arrB)"/>

  <rect x="650" y="170" width="180" height="35" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1"/>
  <text x="740" y="191" text-anchor="middle" fill="#d2a8ff" font-size="10">Engines deliver correctly</text>

  <path d="M740,205 L740,220" stroke="#d2a8ff" stroke-width="1.2" marker-end="url(#arrO)"/>

  <rect x="650" y="225" width="180" height="35" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1"/>
  <text x="740" y="246" text-anchor="middle" fill="#f78166" font-size="10">REFLECT writes lessons</text>

  <path d="M740,260 L740,275" stroke="#f78166" stroke-width="1.2" marker-end="url(#arrG)"/>

  <rect x="650" y="280" width="180" height="35" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
  <text x="740" y="301" text-anchor="middle" fill="#7ee787" font-size="10">DDD grows richer</text>

  <path d="M740,315 L740,330" stroke="#7ee787" stroke-width="1.2" marker-end="url(#arrO)"/>

  <rect x="650" y="335" width="180" height="35" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1"/>
  <text x="740" y="356" text-anchor="middle" fill="#f78166" font-size="10">Errors → corrections</text>

  <path d="M740,370 L740,385" stroke="#f78166" stroke-width="1.2" marker-end="url(#arrB)"/>

  <rect x="650" y="390" width="180" height="35" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="740" y="411" text-anchor="middle" fill="#58a6ff" font-size="10">Gates get stronger</text>

  <!-- Loop back arrow -->
  <path d="M830,410 Q860,410 860,265 Q860,115 830,115" fill="none" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="872" y="265" fill="#7ee787" font-size="8" transform="rotate(90,872,265)">accelerates</text>

  <!-- Eval feedback -->
  <rect x="650" y="440" width="180" height="30" rx="6" fill="#0d1f0d" stroke="#7ee787" stroke-width="1"/>
  <text x="740" y="459" text-anchor="middle" fill="#7ee787" font-size="9" font-weight="bold">OS Eval: measures convergence</text>

  <!-- Bottom summary -->
  <rect x="20" y="500" width="860" height="100" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="0.4"/>
  <text x="450" y="522" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">The Thesis: Can one builder + AI operate at team scale?</text>

  <text x="40" y="548" fill="#d2a8ff" font-size="9" font-weight="bold">Engines:</text>
  <text x="100" y="548" fill="#e6edf3" font-size="9">Pipeline (code) · Pollinate (content) · OS Eval (self-awareness) — all share one knowledge layer</text>

  <text x="40" y="568" fill="#7ee787" font-size="9" font-weight="bold">Knowledge:</text>
  <text x="115" y="568" fill="#e6edf3" font-size="9">DDD grows from work. Memory compounds across sessions. Evolution prevents bug classes.</text>

  <text x="40" y="588" fill="#58a6ff" font-size="9" font-weight="bold">Harness:</text>
  <text x="100" y="588" fill="#e6edf3" font-size="9">Context (100K) · Sessions (multi-tab) · Hooks (21) · Jobs (13 feeds) · Skills (86) · 4-Platform</text>
</svg>
