  <!-- L3: ACTIVE SESSION DIGEST -->
  <rect x="250" y="192" width="460" height="38" rx="8" fill="#8b5cf6" fill-opacity="0.08" stroke="url(#purple)" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="480" y="216" text-anchor="middle" fill="#a78bfa" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">L3 : ACTIVE SESSION DIGEST — sibling summaries, tabs ↔ channels</text>
  <line x1="370" y1="230" x2="220" y2="278" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  <polygon points="217,275 223,281 226,274" fill="#a78bfa" opacity="0.35"/>
  <line x1="590" y1="230" x2="740" y2="278" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  <polygon points="737,274 740,281 743,275" fill="#a78bfa" opacity="0.35"/>
  <line x1="220" y1="168" x2="220" y2="192" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
  <line x1="220" y1="230" x2="220" y2="278" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
  <line x1="740" y1="168" x2="740" y2="192" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
  <line x1="740" y1="230" x2="740" y2="278" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
  <text x="195" y="250" text-anchor="start" fill="#f59e0b" font-family="Arial,Helvetica,sans-serif" font-size="8" opacity="0.45" transform="rotate(-90,195,250)">reads</text>
  <text x="765" y="250" text-anchor="start" fill="#f59e0b" font-family="Arial,Helvetica,sans-serif" font-size="8" opacity="0.45" transform="rotate(-90,765,250)">reads</text>

  <!-- CHAT TABS (left) -->
