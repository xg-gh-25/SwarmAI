  <text x="145" y="380" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="9">"Deploy feature"</text>
  <rect x="230" y="340" width="130" height="55" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="295" y="362" text-anchor="middle" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">Tab 2</text>
  <text x="295" y="380" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="9">"Review PR #42"</text>
  <rect x="80" y="408" width="130" height="44" rx="8" fill="#3b82f6" fill-opacity="0.04" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="4 2"/>
  <text x="145" y="434" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="9">Tab 3 (if RAM allows)</text>
  <rect x="230" y="408" width="130" height="44" rx="8" fill="#3b82f6" fill-opacity="0.04" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="4 2"/>
  <text x="295" y="427" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="9">Owner's own Slack</text>
  <text x="295" y="440" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="9">messages use this pool</text>
  <text x="220" y="470" text-anchor="middle" fill="#60a5fa" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" opacity="0.7">Chat pool: 1–4 tabs, bounded by real free RAM</text>

  <!-- CHANNEL SESSIONS (right) -->
  <rect x="580" y="280" width="320" height="200" rx="12" fill="#10b981" fill-opacity="0.05" stroke="url(#green)" stroke-width="1.2"/>
  <text x="740" y="305" text-anchor="middle" fill="#34d399" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold">L2 : CHANNEL SESSIONS</text>
  <text x="740" y="322" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="10">A session per conversation | Serialized | 1 slot</text>
  <rect x="600" y="338" width="88" height="46" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="644" y="357" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">#channel</text>
  <text x="644" y="373" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">own session + history</text>
  <rect x="700" y="338" width="88" height="46" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="744" y="357" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">DM</text>
  <text x="744" y="373" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">own session + history</text>
  <rect x="800" y="338" width="88" height="46" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="844" y="357" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">thread</text>
  <text x="844" y="373" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">own session + history</text>
  <rect x="600" y="400" width="88" height="26" rx="6" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="0.7"/>
  <text x="644" y="418" text-anchor="middle" fill="#f472b6" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">Slack</text>
  <rect x="700" y="400" width="188" height="26" rx="6" fill="#94a3b8" fill-opacity="0.05" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="794" y="417" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9" opacity="0.7">Future channels: adapter + register</text>
  <text x="740" y="448" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Non-owners: allowlisted; private files withheld</text>
  <text x="740" y="470" text-anchor="middle" fill="#10b981" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" opacity="0.7">1 dedicated channel slot, serialized</text>

  <!-- USER IDENTITY MAP -->
  <rect x="320" y="494" width="320" height="40" rx="8" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4 2" stroke-opacity="0.4"/>
  <text x="480" y="510" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">USER IDENTITY MAP</text>
  <text x="480" y="526" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">platform user IDs → one unified user key</text>
  <line x1="606" y1="426" x2="622" y2="494" stroke="#f59e0b" stroke-width="0.8" opacity="0.2" stroke-dasharray="3 2"/>

  <line x1="480" y1="275" x2="480" y2="486" stroke="#334155" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Legend -->
  <g transform="translate(80, 548)">
    <rect x="-4" y="-5" width="8" height="8" rx="2" fill="#3b82f6" opacity="0.6"/>
    <text x="10" y="3" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Chat (parallel, per-topic)</text>
    <rect x="196" y="-5" width="8" height="8" rx="2" fill="#10b981" opacity="0.6"/>
    <text x="210" y="3" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Channel (serialized, per conversation)</text>
    <rect x="416" y="-5" width="8" height="8" rx="2" fill="#f59e0b" opacity="0.6"/>
    <text x="430" y="3" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Shared memory (all sessions)</text>
    <rect x="636" y="-5" width="8" height="8" rx="2" fill="#8b5cf6" opacity="0.6"/>
    <text x="650" y="3" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Cross-session awareness</text>
