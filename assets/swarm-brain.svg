<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1019"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#f59e0b">
    <line x1="0" y1="100" x2="960" y2="100" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="960" y2="200" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="960" y2="400" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="560" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="560" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="560" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" fill="#f59e0b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">SWARM BRAIN</text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="11">One AI, Every Channel, Shared Memory</text>

  <!-- L1: SHARED MEMORY -->
  <rect x="80" y="78" width="800" height="90" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6"/>
  <text x="100" y="100" text-anchor="start" fill="#f59e0b" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" opacity="0.9">L1 : SHARED MEMORY</text>
  <text x="250" y="100" text-anchor="start" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="10" opacity="0.6">the 11 context files, loaded at every prompt build (non-owner prompts get only what is safe to share)</text>
  <g opacity="0.9">
    <rect x="97" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="129" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">SWARMAI</text>
    <rect x="167" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="199" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">IDENTITY</text>
    <rect x="237" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="269" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">SOUL</text>
    <rect x="307" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="339" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">SELF</text>
    <rect x="377" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="409" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">AGENT</text>
    <rect x="447" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="479" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">USER</text>
    <rect x="517" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="549" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">STEERING</text>
    <rect x="587" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="619" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">TOOLS</text>
    <rect x="657" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="689" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">MEMORY</text>
    <rect x="727" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="759" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">EVOLUTION</text>
    <rect x="797" y="114" width="64" height="36" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="829" y="136" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">TIMELINE</text>
