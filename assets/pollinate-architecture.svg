<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1530" width="1200" height="1530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151528"/>
      <stop offset="1" stop-color="#0F1020"/>
    </linearGradient>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8894a8"/>
    </marker>
    <marker id="aO" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FF6B35"/>
    </marker>
    <marker id="aY" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FDCB6E"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FF6B6B"/>
    </marker>
    <marker id="aP" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#A29BFE"/>
    </marker>
    <marker id="aT" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4ECDC4"/>
    </marker>
  </defs>
  <rect width="1200" height="1530" fill="url(#bg)"/>

<text x="60" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">Pollinate: one run, start to finish</text>
<text x="60" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#9AA5B8" text-anchor="start">A deck from the first message to the person's click.</text>
<text x="60" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#4ECDC4" text-anchor="start">Experts find problems. Scripts decide. The person publishes.</text>
<circle cx="68" cy="162" r="8" fill="#FDCB6E"/>
<text x="84" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Person</text>
<circle cx="186" cy="162" r="8" fill="#FF6B35"/>
<text x="202" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Agent</text>
<circle cx="295" cy="162" r="8" fill="#4ECDC4"/>
<text x="311" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">work.py (decides)</text>
<circle cx="512" cy="162" r="8" fill="#A29BFE"/>
<text x="528" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Review experts (find)</text>
<rect x="60" y="200" width="790" height="102" rx="12" fill="#1E2438" stroke="#FDCB6E" stroke-width="1.5"/>
<rect x="60" y="200" width="8" height="102" rx="4" fill="#FDCB6E"/>
<text x="92" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDCB6E" text-anchor="start">PERSON</text>
<text x="92" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">“Make a deck for the team: why we moved to weekly releases.”</text>
<text x="92" y="292" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">One message in chat. There is no form to fill in.</text>
<rect x="60" y="332" width="790" height="154" rx="12" fill="#1E2438" stroke="#FF6B35" stroke-width="1.5"/>
<rect x="60" y="332" width="8" height="154" rx="4" fill="#FF6B35"/>
<text x="92" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF6B35" text-anchor="start">AGENT · BRIEF</text>
<text x="92" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Write the brief</text>
<text x="92" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Look up project knowledge, answer six questions (who, what should</text>
<text x="92" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">happen, the thesis, where, formats, sources). Ask once, only what it</text>
<text x="92" y="476" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">cannot decide. Show 3 design systems as thumbnails.</text>
<rect x="714" y="346" width="112" height="30" rx="15" fill="#2A3350" stroke="#FF6B35" stroke-width="1.5"/><text x="770.0" y="367" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="middle">brief.md</text>
<rect x="60" y="516" width="790" height="128" rx="12" fill="#1E2438" stroke="#4ECDC4" stroke-width="1.5"/>
<rect x="60" y="516" width="8" height="128" rx="4" fill="#4ECDC4"/>
<text x="92" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ECDC4" text-anchor="start">WORK.PY INIT</text>
<text x="92" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Make the work and register it in place</text>
<text x="92" y="608" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">A work is any folder with a work.json, here under the project.</text>
<text x="92" y="634" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Slides get stable ids (s-7f3a), not positions (“slide 3”).</text>
<rect x="704" y="530" width="122" height="30" rx="15" fill="#2A3350" stroke="#4ECDC4" stroke-width="1.5"/><text x="765.0" y="551" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4ECDC4" text-anchor="middle">work.json</text>
<rect x="60" y="674" width="790" height="128" rx="12" fill="#1E2438" stroke="#FF6B35" stroke-width="1.5"/>
<rect x="60" y="674" width="8" height="128" rx="4" fill="#FF6B35"/>
<text x="92" y="706" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF6B35" text-anchor="start">AGENT · SOURCE</text>
<text x="92" y="736" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Write the deck in HTML</text>
<text x="92" y="766" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">One file: one &lt;section data-slide-id&gt; per slide,</text>
<text x="92" y="792" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">plus shared.css and assets/.</text>
<rect x="664" y="688" width="162" height="30" rx="15" fill="#2A3350" stroke="#FF6B35" stroke-width="1.5"/><text x="745.0" y="709" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="middle">src/deck.html</text>
<rect x="60" y="832" width="790" height="128" rx="12" fill="#1E2438" stroke="#4ECDC4" stroke-width="1.5"/>
<rect x="60" y="832" width="8" height="128" rx="4" fill="#4ECDC4"/>
<text x="92" y="864" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ECDC4" text-anchor="start">WORK.PY CUT</text>
<text x="92" y="894" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Cut a version</text>
<text x="92" y="924" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">render → measure → craft checks → guard → new version.</text>
<text x="92" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">current moves only when everything passes (Figure 3).</text>
<rect x="754" y="846" width="72" height="30" rx="15" fill="#2A3350" stroke="#4ECDC4" stroke-width="1.5"/><text x="790.0" y="867" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4ECDC4" text-anchor="middle">v001</text>
<rect x="60" y="990" width="790" height="154" rx="12" fill="#1E2438" stroke="#A29BFE" stroke-width="1.5"/>
<rect x="60" y="990" width="8" height="154" rx="4" fill="#A29BFE"/>
<text x="92" y="1022" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#A29BFE" text-anchor="start">REVIEW · AT MOST 2 ROUNDS</text>
<text x="92" y="1052" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Experts look for problems</text>
<text x="92" y="1082" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">content-accuracy, content-visual and content-copy report findings.</text>
<text x="92" y="1108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">The agent checks each one, fixes by cause, and cuts again.</text>
<text x="92" y="1134" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">A reviewer never blocks delivery; only a failed cut does.</text>
<rect x="754" y="1004" width="72" height="30" rx="15" fill="#2A3350" stroke="#A29BFE" stroke-width="1.5"/><text x="790.0" y="1025" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#A29BFE" text-anchor="middle">v002</text>
<rect x="60" y="1174" width="790" height="128" rx="12" fill="#1E2438" stroke="#FF6B35" stroke-width="1.5"/>
<rect x="60" y="1174" width="8" height="128" rx="4" fill="#FF6B35"/>
<text x="92" y="1206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF6B35" text-anchor="start">AGENT · DELIVER</text>
<text x="92" y="1236" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Hand it over</text>
<text x="92" y="1266" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Canvas opens out/deck.html. One chat block: a line per file</text>
<text x="92" y="1292" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">(version, size), thumbnails, copy ready to paste, one paragraph.</text>
<rect x="664" y="1188" width="162" height="30" rx="15" fill="#2A3350" stroke="#FF6B35" stroke-width="1.5"/><text x="745.0" y="1209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="middle">out/deck.html</text>
<rect x="60" y="1332" width="790" height="128" rx="12" fill="#1E2438" stroke="#FDCB6E" stroke-width="1.5"/>
<rect x="60" y="1332" width="8" height="128" rx="4" fill="#FDCB6E"/>
<text x="92" y="1364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FDCB6E" text-anchor="start">PERSON</text>
<text x="92" y="1394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Publish, or ask for a change</text>
<text x="92" y="1424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">Publishing is always the person's click; Pollinate never posts.</text>
<text x="92" y="1450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#C6CEDC" text-anchor="start">“Slide 3 text is too small” starts the revise loop.</text>
<line x1="455" y1="304" x2="455" y2="328" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<line x1="455" y1="488" x2="455" y2="512" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<line x1="455" y1="646" x2="455" y2="670" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<line x1="455" y1="804" x2="455" y2="828" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<line x1="455" y1="962" x2="455" y2="986" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<line x1="455" y1="1146" x2="455" y2="1170" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<line x1="455" y1="1304" x2="455" y2="1328" stroke="#8894a8" stroke-width="2" marker-end="url(#aG)"/>
<path d="M850 866 H884 V738.0 H860" fill="none" stroke="#FF6B6B" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="900" y="772.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6B6B" text-anchor="start">exit 1: fix the cause,</text>
<text x="900" y="794.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6B6B" text-anchor="start">cut again</text>
<path d="M850 1067.0 H884 V930 H860" fill="none" stroke="#A29BFE" stroke-width="2.5" marker-end="url(#aP)"/>
<text x="900" y="962" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#A29BFE" text-anchor="start">findings: fix,</text>
<text x="900" y="984" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#A29BFE" text-anchor="start">cut again</text>
<path d="M850 1396.0 H1140 V896.0 H860" fill="none" stroke="#FDCB6E" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#aY)"/>
<text x="900" y="1204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FDCB6E" text-anchor="start">revise loop:</text>
<text x="900" y="1228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FDCB6E" text-anchor="start">open --scope,</text>
<text x="900" y="1252" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FDCB6E" text-anchor="start">edit only the scope,</text>
<text x="900" y="1276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FDCB6E" text-anchor="start">cut (Figure 2)</text>
</svg>
