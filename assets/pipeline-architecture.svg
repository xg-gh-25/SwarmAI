<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7ee787"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f78166"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d2a8ff"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="470" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Autonomous Pipeline — 9 Stages · 3 Gates · 2 Modes</text>
  <text x="470" y="48" text-anchor="middle" fill="#8b949e" font-size="10">One requirement → push-ready code  |  One goal → measurable DoD achieved</text>

  <!-- ============ PHASE A: DECISION (shared by both modes) ============ -->
  <rect x="20" y="62" width="250" height="252" rx="10" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="145" y="80" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">PHASE A: DECISION</text>
  <text x="145" y="93" text-anchor="middle" fill="#8b949e" font-size="8">(shared by both modes)</text>

  <rect x="40" y="100" width="210" height="28" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="55" y="118" fill="#58a6ff" font-size="10" font-weight="bold">①</text>
  <text x="72" y="118" fill="#e6edf3" font-size="10">EVALUATE</text>
  <text x="240" y="118" fill="#8b949e" font-size="8" text-anchor="end">GO + profile</text>

  <!-- Gate 0 (framing) sits between EVALUATE and THINK -->
  <line x1="145" y1="128" x2="145" y2="136" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrP)"/>
  <rect x="40" y="138" width="210" height="26" rx="7" fill="#1c1029" stroke="#d2a8ff" stroke-width="2"/>
  <text x="55" y="155" fill="#d2a8ff" font-size="9" font-weight="bold">★ GATE 0</text>
  <text x="240" y="155" fill="#d2a8ff" font-size="7.5" text-anchor="end">framing understood?</text>

  <line x1="145" y1="164" x2="145" y2="172" stroke="#58a6ff" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="40" y="174" width="210" height="28" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="55" y="192" fill="#58a6ff" font-size="10" font-weight="bold">②</text>
  <text x="72" y="192" fill="#e6edf3" font-size="10">THINK</text>
  <text x="240" y="192" fill="#8b949e" font-size="8" text-anchor="end">alts + risk</text>

  <line x1="145" y1="202" x2="145" y2="210" stroke="#58a6ff" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="40" y="212" width="210" height="28" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="55" y="230" fill="#58a6ff" font-size="10" font-weight="bold">③</text>
  <text x="72" y="230" fill="#e6edf3" font-size="10">PLAN</text>
  <text x="240" y="230" fill="#8b949e" font-size="8" text-anchor="end">spec + AC / DoD</text>

  <!-- Gate 1 (plan) -->
  <line x1="145" y1="240" x2="145" y2="248" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrP)"/>
  <rect x="40" y="250" width="210" height="34" rx="8" fill="#1c1029" stroke="#d2a8ff" stroke-width="2"/>
  <text x="55" y="271" fill="#d2a8ff" font-size="10" font-weight="bold">★ GATE 1</text>
  <text x="240" y="266" fill="#d2a8ff" font-size="7.5" text-anchor="end">plan sound?</text>
  <text x="240" y="277" fill="#d2a8ff" font-size="7.5" text-anchor="end">Skeptic + SSA</text>

  <!-- Mode split arrow -->
  <line x1="270" y1="170" x2="300" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ MODE SPLIT ============ -->
  <polygon points="318,170 348,150 378,170 348,190" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="348" y="174" text-anchor="middle" fill="#e6edf3" font-size="8">MODE</text>

  <line x1="378" y1="160" x2="408" y2="125" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="386" y="138" fill="#7ee787" font-size="8">full</text>

  <line x1="378" y1="180" x2="408" y2="320" stroke="#f78166" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="386" y="258" fill="#f78166" font-size="8">goal</text>

  <!-- ============ FULL MODE (top) ============ -->
  <rect x="415" y="62" width="300" height="168" rx="10" fill="none" stroke="#7ee787" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="565" y="82" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">FULL MODE (one-shot)</text>

  <rect x="430" y="92" width="130" height="28" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
  <text x="445" y="110" fill="#7ee787" font-size="9" font-weight="bold">④</text>
  <text x="460" y="110" fill="#e6edf3" font-size="9">BUILD (TDD)</text>

  <rect x="570" y="92" width="130" height="28" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
  <text x="585" y="110" fill="#7ee787" font-size="9" font-weight="bold">⑤</text>
  <text x="600" y="110" fill="#e6edf3" font-size="9">REVIEW (7 spec)</text>

  <rect x="430" y="130" width="130" height="28" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="1"/>
  <text x="445" y="148" fill="#7ee787" font-size="9" font-weight="bold">⑥</text>
  <text x="460" y="148" fill="#e6edf3" font-size="9">TEST</text>

  <text x="565" y="180" text-anchor="middle" fill="#8b949e" font-size="8">One pass: BUILD → REVIEW → TEST → deliver</text>
  <text x="565" y="195" text-anchor="middle" fill="#7ee787" font-size="8">Profiles: full · trivial · bugfix · research · docs</text>
  <text x="565" y="213" text-anchor="middle" fill="#8b949e" font-size="7.5">profile immutable after EVALUATE (GC12)</text>

  <line x1="715" y1="125" x2="740" y2="125" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- ============ GOAL MODE (bottom) ============ -->
  <rect x="415" y="258" width="300" height="200" rx="10" fill="none" stroke="#f78166" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="565" y="278" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">GOAL MODE (iterative)</text>

  <rect x="430" y="290" width="270" height="70" rx="8" fill="#1a1008" stroke="#f78166" stroke-width="0.8"/>
  <text x="565" y="308" text-anchor="middle" fill="#f78166" font-size="9" font-weight="bold">GOAL CYCLE (repeats until DoD met)</text>

  <rect x="440" y="316" width="80" height="24" rx="4" fill="#161b22" stroke="#7ee787" stroke-width="0.8"/>
  <text x="480" y="332" text-anchor="middle" fill="#e6edf3" font-size="8">BUILD</text>
  <text x="527" y="332" fill="#8b949e" font-size="9">→</text>
  <rect x="537" y="316" width="70" height="24" rx="4" fill="#161b22" stroke="#7ee787" stroke-width="0.8"/>
  <text x="572" y="332" text-anchor="middle" fill="#e6edf3" font-size="8">TEST</text>
  <text x="614" y="332" fill="#8b949e" font-size="9">→</text>
  <rect x="624" y="316" width="70" height="24" rx="4" fill="#161b22" stroke="#f78166" stroke-width="0.8"/>
  <text x="659" y="332" text-anchor="middle" fill="#e6edf3" font-size="8">DoD?</text>

  <path d="M659,340 Q659,353 565,353 Q440,353 440,332" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="540" y="366" text-anchor="middle" fill="#f78166" font-size="7">not met → next cycle</text>

  <text x="565" y="392" text-anchor="middle" fill="#8b949e" font-size="8">Periodic REVIEW every N cycles</text>
  <text x="565" y="407" text-anchor="middle" fill="#8b949e" font-size="8">Final ADVERSARIAL on total changeset when DoD met</text>
  <text x="565" y="427" text-anchor="middle" fill="#f78166" font-size="8">Scheduled mode: job system runs cycles overnight</text>
  <text x="565" y="443" text-anchor="middle" fill="#e6edf3" font-size="8" font-weight="bold">Exit: DoD met | max cycles | budget | stuck 3×</text>

  <line x1="715" y1="308" x2="740" y2="308" stroke="#f78166" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- ============ PHASE C: DELIVERY (shared) ============ -->
  <rect x="745" y="62" width="175" height="458" rx="10" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="832" y="80" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">PHASE C: DELIVERY</text>
  <text x="832" y="93" text-anchor="middle" fill="#8b949e" font-size="8">(shared)</text>

  <!-- Gate 2 = ADVERSARIAL (stage 7, embedded in DELIVER) -->
  <rect x="760" y="104" width="145" height="40" rx="8" fill="#1c1029" stroke="#d2a8ff" stroke-width="2"/>
  <text x="770" y="121" fill="#d2a8ff" font-size="9" font-weight="bold">⑦ ★ GATE 2</text>
  <text x="897" y="121" fill="#d2a8ff" font-size="7.5" text-anchor="end">build correct?</text>
  <text x="770" y="136" fill="#e6edf3" font-size="8">ADVERSARIAL</text>
  <text x="897" y="136" fill="#8b949e" font-size="7" text-anchor="end">fresh-context sub-agent</text>

  <line x1="832" y1="144" x2="832" y2="158" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrP)"/>

  <rect x="760" y="160" width="145" height="30" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1"/>
  <text x="770" y="179" fill="#d2a8ff" font-size="9" font-weight="bold">⑧</text>
  <text x="788" y="179" fill="#e6edf3" font-size="9">DELIVER</text>

  <line x1="832" y1="190" x2="832" y2="204" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrP)"/>

  <rect x="760" y="206" width="145" height="30" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1"/>
  <text x="770" y="225" fill="#d2a8ff" font-size="9" font-weight="bold">⑨</text>
  <text x="788" y="225" fill="#e6edf3" font-size="9">REFLECT</text>
  <text x="897" y="225" fill="#8b949e" font-size="7" text-anchor="end">→ DDD</text>

  <!-- 6-Layer convergence gate -->
  <rect x="760" y="254" width="145" height="92" rx="8" fill="#0d1f0d" stroke="#7ee787" stroke-width="1"/>
  <text x="832" y="272" text-anchor="middle" fill="#7ee787" font-size="9" font-weight="bold">6-Layer Quality Gate</text>
  <text x="832" y="288" text-anchor="middle" fill="#e6edf3" font-size="7">L1 Tests · L2 Types</text>
  <text x="832" y="300" text-anchor="middle" fill="#e6edf3" font-size="7">L3 Regression · L4 Adversarial</text>
  <text x="832" y="312" text-anchor="middle" fill="#e6edf3" font-size="7">L5 DDD · L6 Decisions resolved</text>
  <text x="832" y="332" text-anchor="middle" fill="#7ee787" font-size="8">× max 3 iterations</text>

  <rect x="760" y="364" width="145" height="36" rx="8" fill="#0d2818" stroke="#7ee787" stroke-width="2"/>
  <text x="832" y="386" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">PUSH-READY</text>

  <rect x="760" y="408" width="145" height="28" rx="6" fill="#1f1510" stroke="#f78166" stroke-width="1"/>
  <text x="832" y="426" text-anchor="middle" fill="#f78166" font-size="9">or ESCALATE</text>

  <rect x="760" y="446" width="145" height="40" rx="6" fill="#0d1f0d" stroke="#7ee787" stroke-width="0.8"/>
  <text x="832" y="463" text-anchor="middle" fill="#7ee787" font-size="8">REFLECT → DDD learns</text>
  <text x="832" y="476" text-anchor="middle" fill="#7ee787" font-size="7">next run starts smarter</text>

  <!-- ============ 3-GATE LEGEND ============ -->
  <rect x="20" y="326" width="370" height="132" rx="10" fill="#0d1117" stroke="#d2a8ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="32" y="345" fill="#d2a8ff" font-size="10" font-weight="bold">3 GATES — 3 moments of truth</text>

  <text x="32" y="368" fill="#d2a8ff" font-size="9" font-weight="bold">★ GATE 0</text>
  <text x="110" y="368" fill="#e6edf3" font-size="8.5">Do we understand the problem?</text>
  <text x="110" y="380" fill="#8b949e" font-size="7.5">in EVALUATE→THINK · diagnose-before-build + M3 skeptic</text>

  <text x="32" y="402" fill="#d2a8ff" font-size="9" font-weight="bold">★ GATE 1</text>
  <text x="110" y="402" fill="#e6edf3" font-size="8.5">Is the plan sound — root not symptom?</text>
  <text x="110" y="414" fill="#8b949e" font-size="7.5">after PLAN · Skeptic + SSA · BLOCKS before BUILD</text>

  <text x="32" y="436" fill="#d2a8ff" font-size="9" font-weight="bold">★ GATE 2</text>
  <text x="110" y="436" fill="#e6edf3" font-size="8.5">Is the build actually correct?</text>
  <text x="110" y="448" fill="#8b949e" font-size="7.5">in DELIVER · fresh-context Adversarial sub-agent (mandatory)</text>

  <!-- Bottom bar -->
  <rect x="20" y="540" width="900" height="26" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="0.4"/>
  <text x="470" y="557" text-anchor="middle" fill="#e6edf3" font-size="9">9 stages (ADVERSARIAL = ⑦, embedded in DELIVER) · 3 gates · 2 modes · auto-resume on crash (max 3) · DDD compounds every run</text>
</svg>
