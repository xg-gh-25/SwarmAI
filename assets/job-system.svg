<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1019"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" opacity="0.7"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#f59e0b">
    <line x1="0" y1="100" x2="960" y2="100" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="960" y2="200" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="960" y2="400" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="520" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="520" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="520" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#06b6d4" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">JOB SYSTEM</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="11">Background automation inside SwarmAI's backend service (the daemon on macOS, or a Hive): in-process scheduler + managed side services</text>

  <!-- ============ TRIGGERS ============ -->
  <text x="110" y="82" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1">TRIGGERS</text>
  <rect x="30" y="92" width="110" height="36" rx="6" fill="#1e1e36" stroke="#f59e0b" stroke-width="1"/>
  <text x="85" y="114" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">Hourly scheduler loop</text>
  <rect x="152" y="92" width="100" height="36" rx="6" fill="#1e1e36" stroke="#3b82f6" stroke-width="1"/>
  <text x="202" y="114" text-anchor="middle" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">Service start (+30s)</text>
  <rect x="264" y="92" width="100" height="36" rx="6" fill="#1e1e36" stroke="#8b5cf6" stroke-width="1"/>
  <text x="314" y="114" text-anchor="middle" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">API: run a job now</text>
  <rect x="376" y="92" width="100" height="36" rx="6" fill="#1e1e36" stroke="#10b981" stroke-width="1"/>
  <text x="426" y="114" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold">after:&lt;job&gt; ran</text>
  <path d="M 240,128 L 240,155" stroke="#f59e0b" stroke-width="1" opacity="0.3" marker-end="url(#arrowGold)"/>

  <!-- ============ SCHEDULER ============ -->
  <rect x="100" y="160" width="280" height="80" rx="12" fill="#1e1e36" stroke="#f59e0b" stroke-width="1.8" opacity="0.95"/>
  <rect x="100" y="160" width="280" height="80" rx="12" fill="url(#gold)" opacity="0.06"/>
  <text x="240" y="185" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold">Scheduler (in-process)</text>
  <text x="240" y="202" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Due jobs by cron; catch-up after sleep (up to 7 days)</text>
  <text x="240" y="216" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Dependency chain (after:&lt;job-id&gt;)</text>
  <text x="240" y="230" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">scheduler.py + cron_utils.py — a loop in the service, not launchd</text>

  <path d="M 380,200 L 440,200" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowGold)"/>
  <text x="410" y="194" text-anchor="middle" fill="#f59e0b" font-family="Arial,Helvetica,sans-serif" font-size="8" opacity="0.6">dispatch</text>

  <!-- ============ EXECUTOR ============ -->
  <rect x="445" y="155" width="200" height="90" rx="12" fill="#1e1e36" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
  <rect x="445" y="155" width="200" height="90" rx="12" fill="url(#cyan)" opacity="0.06"/>
  <text x="545" y="180" text-anchor="middle" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold">Executor</text>
  <text x="545" y="198" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Route by job.type:</text>
  <text x="545" y="214" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">agent_task | script | notify</text>
  <text x="545" y="228" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">maintenance + built-in handlers</text>
  <text x="545" y="240" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">executor.py — error isolation per job</text>

  <!-- ============ JOB DEFINITIONS ============ -->
  <rect x="680" y="140" width="250" height="110" rx="10" fill="#1e1e36" stroke="#334155" stroke-width="1" opacity="0.95"/>
  <text x="805" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">Job Definitions</text>
  <line x1="695" y1="170" x2="915" y2="170" stroke="#334155" stroke-width="0.5"/>
  <rect x="695" y="178" width="100" height="22" rx="4" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="745" y="193" text-anchor="middle" fill="#fca5a5" font-family="Arial,Helvetica,sans-serif" font-size="8">system_jobs.py</text>
  <text x="808" y="193" text-anchor="start" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">system jobs: in code, read-only</text>
  <rect x="695" y="206" width="100" height="22" rx="4" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="745" y="221" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="8">user-jobs.yaml</text>
  <text x="808" y="221" text-anchor="start" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">the person's own jobs</text>
  <text x="805" y="244" text-anchor="middle" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="8">job_manager.py: create / edit / pause / resume / delete</text>
  <path d="M 680,200 L 645,200" stroke="#334155" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>

  <!-- ============ JOBS (fan out from executor) ============ -->
  <path d="M 500,245 L 108,288" stroke="#06b6d4" stroke-width="1" opacity="0.3" marker-end="url(#arrowCyan)"/>
  <rect x="20" y="292" width="176" height="114" rx="8" fill="#1e1e36" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="20" y="292" width="176" height="114" rx="8" fill="url(#blue)" opacity="0.04"/>
  <text x="108" y="312" text-anchor="middle" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">Knowledge upkeep</text>
  <text x="108" y="330" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Weekly commit reader → CDF</text>
  <text x="108" y="343" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Weekly DDD report</text>
  <text x="108" y="356" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Code graph refresh (hourly)</text>
  <text x="108" y="369" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Re-index changed Library mounts</text>
  <text x="108" y="382" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Archive old raw logs (never deletes)</text>
  <text x="108" y="395" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Continue stalled Brain setups</text>
  <path d="M 545,245 L 296,288" stroke="#06b6d4" stroke-width="1" opacity="0.3" marker-end="url(#arrowCyan)"/>
  <rect x="208" y="292" width="176" height="114" rx="8" fill="#1e1e36" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="208" y="292" width="176" height="114" rx="8" fill="url(#purple)" opacity="0.04"/>
  <text x="296" y="312" text-anchor="middle" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">Health checks</text>
  <text x="296" y="330" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Memory health (weekly)</text>
  <text x="296" y="343" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">CDF health (weekdays)</text>
  <text x="296" y="356" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Self-loops health (weekly)</text>
  <text x="296" y="369" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Session-health probe</text>
  <text x="296" y="382" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Daily log patrol</text>
  <text x="296" y="395" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">Problems → one Slack message</text>
  <path d="M 545,245 L 484,288" stroke="#06b6d4" stroke-width="1" opacity="0.3" marker-end="url(#arrowCyan)"/>
  <rect x="396" y="292" width="176" height="114" rx="8" fill="#1e1e36" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="396" y="292" width="176" height="114" rx="8" fill="url(#red)" opacity="0.04"/>
  <text x="484" y="312" text-anchor="middle" fill="#fca5a5" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">Quality + eval</text>
  <text x="484" y="330" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Online session scoring (weekly)</text>
  <text x="484" y="343" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Full eval + drift alert</text>
  <text x="484" y="356" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">(every two weeks)</text>
  <text x="484" y="369" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Brain mistake audit (monthly)</text>
  <text x="484" y="382" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">Read-only: writes reports</text>
  <path d="M 600,245 L 672,288" stroke="#06b6d4" stroke-width="1" opacity="0.3" marker-end="url(#arrowCyan)"/>
  <rect x="584" y="292" width="176" height="114" rx="8" fill="#1e1e36" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="584" y="292" width="176" height="114" rx="8" fill="url(#gold)" opacity="0.04"/>
  <text x="672" y="312" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">Housekeeping + skills</text>
  <text x="672" y="330" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Weekly maintenance: prune state</text>
  <text x="672" y="343" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Pipeline worktree sweep</text>
  <text x="672" y="356" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Hive run-record sweep</text>
  <text x="672" y="369" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Skill proposer: drafts for gaps</text>
  <text x="672" y="382" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">(never deployed by itself)</text>
  <path d="M 600,245 L 860,288" stroke="#06b6d4" stroke-width="1" opacity="0.3" marker-end="url(#arrowCyan)"/>
  <rect x="772" y="292" width="176" height="114" rx="8" fill="#1e1e36" stroke="#10b981" stroke-width="1.2"/>
  <rect x="772" y="292" width="176" height="114" rx="8" fill="url(#green)" opacity="0.04"/>
  <text x="860" y="312" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">User jobs</text>
  <text x="860" y="330" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">agent_task: headless Claude CLI</text>
  <text x="860" y="343" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">with MCP tools</text>
  <text x="860" y="356" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">script: subprocess, no LLM</text>
  <text x="860" y="369" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">notify: one-way message</text>
  <text x="860" y="382" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">Set up via s_job-manager</text>
  <text x="20" y="270" text-anchor="start" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8" letter-spacing="1">SYSTEM JOBS — BY WHAT THEY DO</text>

  <!-- ============ OUTPUTS ============ -->
  <rect x="30" y="420" width="260" height="75" rx="10" fill="#1e1e36" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
  <rect x="30" y="420" width="260" height="75" rx="10" fill="url(#green)" opacity="0.04"/>
  <text x="160" y="442" text-anchor="middle" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">Outputs</text>
  <text x="160" y="460" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">JobResults/ per-run markdown</text>
  <text x="160" y="476" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Knowledge/Reports/ weekly DDD report</text>
  <text x="160" y="490" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">3 failures in a row → a notification</text>

  <!-- ============ STATE ============ -->
  <rect x="320" y="420" width="310" height="75" rx="10" fill="#1e1e36" stroke="#334155" stroke-width="0.8" opacity="0.95"/>
  <text x="475" y="442" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold">State Persistence</text>
  <text x="475" y="460" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">state.json: last run, status, failures, totals per job</text>
  <text x="475" y="476" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">.job-results.jsonl: append-only execution log</text>
  <text x="475" y="490" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">On disk: survives service restarts; missed runs catch up</text>

  <!-- ============ SERVICE MANAGER ============ -->
  <rect x="660" y="420" width="270" height="75" rx="10" fill="#1e1e36" stroke="#ec4899" stroke-width="1.2" opacity="0.95"/>
  <rect x="660" y="420" width="270" height="75" rx="10" fill="url(#pink)" opacity="0.04"/>
  <text x="795" y="442" text-anchor="middle" fill="#f472b6" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold">Service Manager (side services)</text>
  <text x="795" y="460" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Services/*/service.json discovery</text>
  <text x="795" y="476" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="9">Auto-restart (30s health check, max 5 crashes)</text>
  <text x="795" y="490" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">Run by the data dir's owner | SIGTERM + 5s SIGKILL</text>

  <!-- Legend -->
  <g transform="translate(30, 508)">
    <circle cx="4" cy="0" r="3" fill="#f59e0b" opacity="0.6"/>
    <text x="12" y="4" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Scheduler</text>
    <circle cx="84" cy="0" r="3" fill="#06b6d4" opacity="0.6"/>
    <text x="92" y="4" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Executor</text>
    <circle cx="154" cy="0" r="3" fill="#10b981" opacity="0.6"/>
    <text x="162" y="4" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">User jobs</text>
    <circle cx="224" cy="0" r="3" fill="#ec4899" opacity="0.6"/>
    <text x="232" y="4" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="8">Side services</text>
  </g>
  <text x="930" y="512" text-anchor="end" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="8">Watched feeds are not jobs: the Inbox pulls them.</text>
</svg>
