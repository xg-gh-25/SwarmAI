<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="sans-serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="28" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Agent Harness — Foundation Layer Architecture</text>
  <text x="400" y="46" fill="#58a6ff" font-size="10" text-anchor="middle">The runtime platform that makes persistent, evolving AI operation possible</text>

  <!-- ================================================================== -->
  <!-- Row 1: Context System -->
  <!-- ================================================================== -->
  <rect x="30" y="60" width="740" height="105" rx="8" fill="#0a1420" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="45" y="80" fill="#58a6ff" font-size="11" font-weight="bold">CONTEXT SYSTEM — 11-File System Prompt (P0-P10)</text>
  <text x="45" y="94" fill="#e6edf3" font-size="8" fill-opacity="0.6">Every session starts with full operational awareness. Priority-ordered, token-budgeted, truncation-safe.</text>

  <!-- P0-P2 -->
  <rect x="45" y="102" width="85" height="48" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.5"/>
  <text x="87" y="118" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">P0-P2</text>
  <text x="87" y="130" fill="#e6edf3" font-size="7" text-anchor="middle">Identity</text>
  <text x="87" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">Soul, Principles</text>

  <!-- P3-P5 -->
  <rect x="138" y="102" width="85" height="48" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.5"/>
  <text x="180" y="118" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">P3-P5</text>
  <text x="180" y="130" fill="#e6edf3" font-size="7" text-anchor="middle">Agent Rules</text>
  <text x="180" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">User, Steering</text>

  <!-- P6 -->
  <rect x="231" y="102" width="65" height="48" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.5"/>
  <text x="263" y="118" fill="#e6edf3" font-size="8" text-anchor="middle" font-weight="bold">P6</text>
  <text x="263" y="130" fill="#e6edf3" font-size="7" text-anchor="middle">Tools</text>
  <text x="263" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">Environment</text>

  <!-- P7 Memory -->
  <rect x="304" y="102" width="90" height="48" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="349" y="118" fill="#d2a8ff" font-size="8" text-anchor="middle" font-weight="bold">P7 MEMORY</text>
  <text x="349" y="130" fill="#e6edf3" font-size="7" text-anchor="middle">Agent recall</text>
  <text x="349" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">Tier 2</text>

  <!-- P8 Evolution -->
  <rect x="402" y="102" width="90" height="48" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="447" y="118" fill="#f78166" font-size="8" text-anchor="middle" font-weight="bold">P8 EVOLUTION</text>
  <text x="447" y="130" fill="#e6edf3" font-size="7" text-anchor="middle">Self-improve</text>
  <text x="447" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">Corrections</text>

  <!-- P9 Knowledge -->
  <rect x="500" y="102" width="100" height="48" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="550" y="118" fill="#7ee787" font-size="8" text-anchor="middle" font-weight="bold">P9 KNOWLEDGE</text>
  <text x="550" y="130" fill="#e6edf3" font-size="7" text-anchor="middle">Workspace index</text>
  <text x="550" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">Tier 3</text>

  <!-- P10 Projects -->
  <rect x="608" y="102" width="148" height="48" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.2"/>
  <text x="682" y="115" fill="#7ee787" font-size="8" text-anchor="middle" font-weight="bold">P10 PROJECTS.md</text>
  <text x="682" y="128" fill="#e6edf3" font-size="7" text-anchor="middle">Entity Index (DDD routing)</text>
  <text x="682" y="141" fill="#e6edf3" font-size="7" text-anchor="middle">+ Project Registry</text>
  <text x="682" y="152" fill="#f78166" font-size="7" text-anchor="middle">DDD Entry Point</text>

  <!-- ================================================================== -->
  <!-- Row 2: Memory Pipeline + Self-Evolution (side by side) -->
  <!-- ================================================================== -->

  <!-- Memory Pipeline -->
  <rect x="30" y="178" width="370" height="140" rx="8" fill="#0c1520" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="45" y="198" fill="#d2a8ff" font-size="11" font-weight="bold">4-TIER MEMORY PIPELINE</text>
  <text x="45" y="212" fill="#e6edf3" font-size="8" fill-opacity="0.6">Knowledge flows upward through increasing authority</text>

  <!-- Tier boxes -->
  <rect x="45" y="220" width="340" height="22" rx="3" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.4"/>
  <text x="55" y="234" fill="#e6edf3" font-size="8">Tier 1: DailyActivity — raw session logs (30d TTL)</text>

  <rect x="45" y="246" width="340" height="22" rx="3" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="0.6"/>
  <text x="55" y="260" fill="#d2a8ff" font-size="8">Tier 2: MEMORY.md — agent behavioral recall (permanent)</text>

  <rect x="45" y="272" width="340" height="22" rx="3" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.6"/>
  <text x="55" y="286" fill="#7ee787" font-size="8">Tier 3: Knowledge/ — workspace common knowledge (research, designs)</text>

  <rect x="45" y="298" width="340" height="22" rx="3" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="55" y="312" fill="#7ee787" font-size="8" font-weight="bold">Tier 4: DDD — authoritative per-project domain expertise</text>

  <!-- Self-Evolution -->
  <rect x="410" y="178" width="360" height="140" rx="8" fill="#1a100c" stroke="#f78166" stroke-width="1.2"/>
  <text x="425" y="198" fill="#f78166" font-size="11" font-weight="bold">SELF-EVOLUTION LOOP</text>
  <text x="425" y="212" fill="#e6edf3" font-size="8" fill-opacity="0.6">Learn from mistakes, never repeat them</text>

  <rect x="425" y="222" width="330" height="25" rx="3" fill="#1a1a2e" stroke="#f78166" stroke-width="0.5"/>
  <text x="435" y="238" fill="#e6edf3" font-size="8">User corrections → EVOLUTION.md (C001-C022)</text>

  <rect x="425" y="251" width="330" height="25" rx="3" fill="#1a1a2e" stroke="#f78166" stroke-width="0.5"/>
  <text x="435" y="267" fill="#e6edf3" font-size="8">Recurring patterns → steeringify → STEERING.md rules</text>

  <rect x="425" y="280" width="330" height="25" rx="3" fill="#1a1a2e" stroke="#f78166" stroke-width="0.5"/>
  <text x="435" y="296" fill="#e6edf3" font-size="8">Corrections → Channel 6 → DDD IMPROVEMENT.md proposals</text>

  <text x="590" y="316" fill="#f78166" font-size="8" text-anchor="middle" fill-opacity="0.7">Every mistake becomes a structural prevention</text>

  <!-- ================================================================== -->
  <!-- Row 3: Session Hooks + Skills + Tools -->
  <!-- ================================================================== -->

  <rect x="30" y="332" width="740" height="100" rx="8" fill="#0a1420" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="45" y="352" fill="#58a6ff" font-size="11" font-weight="bold">SESSION LIFECYCLE + SKILLS + TOOLS</text>

  <!-- Hooks -->
  <rect x="45" y="362" width="175" height="55" rx="5" fill="#1a1a2e" stroke="#58a6ff" stroke-width="0.6"/>
  <text x="132" y="378" fill="#58a6ff" font-size="9" text-anchor="middle" font-weight="bold">Session Hooks</text>
  <text x="132" y="392" fill="#e6edf3" font-size="7.5" text-anchor="middle">Pre: load context, check health</text>
  <text x="132" y="404" fill="#e6edf3" font-size="7.5" text-anchor="middle">Post: extract activity, propose DDD</text>
  <text x="132" y="414" fill="#e6edf3" font-size="7" text-anchor="middle" fill-opacity="0.6">10 hooks, zero runtime overhead</text>

  <!-- Skills -->
  <rect x="228" y="362" width="175" height="55" rx="5" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.6"/>
  <text x="315" y="378" fill="#7ee787" font-size="9" text-anchor="middle" font-weight="bold">Skill System</text>
  <text x="315" y="392" fill="#e6edf3" font-size="7.5" text-anchor="middle">75+ composable skills</text>
  <text x="315" y="404" fill="#e6edf3" font-size="7.5" text-anchor="middle">Lazy/always tiered loading</text>
  <text x="315" y="414" fill="#e6edf3" font-size="7" text-anchor="middle" fill-opacity="0.6">Pipeline + Pollinate = skills</text>

  <!-- Tools + MCP -->
  <rect x="411" y="362" width="175" height="55" rx="5" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="0.6"/>
  <text x="498" y="378" fill="#d2a8ff" font-size="9" text-anchor="middle" font-weight="bold">Tools + MCP</text>
  <text x="498" y="392" fill="#e6edf3" font-size="7.5" text-anchor="middle">60+ MCP integrations</text>
  <text x="498" y="404" fill="#e6edf3" font-size="7.5" text-anchor="middle">Slack, Outlook, Sentral, GitHub</text>
  <text x="498" y="414" fill="#e6edf3" font-size="7" text-anchor="middle" fill-opacity="0.6">Agent acts, not just thinks</text>

  <!-- Job System -->
  <rect x="594" y="362" width="162" height="55" rx="5" fill="#1a1a2e" stroke="#f78166" stroke-width="0.6"/>
  <text x="675" y="378" fill="#f78166" font-size="9" text-anchor="middle" font-weight="bold">Job System</text>
  <text x="675" y="392" fill="#e6edf3" font-size="7.5" text-anchor="middle">Background automation</text>
  <text x="675" y="404" fill="#e6edf3" font-size="7.5" text-anchor="middle">Signal pipeline, cron tasks</text>
  <text x="675" y="414" fill="#e6edf3" font-size="7" text-anchor="middle" fill-opacity="0.6">24/7 via launchd/systemd</text>

  <!-- ================================================================== -->
  <!-- Row 4: Session Management + Platform Modes -->
  <!-- ================================================================== -->

  <rect x="30" y="445" width="740" height="85" rx="8" fill="#0c1520" stroke="#58a6ff" stroke-width="1"/>
  <text x="45" y="465" fill="#58a6ff" font-size="11" font-weight="bold">SESSION MANAGEMENT + MULTI-PLATFORM</text>

  <!-- Session -->
  <rect x="45" y="475" width="230" height="42" rx="5" fill="#1a1a2e" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="160" y="491" fill="#e6edf3" font-size="8.5" text-anchor="middle" font-weight="bold">Session Router + Unit + Lifecycle</text>
  <text x="160" y="505" fill="#e6edf3" font-size="7.5" text-anchor="middle">1-4 concurrent tabs, RAM-adaptive, 5-state machine</text>

  <!-- Platform modes -->
  <rect x="283" y="475" width="240" height="42" rx="5" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.5"/>
  <text x="403" y="491" fill="#e6edf3" font-size="8.5" text-anchor="middle" font-weight="bold">4-Platform Backend Isolation</text>
  <text x="403" y="505" fill="#e6edf3" font-size="7.5" text-anchor="middle">macOS daemon | Windows/Linux subprocess | Hive (EC2) | Dev</text>

  <!-- Channels -->
  <rect x="531" y="475" width="225" height="42" rx="5" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="0.5"/>
  <text x="643" y="491" fill="#e6edf3" font-size="8.5" text-anchor="middle" font-weight="bold">Channel Gateway</text>
  <text x="643" y="505" fill="#e6edf3" font-size="7.5" text-anchor="middle">Slack adapter (24/7), multi-user, queue management</text>

  <!-- ================================================================== -->
  <!-- Bottom: Key Properties -->
  <!-- ================================================================== -->
  <rect x="30" y="543" width="740" height="42" rx="6" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.4" stroke-opacity="0.3"/>
  <text x="400" y="560" fill="#e6edf3" font-size="9" text-anchor="middle" font-weight="bold">KEY: The Harness exists independently of DDD and Engines. It is the substrate they both run on.</text>
  <text x="400" y="575" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.7">DDD and Engines are NEW CONSUMERS of existing Harness capabilities — context loading, hooks, memory, tools. Zero new infrastructure.</text>
</svg>
