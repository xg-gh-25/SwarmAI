&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};
const NS=&#x27;http://www.w3.org/2000/svg&#x27;, G=$(&#x27;#g&#x27;);
function path(d,stroke,marker,dash,w){const p=document.createElementNS(NS,&#x27;path&#x27;);p.setAttribute(&#x27;d&#x27;,d);p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);p.setAttribute(&#x27;stroke&#x27;,stroke);p.setAttribute(&#x27;stroke-width&#x27;,w||2);if(dash)p.setAttribute(&#x27;stroke-dasharray&#x27;,dash);if(marker)p.setAttribute(&#x27;marker-end&#x27;,`url(#${marker})`);G.appendChild(p);}
function text(x,y,t,fill,anchor){const e=document.createElementNS(NS,&#x27;text&#x27;);e.setAttribute(&#x27;x&#x27;,x);e.setAttribute(&#x27;y&#x27;,y);e.setAttribute(&#x27;class&#x27;,&#x27;wl&#x27;);e.setAttribute(&#x27;fill&#x27;,fill);if(anchor)e.setAttribute(&#x27;text-anchor&#x27;,anchor);e.textContent=t;G.appendChild(e);}

// ---------- decision funnel: each layer absorbs decisions, only judgment reaches a person ----------
const FW=[228,204,180,156,132,108];
[[&#x27;所有决策&#x27;,&#x27;#e5e7eb&#x27;,&#x27;#111827&#x27;],[&#x27;Brain 已有答案&#x27;,&#x27;#d5efe9&#x27;,&#x27;#0f766e&#x27;],[&#x27;确定性检查&#x27;,&#x27;#e2e8f0&#x27;,&#x27;#334155&#x27;],[&#x27;Agent 自决&#x27;,&#x27;#dbeafe&#x27;,&#x27;#1d4ed8&#x27;],[&#x27;人&#x27;,&#x27;#fde0cc&#x27;,&#x27;#c2410c&#x27;]].forEach(([t,bg,c],k)=&gt;{
  const ins=(FW[k]-FW[k+1])/2;
  $(&#x27;#frows&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;fr&#x27;,t,{width:FW[k]+&#x27;px&#x27;,background:bg,color:c,clipPath:`polygon(0 0,100% 0,calc(100% - ${ins}px) 100%,${ins}px 100%)`}));
});

// ---------- cycle geometry ----------
const PMC={cx:566,cy:470,r:205,hw:62,hh:27,w:124};
const BDC={cx:1246,cy:476,r:222,rx:250,hw:82,hh:28,w:164};   // rx: the Builder ring is a little wider than tall
const at=(c,a,r)=&gt;({x:c.cx+(r||c.rx||c.r)*Math.cos(a*Math.PI/180), y:c.cy-(r||c.r)*Math.sin(a*Math.PI/180)});
const pad=(c,a)=&gt;{const t=a*Math.PI/180, rx=c.rx||c.r;const ext=Math.abs(c.hw*Math.sin(t))+Math.abs(c.hh*Math.cos(t));const ds=Math.hypot(rx*Math.sin(t),c.r*Math.cos(t));return ext/ds*180/Math.PI+2;};
// clockwise arc on screen from the node at angle a1 to the node at angle a2
function arc(c,a1,a2,stroke,marker,dash){
  if(a2&gt;=a1) a2-=360;
  const s=a1-pad(c,a1), e=a2+pad(c,a2);
  const p1=at(c,s), p2=at(c,e), large=(s-e)&gt;180?1:0;
  path(`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} A${c.rx||c.r},${c.r} 0 ${large} 1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,stroke,marker,dash,2.5);
}
const N={};
function node(id,c,a,k,t,s,extra){
  const p=at(c,a); const n={x:p.x,y:p.y,a}; N[id]=n;
  const hum=extra&amp;&amp;extra.hum!==undefined?extra.hum:extra&amp;&amp;[1,2,6].includes(extra.no);
  const no=extra&amp;&amp;extra.no?`&lt;i class=&quot;sno${hum?&#x27; hum&#x27;:&#x27;&#x27;}&quot;&gt;${extra.no}&lt;/i&gt;`:&#x27;&#x27;;
  const d=el(&#x27;div&#x27;,&#x27;nd &#x27;+k,`&lt;b&gt;${no}${t}&lt;/b&gt;&lt;span&gt;${s}&lt;/span&gt;`,{left:p.x+&#x27;px&#x27;,top:p.y+&#x27;px&#x27;,width:c.w+&#x27;px&#x27;});
  if(extra&amp;&amp;extra.role) d.appendChild(el(&#x27;i&#x27;,&#x27;role&#x27;+(extra.b2?&#x27; b2&#x27;:&#x27;&#x27;),extra.role,extra.left?{left:&#x27;-8px&#x27;,right:&#x27;auto&#x27;}:null));
  $(&#x27;#nodes&#x27;).appendChild(d);
}

// ---------- PM cycle: PM + PM Agent, own runs ----------
// 7 stages, like the Builder cycle; orange = a person takes part
const PA=[180,135,90,45,0,-45,-110];
node(&#x27;p1&#x27;,PMC,PA[0],&#x27;&#x27;,&#x27;接 Intent&#x27;,&#x27;自动 Triage&#x27;,{no:1,hum:0});
node(&#x27;p2&#x27;,PMC,PA[1],&#x27;h&#x27;,&#x27;澄清需求&#x27;,&#x27;基于 DDD&#x27;,{no:2,hum:1,role:&#x27;PM + Agent&#x27;});
node(&#x27;p3&#x27;,PMC,PA[2],&#x27;&#x27;,&#x27;生成 PRD&#x27;,&#x27;PRD · Mockup&lt;br&gt;Prototype&#x27;,{no:3,hum:0});
node(&#x27;p4&#x27;,PMC,PA[3],&#x27;&#x27;,&#x27;Agent 评审&#x27;,&#x27;对抗评审 PRD&#x27;,{no:4,hum:0});
node(&#x27;p5&#x27;,PMC,PA[4],&#x27;h&#x27;,&#x27;对齐与评审&#x27;,&#x27;协调对齐&#x27;,{no:5,hum:1,role:&#x27;All stakeholders&#x27;});
node(&#x27;p6&#x27;,PMC,PA[5],&#x27;h&#x27;,&#x27;定稿与批准&#x27;,&#x27;Finalize PRD&lt;br&gt;批准 → Jira&#x27;,{no:6,hum:1,role:&#x27;PM + Agent&#x27;});
node(&#x27;p7&#x27;,PMC,PA[6],&#x27;h&#x27;,&#x27;结果验收&#x27;,&#x27;对照 ACs&#x27;,{no:7,hum:1,role:&#x27;PM + Agent&#x27;});
for(let i=0;i&lt;5;i++) arc(PMC,PA[i],PA[i+1],&#x27;#7c3aed&#x27;,&#x27;mP&#x27;);
arc(PMC,PA[5],PA[6],&#x27;#a78bfa&#x27;,null,&#x27;5 6&#x27;);
arc(PMC,PA[6],PA[0],&#x27;#7c3aed&#x27;,&#x27;mP&#x27;);
text(352,716,&#x27;上线与反馈：新的 Intent 回到 Jira&#x27;,&#x27;#7c3aed&#x27;,&#x27;start&#x27;);
$(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;rc&#x27;,`&lt;b style=&quot;font-size:24px;color:#6d28d9&quot;&gt;PM 环&lt;/b&gt;&lt;em style=&quot;color:#6d28d9&quot;&gt;PM + PM Agent&lt;/em&gt;`,{left:&#x27;566px&#x27;,top:&#x27;470px&#x27;}));

// ---------- Builder cycle: the unchanged pipeline, many runs at once ----------
// the same eight stages as the Inside the Builder Loop and Pipeline Run pages
const BA=[180,130,85,40,-5,-50,-95,-140];
node(&#x27;b1&#x27;,BDC,BA[0],&#x27;bb h c&#x27;,&#x27;评估&#x27;,&#x27;Intent Evaluation&#x27;,{no:1,role:&#x27;按需问人&#x27;,b2:1});
node(&#x27;b2&#x27;,BDC,BA[1],&#x27;bb h c&#x27;,&#x27;方案&#x27;,&#x27;Design-Spec&lt;br&gt;PM + Builder 评审&#x27;,{no:2,role:&#x27;按需问人&#x27;,b2:1});
node(&#x27;b3&#x27;,BDC,BA[2],&#x27;bb&#x27;,&#x27;计划&#x27;,&#x27;任务 · 完成标准&#x27;,{no:3});
node(&#x27;b4&#x27;,BDC,BA[3],&#x27;bb free&#x27;,&#x27;构建（并发 Runs）&#x27;,&#x27;Native Coding&#x27;,{no:4});
node(&#x27;b5&#x27;,BDC,BA[4],&#x27;bb&#x27;,&#x27;评审&#x27;,&#x27;对抗评审 · 门禁&#x27;,{no:5});
node(&#x27;b6&#x27;,BDC,BA[5],&#x27;bb&#x27;,&#x27;测试&#x27;,&#x27;在审过的树上&#x27;,{no:6,hum:0});
node(&#x27;b7&#x27;,BDC,BA[6],&#x27;bb h c&#x27;,&#x27;交付&#x27;,&#x27;PR · 证据报告&#x27;,{no:7,hum:1,role:&#x27;Builder 按需审 PR&#x27;,b2:1,left:1});
node(&#x27;b8&#x27;,BDC,BA[7],&#x27;bb refl&#x27;,&#x27;回写&#x27;,&#x27;Reflect&#x27;,{no:8,hum:0});
for(let i=0;i&lt;8;i++) arc(BDC,BA[i],BA[(i+1)%8],i===7?&#x27;#93c5fd&#x27;:&#x27;#2563eb&#x27;,i===7?null:&#x27;mB&#x27;,i===7?&#x27;5 6&#x27;:null);
// runs travelling round the cycle at the same time, in the gaps between stages; orange = about to wait at 2 方案 and 7 交付
[[168],[156,1],[62],[20],[-25],[-73,1],[-118]].forEach(([a,w])=&gt;{
  const p=at(BDC,a);
  $(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;tok&#x27;+(w?&#x27; w&#x27;:&#x27;&#x27;),null,{left:p.x+&#x27;px&#x27;,top:p.y+&#x27;px&#x27;}));
});
$(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;rc&#x27;,`&lt;b style=&quot;font-size:28px;color:#1d4ed8&quot;&gt;Builder 环&lt;/b&gt;&lt;em style=&quot;color:#1d4ed8&quot;&gt;Builder Agent 自主 run&lt;/em&gt;&lt;span class=&quot;k&quot;&gt;并发：本机 ×N · 云端 ×N&lt;/span&gt;`,{left:&#x27;1246px&#x27;,top:&#x27;483px&#x27;}));

// ---------- Human-on-the-loop points ----------

&lt;script&gt;
// ---------- geometry (stage px) ----------
const EX=480, EY=208;              // execution pane origin
const C0=120, CW=121;               // first stage column x (pane-relative), column width
const cx=i=&gt;EX+C0+CW*i+CW/2;        // stage column centre, absolute
const rcx=i=&gt;C0+CW*i+CW/2;          // stage column centre, pane-relative
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};

// ---------- ② funnel: same layers as the overall diagram ----------
const W=[240,216,192,168,144,120], RH=120, RG=14, RT=56, PANE=256;
[[&#x27;所有决策&#x27;,&#x27;#f3f4f6&#x27;,&#x27;#111827&#x27;],[&#x27;Brain 已有答案&#x27;,&#x27;#dbf1ec&#x27;,&#x27;#0f766e&#x27;],[&#x27;确定性检查&#x27;,&#x27;#e8ecf2&#x27;,&#x27;#334155&#x27;],[&#x27;Agent 自决&#x27;,&#x27;#dbeafe&#x27;,&#x27;#1d4ed8&#x27;],[&#x27;人&#x27;,&#x27;#fde4d0&#x27;,&#x27;#c2410c&#x27;]].forEach(([t,bg,c],k)=&gt;{
  const wt=W[k], wb=W[k+1], ins=(wt-wb)/2;
  $(&#x27;#frows&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;frow&#x27;,t,{left:((PANE-wt)/2)+&#x27;px&#x27;,top:(RT+k*(RH+RG))+&#x27;px&#x27;,width:wt+&#x27;px&#x27;,height:RH+&#x27;px&#x27;,background:bg,color:c,
    clipPath:`polygon(0 0,100% 0,calc(100% - ${ins}px) 100%,${ins}px 100%)`}));
});

// ---------- ④ stage columns: the same eight stages as the Pipeline Run page ----------
// 1, 2, 7 = a person may take part (only when needed)
const stages=[
  [&#x27;评估&#x27;,&#x27;EVALUATE&#x27;],
  [&#x27;方案&#x27;,&#x27;THINK&#x27;],
  [&#x27;计划&#x27;,&#x27;PLAN&#x27;],
  [&#x27;构建&#x27;,&#x27;Native Coding&#x27;],
  [&#x27;评审&#x27;,&#x27;REVIEW&#x27;],
  [&#x27;测试&#x27;,&#x27;TEST&#x27;],
  [&#x27;交付&#x27;,&#x27;结果 → Jira&lt;br&gt;待 PM 验收&#x27;,&#x27;hand&#x27;],
  [&#x27;回写&#x27;,&#x27;REFLECT&#x27;],
];
stages.forEach((s,i)=&gt;{
  const x=C0+CW*i, refl=i===7, hum=[0,1,6].includes(i);
  $(&#x27;#cols&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;colbg&#x27;+(refl?&#x27; refl&#x27;:&#x27;&#x27;)+(i===3?&#x27; free&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;),null,{left:x+&#x27;px&#x27;,width:CW+&#x27;px&#x27;}));
  $(&#x27;#cols&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;sh&#x27;+(refl?&#x27; refl&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;),`&lt;b&gt;&lt;i&gt;${i+1}&lt;/i&gt;${s[0]}&lt;/b&gt;${s[1]?`&lt;em${s[2]?` class=&quot;${s[2]}&quot;`:&#x27;&#x27;}&gt;${s[1]}&lt;/em&gt;`:&#x27;&#x27;}`,{left:x+&#x27;px&#x27;,width:CW+&#x27;px&#x27;}));
});

// ---------- ④ the pipeline owns only the two ends ----------
[[0,3,&#x27;&#x27;,&#x27;流程管&#x27;],[3,4,&#x27; free&#x27;,&#x27;不管&#x27;],[4,8,&#x27;&#x27;,&#x27;流程管&#x27;]].forEach(([a,b,f,t])=&gt;{
  $(&#x27;#ends&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;ends&#x27;+f,`&lt;span&gt;${t}&lt;/span&gt;`,{left:(C0+CW*a+4)+&#x27;px&#x27;,width:(CW*(b-a)-8)+&#x27;px&#x27;}));
});

// ---------- ① ④ concurrent runs ----------
// per stage: d=done, c=current, p=waiting on a person, t=to do, s=skipped by profile, n=not in this mode
const LANES=[
  {top:130,name:&#x27;run A&#x27;,tag:&#x27;Pipeline · full&#x27;},
  {top:166,name:&#x27;run B&#x27;,tag:&#x27;Native Run&#x27;},
  {top:270,name:&#x27;run C&#x27;,tag:&#x27;Pipeline · full&#x27;},
  {top:306,name:&#x27;run D&#x27;,tag:&#x27;Pipeline · trivial&#x27;},
];
// lane state for each demo step (0 = overview)
const LS=[
  [&#x27;ddddcttt&#x27;,&#x27;nnndddct&#x27;,&#x27;dptttttt&#x27;,&#x27;dsdctttt&#x27;],
  [&#x27;tttttttt&#x27;,&#x27;nnnttttt&#x27;,&#x27;tttttttt&#x27;,&#x27;tstttttt&#x27;],
  [&#x27;tttttttt&#x27;,&#x27;nnnttttt&#x27;,&#x27;tttttttt&#x27;,&#x27;tstttttt&#x27;],
  [&#x27;dctttttt&#x27;,&#x27;nnnctttt&#x27;,&#x27;cttttttt&#x27;,&#x27;cstttttt&#x27;],
  [&#x27;dddctttt&#x27;,&#x27;nnndcttt&#x27;,&#x27;dctttttt&#x27;,&#x27;dscttttt&#x27;],
  [&#x27;ddddcttt&#x27;,&#x27;nnndddct&#x27;,&#x27;dptttttt&#x27;,&#x27;dsdctttt&#x27;],
  [&#x27;ddddddct&#x27;,&#x27;nnnddddc&#x27;,&#x27;ddcttttt&#x27;,&#x27;dsddcttt&#x27;],
  [&#x27;dddddddc&#x27;,&#x27;nnnddddd&#x27;,&#x27;dddctttt&#x27;,&#x27;dsddddct&#x27;],
  [&#x27;dddddddc&#x27;,&#x27;nnnddddd&#x27;,&#x27;dddctttt&#x27;,&#x27;dsddddct&#x27;],
  [&#x27;dddddddd&#x27;,&#x27;nnnddddd&#x27;,&#x27;ddddcttt&#x27;,&#x27;dsdddddd&#x27;],
];
const LC={
  0:{2:[1,&#x27;⏸ 等人&#x27;,&#x27;p&#x27;],3:[3,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  1:{0:[0,&#x27;排队中&#x27;,&#x27;&#x27;]},
  2:{0:[0,&#x27;装载中&#x27;,&#x27;&#x27;]},
  3:{3:[0,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  4:{3:[2,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  5:{2:[1,&#x27;⏸ 等人看 spec&#x27;,&#x27;p&#x27;],3:[3,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  6:{2:[2,&#x27;↻ 已恢复&#x27;,&#x27;&#x27;],0:[6,&#x27;待 PM 验收&#x27;,&#x27;p&#x27;]},
  7:{3:[6,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  8:{3:[6,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  9:{},
};
[{top:112,t:&#x27;本机 Local&#x27;},{top:252,t:&#x27;云端 Cloud&#x27;}].forEach(g=&gt;$(&#x27;#lanes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;grp&#x27;,g.t,{top:g.top+&#x27;px&#x27;})));
const laneBox=el(&#x27;div&#x27;,null,null,{position:&#x27;absolute&#x27;,left:&#x27;0&#x27;,top:&#x27;0&#x27;});
$(&#x27;#lanes&#x27;).appendChild(laneBox);
function renderLanes(step){
  laneBox.innerHTML=&#x27;&#x27;;
  LANES.forEach((L,n)=&gt;{
    const lane=el(&#x27;div&#x27;,&#x27;lane&#x27;,null,{top:L.top+&#x27;px&#x27;});
    lane.appendChild(el(&#x27;div&#x27;,&#x27;ll&#x27;,`&lt;b&gt;${L.name}&lt;/b&gt;&lt;span&gt;${L.tag}&lt;/span&gt;`));
    const st=LS[step][n].split(&#x27;&#x27;);
    for(let i=0;i&lt;7;i++){
      const a=st[i], b=st[i+1];
      if(a===&#x27;n&#x27;) continue;
      let cls=&#x27;track&#x27;;
      if(a===&#x27;d&#x27;&amp;&amp;&#x27;dcp&#x27;.includes(b)) cls+=&#x27; done&#x27;;
      if(a===&#x27;s&#x27;||b===&#x27;s&#x27;) cls=&#x27;track skip&#x27;;
      lane.appendChild(el(&#x27;div&#x27;,cls,null,{left:rcx(i)+&#x27;px&#x27;,width:CW+&#x27;px&#x27;}));
    }
    st.forEach((v,i)=&gt;{ if(v!==&#x27;n&#x27;&amp;&amp;v!==&#x27;s&#x27;) lane.appendChild(el(&#x27;div&#x27;,&#x27;dot &#x27;+v,null,{left:rcx(i)+&#x27;px&#x27;})); });
    const c=(LC[step]||{})[n];
    if(c&amp;&amp;c[1]) lane.appendChild(el(&#x27;div&#x27;,&#x27;cap &#x27;+c[2],c[1],{left:(rcx(c[0])+14)+&#x27;px&#x27;}));
    laneBox.appendChild(lane);
  });
}
// many more runs, drawn compact: [start stage, current stage at overview, waiting-on-person?]
const MINI_OFF=[0,-9,-9,-3,-2,0,1,2,2,3];

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};
const NS=&#x27;http://www.w3.org/2000/svg&#x27;, G=$(&#x27;#g&#x27;);
function path(d,stroke,marker,w,dash){const p=document.createElementNS(NS,&#x27;path&#x27;);p.setAttribute(&#x27;d&#x27;,d);p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);p.setAttribute(&#x27;stroke&#x27;,stroke);p.setAttribute(&#x27;stroke-width&#x27;,w||2.5);if(dash)p.setAttribute(&#x27;stroke-dasharray&#x27;,dash);if(marker)p.setAttribute(&#x27;marker-end&#x27;,`url(#${marker})`);G.appendChild(p);}
function text(x,y,t,fill,anchor){const e=document.createElementNS(NS,&#x27;text&#x27;);e.setAttribute(&#x27;x&#x27;,x);e.setAttribute(&#x27;y&#x27;,y);e.setAttribute(&#x27;class&#x27;,&#x27;wl&#x27;);e.setAttribute(&#x27;fill&#x27;,fill);if(anchor)e.setAttribute(&#x27;text-anchor&#x27;,anchor);e.textContent=t;G.appendChild(e);}

// ---------- geometry: a label column, then eight stage columns ----------
const C0=136, CW=170, GAP=12;
const X=i=&gt;C0+i*(CW+GAP), CX=i=&gt;X(i)+CW/2;

// ---------- eight stages: what the agent writes, what the checks decide ----------
const ST=[
  [&#x27;EVALUATE&#x27;,&#x27;评估&#x27;,[&#x27;doc:Requirements&#x27;,&#x27;EARS 结构&#x27;],[&#x27;需求可验证&#x27;,&#x27;Gate-0 按需&#x27;]],
  [&#x27;THINK&#x27;,&#x27;方案&#x27;,[&#x27;方案对比&#x27;,&#x27;用方案词查 Brain&#x27;],[&#x27;代码证据定案&#x27;]],
  [&#x27;PLAN&#x27;,&#x27;计划&#x27;,[&#x27;doc:Design-Spec&#x27;,&#x27;任务 · 完成标准&#x27;],[&#x27;任务 ↔ 需求&#x27;,&#x27;验收有测试&#x27;]],
  [&#x27;BUILD&#x27;,&#x27;构建&#x27;,[&#x27;Native Coding&#x27;,&#x27;Fan-out Runs&#x27;],[&#x27;独立 worktree&#x27;,&#x27;报告在当前树&#x27;]],
  [&#x27;REVIEW&#x27;,&#x27;评审&#x27;,[&#x27;doc:Fixing-Spec&#x27;,&#x27;按原因归并&#x27;,&#x27;一次修完&#x27;],[&#x27;按改动派专家&#x27;,&#x27;R1 → R2&#x27;,&#x27;修复有测试证明&#x27;,&#x27;最多两轮&#x27;]],
  [&#x27;TEST&#x27;,&#x27;测试&#x27;,[&#x27;跑最终验证&#x27;],[&#x27;在审过的树上&#x27;,&#x27;无失败命令&#x27;]],
  [&#x27;DELIVER&#x27;,&#x27;交付&#x27;,[&#x27;doc:Reflect&#x27;],[&#x27;落地 = 审过的&#x27;,&#x27;出 REPORT&#x27;,&#x27;不 push&#x27;]],
  [&#x27;REFLECT&#x27;,&#x27;回写&#x27;,[&#x27;决策 · 纠正&#x27;,&#x27;实践 · 缺口&#x27;],[&#x27;进 CDF&#x27;,&#x27;不挡落地&#x27;]],
];
ST.forEach(([en,zh,a,c],i)=&gt;{
  const hum=[0,1,6].includes(i);
  const cls=&#x27;st&#x27;+(i===3?&#x27; free&#x27;:&#x27;&#x27;)+(i===7?&#x27; refl&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;);
  $(&#x27;#cards&#x27;).appendChild(el(&#x27;div&#x27;,cls,
    `${hum?&#x27;&lt;i class=&quot;tg h&quot;&gt;按需问人&lt;/i&gt;&#x27;:&#x27;&lt;i class=&quot;tg a&quot;&gt;Agent 全权&lt;/i&gt;&#x27;}&lt;h3&gt;${zh}&lt;small&gt;${i+1} ${en}&lt;/small&gt;&lt;/h3&gt;&lt;div class=&quot;za&quot;&gt;&lt;b&gt;AGENT&lt;/b&gt;${a.map(t=&gt;t.startsWith(&#x27;doc:&#x27;)?`&lt;span class=&quot;doc&quot;&gt;${t.slice(4)}&lt;/span&gt;`:t).join(&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;&lt;div class=&quot;zc&quot;&gt;&lt;b&gt;CHECK&lt;/b&gt;${c.map(t=&gt;`&lt;div&gt;${t}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`,
    {left:X(i)+&#x27;px&#x27;}));
});

// ---------- profiles: which stages each one runs ----------
ST.forEach(([en],i)=&gt;$(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;mh&#x27;,`&lt;i&gt;${i+1}&lt;/i&gt;${en}`,{left:(X(i)-16)+&#x27;px&#x27;})));
const PROF=[[&#x27;full · bugfix&#x27;,&#x27;11111111&#x27;],[&#x27;trivial&#x27;,&#x27;10111111&#x27;],[&#x27;direct&#x27;,&#x27;00011111&#x27;],[&#x27;research&#x27;,&#x27;11000011&#x27;]];
PROF.forEach(([name,on],k)=&gt;{
  const y=66+k*34;
  $(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;ml&#x27;,name,{top:(y-15)+&#x27;px&#x27;}));
  const idx=[...on].map((v,i)=&gt;v===&#x27;1&#x27;?i:-1).filter(i=&gt;i&gt;=0);
  for(let j=0;j&lt;idx.length-1;j++) $(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;mt&#x27;,null,{left:(CX(idx[j])-16)+&#x27;px&#x27;,width:(CX(idx[j+1])-CX(idx[j]))+&#x27;px&#x27;,top:(y-1.5)+&#x27;px&#x27;}));
  [...on].forEach((v,i)=&gt;$(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,v===&#x27;1&#x27;?&#x27;md&#x27;:&#x27;mo&#x27;,null,{left:(CX(i)-16)+&#x27;px&#x27;,top:y+&#x27;px&#x27;})));
});

// ---------- where a person may come in ----------
[
  {a:0,b:1,t:&#x27;需求歧义&#x27;},
  {a:1,b:2,t:&#x27;不可逆 /&lt;br&gt;高风险设计&#x27;},
  {a:2,b:6,t:&#x27;全部交给 Agent&lt;small&gt;◇ 危险动作才审批&lt;/small&gt;&#x27;,agent:1},
  {a:6,b:7,t:&#x27;Push&lt;br&gt;按需审 PR&#x27;,solid:1},
].forEach(p=&gt;$(&#x27;#hq&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;hb&#x27;+(p.solid?&#x27; solid&#x27;:&#x27;&#x27;)+(p.agent?&#x27; agent&#x27;:&#x27;&#x27;),`${p.agent?&#x27;&#x27;:&#x27;&lt;i&gt;&lt;/i&gt;&#x27;}&lt;span style=&quot;display:flex;flex-direction:column;align-items:center;gap:3px&quot;&gt;${p.t}&lt;/span&gt;`,{left:(X(p.a)-16)+&#x27;px&#x27;,width:(X(p.b)-X(p.a)-GAP)+&#x27;px&#x27;})));

// ---------- wires ----------
// stage to stage
for(let i=0;i&lt;7;i++) path(`M${X(i)+CW+1},564 L${X(i+1)-1},564`,&#x27;#334155&#x27;,&#x27;mW&#x27;,2);
// BUILD fans out to child runs
const FAN_L=X(1), FAN_R=X(3)+CW+48;
Object.assign($(&#x27;#fan&#x27;).style,{left:FAN_L+&#x27;px&#x27;,width:(FAN_R-FAN_L)+&#x27;px&#x27;});
path(`M${CX(3)},738 L${CX(3)},770`,&#x27;#2563eb&#x27;,&#x27;mB&#x27;,2.2,&#x27;6 4&#x27;);
// a code change in TEST goes back to REVIEW
path(`M${CX(5)},738 C${CX(5)},782 ${CX(4)},782 ${CX(4)},740`,&#x27;#2563eb&#x27;,&#x27;mB&#x27;,2.2,&#x27;6 4&#x27;);
text((CX(4)+CX(5))/2,812,&#x27;改代码 → 回审 · ≤ 2&#x27;,&#x27;#2563eb&#x27;,&#x27;middle&#x27;);
// Brain -&gt; the run&#x27;s knowledge; REFLECT -&gt; CDF -&gt; Brain
path(`M${CX(0)},868 L${CX(0)},740`,&#x27;#0f766e&#x27;,&#x27;mK&#x27;);
text(CX(0)+10,812,&#x27;装载&#x27;,&#x27;#0f766e&#x27;,&#x27;start&#x27;);
path(`M${CX(7)},738 L${CX(7)},866`,&#x27;#0f766e&#x27;,&#x27;mK&#x27;);
text(CX(7)+10,812,&#x27;写回&#x27;,&#x27;#0f766e&#x27;,&#x27;start&#x27;);

function fit(){const a=$(&#x27;#app&#x27;),s=Math.min(innerWidth/1600,innerHeight/1080);a.style.transform=`scale(${s})`;a.style.left=((innerWidth-1600*s)/2)+&#x27;px&#x27;;a.style.top=((innerHeight-1080*s)/2)+&#x27;px&#x27;;}
addEventListener(&#x27;resize&#x27;,fit);fit();
&lt;/script&gt;
