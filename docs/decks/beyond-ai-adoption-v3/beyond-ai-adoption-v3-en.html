&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};
const NS=&#x27;http://www.w3.org/2000/svg&#x27;, G=$(&#x27;#g&#x27;);
function path(d,stroke,marker,dash,w){const p=document.createElementNS(NS,&#x27;path&#x27;);p.setAttribute(&#x27;d&#x27;,d);p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);p.setAttribute(&#x27;stroke&#x27;,stroke);p.setAttribute(&#x27;stroke-width&#x27;,w||2.5);if(dash)p.setAttribute(&#x27;stroke-dasharray&#x27;,dash);if(marker)p.setAttribute(&#x27;marker-end&#x27;,`url(#${marker})`);G.appendChild(p);}
function text(x,y,t,fill,anchor,size){const e=document.createElementNS(NS,&#x27;text&#x27;);e.setAttribute(&#x27;x&#x27;,x);e.setAttribute(&#x27;y&#x27;,y);e.setAttribute(&#x27;class&#x27;,&#x27;wl&#x27;);e.setAttribute(&#x27;fill&#x27;,fill);if(anchor)e.setAttribute(&#x27;text-anchor&#x27;,anchor);if(size)e.setAttribute(&#x27;font-size&#x27;,size);e.textContent=t;G.appendChild(e);}

// ---------- decision funnel: each layer absorbs decisions, only judgment reaches a person ----------
const FW=[300,268,236,204,172,140];
[[&#x27;Every decision&#x27;,&#x27;#e5e7eb&#x27;,&#x27;#111827&#x27;],[&#x27;Brain already knows&#x27;,&#x27;#d5efe9&#x27;,&#x27;#0f766e&#x27;],[&#x27;Deterministic checks&#x27;,&#x27;#e2e8f0&#x27;,&#x27;#334155&#x27;],[&#x27;Agent decides&#x27;,&#x27;#dbeafe&#x27;,&#x27;#1d4ed8&#x27;],[&#x27;Human&#x27;,&#x27;#fde0cc&#x27;,&#x27;#c2410c&#x27;]].forEach(([t,bg,c],k)=&gt;{
  const ins=(FW[k]-FW[k+1])/2;
  $(&#x27;#frows&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;fr&#x27;,t,{width:FW[k]+&#x27;px&#x27;,background:bg,color:c,clipPath:`polygon(0 0,100% 0,calc(100% - ${ins}px) 100%,${ins}px 100%)`}));
});

// ---------- cycle geometry ----------
const PMC={cx:710,cy:460,r:205,hw:105,hh:25,w:210};
const BDC={cx:1484,cy:462,r:222,rx:300,hw:80,hh:26,w:160};   // rx: the Builder ring is a little wider than tall
const at=(c,a,r)=&gt;({x:c.cx+(r||c.rx||c.r)*Math.cos(a*Math.PI/180), y:c.cy-(r||c.r)*Math.sin(a*Math.PI/180)});
const pad=(c,a)=&gt;{const t=a*Math.PI/180, rx=c.rx||c.r;const ext=Math.abs(c.hw*Math.sin(t))+Math.abs(c.hh*Math.cos(t));const ds=Math.hypot(rx*Math.sin(t),c.r*Math.cos(t));return ext/ds*180/Math.PI+2;};
// clockwise arc on screen from the node at angle a1 to the node at angle a2
function arc(c,a1,a2,stroke,marker,dash){
  if(a2&gt;=a1) a2-=360;
  const s=a1-pad(c,a1), e=a2+pad(c,a2);
  const p1=at(c,s), p2=at(c,e), large=(s-e)&gt;180?1:0;
  path(`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} A${c.rx||c.r},${c.r} 0 ${large} 1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,stroke,marker,dash,3);
}
const N={};
function node(id,c,a,k,t,no,hum){
  const p=at(c,a); N[id]={x:p.x,y:p.y,a};
  $(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;nd &#x27;+k,`&lt;b&gt;&lt;i class=&quot;sno${hum?&#x27; hum&#x27;:&#x27;&#x27;}&quot;&gt;${no}&lt;/i&gt;${t}&lt;/b&gt;`,{left:p.x+&#x27;px&#x27;,top:p.y+&#x27;px&#x27;,width:c.w+&#x27;px&#x27;}));
}

// ---------- PM cycle (the demand side): 6 stages, own runs; orange = a person takes part ----------
const PA=[180,135,85,30,-35,-110];
node(&#x27;p1&#x27;,PMC,PA[0],&#x27;&#x27;,&#x27;Take intent&#x27;,1,0);
node(&#x27;p2&#x27;,PMC,PA[1],&#x27;h&#x27;,&#x27;Clarify&#x27;,2,1);
node(&#x27;p3&#x27;,PMC,PA[2],&#x27;&#x27;,&#x27;Draft PRD&#x27;,3,0);
node(&#x27;p4&#x27;,PMC,PA[3],&#x27;&#x27;,&#x27;Agent review&#x27;,4,0);
node(&#x27;p5&#x27;,PMC,PA[4],&#x27;h&#x27;,&#x27;Align &amp;amp; approve&#x27;,5,1);
node(&#x27;p6&#x27;,PMC,PA[5],&#x27;h&#x27;,&#x27;Accept&#x27;,6,1);
for(let i=0;i&lt;4;i++) arc(PMC,PA[i],PA[i+1],&#x27;#7c3aed&#x27;,&#x27;mP&#x27;);
arc(PMC,PA[4],PA[5],&#x27;#a78bfa&#x27;,null,&#x27;5 6&#x27;);
arc(PMC,PA[5],PA[0],&#x27;#7c3aed&#x27;,&#x27;mP&#x27;);
$(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;rc&#x27;,`&lt;b style=&quot;font-size:34px;color:#6d28d9&quot;&gt;PM loop&lt;/b&gt;&lt;em style=&quot;color:#6d28d9&quot;&gt;Faster definition&lt;br&gt;+ alignment&lt;/em&gt;`,{left:&#x27;710px&#x27;,top:&#x27;460px&#x27;}));

// ---------- Builder cycle: the same eight stages as the Builder Loop and Pipeline Run pages ----------
// dashed orange = asks a person only when needed (1, 2, 7)
const BA=[180,130,85,40,-5,-50,-95,-140];
node(&#x27;b1&#x27;,BDC,BA[0],&#x27;bb h c&#x27;,&#x27;Evaluate&#x27;,1,1);
node(&#x27;b2&#x27;,BDC,BA[1],&#x27;bb h c&#x27;,&#x27;Think&#x27;,2,1);
node(&#x27;b3&#x27;,BDC,BA[2],&#x27;bb&#x27;,&#x27;Plan&#x27;,3,0);
node(&#x27;b4&#x27;,BDC,BA[3],&#x27;bb free&#x27;,&#x27;Build&#x27;,4,0);
node(&#x27;b5&#x27;,BDC,BA[4],&#x27;bb&#x27;,&#x27;Review&#x27;,5,0);
node(&#x27;b6&#x27;,BDC,BA[5],&#x27;bb&#x27;,&#x27;Test&#x27;,6,0);
node(&#x27;b7&#x27;,BDC,BA[6],&#x27;bb h c&#x27;,&#x27;Deliver&#x27;,7,1);
node(&#x27;b8&#x27;,BDC,BA[7],&#x27;bb refl&#x27;,&#x27;Reflect&#x27;,8,0);
for(let i=0;i&lt;8;i++) arc(BDC,BA[i],BA[(i+1)%8],i===7?&#x27;#93c5fd&#x27;:&#x27;#2563eb&#x27;,i===7?null:&#x27;mB&#x27;,i===7?&#x27;5 6&#x27;:null);
// runs travelling round the cycle at the same time; orange = about to wait at 2 Think and 7 Deliver
[[168],[154,1],[62],[18],[-27],[-73,1],[-118]].forEach(([a,w])=&gt;{
  const p=at(BDC,a);
  $(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;tok&#x27;+(w?&#x27; w&#x27;:&#x27;&#x27;),null,{left:p.x+&#x27;px&#x27;,top:p.y+&#x27;px&#x27;}));
});
$(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;rc&#x27;,`&lt;b style=&quot;font-size:40px;color:#1d4ed8&quot;&gt;Builder loop&lt;/b&gt;&lt;em style=&quot;color:#1d4ed8&quot;&gt;Builder agent runs on its own&lt;/em&gt;&lt;span&gt;Parallel: local ×N · cloud ×N&lt;/span&gt;`,{left:&#x27;1484px&#x27;,top:&#x27;468px&#x27;}));

// ---------- Human-on-the-loop points: PM loop always (solid), Builder loop only when needed (dashed) ----------
[
  {x:140,w:142,cls:&#x27;box&#x27;,t:&#x27;2 Clarify&#x27;},
  {x:292,w:220,cls:&#x27;box&#x27;,t:&#x27;5 Align &amp;amp; approve&#x27;},
  {x:522,w:138,cls:&#x27;box&#x27;,t:&#x27;6 Accept&#x27;},
  {x:684,w:196,cls:&#x27;dbox&#x27;,t:&#x27;1 Evaluate&#x27;},
  {x:896,w:196,cls:&#x27;dbox&#x27;,t:&#x27;2 Design-Spec&#x27;},
  {x:1108,w:196,cls:&#x27;dbox&#x27;,t:&#x27;Risky actions&#x27;},
  {x:1320,w:196,cls:&#x27;dbox&#x27;,t:&#x27;7 Deliver&#x27;},
].forEach(q=&gt;$(&#x27;#hq&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;hq &#x27;+q.cls,q.t,{left:q.x+&#x27;px&#x27;,width:q.w+&#x27;px&#x27;})));

// ---------- entry: triage into the two cycles (anchored on the triage rows) ----------
// fixed stage coordinates of the &#x27;→ Builder&#x27; and &#x27;→ PM&#x27; rows: in the deck a page is built while its iframe is
// hidden (display:none), where any layout measurement reads 0, so the wires must not be anchored on one
const yB=465, yP=519;
path(&#x27;M186,296 L186,304&#x27;,&#x27;#334155&#x27;,&#x27;mJ&#x27;,null,2.5);
// needs PM -&gt; PM cycle
path(`M356,${yP} C392,${yP} 380,${N.p1.y} ${N.p1.x-PMC.w/2-3},${N.p1.y}`,&#x27;#7c3aed&#x27;,&#x27;mP&#x27;,null,2.8);
// no PM -&gt; straight into the Builder cycle, over the PM cycle
path(`M356,${yB} C366,${yB} 368,${yB-10} 368,${yB-30} L368,198 C368,186 374,180 388,180 L1140,180 C1166,180 1166,200 1166,${N.b1.y-30}`,&#x27;#334155&#x27;,&#x27;mJ&#x27;,null,2.8);
text(760,174,&#x27;No PM → straight to the Builder loop&#x27;,&#x27;#334155&#x27;,&#x27;middle&#x27;);
// PM -&gt; Builder, through Jira
path(`M${N.p5.x+PMC.w/2+2},${N.p5.y} C1010,${N.p5.y} 1050,${N.b1.y+12} ${N.b1.x-BDC.w/2-2},${N.b1.y+12}`,&#x27;#334155&#x27;,&#x27;mJ&#x27;,null,2.8);
text(952,640,&#x27;PM Clarified · via Jira&#x27;,&#x27;#334155&#x27;,&#x27;start&#x27;);
// Builder results -&gt; PM acceptance, through Jira
path(`M${N.b7.x-BDC.w/2-2},${N.b7.y+8} C1180,728 900,722 ${N.p6.x+PMC.w/2+2},${N.p6.y+8}`,&#x27;#2563eb&#x27;,&#x27;mB&#x27;,null,2.8);
text(1120,700,&#x27;Result + evidence → sign-off&#x27;,&#x27;#2563eb&#x27;,&#x27;middle&#x27;);
text(398,714,&#x27;Feedback → new intent&#x27;,&#x27;#7c3aed&#x27;,&#x27;start&#x27;);
// any stage of the demand loop may write states and materials back to task management: one arrow from the ring, not one per stage
const wb=at(PMC,-150);
path(`M${wb.x-6},${wb.y} C${wb.x-90},${wb.y} 410,514 360,514`,&#x27;#334155&#x27;,&#x27;mJ&#x27;,&#x27;6 4&#x27;,2.8);
{const d=document.createElementNS(NS,&#x27;circle&#x27;);d.setAttribute(&#x27;cx&#x27;,wb.x);d.setAttribute(&#x27;cy&#x27;,wb.y);d.setAttribute(&#x27;r&#x27;,6);d.setAttribute(&#x27;fill&#x27;,&#x27;#fff&#x27;);d.setAttribute(&#x27;stroke&#x27;,&#x27;#334155&#x27;);d.setAttribute(&#x27;stroke-width&#x27;,2.8);G.appendChild(d);}
text(392,606,&#x27;States · materials&#x27;,&#x27;#334155&#x27;,&#x27;start&#x27;);
text(392,632,&#x27;back to Task&#x27;,&#x27;#334155&#x27;,&#x27;start&#x27;);

path(&#x27;M420,724 L420,742&#x27;,&#x27;#7c3aed&#x27;,&#x27;mP&#x27;,null,2.5);
path(&#x27;M1866,724 L1866,742&#x27;,&#x27;#2563eb&#x27;,&#x27;mB&#x27;,null,2.5);
path(&#x27;M802,800 L818,800&#x27;,&#x27;#334155&#x27;,&#x27;mJ&#x27;,null,2.5);
path(&#x27;M1318,800 L1302,800&#x27;,&#x27;#334155&#x27;,&#x27;mJ&#x27;,null,2.5);
// ---------- knowledge with the shared Brain ----------
path(&#x27;M810,874 L810,726&#x27;,&#x27;#0f766e&#x27;,&#x27;mK&#x27;,null,2.8); text(804,740,&#x27;Load&#x27;,&#x27;#0f766e&#x27;,&#x27;end&#x27;,18);
path(&#x27;M1310,874 L1310,726&#x27;,&#x27;#0f766e&#x27;,&#x27;mK&#x27;,null,2.8); text(1316,740,&#x27;Load&#x27;,&#x27;#0f766e&#x27;,&#x27;start&#x27;,18);

body{font-family:&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif;color:#111827;-webkit-font-smoothing:antialiased}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#f6f7fb;overflow:hidden}

header{position:absolute;left:0;top:0;width:1920px;height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 24px;gap:18px;z-index:5}
.brand b{font-size:36px;font-weight:800;white-space:nowrap}

.pane{position:absolute;background:#fff;border:1px solid #e5e7eb;border-radius:16px}
.pt{position:absolute;left:16px;top:12px;right:16px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.pt b{font-size:22px;font-weight:800}
.no{display:inline-block;flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:#111827;color:#fff;font:700 17px/28px Menlo,monospace;text-align:center}

/* Intent entry: two kinds */
#int{left:304px;top:84px;width:240px;height:136px;border:2px solid #111827}
.ik{position:absolute;left:10px;right:10px;height:40px;border-radius:9px;padding:0 10px;display:flex;align-items:center;white-space:nowrap}
.ik b{font-size:19px}
.ik.pm{top:46px;background:#f5f3ff;border:1px solid #c4b5fd}.ik.pm b{color:#5b21b6}
.ik.np{top:88px;background:#f1f5f9;border:1px solid #cbd5e1}

/* ① Project Agent */
#pa{left:304px;top:400px;width:240px;height:300px}
.pa-list{position:absolute;left:16px;right:14px;top:56px}
.pa-row{padding:9px 0;border-top:1px solid #f0f1f4;font-size:21px;font-weight:800}
.pa-con{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:8px}
.pa-con span{flex:1;height:40px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#1d4ed8;white-space:nowrap}

/* ② funnel */
#fun{left:16px;top:84px;width:274px;height:768px}
.fsub{position:absolute;left:54px;top:46px;font-size:22px;font-weight:800;color:#c2410c;white-space:nowrap}
.frow{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:0 34px;font-size:22px;font-weight:800}

/* ② human band */
#hum{left:560px;top:84px;width:1344px;height:122px;border:2px solid #f59e0b;background:#fffaf5}
.who{position:absolute;left:12px;top:52px;width:124px;height:58px;border-radius:10px;background:#9a3412;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px}
.who b{font-size:20px}
.solo{display:inline-flex;align-items:center;gap:6px;background:#c2410c;color:#fff;border-radius:13px;padding:2px 12px 2px 8px;font-size:19px;font-weight:800}
.hbox{position:absolute;top:52px;height:58px;border:2px dashed #f59e0b;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;font-size:20px;font-weight:800;color:#9a3412}
.hbox i{position:absolute;left:calc(50% - 6px);top:-7px;width:11px;height:11px;border:2px solid #c2410c;background:#fffaf5;transform:rotate(45deg)}
.hbox.agent{border:2px solid #bfdbfe;background:#eff6ff;color:#1d4ed8}
.hbox.agent small{font-size:19px;font-weight:700;color:#9a3412}
.hbox span{white-space:nowrap}

/* ④ execution */
#exe{left:560px;top:218px;width:1344px;height:446px}
.mchip{font-size:19px;font-weight:700;color:#334155;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:13px;padding:1px 11px}
.colbg{position:absolute;top:52px;height:340px;border-left:1px dashed #e5e7eb}
.colbg.free{background:repeating-linear-gradient(135deg,#f8fafc 0 6px,#f1f5f9 6px 12px);border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0}
.colbg.refl{background:#effaf7;border-left:1px solid #ccebe4}
.colbg.hum{background:#fff4e8;border-left:2px dashed #fdba74;border-right:2px dashed #fdba74}
.sh{position:absolute;top:60px;padding:0 4px;text-align:center;line-height:1.3}
.sh b{display:block;font-size:22px;white-space:nowrap}
.sh b i{font-style:normal;display:inline-block;width:24px;height:24px;border-radius:50%;background:#f3f4f6;color:#374151;font:700 16px/24px Menlo,monospace;margin-right:6px;vertical-align:2px}
.sh.refl b{color:#0f766e}.sh.refl b i{background:#0f766e;color:#fff}
.sh.hum b{color:#9a3412}.sh.hum b i{background:#c2410c;color:#fff}
.lbl{position:absolute;left:14px;top:62px;font-size:20px;font-weight:800;color:#111827}
.grp{position:absolute;left:14px;font-size:19px;font-weight:800;white-space:nowrap;color:#111827}
.lane{position:absolute;left:0;width:1344px;height:34px}
.ll{position:absolute;left:14px;top:2px;width:132px;white-space:nowrap}
.ll b{font-size:19px}
.ll span{font-size:17px;color:#6b7280;margin-left:7px}
.track{position:absolute;top:16px;height:0;border-top:2px solid #e5e7eb}
.track.done{border-top:3px solid #334155}
.track.skip{border-top:2px dashed #d1d5db}
.dot{position:absolute;top:10px;width:14px;height:14px;border-radius:50%;margin-left:-7px}
.dot.d{background:#334155}
.dot.t{background:#fff;border:2px solid #cbd5e1;width:12px;height:12px;top:11px;margin-left:-6px}
.dot.c{background:#fff;border:4px solid #334155;width:20px;height:20px;top:7px;margin-left:-10px}
.dot.p{background:#c2410c;width:20px;height:20px;top:7px;margin-left:-10px;box-shadow:0 0 0 4px #fde7d6}
.cap{position:absolute;top:3px;font-size:18px;font-weight:700;white-space:nowrap;color:#4b5563;background:#fff;padding:0 5px}
.cap.p{color:#c2410c;font-weight:800}
.mini{position:absolute;height:6px}
.mini .mt{position:absolute;top:2px;height:2px;background:#eef0f3}
.mini .mf{position:absolute;top:1.5px;height:3px;background:#94a3b8;border-radius:2px}
.mini .md{position:absolute;top:0;width:6px;height:6px;border-radius:50%;background:#334155;margin-left:-3px}
.mini .md.p{background:#c2410c}
.more{position:absolute;left:14px;font-size:18px;font-weight:800;color:#334155}
.ends{position:absolute;top:398px;height:34px}
.ends:before{content:&quot;&quot;;position:absolute;left:0;right:0;top:0;height:8px;border:2.5px solid #334155;border-bottom:none;border-radius:4px 4px 0 0}
.ends.free:before{border:2px dashed #94a3b8;border-bottom:none}
.ends span{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:20px;font-weight:800;color:#111827;white-space:nowrap}
.ends.free span{color:#64748b}
.ends-l{position:absolute;left:14px;top:406px;width:130px;font-size:20px;font-weight:800;color:#111827}

/* Run Trace */
#trace{left:560px;top:676px;width:1344px;height:56px;border:2px solid #334155;border-left:7px solid #2563eb;background:#f8fafc;display:flex;align-items:center;gap:18px;padding:0 16px}
.tr-t b{font-size:21px;font-weight:800;white-space:nowrap}
.tr-items{display:flex;gap:8px;flex-wrap:nowrap}
.tr-items span{font-size:19px;font-weight:600;color:#1f2937;background:#fff;border:1px solid #e2e8f0;border-radius:7px;padding:2px 9px;white-space:nowrap}
.tr-items span.h{color:#9a3412;border-color:#fed7aa;background:#fffaf5}

/* ② reflect */
#ref{left:560px;top:746px;width:712px;height:106px;border-color:#99d8cb;background:#f4fbf9}
#ref .pt b{color:#0f766e}
.ritems{position:absolute;left:16px;right:12px;top:60px;display:flex;gap:12px}
.ri{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ri b{font-size:19px;color:#0f3d3a}
.ri code{font:700 17px Menlo,monospace;color:#0f766e;background:#dbf1ec;border-radius:4px;padding:2px 5px}

/* ③ eval */
#eva{left:1288px;top:746px;width:616px;height:106px;border:2px solid #334155;border-left:7px solid #334155;background:#eef2f6}
#eva .pt{top:37px}
.echips{position:absolute;left:118px;right:14px;top:10px;bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center}
.echips span{font-size:19px;font-weight:700;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:3px 10px;white-space:nowrap}

/* ---- shared Brain (same block on the v2 flow pages) ---- */
#brain{position:absolute;left:16px;top:876px;width:1888px;height:188px;background:#0b3b37;border-radius:18px;color:#d5ece7}
.bt{position:absolute;left:32px;top:0;bottom:0;width:290px;display:flex;flex-direction:column;justify-content:center}
.bt b{font-size:40px;font-weight:800;color:#fff;white-space:nowrap}
.bt em{font-style:normal;font-size:20px;color:#7ee0cf;margin-top:6px;white-space:nowrap}
.bh{font-size:18px;letter-spacing:1px;font-weight:700;color:#7ee0cf;margin-bottom:10px;white-space:nowrap}
.bagent{position:absolute;left:330px;top:22px;width:310px;height:144px;border:1.5px solid #3aa596;border-radius:13px;background:#124a45;padding:14px 16px}
.bagent .bh{font-size:22px;letter-spacing:0;color:#fff;margin-bottom:10px}
.btags{display:flex;flex-wrap:wrap;gap:8px}
.btags span{font-size:19px;color:#0b3b37;background:#7ee0cf;border-radius:15px;padding:3px 12px;font-weight:700;white-space:nowrap}
.bdocs{position:absolute;left:664px;top:32px;width:570px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgrid span{font:700 18px Menlo,monospace;color:#fff;background:#124a45;border-radius:7px 11px 7px 7px;padding:9px 10px;white-space:nowrap}
.bdirs{position:absolute;left:1258px;top:32px;width:220px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dgrid span{position:relative;font:700 18px Menlo,monospace;color:#a7f3e4;border:1.5px dashed #3aa596;border-radius:3px 9px 9px 9px;padding:8px 10px;white-space:nowrap}
.dgrid span:before{content:&quot;&quot;;position:absolute;left:-1.5px;top:-7px;width:26px;height:6px;border:1.5px dashed #3aa596;border-bottom:none;border-radius:4px 4px 0 0}
.bonto{position:absolute;left:1498px;top:32px;right:16px;padding-left:20px;border-left:1px solid #1f5b55}
.otags{display:flex;flex-wrap:wrap;gap:6px}
.otags code{font:700 17px Menlo,monospace;color:#0b3b37;background:#7ee0cf;border-radius:4px;padding:2px 5px}
.olife{margin-top:12px;font-size:19px;color:#fff;font-weight:700}

svg#wires{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.wl{font-size:19px;fill:#0f766e;font-weight:800}

/* ---------- demo controls, in the header ---------- */
#ctrl{margin-left:auto;display:flex;align-items:center;gap:10px}
#chips{display:flex;gap:5px}
.chip{width:34px;height:34px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;color:#4b5563;font:700 16px/32px Menlo,monospace;text-align:center;cursor:pointer}
.chip:hover{border-color:#0f766e}
.chip.done{background:#334155;border-color:#334155;color:#fff}
.chip.cur{background:#0f766e;border-color:#0f766e;color:#fff;box-shadow:0 0 0 3px rgba(15,118,110,.18)}
#cap{min-width:96px;font-size:19px;font-weight:800;color:#0f766e;white-space:nowrap}
.cb{height:36px;padding:0 13px;border-radius:10px;border:1px solid #d1d5db;background:#fff;font:700 17px &quot;PingFang SC&quot;,sans-serif;color:#374151;cursor:pointer;white-space:nowrap}
.cb:hover{border-color:#0f766e;color:#0f766e}
.cb.pri{background:#0f766e;border-color:#0f766e;color:#fff}
.cb.on{background:#effaf7;border-color:#0f766e;color:#0f766e}
#prog{position:absolute;left:0;bottom:-1px;height:3px;background:#0f766e;width:0}

.blk{transition:opacity .45s,filter .45s,box-shadow .45s}
#app.demo .blk:not(.on){opacity:.14;filter:saturate(.2)}
#app.demo .blk.on{box-shadow:0 0 0 3px rgba(15,118,110,.28),0 10px 28px rgba(15,23,42,.10)}
#app.demo #hum.on{box-shadow:0 0 0 4px rgba(194,65,12,.25),0 10px 28px rgba(15,23,42,.10)}
#wires .w{transition:opacity .45s}
#app.demo #wires .w:not(.on){opacity:.06}
#app.demo #wires .w.on path.solid{stroke-dasharray:8 5;animation:march .7s linear infinite}
#app.demo #wires .w.on path.dash{animation:march .7s linear infinite}
@keyframes march{to{stroke-dashoffset:-13}}
.dot,.track{transition:all .5s}
.mini .mf{transition:width .7s ease}
.mini .md{transition:left .7s ease,background .3s}
.dot.p{animation:wait 1.2s ease-in-out infinite}
@keyframes wait{50%{box-shadow:0 0 0 9px rgba(194,65,12,.18)}}
#app.play-fun .frow{animation:frIn .55s both}
#app.play-fun .frow:nth-child(1){animation-delay:.1s}
#app.play-fun .frow:nth-child(2){animation-delay:.7s}
#app.play-fun .frow:nth-child(3){animation-delay:1.3s}
#app.play-fun .frow:nth-child(4){animation-delay:1.9s}
#app.play-fun .frow:nth-child(5){animation-delay:2.5s}
@keyframes frIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#app.pulse-hum .hbox i{animation:dia 1s ease-in-out infinite}
#app.pulse-hum .who{animation:whoP 1.2s ease-in-out infinite}
@keyframes dia{50%{transform:rotate(45deg) scale(1.7)}}
@keyframes whoP{50%{box-shadow:0 0 0 6px rgba(194,65,12,.22)}}
#app.pulse-files .bgrid span{animation:docG 1.3s ease-in-out infinite}
#app.pulse-onto .otags code,#app.pulse-onto .ri code{animation:codeG 1.3s ease-in-out infinite}
@keyframes docG{50%{background:#1f6f66}}
@keyframes codeG{50%{filter:brightness(1.35)}}
#app.pulse-trace .tr-items span{animation:trP 1.2s ease-in-out infinite}
@keyframes trP{50%{transform:translateY(-3px);box-shadow:0 3px 8px rgba(15,23,42,.12)}}
#app.pulse-eval .echips span{animation:eqG 1.4s ease-in-out infinite}
@keyframes eqG{50%{color:#0f766e}}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;stage&quot;&gt;&lt;div id=&quot;app&quot;&gt;

&lt;header&gt;
  &lt;div class=&quot;brand&quot;&gt;&lt;b&gt;Builder Loop —— &lt;span style=&quot;color:#c2410c&quot;&gt;Parallel Runs, People Only at Both Ends&lt;/span&gt;&lt;/b&gt;&lt;/div&gt;
  &lt;div id=&quot;ctrl&quot;&gt;
    &lt;button class=&quot;cb&quot; id=&quot;bOver&quot;&gt;Overview&lt;/button&gt;
    &lt;div id=&quot;chips&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;cap&quot;&gt;&lt;/div&gt;
    &lt;button class=&quot;cb&quot; id=&quot;bPrev&quot; title=&quot;Previous&quot;&gt;◀&lt;/button&gt;&lt;button class=&quot;cb&quot; id=&quot;bNext&quot; title=&quot;Next&quot;&gt;▶&lt;/button&gt;&lt;button class=&quot;cb pri&quot; id=&quot;bPlay&quot;&gt;▶ Play&lt;/button&gt;
  &lt;/div&gt;
  &lt;div id=&quot;prog&quot;&gt;&lt;/div&gt;
  &lt;div style=&quot;font-size:20px;font-weight:800;color:#6b7280;letter-spacing:1px;white-space:nowrap;&quot;&gt;03 Toward Autonomy · Zoom-in ①&lt;/div&gt;
&lt;/header&gt;

&lt;div id=&quot;content&quot;&gt;

&lt;!-- ② Decision funnel --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;fun&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;span class=&quot;no&quot;&gt;2&lt;/span&gt;&lt;b&gt;Funnel&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;fsub&quot;&gt;Less Attention&lt;/div&gt;
  &lt;div id=&quot;frows&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- Intent entry: two kinds, both through Jira / Taskei --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;int&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;b&gt;Intent&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;ik pm&quot;&gt;&lt;b&gt;PM Clarified Intent&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;ik np&quot;&gt;&lt;b&gt;No PM needed&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ① Project Agent --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;pa&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;span class=&quot;no&quot;&gt;1&lt;/span&gt;&lt;b&gt;Project Agent&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;pa-list&quot;&gt;&lt;div class=&quot;pa-row&quot;&gt;Scope&lt;/div&gt;&lt;div class=&quot;pa-row&quot;&gt;Mode&lt;/div&gt;&lt;div class=&quot;pa-row&quot;&gt;Authority&lt;/div&gt;&lt;div class=&quot;pa-row&quot;&gt;Concurrency&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;pa-con&quot;&gt;&lt;span&gt;Local ×N&lt;/span&gt;&lt;span&gt;Cloud ×N&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ② Human-on-the-loop --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;hum&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;span class=&quot;no&quot;&gt;2&lt;/span&gt;&lt;b style=&quot;color:#9a3412&quot;&gt;Human-on-the-loop&lt;/b&gt;&lt;span class=&quot;solo&quot;&gt;&lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 26 26&quot;&gt;&lt;circle cx=&quot;13&quot; cy=&quot;8&quot; r=&quot;5&quot; fill=&quot;#fff&quot;/&gt;&lt;path d=&quot;M3,25 C3,17 8,14 13,14 C18,14 23,17 23,25 Z&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;Humans only here · only when needed&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;who&quot;&gt;&lt;svg width=&quot;20&quot; height=&quot;20&quot; viewBox=&quot;0 0 26 26&quot;&gt;&lt;circle cx=&quot;13&quot; cy=&quot;8&quot; r=&quot;5&quot; fill=&quot;#fff&quot;/&gt;&lt;path d=&quot;M3,25 C3,17 8,14 13,14 C18,14 23,17 23,25 Z&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;&lt;b&gt;Builder&lt;/b&gt;&lt;/div&gt;
  &lt;div id=&quot;hpoints&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ④ Execution --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;exe&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;span class=&quot;no&quot;&gt;4&lt;/span&gt;&lt;b&gt;Execution&lt;/b&gt;&lt;span class=&quot;mchip&quot; style=&quot;margin-left:430px&quot;&gt;Pipeline Run&lt;/span&gt;&lt;span class=&quot;mchip&quot;&gt;Native Run&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;lbl&quot;&gt;Stage&lt;/div&gt;
  &lt;div id=&quot;cols&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;lanes&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;ends-l&quot;&gt;Ends only&lt;/div&gt;
  &lt;div id=&quot;ends&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- Run Trace --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;trace&quot;&gt;
  &lt;div class=&quot;tr-t&quot;&gt;&lt;b&gt;Builder Agent · Run Trace&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;tr-items&quot;&gt;&lt;span&gt;Plan&lt;/span&gt;&lt;span&gt;Key actions&lt;/span&gt;&lt;span&gt;Decisions &amp;amp; why&lt;/span&gt;&lt;span&gt;Check results&lt;/span&gt;&lt;span class=&quot;h&quot;&gt;Human corrections&lt;/span&gt;&lt;span&gt;Token cost&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ② Reflect --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;ref&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;span class=&quot;no&quot;&gt;2&lt;/span&gt;&lt;b&gt;Reflect loop&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;ritems&quot;&gt;
    &lt;div class=&quot;ri&quot;&gt;&lt;code&gt;decision&lt;/code&gt;&lt;/div&gt;
    &lt;div class=&quot;ri&quot;&gt;&lt;code&gt;pitfall&lt;/code&gt;&lt;/div&gt;
    &lt;div class=&quot;ri&quot;&gt;&lt;code&gt;correction&lt;/code&gt;&lt;/div&gt;
    &lt;div class=&quot;ri&quot;&gt;&lt;b&gt;Gaps&lt;/b&gt;&lt;code&gt;→ next run&lt;/code&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ③ Eval --&gt;
&lt;div class=&quot;pane blk&quot; id=&quot;eva&quot;&gt;
  &lt;div class=&quot;pt&quot;&gt;&lt;span class=&quot;no&quot;&gt;3&lt;/span&gt;&lt;b&gt;Eval&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;echips&quot;&gt;&lt;span&gt;Autonomous&lt;/span&gt;&lt;span&gt;Human Attention&lt;/span&gt;&lt;span&gt;Knowledge Health&lt;/span&gt;&lt;span&gt;Token Cost&lt;/span&gt;&lt;/div&gt;

function renderLanes(step){

const NS=&#x27;http://www.w3.org/2000/svg&#x27;, G=$(&#x27;#wireg&#x27;), WG={};

function path(k,d,stroke,marker,dash,w){const p=document.createElementNS(NS,&#x27;path&#x27;);p.setAttribute(&#x27;d&#x27;,d);p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);p.setAttribute(&#x27;stroke&#x27;,stroke);p.setAttribute(&#x27;stroke-width&#x27;,w||2.5);p.setAttribute(&#x27;class&#x27;,dash?&#x27;dash&#x27;:&#x27;solid&#x27;);if(dash)p.setAttribute(&#x27;stroke-dasharray&#x27;,dash);if(marker)p.setAttribute(&#x27;marker-end&#x27;,`url(#${marker})`);grp(k).appendChild(p);}
function text(k,x,y,t,cls){const e=document.createElementNS(NS,&#x27;text&#x27;);e.setAttribute(&#x27;x&#x27;,x);e.setAttribute(&#x27;y&#x27;,y);e.setAttribute(&#x27;class&#x27;,cls);e.textContent=t;grp(k).appendChild(e);}

const STEPS=[

const APP=$(&#x27;#app&#x27;), BLOCKS=[...document.querySelectorAll(&#x27;.blk&#x27;)], EXTRAS=[&#x27;play-fun&#x27;,&#x27;pulse-hum&#x27;,&#x27;pulse-files&#x27;,&#x27;pulse-onto&#x27;,&#x27;pulse-eval&#x27;,&#x27;pulse-trace&#x27;];

STEPS.forEach((S,i)=&gt;{ if(i===0) return; const c=el(&#x27;div&#x27;,&#x27;chip&#x27;,String(i)); c.title=S.chip; c.onclick=()=&gt;{stop();go(i);}; $(&#x27;#chips&#x27;).appendChild(c); });

  $(&#x27;#bOver&#x27;).classList.toggle(&#x27;on&#x27;,n===0);

const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};

// ---------- geometry: a label column, then eight stage columns ----------
const C0=200, CW=200, GAP=12;
const X=i=&gt;C0+i*(CW+GAP), CX=i=&gt;X(i)+CW/2;

// ---------- eight stages: what the agent writes, what the checks decide ----------
const ST=[
  [&#x27;EVALUATE&#x27;,&#x27;Evaluate&#x27;,[&#x27;doc:Requirements&#x27;],[&#x27;Testable ACs&#x27;,&#x27;Gate-0 if needed&#x27;]],
  [&#x27;THINK&#x27;,&#x27;Think&#x27;,[&#x27;Compare options&#x27;,&#x27;Search the Brain&#x27;],[&#x27;Evidence decides&#x27;]],
  [&#x27;PLAN&#x27;,&#x27;Plan&#x27;,[&#x27;doc:Design-Spec&#x27;],[&#x27;Tasks ↔ reqs&#x27;,&#x27;ACs tested&#x27;]],
  [&#x27;BUILD&#x27;,&#x27;Build&#x27;,[&#x27;Native Coding&#x27;,&#x27;Fan-out Runs&#x27;],[&#x27;Own worktree&#x27;,&#x27;Fresh report&#x27;]],
  [&#x27;REVIEW&#x27;,&#x27;Review&#x27;,[&#x27;doc:Fixing-Spec&#x27;,&#x27;Fix in one pass&#x27;],[&#x27;Expert review&#x27;,&#x27;Test per fix&#x27;,&#x27;Max 2 rounds&#x27;]],
  [&#x27;TEST&#x27;,&#x27;Test&#x27;,[&#x27;Final verification&#x27;],[&#x27;Reviewed tree&#x27;,&#x27;No failures&#x27;]],
  [&#x27;DELIVER&#x27;,&#x27;Deliver&#x27;,[&#x27;doc:Reflect&#x27;],[&#x27;Lands as reviewed&#x27;,&#x27;Never pushes&#x27;]],
  [&#x27;REFLECT&#x27;,&#x27;Reflect&#x27;,[&#x27;Decisions&#x27;,&#x27;Corrections · gaps&#x27;],[&#x27;To distill flow&#x27;,&#x27;Never blocks&#x27;]],

ST.forEach(([en,zh,a,c],i)=&gt;{
  const hum=[0,1,6].includes(i);
  const cls=&#x27;st&#x27;+(i===3?&#x27; free&#x27;:&#x27;&#x27;)+(i===7?&#x27; refl&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;);
  $(&#x27;#cards&#x27;).appendChild(el(&#x27;div&#x27;,cls,
    `${hum?&#x27;&lt;i class=&quot;tg h&quot;&gt;Asks if needed&lt;/i&gt;&#x27;:&#x27;&lt;i class=&quot;tg a&quot;&gt;Agent owns&lt;/i&gt;&#x27;}&lt;h3&gt;${zh}&lt;/h3&gt;&lt;div class=&quot;za&quot;&gt;&lt;b&gt;AGENT&lt;/b&gt;${a.map(t=&gt;t.startsWith(&#x27;doc:&#x27;)?`&lt;span class=&quot;doc&quot;&gt;${t.slice(4)}&lt;/span&gt;`:t).join(&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;&lt;div class=&quot;zc&quot;&gt;&lt;b&gt;CHECK&lt;/b&gt;${c.map(t=&gt;`&lt;div&gt;${t}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`,
    {left:X(i)+&#x27;px&#x27;}));
});

// ---------- profiles: which stages each one runs ----------
ST.forEach(([en],i)=&gt;$(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;mh&#x27;,`&lt;i&gt;${i+1}&lt;/i&gt;${en}`,{left:(X(i)-16)+&#x27;px&#x27;,width:CW+&#x27;px&#x27;})));
const PROF=[[&#x27;full · bugfix&#x27;,&#x27;11111111&#x27;],[&#x27;trivial&#x27;,&#x27;10111111&#x27;],[&#x27;direct&#x27;,&#x27;00011111&#x27;],[&#x27;research&#x27;,&#x27;11000011&#x27;]];
PROF.forEach(([name,on],k)=&gt;{
  const y=62+k*32;
  $(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;ml&#x27;,name,{top:(y-15)+&#x27;px&#x27;}));
