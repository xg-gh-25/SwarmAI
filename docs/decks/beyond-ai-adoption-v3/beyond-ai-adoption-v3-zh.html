&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};
const NS=&#x27;http://www.w3.org/2000/svg&#x27;, G=$(&#x27;#g&#x27;);
function path(d,stroke,marker,dash,w){const p=document.createElementNS(NS,&#x27;path&#x27;);p.setAttribute(&#x27;d&#x27;,d);p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);p.setAttribute(&#x27;stroke&#x27;,stroke);p.setAttribute(&#x27;stroke-width&#x27;,w||2.5);if(dash)p.setAttribute(&#x27;stroke-dasharray&#x27;,dash);if(marker)p.setAttribute(&#x27;marker-end&#x27;,`url(#${marker})`);G.appendChild(p);}
function text(x,y,t,fill,anchor,size){const e=document.createElementNS(NS,&#x27;text&#x27;);e.setAttribute(&#x27;x&#x27;,x);e.setAttribute(&#x27;y&#x27;,y);e.setAttribute(&#x27;class&#x27;,&#x27;wl&#x27;);e.setAttribute(&#x27;fill&#x27;,fill);if(anchor)e.setAttribute(&#x27;text-anchor&#x27;,anchor);if(size)e.setAttribute(&#x27;font-size&#x27;,size);e.textContent=t;G.appendChild(e);}

// ---------- decision funnel: each layer absorbs decisions, only judgment reaches a person ----------
const FW=[300,268,236,204,172,140];
[[&#x27;所有决策&#x27;,&#x27;#e5e7eb&#x27;,&#x27;#111827&#x27;],[&#x27;Brain 已有答案&#x27;,&#x27;#d5efe9&#x27;,&#x27;#0f766e&#x27;],[&#x27;确定性检查&#x27;,&#x27;#e2e8f0&#x27;,&#x27;#334155&#x27;],[&#x27;Agent 自决&#x27;,&#x27;#dbeafe&#x27;,&#x27;#1d4ed8&#x27;],[&#x27;人&#x27;,&#x27;#fde0cc&#x27;,&#x27;#c2410c&#x27;]].forEach(([t,bg,c],k)=&gt;{
  const ins=(FW[k]-FW[k+1])/2;
  $(&#x27;#frows&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;fr&#x27;,t,{width:FW[k]+&#x27;px&#x27;,background:bg,color:c,clipPath:`polygon(0 0,100% 0,calc(100% - ${ins}px) 100%,${ins}px 100%)`}));
});

// ---------- cycle geometry ----------
const PMC={cx:710,cy:460,r:205,hw:85,hh:25,w:170};
const BDC={cx:1484,cy:462,r:222,rx:300,hw:66,hh:26,w:132};   // rx: the Builder ring is a little wider than tall
const at=(c,a,r)=&gt;({x:c.cx+(r||c.rx||c.r)*Math.cos(a*Math.PI/180), y:c.cy-(r||c.r)*Math.sin(a*Math.PI/180)});
const pad=(c,a)=&gt;{const t=a*Math.PI/180, rx=c.rx||c.r;const ext=Math.abs(c.hw*Math.sin(t))+Math.abs(c.hh*Math.cos(t));const ds=Math.hypot(rx*Math.sin(t),c.r*Math.cos(t));return ext/ds*180/Math.PI+2;};
// clockwise arc on screen from the node at angle a1 to the node at angle a2
function arc(c,a1,a2,stroke,marker,dash){
  if(a2&gt;=a1) a2-=360;
  const s=a1-pad(c,a1), e=a2+pad(c,a2);
  const p1=at(c,s), p2=at(c,e), large=(s-e)&gt;180?1:0;
  path(`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} A${c.rx||c.r},${c.r} 0 ${large} 1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,stroke,marker,dash,3);
}
const N={};
function node(id,c,a,k,t,no,hum){
  const p=at(c,a); N[id]={x:p.x,y:p.y,a};
  $(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;nd &#x27;+k,`&lt;b&gt;&lt;i class=&quot;sno${hum?&#x27; hum&#x27;:&#x27;&#x27;}&quot;&gt;${no}&lt;/i&gt;${t}&lt;/b&gt;`,{left:p.x+&#x27;px&#x27;,top:p.y+&#x27;px&#x27;,width:c.w+&#x27;px&#x27;}));
}

// ---------- PM cycle (the demand side): 6 stages, own runs; orange = a person takes part ----------
const PA=[180,135,85,30,-35,-110];
node(&#x27;p1&#x27;,PMC,PA[0],&#x27;&#x27;,&#x27;接 Intent&#x27;,1,0);
node(&#x27;p2&#x27;,PMC,PA[1],&#x27;h&#x27;,&#x27;澄清需求&#x27;,2,1);
node(&#x27;p3&#x27;,PMC,PA[2],&#x27;&#x27;,&#x27;生成 PRD&#x27;,3,0);
node(&#x27;p4&#x27;,PMC,PA[3],&#x27;&#x27;,&#x27;Agent 评审&#x27;,4,0);
node(&#x27;p5&#x27;,PMC,PA[4],&#x27;h&#x27;,&#x27;对齐与批准&#x27;,5,1);
node(&#x27;p6&#x27;,PMC,PA[5],&#x27;h&#x27;,&#x27;结果验收&#x27;,6,1);
for(let i=0;i&lt;4;i++) arc(PMC,PA[i],PA[i+1],&#x27;#7c3aed&#x27;,&#x27;mP&#x27;);
arc(PMC,PA[4],PA[5],&#x27;#a78bfa&#x27;,null,&#x27;5 6&#x27;);
arc(PMC,PA[5],PA[0],&#x27;#7c3aed&#x27;,&#x27;mP&#x27;);
$(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;rc&#x27;,`&lt;b style=&quot;font-size:34px;color:#6d28d9&quot;&gt;PM 环&lt;/b&gt;&lt;em style=&quot;color:#6d28d9&quot;&gt;加速定义 + 对齐&lt;/em&gt;`,{left:&#x27;710px&#x27;,top:&#x27;460px&#x27;}));

// ---------- Builder cycle: the same eight stages as the Builder Loop and Pipeline Run pages ----------
// dashed orange = asks a person only when needed (1, 2, 7)
const BA=[180,130,85,40,-5,-50,-95,-140];
node(&#x27;b1&#x27;,BDC,BA[0],&#x27;bb h c&#x27;,&#x27;评估&#x27;,1,1);
node(&#x27;b2&#x27;,BDC,BA[1],&#x27;bb h c&#x27;,&#x27;方案&#x27;,2,1);
node(&#x27;b3&#x27;,BDC,BA[2],&#x27;bb&#x27;,&#x27;计划&#x27;,3,0);
node(&#x27;b4&#x27;,BDC,BA[3],&#x27;bb free&#x27;,&#x27;构建&#x27;,4,0);
node(&#x27;b5&#x27;,BDC,BA[4],&#x27;bb&#x27;,&#x27;评审&#x27;,5,0);
node(&#x27;b6&#x27;,BDC,BA[5],&#x27;bb&#x27;,&#x27;测试&#x27;,6,0);
node(&#x27;b7&#x27;,BDC,BA[6],&#x27;bb h c&#x27;,&#x27;交付&#x27;,7,1);
node(&#x27;b8&#x27;,BDC,BA[7],&#x27;bb refl&#x27;,&#x27;回写&#x27;,8,0);
for(let i=0;i&lt;8;i++) arc(BDC,BA[i],BA[(i+1)%8],i===7?&#x27;#93c5fd&#x27;:&#x27;#2563eb&#x27;,i===7?null:&#x27;mB&#x27;,i===7?&#x27;5 6&#x27;:null);
// runs travelling round the cycle at the same time; orange = about to wait at 2 方案 and 7 交付
[[168],[154,1],[62],[18],[-27],[-73,1],[-118]].forEach(([a,w])=&gt;{
  const p=at(BDC,a);
  $(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;tok&#x27;+(w?&#x27; w&#x27;:&#x27;&#x27;),null,{left:p.x+&#x27;px&#x27;,top:p.y+&#x27;px&#x27;}));
});
$(&#x27;#nodes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;rc&#x27;,`&lt;b style=&quot;font-size:40px;color:#1d4ed8&quot;&gt;Builder 环&lt;/b&gt;&lt;em style=&quot;color:#1d4ed8&quot;&gt;Builder Agent 自主 run&lt;/em&gt;&lt;span&gt;并发：本机 ×N · 云端 ×N&lt;/span&gt;`,{left:&#x27;1484px&#x27;,top:&#x27;468px&#x27;}));

// ---------- Human-on-the-loop points: PM loop always (solid), Builder loop only when needed (dashed) ----------
[
  {x:140,w:164,cls:&#x27;box&#x27;,t:&#x27;2 澄清需求&#x27;},
  {x:318,w:164,cls:&#x27;box&#x27;,t:&#x27;5 对齐与批准&#x27;},
  {x:496,w:164,cls:&#x27;box&#x27;,t:&#x27;6 结果验收&#x27;},
  {x:684,w:196,cls:&#x27;dbox&#x27;,t:&#x27;1 评估&#x27;},
  {x:896,w:196,cls:&#x27;dbox&#x27;,t:&#x27;2 Design-Spec&#x27;},
  {x:1108,w:196,cls:&#x27;dbox&#x27;,t:&#x27;危险动作审批&#x27;},
  {x:1320,w:196,cls:&#x27;dbox&#x27;,t:&#x27;7 交付&#x27;},
].forEach(q=&gt;$(&#x27;#hq&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;hq &#x27;+q.cls,q.t,{left:q.x+&#x27;px&#x27;,width:q.w+&#x27;px&#x27;})));

// ---------- entry: triage into the two cycles (anchored on the triage rows) ----------
// fixed stage coordinates of the &#x27;→ Builder&#x27; and &#x27;→ PM&#x27; rows: in the deck a page is built while its iframe is

&lt;script&gt;
// ---------- geometry (stage px) ----------
const EX=560, EY=218;              // execution pane origin
const C0=150, CW=147;               // first stage column x (pane-relative), column width
const cx=i=&gt;EX+C0+CW*i+CW/2;        // stage column centre, absolute
const rcx=i=&gt;C0+CW*i+CW/2;          // stage column centre, pane-relative
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};

// ---------- ② funnel: same layers as the overall diagram ----------
const W=[250,222,194,166,138,110], RH=118, RG=14, RT=92, PANE=274;
[[&#x27;所有决策&#x27;,&#x27;#f3f4f6&#x27;,&#x27;#111827&#x27;],[&#x27;Brain 已有答案&#x27;,&#x27;#dbf1ec&#x27;,&#x27;#0f766e&#x27;],[&#x27;确定性检查&#x27;,&#x27;#e8ecf2&#x27;,&#x27;#334155&#x27;],[&#x27;Agent 自决&#x27;,&#x27;#dbeafe&#x27;,&#x27;#1d4ed8&#x27;],[&#x27;人&#x27;,&#x27;#fde4d0&#x27;,&#x27;#c2410c&#x27;]].forEach(([t,bg,c],k)=&gt;{
  const wt=W[k], wb=W[k+1], ins=(wt-wb)/2;
  $(&#x27;#frows&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;frow&#x27;,t,{left:((PANE-wt)/2)+&#x27;px&#x27;,top:(RT+k*(RH+RG))+&#x27;px&#x27;,width:wt+&#x27;px&#x27;,height:RH+&#x27;px&#x27;,background:bg,color:c,
    clipPath:`polygon(0 0,100% 0,calc(100% - ${ins}px) 100%,${ins}px 100%)`}));
});

// ---------- ④ stage columns: the same eight stages as the Pipeline Run page ----------
// 1, 2, 7 = a person may take part (only when needed)
const stages=[&#x27;评估&#x27;,&#x27;方案&#x27;,&#x27;计划&#x27;,&#x27;构建&#x27;,&#x27;评审&#x27;,&#x27;测试&#x27;,&#x27;交付&#x27;,&#x27;回写&#x27;];
stages.forEach((s,i)=&gt;{
  const x=C0+CW*i, refl=i===7, hum=[0,1,6].includes(i);
  $(&#x27;#cols&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;colbg&#x27;+(refl?&#x27; refl&#x27;:&#x27;&#x27;)+(i===3?&#x27; free&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;),null,{left:x+&#x27;px&#x27;,width:CW+&#x27;px&#x27;}));
  $(&#x27;#cols&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;sh&#x27;+(refl?&#x27; refl&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;),`&lt;b&gt;&lt;i&gt;${i+1}&lt;/i&gt;${s}&lt;/b&gt;`,{left:x+&#x27;px&#x27;,width:CW+&#x27;px&#x27;}));
});

// ---------- ④ the pipeline owns only the two ends ----------
[[0,3,&#x27;&#x27;,&#x27;流程管&#x27;],[3,4,&#x27; free&#x27;,&#x27;不管&#x27;],[4,8,&#x27;&#x27;,&#x27;流程管&#x27;]].forEach(([a,b,f,t])=&gt;{
  $(&#x27;#ends&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;ends&#x27;+f,`&lt;span&gt;${t}&lt;/span&gt;`,{left:(C0+CW*a+4)+&#x27;px&#x27;,width:(CW*(b-a)-8)+&#x27;px&#x27;}));
});

// ---------- ① ④ concurrent runs ----------
// per stage: d=done, c=current, p=waiting on a person, t=to do, s=skipped by profile, n=not in this mode
const LANES=[
  {top:122,name:&#x27;run A&#x27;,tag:&#x27;full&#x27;},
  {top:158,name:&#x27;run B&#x27;,tag:&#x27;Native&#x27;},
  {top:264,name:&#x27;run C&#x27;,tag:&#x27;full&#x27;},
  {top:300,name:&#x27;run D&#x27;,tag:&#x27;trivial&#x27;},
];
// lane state for each demo step (0 = overview)
const LS=[
  [&#x27;ddddcttt&#x27;,&#x27;nnndddct&#x27;,&#x27;dptttttt&#x27;,&#x27;dsdctttt&#x27;],
  [&#x27;tttttttt&#x27;,&#x27;nnnttttt&#x27;,&#x27;tttttttt&#x27;,&#x27;tstttttt&#x27;],
  [&#x27;tttttttt&#x27;,&#x27;nnnttttt&#x27;,&#x27;tttttttt&#x27;,&#x27;tstttttt&#x27;],
  [&#x27;dctttttt&#x27;,&#x27;nnnctttt&#x27;,&#x27;cttttttt&#x27;,&#x27;cstttttt&#x27;],
  [&#x27;dddctttt&#x27;,&#x27;nnndcttt&#x27;,&#x27;dctttttt&#x27;,&#x27;dscttttt&#x27;],
  [&#x27;ddddcttt&#x27;,&#x27;nnndddct&#x27;,&#x27;dptttttt&#x27;,&#x27;dsdctttt&#x27;],
  [&#x27;ddddddct&#x27;,&#x27;nnnddddc&#x27;,&#x27;ddcttttt&#x27;,&#x27;dsddcttt&#x27;],
  [&#x27;dddddddc&#x27;,&#x27;nnnddddd&#x27;,&#x27;dddctttt&#x27;,&#x27;dsddddct&#x27;],
  [&#x27;dddddddc&#x27;,&#x27;nnnddddd&#x27;,&#x27;dddctttt&#x27;,&#x27;dsddddct&#x27;],
  [&#x27;dddddddd&#x27;,&#x27;nnnddddd&#x27;,&#x27;ddddcttt&#x27;,&#x27;dsdddddd&#x27;],
];
const LC={
  0:{2:[1,&#x27;⏸ 等人&#x27;,&#x27;p&#x27;],3:[3,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  1:{0:[0,&#x27;排队中&#x27;,&#x27;&#x27;]},
  2:{0:[0,&#x27;装载中&#x27;,&#x27;&#x27;]},
  3:{3:[0,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  4:{3:[2,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  5:{2:[1,&#x27;⏸ 等人看 spec&#x27;,&#x27;p&#x27;],3:[3,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  6:{2:[2,&#x27;↻ 已恢复&#x27;,&#x27;&#x27;],0:[6,&#x27;待 PM 验收&#x27;,&#x27;p&#x27;]},
  7:{3:[6,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  8:{3:[6,&#x27;无人值守&#x27;,&#x27;&#x27;]},
  9:{},
};
[{top:96,t:&#x27;本机 Local&#x27;},{top:236,t:&#x27;云端 Cloud&#x27;}].forEach(g=&gt;$(&#x27;#lanes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;grp&#x27;,g.t,{top:g.top+&#x27;px&#x27;})));
const laneBox=el(&#x27;div&#x27;,null,null,{position:&#x27;absolute&#x27;,left:&#x27;0&#x27;,top:&#x27;0&#x27;});
$(&#x27;#lanes&#x27;).appendChild(laneBox);
function renderLanes(step){
  laneBox.innerHTML=&#x27;&#x27;;
  LANES.forEach((L,n)=&gt;{
    const lane=el(&#x27;div&#x27;,&#x27;lane&#x27;,null,{top:L.top+&#x27;px&#x27;});
    lane.appendChild(el(&#x27;div&#x27;,&#x27;ll&#x27;,`&lt;b&gt;${L.name}&lt;/b&gt;&lt;span&gt;${L.tag}&lt;/span&gt;`));
    const st=LS[step][n].split(&#x27;&#x27;);
    for(let i=0;i&lt;7;i++){
      const a=st[i], b=st[i+1];
      if(a===&#x27;n&#x27;) continue;
      let cls=&#x27;track&#x27;;
      if(a===&#x27;d&#x27;&amp;&amp;&#x27;dcp&#x27;.includes(b)) cls+=&#x27; done&#x27;;
      if(a===&#x27;s&#x27;||b===&#x27;s&#x27;) cls=&#x27;track skip&#x27;;
      lane.appendChild(el(&#x27;div&#x27;,cls,null,{left:rcx(i)+&#x27;px&#x27;,width:CW+&#x27;px&#x27;}));
    }
    st.forEach((v,i)=&gt;{ if(v!==&#x27;n&#x27;&amp;&amp;v!==&#x27;s&#x27;) lane.appendChild(el(&#x27;div&#x27;,&#x27;dot &#x27;+v,null,{left:rcx(i)+&#x27;px&#x27;})); });
    const c=(LC[step]||{})[n];
    if(c&amp;&amp;c[1]) lane.appendChild(el(&#x27;div&#x27;,&#x27;cap &#x27;+c[2],c[1],{left:(rcx(c[0])+16)+&#x27;px&#x27;}));
    laneBox.appendChild(lane);
  });
}
// many more runs, drawn compact: [start stage, current stage at overview, waiting-on-person?]
const MINI_OFF=[0,-9,-9,-3,-2,0,1,2,2,3];
const miniRows=[];
function minis(top,list,label){
  $(&#x27;#lanes&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;more&#x27;,label,{top:(top-4)+&#x27;px&#x27;}));
  list.forEach((m,k)=&gt;{
    const [s0,c,p]=m, y=top+k*6;
    const row=el(&#x27;div&#x27;,&#x27;mini&#x27;,null,{left:&#x27;0px&#x27;,top:y+&#x27;px&#x27;,width:&#x27;1344px&#x27;});
    row.appendChild(el(&#x27;div&#x27;,&#x27;mt&#x27;,null,{left:rcx(s0)+&#x27;px&#x27;,width:(rcx(7)-rcx(s0))+&#x27;px&#x27;}));
    const mf=el(&#x27;div&#x27;,&#x27;mf&#x27;,null,{left:rcx(s0)+&#x27;px&#x27;,width:&#x27;0px&#x27;}), md=el(&#x27;div&#x27;,&#x27;md&#x27;,null,{left:rcx(s0)+&#x27;px&#x27;});
    row.appendChild(mf); row.appendChild(md);
    miniRows.push({s0,c,p,mf,md});
    $(&#x27;#lanes&#x27;).appendChild(row);
  });
}
minis(198,[[0,2],[0,6],[3,4],[0,1],[0,7]],&#x27;+5 个 run&#x27;);
minis(340,[[0,3],[0,0,1],[0,4],[3,6],[0,2],[0,5],[0,7],[0,1]],&#x27;+8 个 run&#x27;);
function updateMinis(step){
  miniRows.forEach(m=&gt;{
    const c=Math.max(m.s0,Math.min(7,m.c+MINI_OFF[step]));
    m.mf.style.width=(rcx(c)-rcx(m.s0))+&#x27;px&#x27;;
    m.md.style.left=rcx(c)+&#x27;px&#x27;;
    m.md.className=&#x27;md&#x27;+(m.p&amp;&amp;(step===0||step===5)?&#x27; p&#x27;:&#x27;&#x27;);
  });
}

// ---------- ② human points: the Builder ring&#x27;s, all only when needed ----------
[
  {a:0,b:1,t:&#x27;需求歧义&#x27;},
  {a:1,b:2,t:&#x27;不可逆 /&lt;br&gt;高风险设计&#x27;},
  {a:2,b:6,t:&#x27;全部交给 Agent&lt;br&gt;&lt;small&gt;◇ 危险动作才审批&lt;/small&gt;&#x27;,agent:1},
  {a:6,b:7,t:&#x27;交付&lt;br&gt;按需审 PR&#x27;},
].forEach(p=&gt;$(&#x27;#hpoints&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;hbox&#x27;+(p.agent?&#x27; agent&#x27;:&#x27;&#x27;),`${p.agent?&#x27;&#x27;:&#x27;&lt;i&gt;&lt;/i&gt;&#x27;}&lt;span&gt;${p.t}&lt;/span&gt;`,{left:(C0+CW*p.a+4)+&#x27;px&#x27;,width:(CW*(p.b-p.a)-8)+&#x27;px&#x27;})));

// ---------- wires (each tagged with a key the demo can light up) ----------

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const el=(tag,cls,html,style)=&gt;{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e;};
const NS=&#x27;http://www.w3.org/2000/svg&#x27;, G=$(&#x27;#g&#x27;);
function path(d,stroke,marker,w,dash){const p=document.createElementNS(NS,&#x27;path&#x27;);p.setAttribute(&#x27;d&#x27;,d);p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);p.setAttribute(&#x27;stroke&#x27;,stroke);p.setAttribute(&#x27;stroke-width&#x27;,w||3);if(dash)p.setAttribute(&#x27;stroke-dasharray&#x27;,dash);if(marker)p.setAttribute(&#x27;marker-end&#x27;,`url(#${marker})`);G.appendChild(p);}
function text(x,y,t,fill,anchor){const e=document.createElementNS(NS,&#x27;text&#x27;);e.setAttribute(&#x27;x&#x27;,x);e.setAttribute(&#x27;y&#x27;,y);e.setAttribute(&#x27;class&#x27;,&#x27;wl&#x27;);e.setAttribute(&#x27;fill&#x27;,fill);if(anchor)e.setAttribute(&#x27;text-anchor&#x27;,anchor);e.textContent=t;G.appendChild(e);}

// ---------- geometry: a label column, then eight stage columns ----------
const C0=200, CW=200, GAP=12;
const X=i=&gt;C0+i*(CW+GAP), CX=i=&gt;X(i)+CW/2;

// ---------- eight stages: what the agent writes, what the checks decide ----------
const ST=[
  [&#x27;EVALUATE&#x27;,&#x27;评估&#x27;,[&#x27;doc:Requirements&#x27;],[&#x27;需求可验证&#x27;,&#x27;Gate-0 按需&#x27;]],
  [&#x27;THINK&#x27;,&#x27;方案&#x27;,[&#x27;方案对比&#x27;,&#x27;查 Brain&#x27;],[&#x27;代码证据定案&#x27;]],
  [&#x27;PLAN&#x27;,&#x27;计划&#x27;,[&#x27;doc:Design-Spec&#x27;],[&#x27;任务 ↔ 需求&#x27;,&#x27;验收有测试&#x27;]],
  [&#x27;BUILD&#x27;,&#x27;构建&#x27;,[&#x27;Native Coding&#x27;,&#x27;Fan-out Runs&#x27;],[&#x27;独立 worktree&#x27;,&#x27;报告在当前树&#x27;]],
  [&#x27;REVIEW&#x27;,&#x27;评审&#x27;,[&#x27;doc:Fixing-Spec&#x27;,&#x27;一次修完&#x27;],[&#x27;按改动派专家&#x27;,&#x27;修复有测试&#x27;,&#x27;最多两轮&#x27;]],
  [&#x27;TEST&#x27;,&#x27;测试&#x27;,[&#x27;跑最终验证&#x27;],[&#x27;在审过的树上&#x27;,&#x27;无失败命令&#x27;]],
  [&#x27;DELIVER&#x27;,&#x27;交付&#x27;,[&#x27;doc:Reflect&#x27;],[&#x27;落地 = 审过的&#x27;,&#x27;不 push&#x27;]],
  [&#x27;REFLECT&#x27;,&#x27;回写&#x27;,[&#x27;决策 · 纠正&#x27;,&#x27;实践 · 缺口&#x27;],[&#x27;进 CDF&#x27;,&#x27;不挡落地&#x27;]],
];
ST.forEach(([en,zh,a,c],i)=&gt;{
  const hum=[0,1,6].includes(i);
  const cls=&#x27;st&#x27;+(i===3?&#x27; free&#x27;:&#x27;&#x27;)+(i===7?&#x27; refl&#x27;:&#x27;&#x27;)+(hum?&#x27; hum&#x27;:&#x27;&#x27;);
  $(&#x27;#cards&#x27;).appendChild(el(&#x27;div&#x27;,cls,
    `${hum?&#x27;&lt;i class=&quot;tg h&quot;&gt;按需问人&lt;/i&gt;&#x27;:&#x27;&lt;i class=&quot;tg a&quot;&gt;Agent 全权&lt;/i&gt;&#x27;}&lt;h3&gt;${zh}&lt;/h3&gt;&lt;div class=&quot;za&quot;&gt;&lt;b&gt;AGENT&lt;/b&gt;${a.map(t=&gt;t.startsWith(&#x27;doc:&#x27;)?`&lt;span class=&quot;doc&quot;&gt;${t.slice(4)}&lt;/span&gt;`:t).join(&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;&lt;div class=&quot;zc&quot;&gt;&lt;b&gt;CHECK&lt;/b&gt;${c.map(t=&gt;`&lt;div&gt;${t}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`,
    {left:X(i)+&#x27;px&#x27;}));
});

// ---------- profiles: which stages each one runs ----------
ST.forEach(([en],i)=&gt;$(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;mh&#x27;,`&lt;i&gt;${i+1}&lt;/i&gt;${en}`,{left:(X(i)-16)+&#x27;px&#x27;,width:CW+&#x27;px&#x27;})));
const PROF=[[&#x27;full · bugfix&#x27;,&#x27;11111111&#x27;],[&#x27;trivial&#x27;,&#x27;10111111&#x27;],[&#x27;direct&#x27;,&#x27;00011111&#x27;],[&#x27;research&#x27;,&#x27;11000011&#x27;]];
PROF.forEach(([name,on],k)=&gt;{
  const y=62+k*32;
  $(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;ml&#x27;,name,{top:(y-15)+&#x27;px&#x27;}));
  const idx=[...on].map((v,i)=&gt;v===&#x27;1&#x27;?i:-1).filter(i=&gt;i&gt;=0);
  for(let j=0;j&lt;idx.length-1;j++) $(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;mt&#x27;,null,{left:(CX(idx[j])-16)+&#x27;px&#x27;,width:(CX(idx[j+1])-CX(idx[j]))+&#x27;px&#x27;,top:(y-2)+&#x27;px&#x27;}));
  [...on].forEach((v,i)=&gt;$(&#x27;#mxi&#x27;).appendChild(el(&#x27;div&#x27;,v===&#x27;1&#x27;?&#x27;md&#x27;:&#x27;mo&#x27;,null,{left:(CX(i)-16)+&#x27;px&#x27;,top:y+&#x27;px&#x27;})));
});

// ---------- where a person may come in ----------
[
  {a:0,b:1,t:&#x27;需求歧义&#x27;},
  {a:1,b:2,t:&#x27;不可逆 /&lt;br&gt;高风险设计&#x27;},
  {a:2,b:6,t:&#x27;全部交给 Agent&lt;small&gt;◇ 危险动作才审批&lt;/small&gt;&#x27;,agent:1},
  {a:6,b:7,t:&#x27;Push&lt;br&gt;按需审 PR&#x27;,solid:1},
].forEach(p=&gt;$(&#x27;#hq&#x27;).appendChild(el(&#x27;div&#x27;,&#x27;hb&#x27;+(p.solid?&#x27; solid&#x27;:&#x27;&#x27;)+(p.agent?&#x27; agent&#x27;:&#x27;&#x27;),`${p.agent?&#x27;&#x27;:&#x27;&lt;i&gt;&lt;/i&gt;&#x27;}&lt;span style=&quot;display:flex;flex-direction:column;align-items:center;gap:2px&quot;&gt;${p.t}&lt;/span&gt;`,{left:(X(p.a)-16)+&#x27;px&#x27;,width:(X(p.b)-X(p.a)-GAP)+&#x27;px&#x27;})));

// ---------- wires ----------
// stage to stage
for(let i=0;i&lt;7;i++) path(`M${X(i)+CW+1},564 L${X(i+1)-1},564`,&#x27;#334155&#x27;,&#x27;mW&#x27;,2.5);
// BUILD fans out to child runs
const FAN_L=X(1), FAN_R=X(3)+CW+60;
Object.assign($(&#x27;#fan&#x27;).style,{left:FAN_L+&#x27;px&#x27;,width:(FAN_R-FAN_L)+&#x27;px&#x27;});
path(`M${CX(3)},742 L${CX(3)},770`,&#x27;#2563eb&#x27;,&#x27;mB&#x27;,2.5,&#x27;6 4&#x27;);
// DELIVER hands over its output: the PR and the report
Object.assign($(&#x27;#out&#x27;).style,{left:X(6)+&#x27;px&#x27;,width:CW+&#x27;px&#x27;});
path(`M${CX(6)},742 L${CX(6)},770`,&#x27;#c2410c&#x27;,&#x27;mO&#x27;,2.5,&#x27;6 4&#x27;);
// a code change in TEST goes back to REVIEW
path(`M${CX(5)},742 C${CX(5)},792 ${CX(4)},792 ${CX(4)},746`,&#x27;#2563eb&#x27;,&#x27;mB&#x27;,2.5,&#x27;6 4&#x27;);
text((CX(4)+CX(5))/2,826,&#x27;改代码 → 回审 · ≤ 2&#x27;,&#x27;#2563eb&#x27;,&#x27;middle&#x27;);
// Brain -&gt; the run&#x27;s knowledge; REFLECT -&gt; CDF -&gt; Brain
path(`M${CX(0)},874 L${CX(0)},744`,&#x27;#0f766e&#x27;,&#x27;mK&#x27;);
text(CX(0)+12,822,&#x27;装载&#x27;,&#x27;#0f766e&#x27;,&#x27;start&#x27;);
path(`M${CX(7)},742 L${CX(7)},872`,&#x27;#0f766e&#x27;,&#x27;mK&#x27;);
text(CX(7)+12,822,&#x27;写回&#x27;,&#x27;#0f766e&#x27;,&#x27;start&#x27;);

addEventListener(&#x27;resize&#x27;,fit);fit();
