<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif">
  <rect width="780" height="440" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Eight Feed Channels into the Cultivation Engine</text>

  <!-- Channel boxes (left side, stacked) -->
  <rect x="30" y="48" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="122" y="67" text-anchor="middle" fill="#7ee787" font-size="10">Ch1: Code Changes</text>

  <rect x="30" y="85" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="122" y="104" text-anchor="middle" fill="#7ee787" font-size="10">Ch2: External Learning</text>

  <rect x="30" y="122" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="122" y="141" text-anchor="middle" fill="#d2a8ff" font-size="10">Ch3: Pipeline Delivery</text>

  <rect x="30" y="159" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="122" y="178" text-anchor="middle" fill="#7ee787" font-size="10">Ch4: Industry Signals</text>

  <rect x="30" y="196" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="122" y="215" text-anchor="middle" fill="#7ee787" font-size="10">Ch5: Conversation</text>

  <rect x="30" y="233" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="122" y="252" text-anchor="middle" fill="#f78166" font-size="10">Ch6: Corrections</text>

  <rect x="30" y="270" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="122" y="289" text-anchor="middle" fill="#7ee787" font-size="10">Ch7: Code Intelligence</text>

  <rect x="30" y="307" width="185" height="30" rx="6" fill="#1a1a2e" stroke="#e3b341" stroke-width="1.5"/>
  <text x="122" y="326" text-anchor="middle" fill="#e3b341" font-size="10">Ch8: Entry Lifecycle (timer)</text>

  <!-- Flow arrows from channels to proposal queue -->
  <line x1="215" y1="63"  x2="310" y2="195" stroke="#7ee787" stroke-width="1"/>
  <line x1="215" y1="100" x2="310" y2="198" stroke="#7ee787" stroke-width="1"/>
  <line x1="215" y1="137" x2="310" y2="201" stroke="#d2a8ff" stroke-width="1.5"/>
  <line x1="215" y1="174" x2="310" y2="204" stroke="#7ee787" stroke-width="1"/>
  <line x1="215" y1="211" x2="310" y2="207" stroke="#7ee787" stroke-width="1"/>
  <line x1="215" y1="248" x2="310" y2="210" stroke="#f78166" stroke-width="1"/>
  <line x1="215" y1="285" x2="310" y2="213" stroke="#7ee787" stroke-width="1"/>
  <line x1="215" y1="322" x2="310" y2="216" stroke="#e3b341" stroke-width="1"/>

  <!-- Proposal Queue -->
  <rect x="310" y="150" width="140" height="120" rx="8" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="175" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Proposal</text>
  <text x="380" y="192" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Queue</text>

  <!-- Stacked proposals -->
  <rect x="325" y="205" width="110" height="18" rx="3" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="380" y="218" text-anchor="middle" fill="#e6edf3" font-size="8">proposal-001.yaml</text>
  <rect x="325" y="227" width="110" height="18" rx="3" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="380" y="240" text-anchor="middle" fill="#e6edf3" font-size="8">proposal-002.yaml</text>
  <rect x="325" y="249" width="110" height="18" rx="3" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="380" y="262" text-anchor="middle" fill="#e6edf3" font-size="8">proposal-003.yaml</text>

  <!-- Arrow to Approval Gate -->
  <line x1="450" y1="210" x2="500" y2="210" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="497,206 505,210 497,214" fill="#58a6ff"/>

  <!-- Approval Gate -->
  <rect x="505" y="170" width="100" height="80" rx="8" fill="none" stroke="#f78166" stroke-width="2.5"/>
  <text x="555" y="200" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">APPROVAL</text>
  <text x="555" y="217" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">GATE</text>
  <text x="555" y="238" text-anchor="middle" fill="#e6edf3" font-size="9">Human or auto</text>

  <!-- Arrow to DDD -->
  <line x1="605" y1="210" x2="655" y2="210" stroke="#7ee787" stroke-width="1.5"/>
  <polygon points="652,206 660,210 652,214" fill="#7ee787"/>

  <!-- DDD Documents -->
  <rect x="660" y="140" width="100" height="140" rx="8" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="710" y="165" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">DDD</text>
  <rect x="672" y="175" width="76" height="20" rx="3" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="710" y="189" text-anchor="middle" fill="#e6edf3" font-size="8">PRODUCT.md</text>
  <rect x="672" y="200" width="76" height="20" rx="3" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="710" y="214" text-anchor="middle" fill="#e6edf3" font-size="8">TECH.md</text>
  <rect x="672" y="225" width="76" height="20" rx="3" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="710" y="239" text-anchor="middle" fill="#e6edf3" font-size="8">IMPROVEMENT.md</text>
  <rect x="672" y="250" width="76" height="20" rx="3" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="710" y="264" text-anchor="middle" fill="#e6edf3" font-size="8">PROJECT.md</text>

  <!-- Rejection path -->
  <path d="M 555 250 L 555 320 L 380 320 L 380 270" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="4"/>
  <text x="470" y="313" text-anchor="middle" fill="#f78166" font-size="9">Rejected: returned to queue or discarded</text>

  <!-- Legend at bottom -->
  <rect x="30" y="392" width="720" height="38" rx="6" fill="none" stroke="#e6edf3" stroke-width="0.5"/>
  <circle cx="55" cy="411" r="5" fill="#d2a8ff"/>
  <text x="66" y="415" fill="#e6edf3" font-size="9">Richest feed (Pipeline)</text>
  <circle cx="220" cy="411" r="5" fill="#f78166"/>
  <text x="231" y="415" fill="#e6edf3" font-size="9">Highest priority (Corrections)</text>
  <circle cx="410" cy="411" r="5" fill="#e3b341"/>
  <text x="421" y="415" fill="#e6edf3" font-size="9">Timer-driven (Entry Lifecycle)</text>
  <circle cx="600" cy="411" r="5" fill="#7ee787"/>
  <text x="611" y="415" fill="#e6edf3" font-size="9">Steady flow (5 channels)</text>
</svg>
