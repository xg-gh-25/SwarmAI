<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="sans-serif">
  <rect width="700" height="440" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Four Pillars of the DDD Cultivation Engine</text>

  <!-- Roof: DDD Knowledge -->
  <polygon points="100,70 350,45 600,70 600,100 100,100" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="350" y="88" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">DDD: Living Domain Knowledge</text>

  <!-- Roof bottom line -->
  <line x1="100" y1="100" x2="600" y2="100" stroke="#58a6ff" stroke-width="2"/>

  <!-- Pillar 1: Feeds -->
  <rect x="115" y="105" width="110" height="260" rx="4" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">FEEDS</text>
  <line x1="130" y1="140" x2="210" y2="140" stroke="#7ee787" stroke-width="0.5"/>
  <text x="170" y="158" text-anchor="middle" fill="#e6edf3" font-size="9">Code Changes</text>
  <text x="170" y="174" text-anchor="middle" fill="#e6edf3" font-size="9">External Learning</text>
  <text x="170" y="190" text-anchor="middle" fill="#e6edf3" font-size="9">Pipeline Delivery</text>
  <text x="170" y="206" text-anchor="middle" fill="#e6edf3" font-size="9">Industry Signals</text>
  <text x="170" y="222" text-anchor="middle" fill="#e6edf3" font-size="9">Conversation</text>
  <text x="170" y="238" text-anchor="middle" fill="#e6edf3" font-size="9">Corrections</text>
  <text x="170" y="254" text-anchor="middle" fill="#e6edf3" font-size="9">Code Intelligence</text>
  <text x="170" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Entry Lifecycle</text>
  <line x1="130" y1="282" x2="210" y2="282" stroke="#7ee787" stroke-width="0.5"/>
  <text x="170" y="302" text-anchor="middle" fill="#7ee787" font-size="9">8 channels</text>
  <text x="170" y="318" text-anchor="middle" fill="#7ee787" font-size="9">nourish DDD</text>
  <text x="170" y="332" text-anchor="middle" fill="#7ee787" font-size="9">from normal</text>
  <text x="170" y="348" text-anchor="middle" fill="#7ee787" font-size="9">work</text>

  <!-- Pillar 2: Health -->
  <rect x="245" y="105" width="110" height="260" rx="4" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="300" y="130" text-anchor="middle" fill="#f78166" font-size="12" font-weight="bold">HEALTH</text>
  <line x1="260" y1="140" x2="340" y2="140" stroke="#f78166" stroke-width="0.5"/>
  <text x="300" y="160" text-anchor="middle" fill="#e6edf3" font-size="9">Staleness</text>
  <text x="300" y="178" text-anchor="middle" fill="#e6edf3" font-size="9">Completeness</text>
  <text x="300" y="196" text-anchor="middle" fill="#e6edf3" font-size="9">Usage frequency</text>
  <text x="300" y="214" text-anchor="middle" fill="#e6edf3" font-size="9">Decay rate</text>
  <text x="300" y="232" text-anchor="middle" fill="#e6edf3" font-size="9">Contradiction</text>
  <line x1="260" y1="250" x2="340" y2="250" stroke="#f78166" stroke-width="0.5"/>
  <text x="300" y="270" text-anchor="middle" fill="#f78166" font-size="9">5 dimensions</text>
  <text x="300" y="286" text-anchor="middle" fill="#f78166" font-size="9">drive AI trust</text>
  <text x="300" y="302" text-anchor="middle" fill="#f78166" font-size="9">levels and</text>
  <text x="300" y="318" text-anchor="middle" fill="#f78166" font-size="9">cultivation</text>
  <text x="300" y="334" text-anchor="middle" fill="#f78166" font-size="9">priority</text>

  <!-- Pillar 3: Maturity -->
  <rect x="375" y="105" width="110" height="260" rx="4" fill="none" stroke="#d2a8ff" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">MATURITY</text>
  <line x1="390" y1="140" x2="470" y2="140" stroke="#d2a8ff" stroke-width="0.5"/>
  <text x="430" y="160" text-anchor="middle" fill="#e6edf3" font-size="9">[Sparse]</text>
  <text x="430" y="178" text-anchor="middle" fill="#e6edf3" font-size="9">[Growing]</text>
  <text x="430" y="196" text-anchor="middle" fill="#e6edf3" font-size="9">[Mature]</text>
  <text x="430" y="214" text-anchor="middle" fill="#e6edf3" font-size="9">[Evergreen]</text>
  <line x1="390" y1="232" x2="470" y2="232" stroke="#d2a8ff" stroke-width="0.5"/>
  <text x="430" y="252" text-anchor="middle" fill="#d2a8ff" font-size="9">Per-section</text>
  <text x="430" y="268" text-anchor="middle" fill="#d2a8ff" font-size="9">confidence</text>
  <text x="430" y="284" text-anchor="middle" fill="#d2a8ff" font-size="9">enables</text>
  <text x="430" y="300" text-anchor="middle" fill="#d2a8ff" font-size="9">graduated</text>
  <text x="430" y="316" text-anchor="middle" fill="#d2a8ff" font-size="9">autonomy</text>

  <!-- Pillar 4: Discovery -->
  <rect x="505" y="105" width="110" height="260" rx="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="560" y="130" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">DISCOVERY</text>
  <line x1="520" y1="140" x2="600" y2="140" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="560" y="160" text-anchor="middle" fill="#e6edf3" font-size="9">Entity Index</text>
  <text x="560" y="178" text-anchor="middle" fill="#e6edf3" font-size="9">PROJECTS.md</text>
  <text x="560" y="196" text-anchor="middle" fill="#e6edf3" font-size="9">Routing table</text>
  <text x="560" y="214" text-anchor="middle" fill="#e6edf3" font-size="9">Cross-project</text>
  <line x1="520" y1="232" x2="600" y2="232" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="560" y="252" text-anchor="middle" fill="#58a6ff" font-size="9">Flat lookup</text>
  <text x="560" y="268" text-anchor="middle" fill="#58a6ff" font-size="9">routes queries</text>
  <text x="560" y="284" text-anchor="middle" fill="#58a6ff" font-size="9">to the right</text>
  <text x="560" y="300" text-anchor="middle" fill="#58a6ff" font-size="9">project/doc/</text>
  <text x="560" y="316" text-anchor="middle" fill="#58a6ff" font-size="9">section</text>

  <!-- Foundation -->
  <rect x="100" y="370" width="500" height="40" rx="4" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="350" y="395" text-anchor="middle" fill="#e6edf3" font-size="11">Foundation: Filesystem + Git (no database, no external dependencies)</text>

  <!-- Pillar bases connecting to foundation -->
  <line x1="170" y1="365" x2="170" y2="370" stroke="#7ee787" stroke-width="2"/>
  <line x1="300" y1="365" x2="300" y2="370" stroke="#f78166" stroke-width="2"/>
  <line x1="430" y1="365" x2="430" y2="370" stroke="#d2a8ff" stroke-width="2"/>
  <line x1="560" y1="365" x2="560" y2="370" stroke="#58a6ff" stroke-width="2"/>

  <!-- Legend -->
  <text x="350" y="430" text-anchor="middle" fill="#e6edf3" font-size="9">Each pillar operates independently but reinforces the others: feeds nourish, health monitors, maturity gates autonomy, discovery connects</text>
</svg>