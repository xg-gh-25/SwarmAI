<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" font-family="sans-serif">
  <rect width="900" height="664" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">DDD — Overall Architecture: the Product Domain Brain</text>
  <text x="450" y="50" text-anchor="middle" fill="#8b949e" font-size="10">a control plane that OWNs cognition (①–④, ships in full) and GOVERNs the physical (⑤–⑥, points at + controls — 指+治,不含+不跑)</text>

  <!-- ===== BRAIN container ===== -->
  <rect x="28" y="68" width="844" height="366" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="44" y="90" fill="#58a6ff" font-size="12" font-weight="bold">DDD = Product Domain BRAIN (control plane)</text>

  <!-- ===== OWN zone ===== -->
  <rect x="44" y="100" width="512" height="322" rx="8" fill="#0f1c26" stroke="#58a6ff" stroke-width="1" stroke-dasharray="0"/>
  <text x="56" y="120" fill="#58a6ff" font-size="11" font-weight="bold">OWN — cognitive assets · the DDD <tspan font-style="italic">is</tspan> these · shipped in full</text>

  <!-- (1) Identity -->
  <rect x="58" y="130" width="240" height="90" rx="6" fill="#182635" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="70" y="150" fill="#e6edf3" font-size="11" font-weight="bold">① IDENTITY &amp; MANIFEST</text>
  <text x="70" y="168" fill="#8b949e" font-size="8.5">aim.json · AGENTS.md · config</text>
  <text x="70" y="182" fill="#8b949e" font-size="8.5">brain_kind · declared skills/tools/jobs</text>
  <text x="70" y="200" fill="#7ee787" font-size="8">what this brain IS</text>

  <!-- (2) Knowledge -->
  <rect x="308" y="130" width="238" height="90" rx="6" fill="#182635" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="320" y="150" fill="#e6edf3" font-size="11" font-weight="bold">② KNOWLEDGE</text>
  <text x="320" y="168" fill="#8b949e" font-size="8.5">PRODUCT/TECH/IMPROVEMENT/PROJECT</text>
  <text x="320" y="182" fill="#8b949e" font-size="8.5">+ Knowledge/ · 7-type × 3-layer ontology</text>
  <text x="320" y="200" fill="#7ee787" font-size="8">judgment is BORN here as prose · cold-start</text>

  <!-- (3) Gates -->
  <rect x="58" y="230" width="240" height="90" rx="6" fill="#182635" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="70" y="250" fill="#e6edf3" font-size="11" font-weight="bold">③ GATES <tspan fill="#d29922" font-size="9">(the MOAT)</tspan></text>
  <text x="70" y="268" fill="#8b949e" font-size="8.5">gates/*.py|sh + tests + deny-lists</text>
  <text x="70" y="282" fill="#8b949e" font-size="8.5">the executable TERMINUS of matured judgment</text>
  <text x="70" y="300" fill="#f0883e" font-size="8">designed · sparse in practice (only AIDLC ships one)</text>

  <!-- (4) Capabilities -->
  <rect x="308" y="230" width="238" height="90" rx="6" fill="#182635" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="320" y="250" fill="#e6edf3" font-size="11" font-weight="bold">④ CAPABILITIES</text>
  <text x="320" y="268" fill="#8b949e" font-size="8.5">skills/ · agent-specs · agent-SOPs · tools</text>
  <text x="320" y="282" fill="#8b949e" font-size="8.5">the distribution layer · validated + portable</text>
  <text x="320" y="300" fill="#7ee787" font-size="8">what this brain can DO</text>

  <!-- 养成 ladder: (2) -> (3) -> (4) -->
  <line x1="178" y1="220" x2="178" y2="230" stroke="#d29922" stroke-width="1.6"/>
  <polygon points="174,228 178,236 182,228" fill="#d29922"/>
  <text x="150" y="228" text-anchor="end" fill="#d29922" font-size="8">养成: prose→gate</text>
  <line x1="298" y1="275" x2="308" y2="275" stroke="#d29922" stroke-width="1.6"/>
  <polygon points="306,271 314,275 306,279" fill="#d29922"/>
  <text x="303" y="266" text-anchor="middle" fill="#d29922" font-size="7.5">gate wires into ④</text>

  <!-- self-improve REFLECT loop: (4) -> (2), routed through the empty lower band -->
  <path d="M 427 320 C 427 360, 315 365, 315 224" fill="none" stroke="#7ee787" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="311,232 315,222 319,232" fill="#7ee787"/>
  <text x="335" y="360" fill="#7ee787" font-size="8">REFLECT: new pitfalls/judgment ▲ compound back to ②</text>

  <!-- ===== GOVERN zone ===== -->
  <rect x="566" y="100" width="290" height="322" rx="8" fill="#261f12" stroke="#d29922" stroke-width="1"/>
  <text x="578" y="120" fill="#d29922" font-size="11" font-weight="bold">GOVERN — physical control</text>
  <text x="578" y="134" fill="#8b949e" font-size="8">point at + control · never contain / never run</text>

  <!-- (5) Delivery Contract -->
  <rect x="578" y="144" width="266" height="80" rx="6" fill="#2a2318" stroke="#d29922" stroke-width="1.2"/>
  <text x="590" y="164" fill="#e6edf3" font-size="11" font-weight="bold">⑤ DELIVERY CONTRACT</text>
  <text x="590" y="181" fill="#8b949e" font-size="8.5">bindings.yaml — full 全貌 per governed asset:</text>
  <text x="590" y="194" fill="#8b949e" font-size="8.5">repo(s)/build/version/branch/deploy-ref/review</text>
  <text x="590" y="212" fill="#f0b429" font-size="8">0..N governed assets · all DATA</text>

  <!-- (6) Code-Intel Refresher -->
  <rect x="578" y="234" width="266" height="86" rx="6" fill="#2a2318" stroke="#d29922" stroke-width="1.2"/>
  <text x="590" y="254" fill="#e6edf3" font-size="11" font-weight="bold">⑥ CODE-INTEL REFRESHER</text>
  <text x="590" y="271" fill="#8b949e" font-size="8.5">self-contained mechanism (ships WITH package)</text>
  <text x="590" y="284" fill="#8b949e" font-size="8.5">regenerates the projection from code</text>
  <text x="590" y="302" fill="#f0b429" font-size="8">ship the REFRESHER (capability), NOT the projection</text>

  <!-- (4) capabilities EXECUTE the governance: arrow (4) -> GOVERN -->
  <line x1="546" y1="200" x2="566" y2="184" stroke="#58a6ff" stroke-width="1.6"/>
  <polygon points="560,180 568,182 562,188" fill="#58a6ff"/>
  <text x="556" y="172" text-anchor="middle" fill="#58a6ff" font-size="7.5">④ executes</text>

  <!-- ===== DERIVED / PHYSICAL zone (NOT a member) ===== -->
  <rect x="28" y="452" width="844" height="176" rx="10" fill="#141420" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="44" y="474" fill="#6e7681" font-size="11" font-weight="bold">✗ NOT a DDD member — DERIVED / PHYSICAL zone</text>
  <text x="330" y="474" fill="#6e7681" font-size="8.5">gitignored · local-only · Amazon infra · never PR-flows-back into the brain</text>

  <!-- physical items -->
  <rect x="48" y="486" width="196" height="120" rx="6" fill="#1a1a2e" stroke="#6e7681" stroke-width="1"/>
  <text x="60" y="506" fill="#c9d1d9" font-size="10" font-weight="bold">&lt;product source&gt;</text>
  <text x="60" y="524" fill="#6e7681" font-size="8">the repo(s) themselves</text>
  <text x="60" y="537" fill="#6e7681" font-size="8">GOVERNed via ⑤ · never contained</text>

  <rect x="256" y="486" width="196" height="120" rx="6" fill="#1a1a2e" stroke="#6e7681" stroke-width="1"/>
  <text x="268" y="506" fill="#c9d1d9" font-size="10" font-weight="bold">&lt;deploy pipeline&gt;</text>
  <text x="268" y="524" fill="#6e7681" font-size="8">runs on the org's CI host</text>
  <text x="268" y="537" fill="#6e7681" font-size="8">referenced in ⑤ · never executed</text>

  <rect x="464" y="486" width="196" height="120" rx="6" fill="#1a1a2e" stroke="#6e7681" stroke-width="1"/>
  <text x="476" y="506" fill="#c9d1d9" font-size="10" font-weight="bold">code-intel.json</text>
  <text x="476" y="524" fill="#6e7681" font-size="8">DERIVED projection (by ⑥)</text>
  <text x="476" y="537" fill="#6e7681" font-size="8">regenerated locally at each host</text>

  <rect x="672" y="486" width="180" height="120" rx="6" fill="#1a1a2e" stroke="#6e7681" stroke-width="1"/>
  <text x="684" y="506" fill="#c9d1d9" font-size="10" font-weight="bold">code_intel.db</text>
  <text x="684" y="524" fill="#6e7681" font-size="8">SwarmAI's SQLite engine</text>
  <text x="684" y="537" fill="#6e7681" font-size="8">LOCAL-ONLY · never shipped</text>

  <!-- GOVERN -> physical arrows (指 + 治) -->
  <line x1="640" y1="224" x2="150" y2="486" stroke="#d29922" stroke-width="1.3" stroke-dasharray="3 3"/>
  <polygon points="150,479 146,489 156,486" fill="#d29922"/>
  <text x="380" y="360" fill="#d29922" font-size="8" transform="rotate(-26 380 360)">⑤ 指 (points at) + 治 (controls)</text>

  <line x1="700" y1="320" x2="562" y2="486" stroke="#d29922" stroke-width="1.3" stroke-dasharray="3 3"/>
  <polygon points="562,479 558,489 568,487" fill="#d29922"/>
  <text x="648" y="410" fill="#d29922" font-size="8" transform="rotate(-50 648 410)">⑥ regenerates ▸</text>

  <!-- footnote -->
  <text x="450" y="650" text-anchor="middle" fill="#6e7681" font-size="8.5" font-style="italic">Six sections are invariant for every DDD; only the 0..N governed-asset set varies. A 0-asset pure-knowledge brain (⑤ empty, ⑥ no-op) is structurally complete — value is intrinsic.</text>
</svg>
