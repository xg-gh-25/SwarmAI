<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" font-family="sans-serif">
  <!-- Background -->
  <rect width="780" height="620" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="390" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">How AI Navigates DDD at Runtime</text>

  <!-- Phase 1: Session Start -->
  <rect x="30" y="50" width="720" height="160" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="50" y="72" fill="#58a6ff" font-size="13" font-weight="bold">SESSION START (always loaded, ~7K tokens)</text>

  <!-- Entity Index box -->
  <rect x="50" y="85" width="200" height="55" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="150" y="107" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">Entity Index</text>
  <text x="150" y="125" fill="#e6edf3" font-size="10" text-anchor="middle">~2K tokens | routing table</text>

  <!-- 4 Doc Headers box -->
  <rect x="270" y="85" width="220" height="55" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="380" y="107" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">4 Doc Section Headers</text>
  <text x="380" y="125" fill="#e6edf3" font-size="10" text-anchor="middle">~500 tokens | visible TOC</text>

  <!-- Mature sections box -->
  <rect x="510" y="85" width="220" height="55" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="620" y="107" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">[Mature] + [Evergreen] Sections</text>
  <text x="620" y="125" fill="#e6edf3" font-size="10" text-anchor="middle">~3-5K tokens | full trust content</text>

  <!-- What AI sees -->
  <rect x="50" y="150" width="700" height="45" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="60" y="170" fill="#d2a8ff" font-size="10" font-weight="bold">AI SEES:</text>
  <text x="60" y="185" fill="#e6edf3" font-size="10">"Session Architecture [Mature]" = full content loaded  |  "Voice Input [Sparse]" = heading only, content available on request</text>

  <!-- Phase 2: On-Demand -->
  <rect x="30" y="225" width="720" height="170" rx="8" fill="none" stroke="#f78166" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="50" y="247" fill="#f78166" font-size="13" font-weight="bold">MID-CONVERSATION (on-demand pulls, ~500 tokens each)</text>

  <!-- Trigger 1 -->
  <rect x="50" y="260" width="330" height="50" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="65" y="280" fill="#e6edf3" font-size="10" font-weight="bold">Trigger: AI needs a [Sparse/Growing] section</text>
  <text x="65" y="296" fill="#e6edf3" font-size="10">Sees heading in TOC → pulls section content → uses it</text>

  <!-- Trigger 2 -->
  <rect x="400" y="260" width="330" height="50" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="415" y="280" fill="#e6edf3" font-size="10" font-weight="bold">Trigger: Entity Index keyword match</text>
  <text x="415" y="296" fill="#e6edf3" font-size="10">Cross-project entity detected → pull target section</text>

  <!-- Trigger 3 -->
  <rect x="50" y="320" width="330" height="50" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="65" y="340" fill="#e6edf3" font-size="10" font-weight="bold">Trigger: Decision depends on unknown</text>
  <text x="65" y="356" fill="#e6edf3" font-size="10">Agent directive: "pull before deciding"</text>

  <!-- Budget guard -->
  <rect x="400" y="320" width="330" height="50" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="415" y="340" fill="#d2a8ff" font-size="10" font-weight="bold">Budget Guard</text>
  <text x="415" y="356" fill="#e6edf3" font-size="10">Max 3 pulls/turn × 500 tokens = 1.5K cap</text>

  <!-- Phase 3: Maturity Scale -->
  <rect x="30" y="410" width="720" height="190" rx="8" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="50" y="432" fill="#d2a8ff" font-size="13" font-weight="bold">LOADING STRATEGY SCALES WITH MATURITY</text>

  <!-- Early stage -->
  <rect x="50" y="445" width="220" height="70" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="160" y="465" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">Early (&lt;5K total)</text>
  <text x="160" y="483" fill="#e6edf3" font-size="10" text-anchor="middle">Load ALL 4 docs fully</text>
  <text x="160" y="498" fill="#e6edf3" font-size="10" text-anchor="middle">No optimization needed</text>

  <!-- Growing stage -->
  <rect x="280" y="445" width="220" height="70" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="390" y="465" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Growing (5-15K)</text>
  <text x="390" y="483" fill="#e6edf3" font-size="10" text-anchor="middle">Headers + [Mature] full</text>
  <text x="390" y="498" fill="#e6edf3" font-size="10" text-anchor="middle">[Sparse/Growing] on-demand</text>

  <!-- Mature stage -->
  <rect x="510" y="445" width="220" height="70" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="620" y="465" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="middle">Mature (15K+)</text>
  <text x="620" y="483" fill="#e6edf3" font-size="10" text-anchor="middle">TOC + [Evergreen] only</text>
  <text x="620" y="498" fill="#e6edf3" font-size="10" text-anchor="middle">Everything else on-demand</text>

  <!-- Arrow progression -->
  <line x1="270" y1="480" x2="278" y2="480" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="480" x2="508" y2="480" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Key insight -->
  <rect x="50" y="530" width="700" height="55" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="60" y="550" fill="#7ee787" font-size="11" font-weight="bold">KEY INSIGHT</text>
  <text x="60" y="568" fill="#e6edf3" font-size="10">AI always sees WHAT exists (headers + Entity Index). It loads HOW MUCH based on maturity.</text>
  <text x="60" y="583" fill="#e6edf3" font-size="10">High-trust content (Mature/Evergreen) = preloaded. Low-trust content (Sparse) = pulled on demand + flagged as uncertain.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e6edf3"/>
    </marker>
  </defs>
</svg>
