<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="sans-serif">
  <rect width="700" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Positioning: Complexity vs Delivered Value</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="650" y2="380" stroke="#e6edf3" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="80" y2="60" stroke="#e6edf3" stroke-width="1.5"/>

  <!-- X axis label -->
  <text x="365" y="415" text-anchor="middle" fill="#e6edf3" font-size="11">Implementation Complexity</text>
  <text x="130" y="400" fill="#e6edf3" font-size="9">Low</text>
  <text x="600" y="400" fill="#e6edf3" font-size="9">High</text>

  <!-- Y axis label -->
  <text x="35" y="220" text-anchor="middle" fill="#e6edf3" font-size="11" transform="rotate(-90, 35, 220)">Delivered Value to AI Agent</text>
  <text x="65" y="370" fill="#e6edf3" font-size="9">Low</text>
  <text x="65" y="80" fill="#e6edf3" font-size="9">High</text>

  <!-- Grid lines (subtle) -->
  <line x1="80" y1="220" x2="650" y2="220" stroke="#e6edf3" stroke-width="0.3" stroke-dasharray="4"/>
  <line x1="365" y1="60" x2="365" y2="380" stroke="#e6edf3" stroke-width="0.3" stroke-dasharray="4"/>

  <!-- Quadrant labels -->
  <text x="220" y="135" text-anchor="middle" fill="#7ee787" font-size="9" opacity="0.6">Sweet Spot: High value, manageable complexity</text>
  <text x="520" y="330" text-anchor="middle" fill="#f78166" font-size="9" opacity="0.6">Over-engineered: High cost, diminishing returns</text>

  <!-- CLAUDE.md - low complexity, low-medium value -->
  <circle cx="160" cy="290" r="22" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="160" y="294" text-anchor="middle" fill="#f78166" font-size="9">CLAUDE</text>
  <text x="160" y="304" text-anchor="middle" fill="#f78166" font-size="9">.md</text>
  <text x="160" y="330" text-anchor="middle" fill="#e6edf3" font-size="8">Simple, no lifecycle</text>
  <text x="160" y="342" text-anchor="middle" fill="#e6edf3" font-size="8">No cross-project</text>

  <!-- RAG - medium-high complexity, medium value -->
  <circle cx="430" cy="220" r="22" fill="none" stroke="#d2a8ff" stroke-width="2"/>
  <text x="430" y="224" text-anchor="middle" fill="#d2a8ff" font-size="9">RAG</text>
  <text x="430" y="250" text-anchor="middle" fill="#e6edf3" font-size="8">Retrieval-heavy</text>
  <text x="430" y="262" text-anchor="middle" fill="#e6edf3" font-size="8">No judgment structure</text>

  <!-- Knowledge Graph - very high complexity, medium-high value -->
  <circle cx="570" cy="160" r="22" fill="none" stroke="#d2a8ff" stroke-width="2"/>
  <text x="570" y="158" text-anchor="middle" fill="#d2a8ff" font-size="8">Knowledge</text>
  <text x="570" y="170" text-anchor="middle" fill="#d2a8ff" font-size="8">Graph</text>
  <text x="570" y="195" text-anchor="middle" fill="#e6edf3" font-size="8">Overkill at project scale</text>
  <text x="570" y="207" text-anchor="middle" fill="#e6edf3" font-size="8">Agent cannot read a graph</text>

  <!-- Evans DDD - high complexity, low value for AI -->
  <circle cx="520" cy="310" r="22" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="520" y="308" text-anchor="middle" fill="#f78166" font-size="8">Evans</text>
  <text x="520" y="320" text-anchor="middle" fill="#f78166" font-size="8">DDD</text>
  <text x="520" y="345" text-anchor="middle" fill="#e6edf3" font-size="8">For human architects</text>
  <text x="520" y="357" text-anchor="middle" fill="#e6edf3" font-size="8">Heavy ceremony</text>

  <!-- DDD Cultivation Engine - medium complexity, highest value -->
  <circle cx="280" cy="110" r="28" fill="none" stroke="#7ee787" stroke-width="3"/>
  <text x="280" y="106" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">DDD</text>
  <text x="280" y="120" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">Engine</text>

  <!-- Annotation for our system -->
  <rect x="140" y="50" width="220" height="36" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="250" y="65" text-anchor="middle" fill="#7ee787" font-size="9">Structured + Self-maintaining</text>
  <text x="250" y="79" text-anchor="middle" fill="#7ee787" font-size="9">Cross-project + Graduated trust</text>
  <line x1="265" y1="86" x2="275" y2="100" stroke="#7ee787" stroke-width="1"/>

  <!-- Value arrow annotation -->
  <path d="M 160 268 Q 200 190, 258 125" fill="none" stroke="#e6edf3" stroke-width="0.8" stroke-dasharray="3"/>
  <text x="180" y="200" fill="#e6edf3" font-size="8" transform="rotate(-55, 180, 200)">Evolution path</text>
</svg>