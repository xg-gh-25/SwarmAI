<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox mockup v2 · SwarmAI</title>
<!--
  Inbox overlay mockup v2 (design: docs/design/2026-11-20-inbox.md §7).
  v1 was a text wall: four lanes stacked, every row two equal-weight lines.
  v2 follows the shape inbox products converge on: one lane at a time, list + detail, the
  detail as a conversation (their message left, your draft right), one focal point per screen.
  Tokens copied from desktop/src/index.css; type scale 11/12/13/14/16/20, weights 400/600.
  All people, repos and messages are fictional.
-->
<style>
:root {
  --color-bg: #f8fafc; --color-card: #ffffff; --color-hover: #f1f5f9; --color-border: #dce1e8;
  --color-text: #1e293b; --color-text-secondary: #475569; --color-text-muted: #64748b; --color-text-dim: #94a3b8;
  --color-status-success: #16a34a; --color-status-error: #dc2626; --color-status-warning: #d97706;
  --color-zone-cognitive: #1f9d6b; --color-zone-work: #2f7596; --color-zone-system: #5f6577;
  --color-primary: #2b6cee; --color-primary-hover: #1d5cd6; --color-on-accent: #fff;
  --color-bg-chrome: #eef1f5; --color-scrim: rgba(0,0,0,.15); --shadow-overlay: -8px 24px 80px rgba(0,0,0,.18);
  --shadow-sel: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.06);
  /* proposed new tokens: one colour per channel, so the source reads at a glance */
  --color-channel-slack: #7c3aed; --color-channel-mail: #0e7490; --color-channel-github: #334155; --color-channel-feed: #c2410c;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --t-meta: 11px/16px; --t-small: 12px/18px; --t-body: 13px/20px; --t-heading: 14px/20px; --t-title: 16px/24px; --t-display: 20px/28px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --color-bg: #111318; --color-card: #1a1f2b; --color-hover: #252d3a; --color-border: #272d38;
  --color-text: #e6edf3; --color-text-secondary: #b0bac5; --color-text-muted: #7d8590; --color-text-dim: #545d68;
  --color-status-success: #22c55e; --color-status-error: #ef4444; --color-status-warning: #f59e0b;
  --color-zone-cognitive: #5fc99a; --color-zone-work: #4a8fb0; --color-zone-system: #7c8194;
  --color-primary: #4c8dff; --color-primary-hover: #3d7ef0; --color-bg-chrome: #161a21;
  --shadow-overlay: -8px 24px 80px rgba(0,0,0,.6); --shadow-sel: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --color-channel-slack: #a78bfa; --color-channel-mail: #22d3ee; --color-channel-github: #cbd5e1; --color-channel-feed: #fb923c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: var(--t-body) var(--font-sans); color: var(--color-text); background: var(--color-bg-chrome); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* mockup controls */
.mock-bar { display: flex; gap: 12px; align-items: center; height: 37px; padding: 0 16px; font: var(--t-small) var(--font-sans);
  color: var(--color-text-muted); border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
.mock-bar b { color: var(--color-text); font-weight: 600; } .mock-bar .sp { flex: 1; }

/* app frame */
.app { display: grid; grid-template-columns: 200px 1fr; height: calc(100% - 37px); }
.nav { padding: 16px 10px; display: flex; flex-direction: column; gap: 20px; }
.zone-label { font: var(--t-meta) var(--font-sans); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--color-text-dim); padding: 0 10px 6px; }
.nav-card { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; text-align: left; color: var(--color-text-muted); cursor: pointer; }
.nav-card:hover { background: var(--color-hover); }
.nav-card[aria-current="true"] { background: var(--color-card); color: var(--color-text); font-weight: 600; box-shadow: var(--shadow-sel); }
.nav-card .badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; text-align: center;
  font: var(--t-meta) var(--font-sans); font-weight: 600; line-height: 18px; color: var(--color-on-accent); background: var(--color-primary); }
.chat-area { position: relative; background: var(--color-bg); border-left: 1px solid var(--color-border); }
.scrim { position: absolute; inset: 0; background: var(--color-scrim); }

/* overlay */
.overlay { position: absolute; top: 12px; bottom: 12px; left: 12px; width: clamp(760px, 70%, 1200px); container-type: inline-size;
  display: flex; flex-direction: column; background: var(--color-card); border: 1px solid var(--color-border);
  border-radius: 18px; box-shadow: var(--shadow-overlay); overflow: hidden; }
.overlay.narrow { width: 600px; }
.ov-head { display: flex; align-items: center; gap: 20px; height: 56px; padding: 0 12px 0 24px; flex: none; border-bottom: 1px solid var(--color-border); }
.ov-head h1 { margin: 0; font: var(--t-title) var(--font-sans); font-weight: 600; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 10px; border: 0; background: transparent;
  color: var(--color-text-muted); cursor: pointer; }
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { color: var(--color-text); font-weight: 600; }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--color-primary); }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font: var(--t-meta) var(--font-sans); font-weight: 600; line-height: 18px; text-align: center;
  background: color-mix(in srgb, var(--color-text) 8%, transparent); color: var(--color-text-muted); }
.count.hot { background: var(--color-primary); color: var(--color-on-accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-status-error); }
.head-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.updated { font: var(--t-small) var(--font-sans); color: var(--color-text-dim); margin-right: 6px; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--color-text-muted); cursor: pointer; }
.icon-btn:hover { background: var(--color-hover); color: var(--color-text); }
.ov-body { flex: 1; min-height: 0; display: flex; }

/* avatar + channel badge */
.av { position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font: var(--t-small) var(--font-sans); font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--color-card)); }
.av.sm { width: 28px; height: 28px; font: var(--t-meta) var(--font-sans); font-weight: 600; }
.av svg.i { width: 18px; height: 18px; }
.av.sm svg.i { width: 15px; height: 15px; }
.av .ch { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
  background: var(--color-card); color: var(--color-text-muted); box-shadow: 0 0 0 1.5px var(--color-card); }
.av .ch svg.i { width: 11px; height: 11px; stroke-width: 2.4; }

.chan { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 20px; padding: 0 7px 0 6px; border-radius: 6px;
  font: var(--t-meta) var(--font-sans); font-weight: 600; color: var(--cc); background: color-mix(in srgb, var(--cc) 13%, transparent); }
.chan svg.i { width: 12px; height: 12px; stroke-width: 2.4; }
.chan.lg { height: 24px; padding: 0 9px 0 7px; font: var(--t-small) var(--font-sans); font-weight: 600; }
.chan.lg svg.i { width: 14px; height: 14px; }

/* ---------- reply lane: list + detail ---------- */
.list-pane { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--color-bg); border-right: 1px solid var(--color-border); }
.banner { display: flex; align-items: center; gap: 8px; margin: 12px 12px 0; padding: 8px 10px; border-radius: 8px;
  font: var(--t-small) var(--font-sans); color: var(--color-status-warning); background: color-mix(in srgb, var(--color-status-warning) 10%, transparent); }
.banner .link { margin-left: auto; }
.items { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.group { padding: 18px 10px 6px; font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
.item { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
.item:hover { background: var(--color-hover); }
.item[aria-selected="true"] { background: var(--color-card); box-shadow: var(--shadow-sel); }
.item .txt { min-width: 0; flex: 1; }
.item .top { display: flex; align-items: center; gap: 8px; }
.item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .time { margin-left: auto; flex: none; font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
.item .time.late { color: var(--color-status-warning); }
.item .why { margin-top: 2px; font: var(--t-small) var(--font-sans); color: var(--color-text-muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item[aria-selected="true"] .why { color: var(--color-text-secondary); }
.keys { padding: 10px 18px 14px; font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
kbd { font: var(--t-meta) var(--font-sans); padding: 0 4px; border-radius: 4px; border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text-muted); }

.detail { flex: 1; min-width: 0; overflow-y: auto; }
.detail-in { max-width: 680px; margin: 0 auto; padding: 28px 36px 48px; display: flex; flex-direction: column; }
.d-meta { display: flex; align-items: center; gap: 10px; color: var(--color-text-muted); font: var(--t-small) var(--font-sans); }
.d-meta .who { color: var(--color-text); font: var(--t-body) var(--font-sans); font-weight: 600; }
.d-meta .tools { margin-left: auto; display: flex; gap: 2px; }
.back { display: none; }
.ask { margin: 18px 0 0; font: var(--t-display) var(--font-sans); font-weight: 600; letter-spacing: -.01em; }
.ask-sub { margin: 6px 0 0; font: var(--t-small) var(--font-sans); color: var(--color-text-dim); }

.thread { margin-top: 28px; display: flex; flex-direction: column; gap: 20px; }
.bubble-them { align-self: flex-start; max-width: 88%; padding: 12px 16px; border-radius: 4px 16px 16px 16px;
  background: color-mix(in srgb, var(--color-text) 5%, transparent); color: var(--color-text); white-space: pre-line; }
.bubble-them .src { display: block; margin-bottom: 4px; font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
.mine { align-self: flex-end; width: 92%; }
.to { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-bottom: 6px; font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
.to b { font-weight: 600; color: var(--color-text-muted); }
.alert { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; padding: 10px 12px; border-radius: 10px;
  font: var(--t-small) var(--font-sans); color: var(--color-status-error); background: color-mix(in srgb, var(--color-status-error) 9%, transparent); }
.alert svg.i { margin-top: 1px; }
.bubble-me { border-radius: 16px 4px 16px 16px; background: color-mix(in srgb, var(--color-primary) 8%, var(--color-card));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-primary) 28%, transparent); padding: 12px 16px 10px; }
.bubble-me:focus-within { box-shadow: inset 0 0 0 1.5px var(--color-primary); }
.bubble-me textarea { display: block; width: 100%; field-sizing: content; min-block-size: 3lh; max-block-size: 14lh; padding: 0; border: 0; outline: 0; resize: none;
  background: transparent; color: var(--color-text); font: var(--t-body) var(--font-sans); }
.compose { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.compose .note { font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
.compose .sp { flex: 1; }
.txt-btn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent;
  color: var(--color-text-muted); font: var(--t-small) var(--font-sans); cursor: pointer; }
.txt-btn:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); color: var(--color-text); }
.send { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 16px; border: 0; border-radius: 9px;
  background: var(--color-primary); color: var(--color-on-accent); font: var(--t-body) var(--font-sans); font-weight: 600; cursor: pointer; }
.send:hover:not(:disabled) { background: var(--color-primary-hover); }
.send:disabled { opacity: .65; cursor: default; }
.send kbd { border-color: transparent; background: color-mix(in srgb, #fff 22%, transparent); color: var(--color-on-accent); }
.err-line { margin-top: 8px; font: var(--t-small) var(--font-sans); color: var(--color-status-error); text-align: right; }

.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--color-text-muted); }
.empty .big { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center;
  color: var(--color-status-success); background: color-mix(in srgb, var(--color-status-success) 12%, transparent); }
.empty .big svg.i { width: 24px; height: 24px; }
.empty h2 { margin: 0; font: var(--t-title) var(--font-sans); font-weight: 600; color: var(--color-text); }

/* ---------- single-column lanes ---------- */
.col { flex: 1; overflow-y: auto; }
.col-in { max-width: 680px; margin: 0 auto; padding: 28px 32px 56px; }
.lead { margin: 0; font: var(--t-display) var(--font-sans); font-weight: 600; }
.lead-sub { margin: 4px 0 0; font: var(--t-small) var(--font-sans); color: var(--color-text-dim); }
.rows { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.r { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px; }
.r:hover { background: var(--color-hover); }
.r .txt { flex: 1; min-width: 0; }
.r .h { font-weight: 600; color: var(--color-text); }
.r .m { display: block; margin-top: 2px; font: var(--t-small) var(--font-sans); color: var(--color-text-dim); }
.r .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.r:hover .acts, .r:focus-within .acts { opacity: 1; }
.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 6px; border: 0; border-radius: 5px; vertical-align: 1px;
  font: var(--t-meta) var(--font-sans); background: color-mix(in srgb, var(--c, var(--color-text)) 10%, transparent); color: var(--c, var(--color-text-muted)); }
button.chip { cursor: pointer; }
.link { border: 0; background: none; padding: 0; color: var(--color-primary); cursor: pointer; font: var(--t-small) var(--font-sans); }
.link:hover { text-decoration: underline; }

/* trends */
.brief { margin-top: 24px; display: flex; flex-direction: column; gap: 6px; }
.b { display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 12px; align-items: baseline; padding: 14px 12px; border-radius: 12px; }
.b:hover { background: var(--color-hover); }
.b .n { font: var(--t-display) var(--font-sans); font-weight: 600; color: color-mix(in srgb, var(--color-primary) 55%, var(--color-text-dim)); text-align: right; }
.b .h { font: var(--t-heading) var(--font-sans); font-weight: 600; }
.b .why { grid-column: 2; font: var(--t-small) var(--font-sans); color: var(--color-text-muted); }
.b .acts { grid-row: 1 / span 2; grid-column: 3; align-self: center; display: flex; gap: 2px; opacity: 0; }
.b:hover .acts, .b:focus-within .acts { opacity: 1; }
.fold { margin-top: 28px; }
.fold summary { cursor: pointer; padding: 8px 12px; border-radius: 8px; font: var(--t-small) var(--font-sans); color: var(--color-text-muted); }
.fold summary:hover { background: var(--color-hover); }

/* sent */
.cards { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.card { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--c) 8%, transparent); }
.card .ic { color: var(--c); margin-top: 2px; }
.card .txt { flex: 1; min-width: 0; }
.card .h { font-weight: 600; }
.card .m { display: block; margin-top: 2px; font: var(--t-small) var(--font-sans); color: var(--color-text-muted); }
.card .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.btn { height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--color-card); color: var(--color-text);
  font: var(--t-small) var(--font-sans); font-weight: 600; cursor: pointer; box-shadow: 0 0 0 1px var(--color-border); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--color-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--color-primary); color: var(--color-on-accent); box-shadow: none; }
.sec-row { display: flex; align-items: center; margin-top: 36px; }
.sec-row h2 { margin: 0; font: var(--t-heading) var(--font-sans); font-weight: 600; }
.seg { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--color-text) 6%, transparent); }
.seg button { height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-muted); font: var(--t-small) var(--font-sans); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--color-card); color: var(--color-text); font-weight: 600; box-shadow: var(--shadow-sel); }
.day { margin: 18px 12px 2px; font: var(--t-meta) var(--font-sans); color: var(--color-text-dim); }
.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { font: var(--t-small) var(--font-sans); white-space: nowrap; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 9px 14px;
  border-radius: 10px; background: var(--color-text); color: var(--color-card); font: var(--t-small) var(--font-sans); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.toast[hidden] { display: none; }
.toast .link { color: color-mix(in srgb, var(--color-primary) 50%, var(--color-card)); }
.pulse { animation: pulse 1s ease-out; }
@keyframes pulse { from { background: color-mix(in srgb, var(--color-primary) 16%, transparent); } }

/* narrow overlay: one pane at a time */
@container (width < 720px) {
  .list-pane { width: 100%; border-right: 0; }
  .detail { display: none; }
  .ov-body.showing-detail .list-pane { display: none; }
  .ov-body.showing-detail .detail { display: block; }
  .back { display: grid; }
  .detail-in { padding: 20px 24px 40px; }
  .updated { display: none; }
}
</style>
</head>
<body>

<div class="mock-bar">
  <b>Inbox mockup v2</b><span>示意稿，数据是虚构的；左侧导航只画了一部分</span><span class="sp"></span>
  <button class="txt-btn" id="themeBtn" type="button">深色</button>
  <button class="txt-btn" id="widthBtn" type="button">窄窗口</button>
</div>

<div class="app">
  <nav class="nav" aria-label="左侧导航（示意）">
    <div><div class="zone-label">Cognition</div>
      <button class="nav-card" type="button">C&amp;M</button><button class="nav-card" type="button">Library</button><button class="nav-card" type="button">Brain Hub</button></div>
    <div><div class="zone-label">Work</div>
      <button class="nav-card" type="button" aria-current="true">Inbox<span class="badge" id="navBadge">4</span></button>
      <button class="nav-card" type="button">ToDo</button><button class="nav-card" type="button">Pipeline</button>
      <button class="nav-card" type="button">Pollinate</button><button class="nav-card" type="button">Workspace</button></div>
    <div><div class="zone-label">System</div>
      <button class="nav-card" type="button">Jobs &amp; Runs</button><button class="nav-card" type="button">Settings</button></div>
  </nav>

  <main class="chat-area">
    <div class="scrim"></div>
    <div class="overlay" id="overlay" role="dialog" aria-label="Inbox">
      <header class="ov-head">
        <h1>Inbox</h1>
        <div class="tabs" role="tablist" aria-label="Inbox" id="tabs"></div>
        <div class="head-right">
          <span class="updated" id="updated">10:35 更新</span>
          <button class="icon-btn" type="button" id="refreshBtn" aria-label="现在刷新" title="现在刷新"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>

  const rows = [
    ['Slack', 'slack-mcp · @xg · 关注 3 个频道 · 每 15 分钟', '正常', '--color-status-success'],
    ['邮件', 'aws-outlook-mcp · xg@example.com · 每 15 分钟', '授权过期：运行 mwinit -f 后重试', '--color-status-error', true],
    ['GitHub', 'gh · @xg-dev · 关注 12 个仓库 · 每 15 分钟', '正常', '--color-status-success'],
    ['信息流', '22 个 feed · 每 6 小时', '正常', '--color-status-success'],
  ];
  return `<div class="col"><div class="col-in">
    <p class="lead">渠道</p><p class="lead-sub"><button class="link" type="button" data-tab-go="reply">← 返回</button> · 坏掉的渠道也会出现在 Needs You</p>
    <ul class="rows">${rows.map(([n, m, st, c, bad]) => `<li class="r"><span class="av sm" style="--c:var(--color-channel-${CH[n]})">${I[CH[n]]}</span>
      <span class="txt"><span class="h">${n}</span><span class="m">${m}</span></span>
      <span class="state" style="color:var(${c})">${st}</span>
      ${bad ? '<button class="btn primary" type="button" data-toast="重试中…（示意）">重试</button>' : ''}</li>`).join('')}</ul>
    <p class="lead-sub" style="margin-top:24px">加一个渠道：Slack（Web API）· 邮件（IMAP/SMTP）· GitHub · 信息流</p>
  </div></div>`;
}

// ---------- render ----------
function render() {
  renderTabs();
  const b = $('#body');
  b.classList.toggle('showing-detail', showDetail);
  b.innerHTML = tab === 'reply' ? replyLane() : tab === 'aware' ? awareLane() : tab === 'trend' ? trendLane() : tab === 'sent' ? sentLane() : channelsLane();
  const ta = $('#draft');
  if (ta) ta.addEventListener('input', () => { drafts[sel] = ta.value; $('#errLine').hidden = true; });
}

let tt;
function toast(msg, undo) { $('#toastText').textContent = msg; $('#toastUndo').hidden = !undo; $('#toast').hidden = false; clearTimeout(tt); tt = setTimeout(() => { $('#toast').hidden = true; }, 3500); }
const SECRETISH = /(AKIA[0-9A-Z]{12,}|xox[abp]-[0-9A-Za-z-]{8,}|password\s*[:=]\s*\S+)/i;

function advance(fromId) {
  const i = queue().findIndex((x) => x.id === fromId);
  gone.add(fromId); lastGone = fromId;
  const rest = queue(); sel = (rest[i] || rest[i - 1] || {}).id; showDetail = false;
}
function send() {
  const it = queue().find((x) => x.id === sel); const text = $('#draft').value;
  if (SECRETISH.test(text)) { const e = $('#errLine'); e.textContent = '草稿里有一段像密钥（例如 password: …），没有发。改掉后再点发送。'; e.hidden = false; return; }
  const btn = document.querySelector('[data-act=send]'); btn.disabled = true; btn.textContent = '发送中…';
  setTimeout(() => {
    sent.splice(needsMe().length, 0, { id: 's' + Date.now(), state: 'sent', day: '今天', who: it.who, ch: it.ch, at: '刚刚', text: text.split('\n').find(Boolean) });
    advance(it.id); lastGone = null; render(); toast(`已发送给 ${it.who}，在"已发"里能看到`);
  }, 650);
}
function act(a) {
  if (a === 'back') { showDetail = false; render(); return; }
  const it = queue().find((x) => x.id === sel); if (!it) return;
  if (a === 'send') return send();
  if (a === 'redraft') { [it.draft, it.alt] = [it.alt, it.draft]; delete drafts[it.id]; render(); $('.bubble-me').classList.add('pulse'); return; }
  if (a === 'chat') return toast('已送进新的 chat tab（作为外部内容）');
  if (a === 'later' || a === 'dismiss') { advance(it.id); render(); toast(a === 'later' ? '移到稍后，明天 9:00 再出现' : '标为不用回', true); }
}

$('#tabs').addEventListener('click', (e) => { const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; showDetail = false; render(); } });
$('#tabs').addEventListener('keydown', (e) => {
  const ks = ['reply', 'aware', 'trend', 'sent']; const i = Math.max(0, ks.indexOf(tab));
  const n = e.key === 'ArrowRight' ? (i + 1) % 4 : e.key === 'ArrowLeft' ? (i + 3) % 4 : -1;
  if (n < 0) return; e.preventDefault(); tab = ks[n]; render(); document.querySelector(`[data-tab=${ks[n]}]`).focus();
});
$('#body').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.sel) { sel = d.sel; showDetail = true; render(); return; }
  if (d.act) return act(d.act);
  if (d.toast) return toast(d.toast);
  if (d.go) { tab = d.go; render(); return; }
  if (d.tabGo) { tab = d.tabGo; render(); return; }
  if (d.filter) { outFilter = d.filter; render(); return; }
  if (d.notSent) { const s = sent.find((x) => x.id === d.notSent); s.state = 'failed'; s.blocked = false; render(); return; }
  if (d.resend) { const s = sent.find((x) => x.id === d.resend); s.state = 'sent'; s.day = '今天'; s.at = '刚刚'; render(); toast('已发出'); return; }
  if (d.goto) { gone.delete(d.goto); tab = 'reply'; sel = d.goto; showDetail = true; render(); document.querySelector('.detail-in')?.classList.add('pulse'); }
});
document.addEventListener('keydown', (e) => {
  if (tab !== 'reply') return;
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); return act('send'); }
  if (e.target.tagName === 'TEXTAREA') return;
  const q = queue(), i = q.findIndex((x) => x.id === sel);
  if (e.key === 'j' && i < q.length - 1) { sel = q[i + 1].id; render(); }
  else if (e.key === 'k' && i > 0) { sel = q[i - 1].id; render(); }
  else if (e.key === 'e') act('dismiss');
  else if (e.key === 'h') act('later');
});
$('#toastUndo').addEventListener('click', () => { if (lastGone) { gone.delete(lastGone); sel = lastGone; lastGone = null; render(); } $('#toast').hidden = true; });
$('#gearBtn').addEventListener('click', () => { tab = tab === 'channels' ? 'reply' : 'channels'; render(); });
$('#refreshBtn').addEventListener('click', () => { $('#updated').textContent = '刷新中…'; setTimeout(() => { $('#updated').textContent = '刚刚更新'; }, 800); });
$('#themeBtn').addEventListener('click', (e) => { const r = document.documentElement; const dark = r.dataset.theme !== 'dark'; r.dataset.theme = dark ? 'dark' : ''; e.target.textContent = dark ? '浅色' : '深色'; });
$('#widthBtn').addEventListener('click', (e) => { const o = $('#overlay'); o.classList.toggle('narrow'); e.target.textContent = o.classList.contains('narrow') ? '标准宽度' : '窄窗口'; });
render();
</script>
</body>
