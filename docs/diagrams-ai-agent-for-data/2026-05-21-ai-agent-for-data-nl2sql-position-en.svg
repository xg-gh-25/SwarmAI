<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Where NL2SQL Fits: Not the Enemy, a Controlled Tool</text>

  <!-- Three levels -->
  <!-- Level 1 -->
  <rect x="50" y="55" width="700" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="78" font-size="12" font-weight="700" fill="#16a34a">Level 1: Certified Patterns (100% Accurate)</text>
  <text x="75" y="98" font-size="10" fill="#555">Pre-written SQL templates. Agent selects pattern + fills parameters.</text>
  <text x="75" y="113" font-size="10" fill="#888">Use for: Leadership reports, scheduled pushes, compliance data</text>
  <rect x="580" y="65" width="150" height="24" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="0.5"/>
  <text x="655" y="82" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">NL2SQL not needed</text>

  <!-- Level 2 -->
  <rect x="50" y="140" width="700" height="70" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="163" font-size="12" font-weight="700" fill="#ca8a04">Level 2: Constrained Generation (~95% Accurate)</text>
  <text x="75" y="183" font-size="10" fill="#555">NL2SQL + Semantic Catalog constraints (table/column whitelist + mandatory filters + JOIN rules)</text>
  <text x="75" y="198" font-size="10" fill="#888">Use for: Ad-hoc analysis, self-service exploration, follow-up questions</text>
  <rect x="580" y="150" width="150" height="24" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="0.5"/>
  <text x="655" y="167" text-anchor="middle" font-size="9" font-weight="600" fill="#ca8a04">NL2SQL lives HERE ←</text>

  <!-- Level 3 -->
  <rect x="50" y="225" width="700" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="248" font-size="12" font-weight="700" fill="#dc2626">Level 3: Unconstrained NL2SQL (60-70% Accurate)</text>
  <text x="75" y="268" font-size="10" fill="#555">Agent generates SQL freely, no validation — most AI+Data demos stop here</text>
  <text x="75" y="283" font-size="10" fill="#888">Blocked in production — this is where trust collapses</text>
  <rect x="580" y="235" width="150" height="24" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="0.5"/>
  <text x="655" y="252" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">❌ Blocked</text>

  <!-- Key insight box -->
  <rect x="50" y="310" width="700" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#334155">The difference: Raw NL2SQL = 60-70%  vs  NL2SQL + Catalog constraints = ~95%</text>
  <text x="400" y="345" text-anchor="middle" font-size="10" font-weight="600" fill="#6366f1">Semantic Catalog is what makes NL2SQL go from "unreliable" to "basically reliable"</text>
</svg>
