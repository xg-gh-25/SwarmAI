<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c471ed"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Layer 3 Evolution Loop</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#666">The Semantic Catalog gets smarter with use — not static documentation, but a living system</text>

  <!-- Central cycle -->
  <!-- Phase 1: Observe -->
  <rect x="340" y="80" width="220" height="70" rx="12" fill="#fdf2ff" stroke="#c471ed" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="100" font-size="10" font-weight="700" fill="#c471ed">PHASE 1: OBSERVE</text>
  <text x="365" y="118" font-size="9" fill="#555">Every Level 2 query auto-recorded:</text>
  <text x="365" y="132" font-size="9" fill="#555">intent, SQL, tables, success, user satisfaction</text>
  <text x="545" y="140" font-size="14">👁️</text>

  <!-- Phase 2: Discover -->
  <rect x="600" y="200" width="220" height="70" rx="12" fill="#fdf2ff" stroke="#c471ed" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="220" font-size="10" font-weight="700" fill="#c471ed">PHASE 2: DISCOVER</text>
  <text x="625" y="238" font-size="9" fill="#555">Similar SQL patterns clustered</text>
  <text x="625" y="252" font-size="9" fill="#555">Candidate certified patterns surfaced</text>
  <text x="805" y="260" font-size="14">🔍</text>

  <!-- Phase 3: Crystallize -->
  <rect x="340" y="330" width="220" height="70" rx="12" fill="#fdf2ff" stroke="#c471ed" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="350" font-size="10" font-weight="700" fill="#c471ed">PHASE 3: CRYSTALLIZE</text>
  <text x="365" y="368" font-size="9" fill="#555">Domain expert reviews + approves</text>
  <text x="365" y="382" font-size="9" fill="#555">Pattern parameterized → published as certified</text>
  <text x="545" y="390" font-size="14">💎</text>

  <!-- Phase 4: Accelerate -->
  <rect x="80" y="200" width="220" height="70" rx="12" fill="#fdf2ff" stroke="#c471ed" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="220" font-size="10" font-weight="700" fill="#c471ed">PHASE 4: ACCELERATE</text>
  <text x="105" y="238" font-size="9" fill="#555">Next same question → Level 1 hit</text>
  <text x="105" y="252" font-size="9" fill="#555">Faster, exact, deterministic</text>
  <text x="285" y="260" font-size="14">⚡</text>

  <!-- Circular arrows connecting phases -->
  <!-- 1→2 -->
  <path d="M 560 115 C 620 115, 650 180, 620 200" fill="none" stroke="#c471ed" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <!-- 2→3 -->
  <path d="M 680 270 C 680 310, 600 330, 560 345" fill="none" stroke="#c471ed" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <!-- 3→4 -->
  <path d="M 340 365 C 280 365, 260 300, 280 270" fill="none" stroke="#c471ed" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <!-- 4→1 -->
  <path d="M 210 200 C 210 150, 300 100, 340 100" fill="none" stroke="#c471ed" stroke-width="2" marker-end="url(#arrowLoop)"/>

  <!-- Center label -->
  <text x="450" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#c471ed">Self-Reinforcing</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#c471ed">Loop</text>

  <!-- Timeline bar at bottom -->
  <rect x="80" y="430" width="740" height="100" rx="8" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="453" font-size="11" font-weight="600" fill="#333">Coverage Over Time (Illustrative)</text>

  <!-- Timeline scale -->
  <line x1="120" y1="475" x2="780" y2="475" stroke="#ddd" stroke-width="1"/>
  <text x="120" y="490" font-size="9" fill="#999">Day 1</text>
  <text x="340" y="490" font-size="9" fill="#999">Month 1</text>
  <text x="560" y="490" font-size="9" fill="#999">Month 3</text>
  <text x="780" y="490" text-anchor="end" font-size="9" fill="#999">Month 6+</text>

  <!-- Progress bars -->
  <!-- Level 1 coverage -->
  <rect x="120" y="500" width="100" height="8" rx="4" fill="#c471ed" fill-opacity="0.7"/>
  <rect x="120" y="500" width="330" height="8" rx="4" fill="#c471ed" fill-opacity="0.5"/>
  <rect x="120" y="500" width="550" height="8" rx="4" fill="#c471ed" fill-opacity="0.3"/>
  <rect x="120" y="500" width="640" height="8" rx="4" fill="#c471ed" fill-opacity="0.15"/>

  <!-- Labels -->
  <text x="225" y="520" text-anchor="middle" font-size="9" fill="#c471ed" font-weight="600">70%</text>
  <text x="395" y="520" text-anchor="middle" font-size="9" fill="#c471ed" font-weight="600">85%</text>
  <text x="580" y="520" text-anchor="middle" font-size="9" fill="#c471ed" font-weight="600">93%</text>
  <text x="730" y="520" text-anchor="middle" font-size="9" fill="#c471ed" font-weight="600">95%+</text>

  <text x="450" y="540" text-anchor="middle" font-size="9" fill="#888">% of queries served by Level 1 (certified patterns) — rest handled by Level 2 with catalog constraints</text>
</svg>
