<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <rect width="800" height="500" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">Pipeline x Pollinate: Cross-Engine Knowledge Flow</text>
  <text x="400" y="55" fill="#d2a8ff" font-size="11" text-anchor="middle">DDD as the shared knowledge platform between code delivery and content delivery</text>

  <!-- Pipeline Engine (Left) -->
  <rect x="40" y="80" width="280" height="310" rx="8" fill="#1e2330" stroke="#58a6ff" stroke-width="2"/>
  <text x="180" y="110" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Pipeline Engine</text>
  <text x="180" y="128" fill="#e6edf3" font-size="9" text-anchor="middle">(Code Delivery)</text>

  <rect x="65" y="145" width="230" height="30" rx="6" fill="#2d333b" stroke="#58a6ff" stroke-width="1"/>
  <text x="180" y="165" fill="#e6edf3" font-size="9" text-anchor="middle">Evaluate - Think - Plan - Build</text>

  <rect x="65" y="185" width="230" height="30" rx="6" fill="#2d333b" stroke="#58a6ff" stroke-width="1"/>
  <text x="180" y="205" fill="#e6edf3" font-size="9" text-anchor="middle">Review - Test - Deliver - Reflect</text>

  <rect x="65" y="235" width="230" height="55" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="180" y="255" fill="#7ee787" font-size="10" font-weight="bold" text-anchor="middle">Outputs</text>
  <text x="180" y="272" fill="#e6edf3" font-size="9" text-anchor="middle">Features, bug fixes, architecture</text>
  <text x="180" y="285" fill="#e6edf3" font-size="9" text-anchor="middle">PR-ready code with tests</text>

  <rect x="65" y="305" width="230" height="55" rx="6" fill="#2d333b" stroke="#d2a8ff" stroke-width="1"/>
  <text x="180" y="325" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">REFLECT writes to DDD:</text>
  <text x="180" y="342" fill="#e6edf3" font-size="9" text-anchor="middle">New capabilities in TECH.md</text>
  <text x="180" y="355" fill="#e6edf3" font-size="9" text-anchor="middle">Architecture changes, perf gains</text>

  <!-- Pollinate Engine (Right) -->
  <rect x="480" y="80" width="280" height="310" rx="8" fill="#1e2330" stroke="#7ee787" stroke-width="2"/>
  <text x="620" y="110" fill="#7ee787" font-size="14" font-weight="bold" text-anchor="middle">Pollinate Engine</text>
  <text x="620" y="128" fill="#e6edf3" font-size="9" text-anchor="middle">(Content Delivery)</text>

  <rect x="505" y="145" width="230" height="30" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="620" y="165" fill="#e6edf3" font-size="9" text-anchor="middle">Evaluate - Think - Plan - Produce</text>

  <rect x="505" y="185" width="230" height="30" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="620" y="205" fill="#e6edf3" font-size="9" text-anchor="middle">Review - Refine - Deliver - Reflect</text>

  <rect x="505" y="235" width="230" height="55" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="620" y="255" fill="#7ee787" font-size="10" font-weight="bold" text-anchor="middle">Outputs</text>
  <text x="620" y="272" fill="#e6edf3" font-size="9" text-anchor="middle">Posters, videos, narratives, shorts</text>
  <text x="620" y="285" fill="#e6edf3" font-size="9" text-anchor="middle">Brand-correct multi-format content</text>

  <rect x="505" y="305" width="230" height="55" rx="6" fill="#2d333b" stroke="#d2a8ff" stroke-width="1"/>
  <text x="620" y="325" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">REFLECT writes to DDD:</text>
  <text x="620" y="342" fill="#e6edf3" font-size="9" text-anchor="middle">Messaging lessons to IMPROVEMENT.md</text>
  <text x="620" y="355" fill="#e6edf3" font-size="9" text-anchor="middle">Audience reactions, channel perf</text>

  <!-- DDD Knowledge Layer (Center) -->
  <rect x="280" y="120" width="240" height="240" rx="12" fill="#2d333b" stroke="#d2a8ff" stroke-width="2"/>
  <text x="400" y="148" fill="#d2a8ff" font-size="13" font-weight="bold" text-anchor="middle">DDD Knowledge Layer</text>
  <text x="400" y="165" fill="#e6edf3" font-size="9" text-anchor="middle">(Shared Platform)</text>

  <rect x="305" y="180" width="190" height="30" rx="6" fill="#1e2330" stroke="#58a6ff" stroke-width="1"/>
  <text x="400" y="200" fill="#58a6ff" font-size="10" text-anchor="middle">PRODUCT.md</text>

  <rect x="305" y="218" width="190" height="30" rx="6" fill="#1e2330" stroke="#7ee787" stroke-width="1"/>
  <text x="400" y="238" fill="#7ee787" font-size="10" text-anchor="middle">TECH.md</text>

  <rect x="305" y="256" width="190" height="30" rx="6" fill="#1e2330" stroke="#f78166" stroke-width="1"/>
  <text x="400" y="276" fill="#f78166" font-size="10" text-anchor="middle">IMPROVEMENT.md</text>

  <rect x="305" y="294" width="190" height="30" rx="6" fill="#1e2330" stroke="#d2a8ff" stroke-width="1"/>
  <text x="400" y="314" fill="#d2a8ff" font-size="10" text-anchor="middle">PROJECT.md</text>

  <!-- Bidirectional arrows Pipeline <-> DDD -->
  <path d="M 295 200 L 280 200" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowB6)"/>
  <path d="M 280 240 L 295 240" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowB6)"/>

  <!-- Bidirectional arrows DDD <-> Pollinate -->
  <path d="M 505 200 L 520 200" fill="none" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowG6)"/>
  <path d="M 520 240 L 505 240" fill="none" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowG6)"/>

  <!-- Cross-engine flow examples (bottom) -->
  <rect x="60" y="410" width="680" height="75" rx="8" fill="#1e2330" stroke="#f78166" stroke-width="1"/>
  <text x="400" y="435" fill="#f78166" font-size="12" font-weight="bold" text-anchor="middle">Cross-Engine Compound Effects</text>

  <text x="100" y="458" fill="#58a6ff" font-size="9">Pipeline ships voice input</text>
  <text x="250" y="458" fill="#e6edf3" font-size="9">TECH.md updates</text>
  <text x="390" y="458" fill="#7ee787" font-size="9">Pollinate produces announcement</text>

  <path d="M 218 455 L 240 455" fill="none" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP6)"/>
  <path d="M 340 455 L 375 455" fill="none" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP6)"/>

  <text x="100" y="478" fill="#7ee787" font-size="9">Pollinate discovers user pain</text>
  <text x="280" y="478" fill="#e6edf3" font-size="9">PRODUCT.md updated</text>
  <text x="430" y="478" fill="#58a6ff" font-size="9">Pipeline prioritizes fix</text>

  <path d="M 248 475 L 270 475" fill="none" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP6)"/>
  <path d="M 382 475 L 418 475" fill="none" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP6)"/>

  <defs>
    <marker id="arrowB6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7ee787"/>
    </marker>
    <marker id="arrowP6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#d2a8ff"/>
    </marker>
  </defs>
</svg>