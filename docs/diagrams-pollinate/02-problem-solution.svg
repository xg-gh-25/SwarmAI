<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <rect width="800" height="500" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">The Problem: AI Content Without Brand Memory</text>

  <!-- LEFT SIDE: Today -->
  <rect x="30" y="60" width="350" height="400" rx="8" fill="#1e2330" stroke="#f78166" stroke-width="1.5"/>
  <text x="205" y="90" fill="#f78166" font-size="14" font-weight="bold" text-anchor="middle">TODAY: Generic AI Content</text>

  <!-- User input -->
  <rect x="60" y="110" width="290" height="35" rx="6" fill="#2d333b" stroke="#e6edf3" stroke-width="1"/>
  <text x="205" y="132" fill="#e6edf3" font-size="10" text-anchor="middle">"Write about our new feature launch"</text>

  <!-- Arrow -->
  <line x1="205" y1="145" x2="205" y2="165" stroke="#f78166" stroke-width="1" marker-end="url(#arrowOrangeS)"/>

  <!-- Generic AI box -->
  <rect x="80" y="170" width="250" height="50" rx="6" fill="#2d333b" stroke="#f78166" stroke-width="1"/>
  <text x="205" y="192" fill="#f78166" font-size="11" font-weight="bold" text-anchor="middle">Generic LLM</text>
  <text x="205" y="208" fill="#e6edf3" font-size="9" text-anchor="middle">No brand context, no audience model</text>

  <!-- Arrow -->
  <line x1="205" y1="220" x2="205" y2="240" stroke="#f78166" stroke-width="1" marker-end="url(#arrowOrangeS)"/>

  <!-- Problems list -->
  <rect x="60" y="245" width="290" height="195" rx="6" fill="#2d333b" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="80" y="270" fill="#f78166" font-size="10" font-weight="bold">Output Problems:</text>

  <circle cx="80" cy="292" r="3" fill="#f78166"/>
  <text x="92" y="296" fill="#e6edf3" font-size="9">Technically polished but off-brand tone</text>

  <circle cx="80" cy="315" r="3" fill="#f78166"/>
  <text x="92" y="319" fill="#e6edf3" font-size="9">Self-congratulatory ("We are thrilled...")</text>

  <circle cx="80" cy="338" r="3" fill="#f78166"/>
  <text x="92" y="342" fill="#e6edf3" font-size="9">Claims features that do not exist</text>

  <circle cx="80" cy="361" r="3" fill="#f78166"/>
  <text x="92" y="365" fill="#e6edf3" font-size="9">Tone drifts between sessions</text>

  <circle cx="80" cy="384" r="3" fill="#f78166"/>
  <text x="92" y="388" fill="#e6edf3" font-size="9">Repeats same messaging angles</text>

  <circle cx="80" cy="407" r="3" fill="#f78166"/>
  <text x="92" y="411" fill="#e6edf3" font-size="9">Wrong format for wrong audience</text>

  <circle cx="80" cy="430" r="3" fill="#f78166"/>
  <text x="92" y="434" fill="#e6edf3" font-size="9">No memory of past failures</text>

  <!-- RIGHT SIDE: Pollinate -->
  <rect x="420" y="60" width="350" height="400" rx="8" fill="#1e2330" stroke="#7ee787" stroke-width="1.5"/>
  <text x="595" y="90" fill="#7ee787" font-size="14" font-weight="bold" text-anchor="middle">POLLINATE: Brand-Correct from Turn One</text>

  <!-- User input -->
  <rect x="450" y="110" width="290" height="35" rx="6" fill="#2d333b" stroke="#e6edf3" stroke-width="1"/>
  <text x="595" y="132" fill="#e6edf3" font-size="10" text-anchor="middle">"Write about our new feature launch"</text>

  <!-- Arrow -->
  <line x1="595" y1="145" x2="595" y2="165" stroke="#7ee787" stroke-width="1" marker-end="url(#arrowGreenS)"/>

  <!-- Pollinate box with DDD -->
  <rect x="470" y="170" width="250" height="50" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="595" y="192" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">Pollinate + DDD Knowledge</text>
  <text x="595" y="208" fill="#e6edf3" font-size="9" text-anchor="middle">Brand memory, audience model, history</text>

  <!-- Arrow -->
  <line x1="595" y1="220" x2="595" y2="240" stroke="#7ee787" stroke-width="1" marker-end="url(#arrowGreenS)"/>

  <!-- Solutions list -->
  <rect x="450" y="245" width="290" height="195" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="470" y="270" fill="#7ee787" font-size="10" font-weight="bold">Output Quality:</text>

  <circle cx="470" cy="292" r="3" fill="#7ee787"/>
  <text x="482" y="296" fill="#e6edf3" font-size="9">Brand voice from first word (PRODUCT.md)</text>

  <circle cx="470" cy="315" r="3" fill="#7ee787"/>
  <text x="482" y="319" fill="#e6edf3" font-size="9">Audience-appropriate framing (PROJECT.md)</text>

  <circle cx="470" cy="338" r="3" fill="#7ee787"/>
  <text x="482" y="342" fill="#e6edf3" font-size="9">Only real capabilities claimed (TECH.md)</text>

  <circle cx="470" cy="361" r="3" fill="#7ee787"/>
  <text x="482" y="365" fill="#e6edf3" font-size="9">Consistent tone across all sessions</text>

  <circle cx="470" cy="384" r="3" fill="#7ee787"/>
  <text x="482" y="388" fill="#e6edf3" font-size="9">Fresh angles, no messaging fatigue</text>

  <circle cx="470" cy="407" r="3" fill="#7ee787"/>
  <text x="482" y="411" fill="#e6edf3" font-size="9">Format matched to channel + audience</text>

  <circle cx="470" cy="430" r="3" fill="#7ee787"/>
  <text x="482" y="434" fill="#e6edf3" font-size="9">Learns from past failures (IMPROVEMENT.md)</text>

  <!-- VS divider -->
  <rect x="382" y="240" width="36" height="36" rx="18" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="264" fill="#d2a8ff" font-size="12" font-weight="bold" text-anchor="middle">vs</text>

  <!-- Bottom insight -->
  <text x="400" y="485" fill="#d2a8ff" font-size="11" text-anchor="middle" font-style="italic">Same LLM capability — the difference is persistent, structured brand knowledge</text>

  <defs>
    <marker id="arrowOrangeS" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#f78166"/>
    </marker>
    <marker id="arrowGreenS" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7ee787"/>
    </marker>
  </defs>
</svg>