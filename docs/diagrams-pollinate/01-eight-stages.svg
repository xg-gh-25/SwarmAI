<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="sans-serif">
  <rect width="800" height="620" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">Pollinate 8-Stage Pipeline</text>
  <text x="400" y="55" fill="#7ee787" font-size="11" text-anchor="middle">Message First, Format Follows</text>

  <!-- Input -->
  <rect x="320" y="70" width="160" height="36" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="93" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">ONE-SENTENCE MESSAGE</text>

  <!-- Arrow down -->
  <line x1="400" y1="106" x2="400" y2="125" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Stage boxes -->
  <!-- Stage 1: EVALUATE -->
  <rect x="140" y="130" width="130" height="50" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="205" y="152" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">1. EVALUATE</text>
  <text x="205" y="168" fill="#e6edf3" font-size="9" text-anchor="middle">Is this worth producing?</text>

  <!-- Stage 2: THINK -->
  <rect x="290" y="130" width="130" height="50" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="355" y="152" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">2. THINK</text>
  <text x="355" y="168" fill="#e6edf3" font-size="9" text-anchor="middle">What formats x audience?</text>

  <!-- Stage 3: PLAN -->
  <rect x="440" y="130" width="130" height="50" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="505" y="152" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">3. PLAN</text>
  <text x="505" y="168" fill="#e6edf3" font-size="9" text-anchor="middle">Storyboard per format</text>

  <!-- Stage 4: PRODUCE -->
  <rect x="590" y="130" width="130" height="50" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="655" y="152" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">4. PRODUCE</text>
  <text x="655" y="168" fill="#e6edf3" font-size="9" text-anchor="middle">Generate all formats</text>

  <!-- Connecting arrows top row -->
  <line x1="270" y1="155" x2="290" y2="155" stroke="#7ee787" stroke-width="1" marker-end="url(#arrowGreen)"/>
  <line x1="420" y1="155" x2="440" y2="155" stroke="#7ee787" stroke-width="1" marker-end="url(#arrowGreen)"/>
  <line x1="570" y1="155" x2="590" y2="155" stroke="#7ee787" stroke-width="1" marker-end="url(#arrowGreen)"/>

  <!-- Arrow down from PRODUCE -->
  <path d="M 655 180 L 655 210 L 655 225" fill="none" stroke="#7ee787" stroke-width="1" marker-end="url(#arrowGreen)"/>

  <!-- Stage 5: REVIEW -->
  <rect x="590" y="230" width="130" height="50" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="1.5"/>
  <text x="655" y="252" fill="#f78166" font-size="11" font-weight="bold" text-anchor="middle">5. REVIEW</text>
  <text x="655" y="268" fill="#e6edf3" font-size="9" text-anchor="middle">Brand conformance check</text>

  <!-- Stage 6: REFINE -->
  <rect x="440" y="230" width="130" height="50" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="1.5"/>
  <text x="505" y="252" fill="#f78166" font-size="11" font-weight="bold" text-anchor="middle">6. REFINE</text>
  <text x="505" y="268" fill="#e6edf3" font-size="9" text-anchor="middle">Quality convergence</text>

  <!-- Stage 7: DELIVER -->
  <rect x="290" y="230" width="130" height="50" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="355" y="252" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="middle">7. DELIVER</text>
  <text x="355" y="268" fill="#e6edf3" font-size="9" text-anchor="middle">Package + publish</text>

  <!-- Stage 8: REFLECT -->
  <rect x="140" y="230" width="130" height="50" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="205" y="252" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="middle">8. REFLECT</text>
  <text x="205" y="268" fill="#e6edf3" font-size="9" text-anchor="middle">Feed back to DDD</text>

  <!-- Connecting arrows bottom row (right to left) -->
  <line x1="590" y1="255" x2="570" y2="255" stroke="#f78166" stroke-width="1" marker-end="url(#arrowOrange)"/>
  <line x1="440" y1="255" x2="420" y2="255" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowPurple)"/>
  <line x1="290" y1="255" x2="270" y2="255" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <!-- Convergence loop (REFINE back to REVIEW) -->
  <path d="M 505 230 C 505 210, 580 210, 580 230" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="545" y="207" fill="#f78166" font-size="8" text-anchor="middle">iterate</text>

  <!-- DDD Knowledge Layer -->
  <rect x="80" y="320" width="640" height="120" rx="8" fill="#1e2330" stroke="#58a6ff" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="400" y="345" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">DDD Knowledge Layer</text>

  <!-- DDD Docs -->
  <rect x="110" y="360" width="130" height="60" rx="6" fill="#2d333b" stroke="#58a6ff" stroke-width="1"/>
  <text x="175" y="382" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">PRODUCT.md</text>
  <text x="175" y="396" fill="#e6edf3" font-size="8" text-anchor="middle">Brand, voice, tone</text>
  <text x="175" y="408" fill="#e6edf3" font-size="8" text-anchor="middle">Audience, non-goals</text>

  <rect x="260" y="360" width="130" height="60" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="325" y="382" fill="#7ee787" font-size="10" font-weight="bold" text-anchor="middle">TECH.md</text>
  <text x="325" y="396" fill="#e6edf3" font-size="8" text-anchor="middle">Real capabilities</text>
  <text x="325" y="408" fill="#e6edf3" font-size="8" text-anchor="middle">Differentiators</text>

  <rect x="410" y="360" width="140" height="60" rx="6" fill="#2d333b" stroke="#f78166" stroke-width="1"/>
  <text x="480" y="382" fill="#f78166" font-size="10" font-weight="bold" text-anchor="middle">IMPROVEMENT.md</text>
  <text x="480" y="396" fill="#e6edf3" font-size="8" text-anchor="middle">Past failures</text>
  <text x="480" y="408" fill="#e6edf3" font-size="8" text-anchor="middle">Messaging lessons</text>

  <rect x="570" y="360" width="130" height="60" rx="6" fill="#2d333b" stroke="#d2a8ff" stroke-width="1"/>
  <text x="635" y="382" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">PROJECT.md</text>
  <text x="635" y="396" fill="#e6edf3" font-size="8" text-anchor="middle">Current campaign</text>
  <text x="635" y="408" fill="#e6edf3" font-size="8" text-anchor="middle">Launch timeline</text>

  <!-- Read arrows from stages to DDD -->
  <path d="M 205 180 L 205 315" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowBlue)"/>
  <path d="M 355 180 L 355 315" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowBlue)"/>
  <path d="M 655 280 L 655 315 L 480 315" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowBlue)"/>

  <!-- Write arrow from REFLECT back to DDD -->
  <path d="M 205 280 L 205 310" fill="none" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="220" y="300" fill="#d2a8ff" font-size="8">write</text>

  <!-- Read/Write Labels -->
  <text x="190" y="205" fill="#58a6ff" font-size="8">reads</text>
  <text x="340" y="205" fill="#58a6ff" font-size="8">reads</text>
  <text x="660" y="300" fill="#58a6ff" font-size="8">reads</text>

  <!-- Output -->
  <rect x="80" y="470" width="640" height="100" rx="8" fill="#1e2330" stroke="#7ee787" stroke-width="1"/>
  <text x="400" y="495" fill="#7ee787" font-size="13" font-weight="bold" text-anchor="middle">Multi-Format Output</text>

  <rect x="110" y="510" width="90" height="40" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="155" y="535" fill="#e6edf3" font-size="9" text-anchor="middle">Poster</text>

  <rect x="215" y="510" width="90" height="40" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="260" y="535" fill="#e6edf3" font-size="9" text-anchor="middle">Video</text>

  <rect x="320" y="510" width="90" height="40" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="365" y="535" fill="#e6edf3" font-size="9" text-anchor="middle">Narrative</text>

  <rect x="425" y="510" width="90" height="40" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="470" y="535" fill="#e6edf3" font-size="9" text-anchor="middle">Shorts</text>

  <rect x="530" y="510" width="90" height="40" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="575" y="535" fill="#e6edf3" font-size="9" text-anchor="middle">README</text>

  <rect x="635" y="510" width="90" height="40" rx="6" fill="#2d333b" stroke="#7ee787" stroke-width="1"/>
  <text x="680" y="535" fill="#e6edf3" font-size="9" text-anchor="middle">Presentation</text>

  <!-- Legend -->
  <rect x="80" y="585" width="640" height="25" rx="4" fill="#1e2330"/>
  <circle cx="120" cy="598" r="5" fill="#7ee787"/>
  <text x="130" y="602" fill="#e6edf3" font-size="9">Production Stages</text>
  <circle cx="260" cy="598" r="5" fill="#f78166"/>
  <text x="270" y="602" fill="#e6edf3" font-size="9">Quality Stages</text>
  <circle cx="390" cy="598" r="5" fill="#d2a8ff"/>
  <text x="400" y="602" fill="#e6edf3" font-size="9">Delivery + Learning</text>
  <circle cx="540" cy="598" r="5" fill="#58a6ff"/>
  <text x="550" y="602" fill="#e6edf3" font-size="9">DDD Knowledge</text>

  <!-- Markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7ee787"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#f78166"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#d2a8ff"/>
    </marker>
  </defs>
</svg>