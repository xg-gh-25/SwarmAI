<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrow7p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d2a8ff"/>
    </marker>
    <marker id="arrow7g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7ee787"/>
    </marker>
  </defs>
  <rect width="780" height="440" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">DDD Integration: Bidirectional Flow</text>
  <text x="390" y="50" text-anchor="middle" fill="#e6edf3" font-size="10" opacity="0.7">Stages read DDD context; REFLECT writes back cultivation proposals</text>

  <!-- DDD Knowledge Block (center) -->
  <rect x="280" y="70" width="220" height="170" rx="8" fill="#1e2a3a" stroke="#d2a8ff" stroke-width="2.5"/>
  <text x="390" y="95" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold">DDD Knowledge</text>

  <rect x="300" y="108" width="180" height="26" rx="4" fill="none" stroke="#d2a8ff" stroke-width="1"/>
  <text x="390" y="125" text-anchor="middle" fill="#e6edf3" font-size="10">PRODUCT.md — what we build</text>

  <rect x="300" y="140" width="180" height="26" rx="4" fill="none" stroke="#d2a8ff" stroke-width="1"/>
  <text x="390" y="157" text-anchor="middle" fill="#e6edf3" font-size="10">TECH.md — how we build</text>

  <rect x="300" y="172" width="180" height="26" rx="4" fill="none" stroke="#d2a8ff" stroke-width="1"/>
  <text x="390" y="189" text-anchor="middle" fill="#e6edf3" font-size="10">IMPROVEMENT.md — what to avoid</text>

  <rect x="300" y="204" width="180" height="26" rx="4" fill="none" stroke="#d2a8ff" stroke-width="1"/>
  <text x="390" y="221" text-anchor="middle" fill="#e6edf3" font-size="10">PROJECT.md — active work</text>

  <!-- Left: Stages READ from DDD -->
  <rect x="30" y="100" width="180" height="280" rx="8" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Pipeline Stages</text>
  <text x="120" y="143" text-anchor="middle" fill="#58a6ff" font-size="9">(READ from DDD)</text>

  <rect x="50" y="158" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#58a6ff" stroke-width="1"/>
  <text x="120" y="174" text-anchor="middle" fill="#e6edf3" font-size="9">EVALUATE reads PRODUCT</text>

  <rect x="50" y="190" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#58a6ff" stroke-width="1"/>
  <text x="120" y="206" text-anchor="middle" fill="#e6edf3" font-size="9">THINK reads TECH, IMPROV</text>

  <rect x="50" y="222" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#58a6ff" stroke-width="1"/>
  <text x="120" y="238" text-anchor="middle" fill="#e6edf3" font-size="9">PLAN reads all DDD docs</text>

  <rect x="50" y="254" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#58a6ff" stroke-width="1"/>
  <text x="120" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">BUILD reads TECH patterns</text>

  <rect x="50" y="286" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#58a6ff" stroke-width="1"/>
  <text x="120" y="302" text-anchor="middle" fill="#e6edf3" font-size="9">ADVERSARIAL reads IMPROV</text>

  <rect x="50" y="318" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#58a6ff" stroke-width="1"/>
  <text x="120" y="334" text-anchor="middle" fill="#e6edf3" font-size="9">Gate L5: DDD conformance</text>

  <!-- Arrows: stages read from DDD -->
  <line x1="210" y1="155" x2="275" y2="155" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="243" y="148" fill="#58a6ff" font-size="8">read</text>

  <!-- Right: REFLECT WRITES to DDD -->
  <rect x="570" y="100" width="180" height="200" rx="8" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">REFLECT Stage</text>
  <text x="660" y="143" text-anchor="middle" fill="#7ee787" font-size="9">(WRITE to DDD)</text>

  <rect x="590" y="158" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="660" y="174" text-anchor="middle" fill="#e6edf3" font-size="9">New patterns discovered</text>

  <rect x="590" y="190" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="660" y="206" text-anchor="middle" fill="#e6edf3" font-size="9">Anti-patterns identified</text>

  <rect x="590" y="222" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="660" y="238" text-anchor="middle" fill="#e6edf3" font-size="9">Convention updates</text>

  <rect x="590" y="254" width="140" height="24" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="660" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Improvement proposals</text>

  <!-- Arrow: REFLECT writes to DDD -->
  <line x1="570" y1="155" x2="505" y2="155" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="537" y="148" fill="#7ee787" font-size="8">write</text>

  <!-- Channel 3 label -->
  <rect x="280" y="260" width="220" height="40" rx="6" fill="#1e2a3a" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="390" y="278" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="bold">Channel 3: Pipeline Feed</text>
  <text x="390" y="294" text-anchor="middle" fill="#e6edf3" font-size="9">Richest source of DDD cultivation</text>

  <!-- Bottom: Without vs With -->
  <rect x="40" y="395" width="330" height="35" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="205" y="417" text-anchor="middle" fill="#f78166" font-size="10">Without DDD: repeats mistakes, ignores conventions</text>

  <rect x="410" y="395" width="330" height="35" rx="6" fill="#1e2a3a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="575" y="417" text-anchor="middle" fill="#7ee787" font-size="10">With DDD: starts informed, delivers domain-correctly</text>

  <!-- Growth arrow at bottom -->
  <text x="390" y="365" text-anchor="middle" fill="#e6edf3" font-size="10" font-style="italic">Each pipeline run makes DDD richer, making next pipeline run better</text>
</svg>