<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrow2g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7ee787"/>
    </marker>
    <marker id="arrow2o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f78166"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">One-Shot vs Quality Convergence</text>

  <!-- LEFT SIDE: One-Shot -->
  <text x="185" y="60" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">One-Shot Pipeline</text>
  <text x="185" y="78" text-anchor="middle" fill="#e6edf3" font-size="10">Quality = Dice Roll</text>

  <!-- Linear flow -->
  <rect x="50" y="100" width="80" height="28" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="90" y="118" text-anchor="middle" fill="#e6edf3" font-size="9">Stage 1</text>
  <line x1="130" y1="114" x2="145" y2="114" stroke="#f78166" stroke-width="1.5" marker-end="url(#arrow2o)"/>

  <rect x="150" y="100" width="80" height="28" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="190" y="118" text-anchor="middle" fill="#e6edf3" font-size="9">Stage 2</text>
  <line x1="230" y1="114" x2="245" y2="114" stroke="#f78166" stroke-width="1.5" marker-end="url(#arrow2o)"/>

  <rect x="250" y="100" width="50" height="28" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="275" y="118" text-anchor="middle" fill="#e6edf3" font-size="9">...</text>
  <line x1="300" y1="114" x2="315" y2="114" stroke="#f78166" stroke-width="1.5" marker-end="url(#arrow2o)"/>

  <rect x="320" y="100" width="50" height="28" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="345" y="118" text-anchor="middle" fill="#e6edf3" font-size="9">Done?</text>

  <!-- Quality outcome area -->
  <rect x="50" y="150" width="320" height="90" rx="6" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="170" text-anchor="middle" fill="#f78166" font-size="10">Quality Outcomes (unpredictable)</text>

  <!-- Scattered dots representing quality randomness -->
  <circle cx="80" cy="195" r="4" fill="#7ee787" opacity="0.6"/>
  <circle cx="120" cy="210" r="4" fill="#f78166" opacity="0.8"/>
  <circle cx="160" cy="185" r="4" fill="#f78166" opacity="0.8"/>
  <circle cx="200" cy="220" r="4" fill="#f78166" opacity="0.8"/>
  <circle cx="240" cy="190" r="4" fill="#7ee787" opacity="0.6"/>
  <circle cx="280" cy="215" r="4" fill="#f78166" opacity="0.8"/>
  <circle cx="320" cy="200" r="4" fill="#7ee787" opacity="0.6"/>
  <circle cx="340" cy="225" r="4" fill="#f78166" opacity="0.8"/>

  <!-- Quality bar -->
  <line x1="50" y1="192" x2="370" y2="192" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="355" y="188" fill="#d2a8ff" font-size="8">push-ready bar</text>

  <text x="210" y="260" text-anchor="middle" fill="#f78166" font-size="10" font-style="italic">30% chance of push-ready</text>

  <!-- Divider -->
  <line x1="390" y1="50" x2="390" y2="380" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- RIGHT SIDE: Convergence -->
  <text x="585" y="60" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="bold">Quality Convergence</text>
  <text x="585" y="78" text-anchor="middle" fill="#e6edf3" font-size="10">Quality = Guaranteed</text>

  <!-- Convergence funnel visualization -->
  <rect x="420" y="100" width="330" height="180" rx="6" fill="none" stroke="#7ee787" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Iteration lines converging -->
  <text x="435" y="118" fill="#e6edf3" font-size="9">Iteration 1</text>
  <line x1="510" y1="115" x2="730" y2="115" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="640" y="108" width="14" height="14" rx="3" fill="none" stroke="#f78166" stroke-width="1.5"/>

  <text x="435" y="148" fill="#e6edf3" font-size="9">Iteration 2</text>
  <line x1="510" y1="145" x2="730" y2="145" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="680" y="138" width="14" height="14" rx="3" fill="none" stroke="#f78166" stroke-width="1.5"/>

  <text x="435" y="178" fill="#e6edf3" font-size="9">Iteration 3</text>
  <line x1="510" y1="175" x2="730" y2="175" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="710" y="168" width="14" height="14" rx="3" fill="none" stroke="#7ee787" stroke-width="1.5"/>

  <!-- Quality bar on right -->
  <line x1="720" y1="100" x2="720" y2="280" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="720" y="295" text-anchor="middle" fill="#d2a8ff" font-size="8">push-ready bar</text>

  <!-- Converging gap visualization -->
  <!-- Gap labels -->
  <text x="620" y="130" fill="#f78166" font-size="8">large gap</text>
  <text x="660" y="160" fill="#f78166" font-size="8">smaller gap</text>
  <text x="710" y="190" fill="#7ee787" font-size="8">passed</text>

  <text x="585" y="260" text-anchor="middle" fill="#7ee787" font-size="10" font-style="italic">100% push-ready (or escalate)</text>

  <!-- Bottom comparison -->
  <rect x="50" y="310" width="320" height="55" rx="8" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="210" y="332" text-anchor="middle" fill="#f78166" font-size="10" font-weight="bold">Hope-Based Quality</text>
  <text x="210" y="350" text-anchor="middle" fill="#e6edf3" font-size="9">"Run stages once, ship what comes out"</text>

  <rect x="420" y="310" width="330" height="55" rx="8" fill="#1e2a3a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="585" y="332" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">Convergence-Based Quality</text>
  <text x="585" y="350" text-anchor="middle" fill="#e6edf3" font-size="9">"Iterate until push-ready or escalate"</text>
</svg>