<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 648" font-family="sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrow3p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d2a8ff"/>
    </marker>
  </defs>
  <rect width="780" height="648" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">The 9 Stages: Production Line</text>
  <text x="390" y="48" text-anchor="middle" fill="#e6edf3" font-size="10" opacity="0.7">DDD-informed, sequential &#183; 9 stages &#183; 3 gates &#183; produces delivery candidate</text>

  <!-- DDD column on left -->
  <rect x="20" y="65" width="110" height="490" rx="8" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="85" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">DDD Context</text>
  <text x="75" y="105" text-anchor="middle" fill="#d2a8ff" font-size="9">PRODUCT.md</text>
  <text x="75" y="120" text-anchor="middle" fill="#d2a8ff" font-size="9">TECH.md</text>
  <text x="75" y="135" text-anchor="middle" fill="#d2a8ff" font-size="9">IMPROVEMENT.md</text>
  <text x="75" y="150" text-anchor="middle" fill="#d2a8ff" font-size="9">PROJECT.md</text>

  <!-- Stage column -->
  <!-- Stage 1: EVALUATE -->
  <rect x="180" y="65" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#58a6ff" stroke-width="2"/>
  <text x="280" y="83" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1. EVALUATE</text>
  <text x="280" y="100" text-anchor="middle" fill="#e6edf3" font-size="9">GO/DEFER/REJECT/ESCALATE</text>
  <line x1="130" y1="88" x2="175" y2="88" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow3p)"/>

  <!-- Decision type labels -->
  <rect x="420" y="72" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#f78166" stroke-width="1"/>
  <text x="460" y="87" text-anchor="middle" fill="#f78166" font-size="9">judgment</text>

  <!-- Reads -->
  <text x="560" y="83" fill="#e6edf3" font-size="8" opacity="0.7">Reads: PRODUCT.md</text>
  <text x="560" y="97" fill="#e6edf3" font-size="8" opacity="0.7">Produces: GO decision</text>

  <!-- Gate 0: framing (fires on EVALUATE -> THINK) -->
  <rect x="135" y="105" width="40" height="23" rx="4" fill="#3a2f10" stroke="#e3b341" stroke-width="1.5"/>
  <text x="155" y="115" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="bold">&#9733;Gate</text>
  <text x="155" y="124" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="bold">0</text>

  <line x1="280" y1="110" x2="280" y2="120" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Stage 2: THINK -->
  <rect x="180" y="125" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#58a6ff" stroke-width="2"/>
  <text x="280" y="143" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">2. THINK</text>
  <text x="280" y="160" text-anchor="middle" fill="#e6edf3" font-size="9">Research, alternatives, approach</text>
  <line x1="130" y1="148" x2="175" y2="148" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow3p)"/>

  <rect x="420" y="132" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#f78166" stroke-width="1"/>
  <text x="460" y="147" text-anchor="middle" fill="#f78166" font-size="9">judgment</text>

  <text x="560" y="143" fill="#e6edf3" font-size="8" opacity="0.7">Reads: TECH.md, IMPROVEMENT.md</text>
  <text x="560" y="157" fill="#e6edf3" font-size="8" opacity="0.7">Produces: approach decision</text>

  <line x1="280" y1="170" x2="280" y2="180" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Stage 3: PLAN -->
  <rect x="180" y="185" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#58a6ff" stroke-width="2"/>
  <text x="280" y="203" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">3. PLAN</text>
  <text x="280" y="220" text-anchor="middle" fill="#e6edf3" font-size="9">SDD specification, test strategy</text>
  <line x1="130" y1="208" x2="175" y2="208" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow3p)"/>

  <rect x="420" y="192" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#d2a8ff" stroke-width="1"/>
  <text x="460" y="207" text-anchor="middle" fill="#d2a8ff" font-size="9">taste</text>

  <text x="560" y="203" fill="#e6edf3" font-size="8" opacity="0.7">Reads: all DDD docs</text>
  <text x="560" y="217" fill="#e6edf3" font-size="8" opacity="0.7">Produces: SDD spec</text>

  <!-- Gate 1: plan soundness (fires after PLAN, before BUILD) -->
  <rect x="135" y="223" width="40" height="23" rx="4" fill="#3a2f10" stroke="#e3b341" stroke-width="1.5"/>
  <text x="155" y="233" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="bold">&#9733;Gate</text>
  <text x="155" y="242" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="bold">1</text>

  <line x1="280" y1="230" x2="280" y2="240" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Stage 4: BUILD -->
  <rect x="180" y="245" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#7ee787" stroke-width="2"/>
  <text x="280" y="263" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">4. BUILD (TDD)</text>
  <text x="280" y="280" text-anchor="middle" fill="#e6edf3" font-size="9">Red-Green-Refactor cycle</text>
  <line x1="130" y1="268" x2="175" y2="268" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow3p)"/>

  <rect x="420" y="252" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="460" y="267" text-anchor="middle" fill="#7ee787" font-size="9">mechanical</text>

  <text x="560" y="263" fill="#e6edf3" font-size="8" opacity="0.7">Reads: TECH.md conventions</text>
  <text x="560" y="277" fill="#e6edf3" font-size="8" opacity="0.7">Produces: working code + tests</text>

  <line x1="280" y1="290" x2="280" y2="300" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Stage 5: REVIEW -->
  <rect x="180" y="305" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#58a6ff" stroke-width="2"/>
  <text x="280" y="323" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">5. REVIEW</text>
  <text x="280" y="340" text-anchor="middle" fill="#e6edf3" font-size="9">Self-check against SDD spec</text>

  <rect x="420" y="312" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="460" y="327" text-anchor="middle" fill="#7ee787" font-size="9">mechanical</text>

  <text x="560" y="323" fill="#e6edf3" font-size="8" opacity="0.7">Reads: SDD from PLAN</text>
  <text x="560" y="337" fill="#e6edf3" font-size="8" opacity="0.7">Produces: conformance report</text>

  <line x1="280" y1="350" x2="280" y2="360" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Stage 6: TEST -->
  <rect x="180" y="365" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#58a6ff" stroke-width="2"/>
  <text x="280" y="383" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">6. TEST</text>
  <text x="280" y="400" text-anchor="middle" fill="#e6edf3" font-size="9">Integration, edge cases, QA</text>

  <rect x="420" y="372" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="460" y="387" text-anchor="middle" fill="#7ee787" font-size="9">mechanical</text>

  <text x="560" y="383" fill="#e6edf3" font-size="8" opacity="0.7">Reads: test strategy from PLAN</text>
  <text x="560" y="397" fill="#e6edf3" font-size="8" opacity="0.7">Produces: test results</text>

  <line x1="280" y1="410" x2="280" y2="420" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Gate 2: build correctness (ADVERSARIAL rides inside DELIVER, BLOCKING) -->
  <rect x="135" y="436" width="40" height="23" rx="4" fill="#3a2f10" stroke="#e3b341" stroke-width="1.5"/>
  <text x="155" y="446" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="bold">&#9733;Gate</text>
  <text x="155" y="455" text-anchor="middle" fill="#e3b341" font-size="8" font-weight="bold">2</text>

  <!-- Stage 7: ADVERSARIAL -->
  <rect x="180" y="425" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#f78166" stroke-width="2"/>
  <text x="280" y="439" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">7. ADVERSARIAL REVIEW</text>
  <text x="280" y="452" text-anchor="middle" fill="#e6edf3" font-size="9">Fresh-context sub-agent attack</text>
  <text x="280" y="463" text-anchor="middle" fill="#e3b341" font-size="8">&#9733; Gate 2 &#183; BLOCKING &#183; runs inside DELIVER</text>

  <rect x="420" y="432" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="460" y="447" text-anchor="middle" fill="#7ee787" font-size="9">mechanical</text>

  <text x="560" y="443" fill="#e6edf3" font-size="8" opacity="0.7">Reads: code + DDD anti-patterns</text>
  <text x="560" y="457" fill="#e6edf3" font-size="8" opacity="0.7">Produces: issue list or clean bill</text>

  <line x1="280" y1="470" x2="280" y2="480" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Stage 8: DELIVER -->
  <rect x="180" y="485" width="200" height="45" rx="8" fill="#1e2a3a" stroke="#58a6ff" stroke-width="2"/>
  <text x="280" y="503" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">8. DELIVER</text>
  <text x="280" y="520" text-anchor="middle" fill="#e6edf3" font-size="9">Package, PR, delivery report</text>

  <rect x="420" y="492" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="460" y="507" text-anchor="middle" fill="#7ee787" font-size="9">mechanical</text>

  <text x="560" y="503" fill="#e6edf3" font-size="8" opacity="0.7">Reads: all stage outputs</text>
  <text x="560" y="517" fill="#e6edf3" font-size="8" opacity="0.7">Produces: delivery candidate</text>

  <line x1="280" y1="530" x2="280" y2="540" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Stage 9: REFLECT -->
  <rect x="180" y="545" width="200" height="30" rx="8" fill="#1e2a3a" stroke="#d2a8ff" stroke-width="2"/>
  <text x="280" y="565" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">9. REFLECT</text>

  <rect x="420" y="548" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#7ee787" stroke-width="1"/>
  <text x="460" y="563" text-anchor="middle" fill="#7ee787" font-size="9">mechanical</text>

  <text x="560" y="558" fill="#e6edf3" font-size="8" opacity="0.7">Reads: execution trace</text>
  <text x="560" y="572" fill="#e6edf3" font-size="8" opacity="0.7">Produces: DDD cultivation proposals</text>

  <!-- Legend -->
  <rect x="420" y="65" width="80" height="22" rx="4" fill="#1e2a3a" stroke="#e6edf3" stroke-width="0.5"/>
  <text x="460" y="80" text-anchor="middle" fill="#e6edf3" font-size="8">Decision Type</text>

  <!-- Gate legend band -->
  <rect x="20" y="588" width="740" height="48" rx="8" fill="#22201a" stroke="#e3b341" stroke-width="1"/>
  <text x="34" y="606" fill="#e3b341" font-size="10" font-weight="bold">&#9733; 3 Gates &#183; 3 moments of truth</text>
  <text x="34" y="622" fill="#e6edf3" font-size="8.5" opacity="0.85">Gate 0 &#8212; framing (inside EVALUATE): is the problem understood? &#183; Gate 1 &#8212; plan (after PLAN, before BUILD): root not symptom?</text>
  <text x="34" y="633" fill="#e6edf3" font-size="8.5" opacity="0.85">Gate 2 &#8212; build correctness (ADVERSARIAL, inside DELIVER, BLOCKING): is the code actually right? &#183; Gates 0 &amp; 2 ride within a stage; Gate 1 is the PLAN&#8594;BUILD boundary.</text>
</svg>