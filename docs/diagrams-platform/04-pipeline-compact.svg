<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif">
  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d2a8ff"/>
    </marker>
    <marker id="arr4b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
    <marker id="arr4g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7ee787"/>
    </marker>
  </defs>
  <rect width="780" height="440" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Super Builder: Autonomous Pipeline</text>
  <text x="390" y="46" text-anchor="middle" fill="#8b8ba0" font-size="10">One requirement in, one reviewed, tested, landed commit out</text>

  <!-- DDD Read (top, into EVALUATE, THINK, PLAN, REVIEW only) -->
  <rect x="42" y="58" width="434" height="34" rx="8" fill="#0d2240" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="259" y="72" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">DDD READS</text>
  <text x="259" y="85" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.85">the project's knowledge, recalled at EVALUATE, THINK, PLAN and REVIEW</text>

  <!-- 8 stages of a full or bugfix run -->
  <line x1="81.5" y1="92" x2="81.5" y2="114" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr4b)"/>
  <rect x="42" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="81.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">EVALUATE</text>
  <text x="81.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">requirements,</text>
  <text x="81.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">Gate-0 on bugfix</text>
  <text x="81.5" y="174" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">or ambiguous</text>
  <line x1="121" y1="149.0" x2="129" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <line x1="169.5" y1="92" x2="169.5" y2="114" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr4b)"/>
  <rect x="130" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="169.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">THINK</text>
  <text x="169.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">weighs</text>
  <text x="169.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">approaches</text>
  <line x1="209" y1="149.0" x2="217" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <line x1="257.5" y1="92" x2="257.5" y2="114" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr4b)"/>
  <rect x="218" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="257.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">PLAN</text>
  <text x="257.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">design + tests</text>
  <text x="257.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">per criterion</text>
  <line x1="297" y1="149.0" x2="305" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <rect x="306" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="345.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">BUILD</text>
  <text x="345.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">in the run's</text>
  <text x="345.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">own worktree</text>
  <line x1="385" y1="149.0" x2="393" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <line x1="433.5" y1="92" x2="433.5" y2="114" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr4b)"/>
  <rect x="394" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="433.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">REVIEW</text>
  <text x="433.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">independent</text>
  <text x="433.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">experts,</text>
  <text x="433.5" y="174" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">2 rounds</text>
  <line x1="473" y1="149.0" x2="481" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <rect x="482" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="521.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">TEST</text>
  <text x="521.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">its tests + repo</text>
  <text x="521.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">checks on the</text>
  <text x="521.5" y="174" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">reviewed code</text>
  <line x1="561" y1="149.0" x2="569" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <rect x="570" y="116" width="79" height="66" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="609.5" y="133" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">DELIVER</text>
  <text x="609.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">REPORT + lands</text>
  <text x="609.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">one local</text>
  <text x="609.5" y="174" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">commit</text>
  <line x1="649" y1="149.0" x2="657" y2="149.0" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr4)"/>
  <rect x="658" y="116" width="79" height="66" rx="6" fill="#1a2e1a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="697.5" y="133" text-anchor="middle" fill="#7ee787" font-size="10.5" font-weight="bold">REFLECT</text>
  <text x="697.5" y="148" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">report → CDF</text>
  <text x="697.5" y="161" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">→ DDD</text>

  <!-- Other profiles -->
  <text x="390" y="200" text-anchor="middle" fill="#8b8ba0" font-size="9">Shown: a full or bugfix run. Other profiles: trivial (no THINK) · direct (BUILD → REFLECT) · research (EVALUATE, THINK, DELIVER, REFLECT; lands no code)</text>

  <!-- When the person is asked -->
  <rect x="40" y="212" width="290" height="166" rx="8" fill="none" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="185" y="231" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">When the person is asked</text>
  <text x="52" y="252" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">1. A requirement with 2+ readings</text>
  <text x="52" y="266" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">2. An irreversible or high-risk design choice</text>
  <text x="52" y="282" fill="#8b8ba0" font-size="9">2–3 options each, at most 2 questions per run</text>
  <text x="52" y="306" fill="#f78166" font-size="9.5" font-weight="bold">A failed check is never a question.</text>
  <line x1="52" y1="322" x2="318" y2="322" stroke="#333355" stroke-width="1"/>
  <text x="52" y="342" fill="#7ee787" font-size="9.5" font-weight="bold">The person reads the REPORT and pushes.</text>
  <text x="52" y="358" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">The pipeline never pushes.</text>

  <!-- Lands only if -->
  <rect x="342" y="212" width="398" height="166" rx="8" fill="none" stroke="#f78166" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="541" y="231" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">Lands only if (deterministic checks)</text>
  <text x="354" y="252" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">1. Every stage document is valid</text>
  <text x="354" y="266" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">2. Review saw this exact code</text>
  <text x="354" y="280" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">3. Fixed findings were rechecked</text>
  <text x="550" y="252" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">4. Tests pass on this code</text>
  <text x="550" y="266" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">5. Commit = reviewed code + REPORT</text>
  <text x="550" y="280" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">6. main has not moved</text>
  <text x="562" y="293" fill="#8b8ba0" font-size="9">(else sync and test again)</text>
  <line x1="354" y1="302" x2="728" y2="302" stroke="#333355" stroke-width="1"/>
  <text x="354" y="320" fill="#f78166" font-size="9.5" font-weight="bold">Every loop is capped:</text>
  <text x="354" y="334" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">the run lands, or ends not landed, with a reason.</text>
  <text x="354" y="352" fill="#f78166" font-size="9.5" font-weight="bold">An expert's opinion never blocks landing:</text>
  <text x="354" y="366" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">an open finding is listed in the REPORT as residual risk.</text>

  <!-- Loop back: REFLECT -> run report -> DDD grows -> next run reads it -->
  <path d="M737,149 L756,149 L756,409 L742,409" fill="none" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arr4g)"/>
  <rect x="40" y="390" width="700" height="38" rx="8" fill="#0d2b1a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="390" y="413" text-anchor="middle" fill="#7ee787" font-size="10.5" font-weight="bold">REFLECT → run report → DDD grows → the next run reads it</text>
  <path d="M40,409 L24,409 L24,75 L40,75" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr4b)"/>
</svg>
