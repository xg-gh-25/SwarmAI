  <text x="562" y="252" text-anchor="middle" fill="#58a6ff" font-size="9">TECH</text>
  <rect x="610" y="232" width="75" height="32" rx="6" fill="#0d2240" stroke="#58a6ff" stroke-width="1"/>
  <text x="647" y="252" text-anchor="middle" fill="#58a6ff" font-size="9">IMPROVE</text>
  <rect x="695" y="232" width="75" height="32" rx="6" fill="#0d2240" stroke="#58a6ff" stroke-width="1"/>
  <text x="732" y="252" text-anchor="middle" fill="#58a6ff" font-size="9">PROJECT</text>
