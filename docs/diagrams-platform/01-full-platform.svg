  <rect x="440" y="85" width="145" height="45" rx="8" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="512" y="105" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Super Builder</text>
  <text x="512" y="120" text-anchor="middle" fill="#e6edf3" font-size="9">Autonomous Pipeline</text>
  <rect x="615" y="85" width="145" height="45" rx="8" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="687" y="105" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Super Marketer</text>
  <text x="687" y="120" text-anchor="middle" fill="#e6edf3" font-size="9">Pollinate</text>
  <rect x="440" y="140" width="145" height="35" rx="8" fill="#1e1e3a" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="512" y="162" text-anchor="middle" fill="#8b8ba0" font-size="10">Future: Analyst</text>
