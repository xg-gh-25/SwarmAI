  <text x="490" y="422" text-anchor="middle" fill="#7ee787" font-size="9">11-File Context</text>
  <rect x="550" y="405" width="100" height="25" rx="5" fill="#0d2b1a" stroke="#7ee787" stroke-width="1"/>
