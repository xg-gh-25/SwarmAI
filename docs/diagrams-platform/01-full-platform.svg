  <rect x="420" y="375" width="360" height="100" rx="8" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="600" y="395" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">HARNESS (Foundation)</text>
