  <rect x="660" y="405" width="100" height="25" rx="5" fill="#0d2b1a" stroke="#7ee787" stroke-width="1"/>
  <text x="710" y="422" text-anchor="middle" fill="#7ee787" font-size="9">Self-Evolution</text>
  <rect x="440" y="440" width="100" height="25" rx="5" fill="#0d2b1a" stroke="#7ee787" stroke-width="1"/>
  <text x="490" y="457" text-anchor="middle" fill="#7ee787" font-size="9">Session Hooks</text>
  <rect x="550" y="440" width="100" height="25" rx="5" fill="#0d2b1a" stroke="#7ee787" stroke-width="1"/>
  <text x="600" y="457" text-anchor="middle" fill="#7ee787" font-size="9">MCP Tools</text>
  <rect x="660" y="440" width="100" height="25" rx="5" fill="#0d2b1a" stroke="#7ee787" stroke-width="1"/>
  <text x="710" y="457" text-anchor="middle" fill="#7ee787" font-size="9">Skills (170+)</text>

