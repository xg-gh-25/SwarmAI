  <text x="75" y="107" fill="#e6edf3" font-size="10">Code Changes</text>
  <text x="270" y="107" text-anchor="middle" fill="#8b8ba0" font-size="9">Git commits -> TECH.md</text>

  <rect x="40" y="132" width="320" height="34" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1"/>
  <text x="55" y="149" fill="#f78166" font-size="10" font-weight="bold">2</text>
  <text x="75" y="149" fill="#e6edf3" font-size="10">External Learning</text>
  <text x="270" y="149" text-anchor="middle" fill="#8b8ba0" font-size="9">Research -> PRODUCT/TECH</text>

  <rect x="40" y="174" width="320" height="34" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1"/>
  <text x="55" y="191" fill="#f78166" font-size="10" font-weight="bold">3</text>
  <text x="75" y="191" fill="#e6edf3" font-size="10">Pipeline Delivery</text>
  <text x="270" y="191" text-anchor="middle" fill="#8b8ba0" font-size="9">REFLECT -> IMPROVEMENT.md</text>

  <rect x="40" y="216" width="320" height="34" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1"/>
  <text x="55" y="233" fill="#f78166" font-size="10" font-weight="bold">4</text>
  <text x="75" y="233" fill="#e6edf3" font-size="10">Industry Signals</text>
  <text x="270" y="233" text-anchor="middle" fill="#8b8ba0" font-size="9">Signal pipeline -> PRODUCT.md</text>

  <rect x="40" y="258" width="320" height="34" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1"/>
  <text x="55" y="275" fill="#f78166" font-size="10" font-weight="bold">5</text>
  <text x="75" y="275" fill="#e6edf3" font-size="10">Conversation</text>
  <text x="270" y="275" text-anchor="middle" fill="#8b8ba0" font-size="9">Session decisions -> PROJECT.md</text>

  <rect x="40" y="300" width="320" height="34" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1"/>
  <text x="55" y="317" fill="#f78166" font-size="10" font-weight="bold">6</text>
  <text x="75" y="317" fill="#e6edf3" font-size="10">Corrections</text>
  <text x="270" y="317" text-anchor="middle" fill="#8b8ba0" font-size="9">User overrides -> Any doc</text>

  <rect x="40" y="342" width="320" height="34" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1"/>
  <text x="55" y="359" fill="#f78166" font-size="10" font-weight="bold">7</text>
  <text x="75" y="359" fill="#e6edf3" font-size="10">Code Intelligence</text>
  <text x="270" y="359" text-anchor="middle" fill="#8b8ba0" font-size="9">Static analysis -> TECH.md</text>

  <!-- Cultivation box -->
  <rect x="80" y="395" width="240" height="65" rx="8" fill="#1a2e1a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="200" y="415" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">Cultivation Engine</text>
  <text x="200" y="433" text-anchor="middle" fill="#e6edf3" font-size="9">Propose -> Approve -> Grow</text>
  <text x="200" y="449" text-anchor="middle" fill="#8b8ba0" font-size="8">Zero-maintenance knowledge growth</text>

  <!-- Arrows: Channels -> DDD -->
  <line x1="360" y1="200" x2="418" y2="250" stroke="#f78166" stroke-width="2" marker-end="url(#arrow1o)"/>
  <line x1="360" y1="260" x2="418" y2="270" stroke="#f78166" stroke-width="2" marker-end="url(#arrow1o)"/>
  <line x1="360" y1="340" x2="418" y2="300" stroke="#f78166" stroke-width="2" marker-end="url(#arrow1o)"/>

  <!-- Arrow: Cultivation -> DDD -->
  <path d="M320,428 Q390,428 418,310" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#arrow1g)"/>

  <!-- Arrows: DDD -> Engines -->
  <line x1="600" y1="200" x2="600" y2="187" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Feedback arrows: Engines -> Channel 3 -->
  <path d="M440,130 Q410,130 410,191 L362,191" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow1o)"/>

  <!-- Legend -->
  <rect x="20" y="490" width="760" height="120" rx="8" fill="#12122a" stroke="#333355" stroke-width="1"/>
  <text x="400" y="510" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">The Platform Model</text>
  <line x1="50" y1="530" x2="70" y2="530" stroke="#f78166" stroke-width="2"/>
  <text x="80" y="534" fill="#e6edf3" font-size="9">8 Channels PRODUCE knowledge (feed DDD)</text>
  <line x1="50" y1="550" x2="70" y2="550" stroke="#58a6ff" stroke-width="2"/>
  <text x="80" y="554" fill="#e6edf3" font-size="9">Engines CONSUME knowledge (read DDD to deliver)</text>
  <line x1="50" y1="570" x2="70" y2="570" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="80" y="574" fill="#e6edf3" font-size="9">Engine REFLECT feeds back via Channel 3</text>
  <line x1="50" y1="590" x2="70" y2="590" stroke="#7ee787" stroke-width="2"/>
  <text x="80" y="594" fill="#e6edf3" font-size="9">Cultivation orchestrates proposals -> approval -> growth</text>

  <text x="450" y="534" fill="#e6edf3" font-size="9">Result: Every session makes ALL future sessions smarter.</text>
  <text x="450" y="554" fill="#e6edf3" font-size="9">DDD grows automatically from 7 sources -- zero maintenance.</text>
  <text x="450" y="574" fill="#e6edf3" font-size="9">New engines get domain expertise for free (just read DDD).</text>
  <text x="450" y="594" fill="#8b8ba0" font-size="9">Session 100 reads DDD that is 100x richer than Session 1.</text>
</svg>