<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f78166"/>
    </marker>
    <marker id="arr3g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7ee787"/>
    </marker>
    <marker id="arr3b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">The 8 Feed Channels: How DDD Grows Automatically</text>
  <text x="400" y="50" text-anchor="middle" fill="#8b8ba0" font-size="10">These are the flywheel fuel -- zero-maintenance knowledge production</text>

  <!-- Channel boxes (left column) -->
  <rect x="30" y="70" width="290" height="60" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="95" r="12" fill="#f78166"/>
  <text x="55" y="99" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">1</text>
  <text x="80" y="90" fill="#e6edf3" font-size="11" font-weight="bold">Code Changes</text>
  <text x="80" y="106" fill="#8b8ba0" font-size="9">Source: Git commits, PRs, refactors</text>
  <text x="80" y="120" fill="#58a6ff" font-size="9">Target: TECH.md (patterns, architecture)</text>

  <rect x="30" y="140" width="290" height="60" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="165" r="12" fill="#f78166"/>
  <text x="55" y="169" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">2</text>
  <text x="80" y="160" fill="#e6edf3" font-size="11" font-weight="bold">External Learning</text>
  <text x="80" y="176" fill="#8b8ba0" font-size="9">Source: Research, articles, learn-content skill</text>
  <text x="80" y="190" fill="#58a6ff" font-size="9">Target: PRODUCT.md / TECH.md</text>

  <rect x="30" y="210" width="290" height="60" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="235" r="12" fill="#f78166"/>
  <text x="55" y="239" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">3</text>
  <text x="80" y="230" fill="#e6edf3" font-size="11" font-weight="bold">Pipeline Delivery</text>
  <text x="80" y="246" fill="#8b8ba0" font-size="9">Source: REFLECT stage output from engines</text>
  <text x="80" y="260" fill="#58a6ff" font-size="9">Target: IMPROVEMENT.md (lessons, patterns)</text>

  <rect x="30" y="280" width="290" height="60" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="305" r="12" fill="#f78166"/>
  <text x="55" y="309" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">4</text>
  <text x="80" y="300" fill="#e6edf3" font-size="11" font-weight="bold">Industry Signals</text>
  <text x="80" y="316" fill="#8b8ba0" font-size="9">Source: Signal pipeline, feeds, alerts</text>
  <text x="80" y="330" fill="#58a6ff" font-size="9">Target: PRODUCT.md (strategic context)</text>

  <rect x="30" y="350" width="290" height="60" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="375" r="12" fill="#f78166"/>
  <text x="55" y="379" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">5</text>
  <text x="80" y="370" fill="#e6edf3" font-size="11" font-weight="bold">Conversation</text>
  <text x="80" y="386" fill="#8b8ba0" font-size="9">Source: Session decisions, implicit rules</text>
  <text x="80" y="400" fill="#58a6ff" font-size="9">Target: PROJECT.md (team rules, decisions)</text>

  <rect x="30" y="420" width="290" height="60" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="445" r="12" fill="#f78166"/>
  <text x="55" y="449" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">6</text>
  <text x="80" y="440" fill="#e6edf3" font-size="11" font-weight="bold">Corrections</text>
  <text x="80" y="456" fill="#8b8ba0" font-size="9">Source: User says "no, do X instead"</text>
  <text x="80" y="470" fill="#58a6ff" font-size="9">Target: Any doc (highest priority)</text>

  <rect x="30" y="490" width="290" height="55" rx="8" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <circle cx="55" cy="513" r="12" fill="#f78166"/>
  <text x="55" y="517" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">7</text>
  <text x="80" y="508" fill="#e6edf3" font-size="11" font-weight="bold">Code Intelligence</text>
  <text x="80" y="524" fill="#8b8ba0" font-size="9">Source: Static analysis, dependency graph</text>
  <text x="80" y="538" fill="#58a6ff" font-size="9">Target: TECH.md (structural truth)</text>

  <!-- Cultivation Engine (center-right) -->
  <rect x="420" y="180" width="200" height="90" rx="10" fill="#1a2e1a" stroke="#7ee787" stroke-width="2"/>
  <text x="520" y="205" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">Cultivation Engine</text>
  <text x="520" y="225" text-anchor="middle" fill="#e6edf3" font-size="9">Receives signals from all 8 channels</text>
  <text x="520" y="242" text-anchor="middle" fill="#e6edf3" font-size="9">Generates DDD update proposals</text>
  <text x="520" y="258" text-anchor="middle" fill="#8b8ba0" font-size="8">Automatic, continuous, incremental</text>

  <!-- Arrows from channels to cultivation -->
  <line x1="320" y1="100" x2="418" y2="210" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="320" y1="170" x2="418" y2="215" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="320" y1="240" x2="418" y2="225" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="320" y1="310" x2="418" y2="240" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="320" y1="380" x2="418" y2="250" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="320" y1="450" x2="418" y2="255" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="320" y1="515" x2="418" y2="260" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Approval Gate -->
  <rect x="450" y="310" width="140" height="50" rx="8" fill="#2d1b10" stroke="#f78166" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="520" y="332" text-anchor="middle" fill="#f78166" font-size="10" font-weight="bold">Approval Gate</text>
  <text x="520" y="350" text-anchor="middle" fill="#8b8ba0" font-size="9">30-sec human review</text>

  <!-- Arrow: Cultivation -> Approval -->
  <line x1="520" y1="270" x2="520" y2="308" stroke="#7ee787" stroke-width="2" marker-end="url(#arr3g)"/>

  <!-- DDD Docs (right) -->
  <rect x="420" y="400" width="200" height="100" rx="8" fill="#0d2240" stroke="#58a6ff" stroke-width="2"/>
  <text x="520" y="420" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">DDD Knowledge Docs</text>
  <rect x="435" y="430" width="80" height="22" rx="4" fill="#0a1a35" stroke="#396ea3" stroke-width="1"/>
  <text x="475" y="445" text-anchor="middle" fill="#58a6ff" font-size="8">PRODUCT.md</text>
  <rect x="525" y="430" width="80" height="22" rx="4" fill="#0a1a35" stroke="#396ea3" stroke-width="1"/>
  <text x="565" y="445" text-anchor="middle" fill="#58a6ff" font-size="8">TECH.md</text>
  <rect x="435" y="460" width="80" height="22" rx="4" fill="#0a1a35" stroke="#396ea3" stroke-width="1"/>
  <text x="475" y="475" text-anchor="middle" fill="#58a6ff" font-size="8">IMPROVE.md</text>
  <rect x="525" y="460" width="80" height="22" rx="4" fill="#0a1a35" stroke="#396ea3" stroke-width="1"/>
  <text x="565" y="475" text-anchor="middle" fill="#58a6ff" font-size="8">PROJECT.md</text>

  <!-- Arrow: Approval -> DDD -->
  <line x1="520" y1="360" x2="520" y2="398" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr3b)"/>

  <!-- Result label -->
  <rect x="650" y="430" width="130" height="50" rx="8" fill="#12122a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="715" y="452" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">Result</text>
  <text x="715" y="468" text-anchor="middle" fill="#e6edf3" font-size="9">DDD grows every</text>
  <text x="715" y="481" text-anchor="middle" fill="#e6edf3" font-size="9">session, automatically</text>

  <!-- Arrow DDD -> Result -->
  <line x1="620" y1="455" x2="648" y2="455" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arr3g)"/>

  <!-- Key insight -->
  <rect x="420" y="520" width="360" height="30" rx="6" fill="#12122a" stroke="#d2a8ff" stroke-width="1"/>
  <text x="600" y="540" text-anchor="middle" fill="#d2a8ff" font-size="9">KEY: Engines contribute via Channel 3, but ALL 8 channels drive the flywheel equally</text>
</svg>