<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" font-family="sans-serif">
  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d2a8ff"/>
    </marker>
    <marker id="arr5b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
    <marker id="arr5g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7ee787"/>
    </marker>
    <marker id="arr5o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f78166"/>
    </marker>
  </defs>
  <rect width="780" height="450" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Super Marketer: Pollinate (a Work and Its Versions)</text>
  <text x="390" y="46" text-anchor="middle" fill="#8b8ba0" font-size="10">Make it once, revise it many times / Experts find, scripts decide, the person publishes</text>

  <!-- Legend -->
  <circle cx="300" cy="61" r="4" fill="#d2a8ff"/>
  <text x="308" y="64" fill="#e6edf3" font-size="9" fill-opacity="0.85">Agent</text>
  <circle cx="356" cy="61" r="4" fill="#f78166"/>
  <text x="364" y="64" fill="#e6edf3" font-size="9" fill-opacity="0.85">work.py (decides)</text>
  <circle cx="458" cy="61" r="4" fill="#8bb8e8"/>
  <text x="466" y="64" fill="#e6edf3" font-size="9" fill-opacity="0.85">Experts (find)</text>
  <circle cx="544" cy="61" r="4" fill="#7ee787"/>
  <text x="552" y="64" fill="#e6edf3" font-size="9" fill-opacity="0.85">Person</text>

  <!-- DDD Read (top left, into the brief) -->
  <rect x="40" y="74" width="210" height="34" rx="8" fill="#0d2240" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="145" y="88" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">DDD READS</text>
  <text x="145" y="101" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.85">the brief looks up project knowledge</text>
  <line x1="84" y1="108" x2="84" y2="128" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr5b)"/>

  <!-- Fix-and-cut-again loop (REVIEW / CUT back to SOURCE) -->
  <text x="390" y="104" text-anchor="middle" fill="#f78166" font-size="9">exit 1 or a real finding: fix the cause, cut again</text>
  <path d="M492,130 C492,108 288,108 288,127" fill="none" stroke="#f78166" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr5o)"/>

  <!-- Steps -->
  <!-- 1 BRIEF -->
  <rect x="40" y="130" width="88" height="70" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="84" y="146" text-anchor="middle" fill="#d2a8ff" font-size="8.5" fill-opacity="0.8">AGENT</text>
  <text x="84" y="161" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">BRIEF</text>
  <text x="84" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">thesis and scope</text>
  <text x="84" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">asks once</text>
  <line x1="128" y1="165" x2="140" y2="165" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <!-- 2 INIT / ADOPT -->
  <rect x="142" y="130" width="88" height="70" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <text x="186" y="146" text-anchor="middle" fill="#f78166" font-size="8.5" fill-opacity="0.8">WORK.PY</text>
  <text x="186" y="161" text-anchor="middle" fill="#f78166" font-size="10.5" font-weight="bold">INIT / ADOPT</text>
  <text x="186" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">a work, in place</text>
  <text x="186" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">stable slide ids</text>
  <line x1="230" y1="165" x2="242" y2="165" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <!-- 3 SOURCE -->
  <rect x="244" y="130" width="88" height="70" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="288" y="146" text-anchor="middle" fill="#d2a8ff" font-size="8.5" fill-opacity="0.8">AGENT</text>
  <text x="288" y="161" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">SOURCE</text>
  <text x="288" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">writes the HTML</text>
  <text x="288" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">or the copy</text>
  <line x1="332" y1="165" x2="344" y2="165" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <!-- 4 CUT -->
  <rect x="346" y="130" width="88" height="70" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.5"/>
  <text x="390" y="146" text-anchor="middle" fill="#f78166" font-size="8.5" fill-opacity="0.8">WORK.PY</text>
  <text x="390" y="161" text-anchor="middle" fill="#f78166" font-size="10.5" font-weight="bold">CUT</text>
  <text x="390" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">a new version</text>
  <text x="390" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">or exit 1</text>
  <line x1="434" y1="165" x2="446" y2="165" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <!-- 5 REVIEW -->
  <rect x="448" y="130" width="88" height="70" rx="6" fill="#0a1a35" stroke="#8bb8e8" stroke-width="1.5"/>
  <text x="492" y="146" text-anchor="middle" fill="#8bb8e8" font-size="8.5" fill-opacity="0.8">EXPERTS</text>
  <text x="492" y="161" text-anchor="middle" fill="#8bb8e8" font-size="10.5" font-weight="bold">REVIEW</text>
  <text x="492" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">find, never veto</text>
  <text x="492" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">at most 2 rounds</text>
  <line x1="536" y1="165" x2="548" y2="165" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <!-- 6 DELIVER -->
  <rect x="550" y="130" width="88" height="70" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="594" y="146" text-anchor="middle" fill="#d2a8ff" font-size="8.5" fill-opacity="0.8">AGENT</text>
  <text x="594" y="161" text-anchor="middle" fill="#d2a8ff" font-size="10.5" font-weight="bold">DELIVER</text>
  <text x="594" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">Canvas + one</text>
  <text x="594" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">copy-ready block</text>
  <line x1="638" y1="165" x2="650" y2="165" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <!-- 7 PERSON -->
  <rect x="652" y="130" width="88" height="70" rx="6" fill="#1a2e1a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="696" y="146" text-anchor="middle" fill="#7ee787" font-size="8.5" fill-opacity="0.8">PERSON</text>
  <text x="696" y="161" text-anchor="middle" fill="#7ee787" font-size="10.5" font-weight="bold">PUBLISH</text>
  <text x="696" y="177" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">their own click</text>
  <text x="696" y="190" text-anchor="middle" fill="#e6edf3" font-size="9" fill-opacity="0.8">or asks a change</text>

  <!-- Arrows down to the panels -->
  <line x1="370" y1="200" x2="370" y2="219" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr5o)"/>
  <line x1="696" y1="200" x2="696" y2="219" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arr5g)"/>

  <!-- Cut panel -->
  <rect x="40" y="222" width="345" height="146" rx="8" fill="none" stroke="#f78166" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="212" y="242" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">work.py cut: one command, the scripts decide</text>

  <rect x="52" y="252" width="52" height="24" rx="4" fill="#12122a" stroke="#f78166" stroke-width="1"/>
  <text x="78" y="268" text-anchor="middle" fill="#e6edf3" font-size="9">render</text>
  <line x1="104" y1="264" x2="114" y2="264" stroke="#f78166" stroke-width="1" marker-end="url(#arr5o)"/>
  <rect x="116" y="252" width="58" height="24" rx="4" fill="#12122a" stroke="#f78166" stroke-width="1"/>
  <text x="145" y="268" text-anchor="middle" fill="#e6edf3" font-size="9">measure</text>
  <line x1="174" y1="264" x2="184" y2="264" stroke="#f78166" stroke-width="1" marker-end="url(#arr5o)"/>
  <rect x="186" y="252" width="74" height="24" rx="4" fill="#12122a" stroke="#f78166" stroke-width="1"/>
  <text x="223" y="268" text-anchor="middle" fill="#e6edf3" font-size="9">craft checks</text>
  <line x1="260" y1="264" x2="270" y2="264" stroke="#f78166" stroke-width="1" marker-end="url(#arr5o)"/>
  <rect x="272" y="252" width="44" height="24" rx="4" fill="#12122a" stroke="#f78166" stroke-width="1"/>
  <text x="294" y="268" text-anchor="middle" fill="#e6edf3" font-size="9">guard</text>
  <line x1="316" y1="264" x2="326" y2="264" stroke="#f78166" stroke-width="1" marker-end="url(#arr5o)"/>
  <rect x="328" y="252" width="47" height="24" rx="4" fill="#12122a" stroke="#f78166" stroke-width="1"/>
  <text x="351" y="268" text-anchor="middle" fill="#e6edf3" font-size="9">version</text>

  <text x="52" y="294" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">Craft checks measure the rendered page (font_floor, fill,</text>
  <text x="52" y="308" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">align, nowrap, density, overflow, image and others).</text>
  <text x="52" y="328" fill="#f78166" font-size="9.5" font-weight="bold">A version fails only for what it made worse.</text>
  <text x="52" y="342" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">Old problems on slides it did not make worse stay warnings.</text>
  <text x="52" y="358" fill="#8b8ba0" font-size="9">exit 0: current moves / 1: kept as failed / 2: setup error</text>

  <!-- Revise loop panel -->
  <rect x="400" y="222" width="340" height="146" rx="8" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="570" y="242" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Revise loop: the guard keeps the person's edits</text>

  <rect x="412" y="252" width="56" height="30" rx="4" fill="#1a2e1a" stroke="#7ee787" stroke-width="1"/>
  <text x="440" y="265" text-anchor="middle" fill="#7ee787" font-size="9" font-weight="bold">v001</text>
  <text x="440" y="277" text-anchor="middle" fill="#e6edf3" font-size="8.5" fill-opacity="0.8">by user</text>
  <rect x="476" y="252" width="56" height="30" rx="4" fill="#1a2e1a" stroke="#7ee787" stroke-width="1"/>
  <text x="504" y="265" text-anchor="middle" fill="#7ee787" font-size="9" font-weight="bold">v001-user</text>
  <text x="504" y="277" text-anchor="middle" fill="#e6edf3" font-size="8.5" fill-opacity="0.8">hand edit</text>
  <rect x="540" y="252" width="56" height="30" rx="4" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="568" y="265" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="bold">v002</text>
  <text x="568" y="277" text-anchor="middle" fill="#e6edf3" font-size="8.5" fill-opacity="0.8">agent, ok</text>
  <rect x="604" y="252" width="56" height="30" rx="4" fill="#3b1520" stroke="#f78166" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="632" y="265" text-anchor="middle" fill="#f78166" font-size="9" font-weight="bold">v003</text>
  <text x="632" y="277" text-anchor="middle" fill="#e6edf3" font-size="8.5" fill-opacity="0.8">failed</text>
  <rect x="668" y="252" width="60" height="30" rx="4" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="698" y="265" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="bold">v004</text>
  <text x="698" y="277" text-anchor="middle" fill="#e6edf3" font-size="8.5" fill-opacity="0.8">agent, ok</text>

  <text x="412" y="300" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">1. open --scope s-7f3a: hand edits on disk are saved</text>
  <text x="424" y="314" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">first as a user version, and that is the base.</text>
  <text x="412" y="328" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">2. The agent edits only the slides in the scope.</text>
  <text x="412" y="342" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">3. cut: a slide outside the scope that was modified,</text>
  <text x="424" y="356" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">deleted or moved fails the guard (v003 above).</text>

  <!-- Back to the DDD -->
  <rect x="40" y="386" width="700" height="48" rx="8" fill="#0d2b1a" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="390" y="406" text-anchor="middle" fill="#7ee787" font-size="10.5" font-weight="bold">Back to the DDD: no Pollinate step writes it</text>
  <text x="390" y="423" text-anchor="middle" fill="#e6edf3" font-size="9.5" fill-opacity="0.85">As for any session, the after-session review (CDF) records what is worth keeping into the project's DDD.</text>
</svg>
