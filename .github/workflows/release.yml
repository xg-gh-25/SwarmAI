name: Release

# One release, four targets (design docs/design/2026-10-24-swarmai-usable-by-anyone.md §3.1,
# §5.1): macOS arm64, macOS x64, Windows x64, Linux x64 (AppImage). Every target builds through
# the same path a developer uses (build-backend.sh -> npm run build -> tauri-build.sh, which
# bundles the backend via src-tauri/tauri.bundle.conf.json), then a separate job on a fresh
# runner installs that installer the way a stranger would (scripts/verify_installer.sh, G1/G2).
# Nothing is published unless every target built AND passed verification.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file build-essential

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Create backend .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Install backend Python dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          if [ -d .venv/Scripts ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          source "$bin/activate"
          uv pip install -e ".[dev]"
          p="$PWD/$bin"; command -v cygpath >/dev/null 2>&1 && p="$(cygpath -w "$p")"
          echo "$p" >> "$GITHUB_PATH"

      - name: Update version
        run: bash scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build Python backend
        working-directory: ./desktop
        run: bash scripts/build-backend.sh

      - name: Build frontend
        working-directory: ./desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: ./desktop
        run: bash scripts/tauri-build.sh --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Installer + updater bundle + its minisign .sig, under names unique across targets
      # (both macOS builds would otherwise ship a SwarmAI.app.tar.gz).
      - name: Collect installer
        run: bash .github/scripts/collect-installer.sh "${{ matrix.name }}" "${{ needs.prepare.outputs.version }}" \
               "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  verify:
    # G1/G2 on a fresh runner: no checkout of the build job, no build tools on the PATH the
    # product sees (verify_installer.sh runs it under a test HOME with a stripped PATH).
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            flag: --dmg
            pattern: '*.dmg'
          - name: macos-x64
            os: macos-15-intel
            flag: --dmg
            pattern: '*.dmg'
          - name: windows-x64
            os: windows-latest
            flag: --setup
            pattern: '*-setup.exe'
          - name: linux-x64
            os: ubuntu-22.04
            flag: --appimage
            pattern: '*.AppImage'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/verify_installer.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: installer

      - name: Install and run it like a new user (G1/G2)
        run: |
          inst="$(find installer -maxdepth 1 -type f -name '${{ matrix.pattern }}' | head -1)"
          [ -n "$inst" ] || { echo "no ${{ matrix.pattern }} in the installer artifact"; exit 1; }
          bash scripts/verify_installer.sh ${{ matrix.flag }} "$inst"

  publish:
    # Only when every target built and passed G1/G2: one release, nothing partial (§7 r14).
    needs: [prepare, build, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the latest.json generator script)
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      # The Tauri updater manifest. Every platform must have its bundle and a non-empty
      # signature, or the publish fails (see gen-latest-json.sh).
      - name: Generate latest.json (updater manifest)
        run: |
          bash .github/scripts/gen-latest-json.sh \
            "${{ needs.prepare.outputs.version }}" \
            artifacts \
            release/latest.json
          echo "--- release/latest.json ---"
          cat release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "SwarmAI v${{ needs.prepare.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
