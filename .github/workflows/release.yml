name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Create backend .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Install backend Python dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Update version
        run: bash scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build Python backend
        working-directory: ./desktop
        run: bash scripts/build-backend.sh

      - name: Build frontend
        working-directory: ./desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: ./desktop
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Updater bundle + minisign signature (createUpdaterArtifacts:true + the
      # signing key produce SwarmAI.app.tar.gz AND SwarmAI.app.tar.gz.sig here).
      # The glob '*.tar.gz*' captures BOTH; the publish job reads the .sig into latest.json.
      - name: Upload macOS updater bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-updater
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz*
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Create backend .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Install backend Python dependencies
        working-directory: ./backend
        shell: bash
        run: |
          pip install uv
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/Scripts" >> $GITHUB_PATH

      - name: Update version
        shell: bash
        run: bash scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build application
        working-directory: ./desktop
        shell: bash
        run: npm run build:all
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # Windows updater bundle + sig (NSIS updater artifact). Best-effort like the
      # MSI above — if the path differs on a future tauri version, the publish job
      # omits the windows-x86_64 platform from latest.json rather than failing.
      - name: Upload Windows updater bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-updater
          path: desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip*
          if-no-files-found: warn

  # NOTE: the build-hive CI job was REMOVED (run_eb45c28d). Hive packaging is now
  # LOCAL-ONLY — hive/release.sh sources the full DDD from the daemon workspace
  # (~/.swarm-ai/SwarmWS), which does not exist on a bare CI runner. The Hive tar
  # is therefore no longer a published GitHub Release asset; build it locally with
  # `bash hive/release.sh <version>` on a machine with a populated daemon workspace.

  publish:
    # Run even if Windows fails — the macOS artifact still ships.
    # 'always()' runs on any outcome; the 'if' filters to skip only
    # when the macOS build fails (prepare always succeeds).
    if: ${{ always() && needs.build-macos.result == 'success' }}
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the latest.json generator script)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          find artifacts -name "*-setup.exe" -exec cp {} release/ \;
          find artifacts -name "*.msi" -exec cp {} release/ \;
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          # Updater bundles + their minisign signatures (the .sig siblings the
          # generic *.tar.gz glob above does NOT catch, plus the Windows nsis.zip).
          find artifacts -name "*.tar.gz.sig" -exec cp {} release/ \;
          find artifacts -name "*.nsis.zip" -exec cp {} release/ \;
          find artifacts -name "*.nsis.zip.sig" -exec cp {} release/ \;
          find artifacts -name "checksums.txt" -exec cp {} release/ \;
          ls -la release/

      # Assemble the Tauri updater manifest from the downloaded artifacts and drop
      # it into release/ so the action-gh-release step below uploads it as an asset.
      # Without this the in-app auto-updater 404s on latest.json (silent no-op).
      # The generator (a) reads each platform's .sig contents into the manifest,
      # (b) points urls at the updater BUNDLE not the installer, (c) fails loud if
      # macOS built-but-missing, (d) omits Windows if absent. (publish now requires
      # build-macos success — Hive is local-only, no longer a CI-published asset.)
      - name: Generate latest.json (updater manifest)
        run: |
          bash .github/scripts/gen-latest-json.sh \
            "${{ needs.prepare.outputs.version }}" \
            artifacts \
            release/latest.json \
            "${{ needs.build-macos.result == 'success' }}" \
            "${{ needs.build-windows.result == 'success' }}"
          echo "--- release/latest.json ---"
          cat release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "SwarmAI v${{ needs.prepare.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
