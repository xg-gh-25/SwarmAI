name: Release

# One release, four targets (design docs/design/2026-10-24-swarmai-usable-by-anyone.md §3.1,
# §5.1): macOS arm64, macOS x64, Windows x64, Linux x64 (AppImage). Every target builds through
# the same path a developer uses (build-backend.sh -> npm run build -> tauri-build.sh, which
# bundles the backend via src-tauri/tauri.bundle.conf.json), then a separate job on a fresh
# runner installs that installer the way a stranger would (scripts/verify_installer.sh, G1/G2).
# Nothing is published unless every target built AND passed verification.
#
# The Hive package (build-hive) is built from this clean checkout, so it carries only what
# the repo ships: hive/release.sh without --with-live-ddd, then verify_package.sh --public,
# which fails if the seed holds anything beyond config + public context, then
# smoke_package.sh installs and starts it as a Hive's first boot would. Users' Hives
# download it, with its .sha256, from the release (backend/hive/provisioner.py
# _sync_release_to_s3): only once the draft below is published — a draft is not visible.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      # A dry run builds and verifies every target on fresh runners (the clean-machine
      # install, G1/G2) without publishing: no draft release, no tag, no elastic Hive image.
      # Run it before tagging a release that changes the installer or the build.
      dry_run:
        description: 'Build and verify only; publish nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      agentcore: ${{ steps.agentcore.outputs.enabled }}
    steps:
      # A job's `if` cannot read secrets, so whether the elastic Hive image is pushed
      # (agentcore-image) is decided here: only when both its settings are present.
      - name: Is the elastic Hive image pushed
        id: agentcore
        env:
          REPO: ${{ vars.AGENTCORE_IMAGE_REPO }}
          ROLE: ${{ secrets.AGENTCORE_PUSH_ROLE_ARN }}
        run: |
          if [ -n "$REPO" ] && [ -n "$ROLE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AGENTCORE_IMAGE_REPO or AGENTCORE_PUSH_ROLE_ARN is not set: the elastic Hive image is not pushed"
          fi

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # 24.04: xcap's PipeWire bindings need PipeWire >= 1.0 (22.04 ships 0.3.48,
          # whose spa headers lack spa_meta_first and friends)
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file build-essential
          # xcap (the display screenshot) links PipeWire, XCB, D-Bus, Wayland, EGL and GBM on Linux
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxcb-randr0-dev libxcb-shm0-dev

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Create backend .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Install backend Python dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          if [ -d .venv/Scripts ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          source "$bin/activate"
          uv sync --locked --extra dev --active  # uv.lock: the versions every developer and Hive runs
          p="$PWD/$bin"; command -v cygpath >/dev/null 2>&1 && p="$(cygpath -w "$p")"
          echo "$p" >> "$GITHUB_PATH"

      - name: Update version
        run: bash scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build Python backend
        working-directory: ./desktop
        run: bash scripts/build-backend.sh

      - name: Build frontend
        working-directory: ./desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: ./desktop
        # Linux: linuxdeploy ships an old strip that fails on ubuntu-24.04's libraries
        # (DT_RELR sections), so it is told not to strip; --verbose keeps its own output
        # in the log, which tauri otherwise reduces to "failed to run linuxdeploy".
        run: bash scripts/tauri-build.sh --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ runner.os == 'Linux' && '--verbose' || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}

      # Installer + updater bundle + its minisign .sig, under names unique across targets
      # (both macOS builds would otherwise ship a SwarmAI.app.tar.gz).
      - name: Collect installer
        # A block scalar: in a plain scalar the line break folds to a space, so the "\"
        # escaped that space and the bundle dir reached the script as " desktop/...".
        run: |
          bash .github/scripts/collect-installer.sh "${{ matrix.name }}" "${{ needs.prepare.outputs.version }}" \
            "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" out

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  build-hive:
    needs: prepare
    # arm64, like every Hive (m7g instances): the smoke test then installs the same
    # wheels a Hive will (an x86 runner would pass a dependency with no aarch64 wheel).
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # A Hive installs with python3.12 (backend/hive/user_data.py); the smoke test does too.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Update version
        run: bash scripts/sync-version.sh "$VERSION"

      # The Hive package is built with the backend's own code, so its dependencies are
      # installed first (the same lock a Hive installs).
      - name: Install backend Python dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv sync --locked --active
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build frontend
        working-directory: ./desktop
        run: npm run build

      # No AWS credentials here, so release.sh skips its S3 upload; CI=true makes it
      # refuse --with-live-ddd.
      - name: Package the Hive
        run: bash hive/release.sh "$VERSION"

      - name: Verify it is safe to publish
        run: bash hive/verify_package.sh --public "dist/swarmai-hive-v${VERSION}-linux-arm64.tar.gz"

      # The smoke step also starts the pinned Chromium of Feature Map replay: the runner gets
      # the system libraries it needs from the pinned Playwright's own list (a Hive gets
      # them from hive/replay-host.sh).
      - name: Install the browser's system libraries
        working-directory: ./backend
        run: |
          PW="$(python -c 'from core.feature_map.runtime import PLAYWRIGHT_VERSION; print(PLAYWRIGHT_VERSION)')"
          npx --yes "playwright@${PW}" install-deps chromium

      # Install it the way a Hive's first boot does and start it: /health must report this
      # version, the workspace must be seeded, a non-public route must refuse (401), and the
      # pinned Chromium must start and render text.
      - name: Install and start the package (smoke)
        run: bash hive/smoke_package.sh "dist/swarmai-hive-v${VERSION}-linux-arm64.tar.gz"

      - name: Name the checksum after the package
        run: mv dist/checksums.txt "dist/swarmai-hive-v${VERSION}-linux-arm64.tar.gz.sha256"

      - name: Upload the Hive package
        uses: actions/upload-artifact@v6
        with:
          name: hive-package
          path: |
            dist/swarmai-hive-*.tar.gz
            dist/swarmai-hive-*.tar.gz.sha256
          if-no-files-found: error

  agentcore-image:
    # The elastic Hive image (design docs/design/2026-11-20-swarm-out-multi-carrier.md §6.3):
    # the Hive package just built, plus hive/agentcore/supervisor.py, as a linux/arm64 image
    # pushed as <version> (no moving tag: a Host pins its digest) to the public ECR repository AGENTCORE_IMAGE_REPO
    # (e.g. public.ecr.aws/<alias>/swarmai-hive). Skipped when that variable or the
    # AGENTCORE_PUSH_ROLE_ARN secret is not set; publish does not wait for it, so it never
    # holds back the release.
    needs: [prepare, build-hive]
    if: needs.prepare.outputs.agentcore == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # OIDC for the push role
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: hive/agentcore
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: hive-package
          path: dist

      # Public ECR is served from us-east-1 only.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AGENTCORE_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push the elastic Hive image
        env:
          REPO: ${{ vars.AGENTCORE_IMAGE_REPO }}
        run: bash hive/agentcore/build_image.sh "$VERSION" --push "$REPO"

  verify:
    # G1/G2 on a fresh runner: no checkout of the build job, no build tools on the PATH the
    # product sees (verify_installer.sh runs it under a test HOME with a stripped PATH).
    needs: [prepare, build]
    # a hang guard: a verify takes minutes; a stuck installer would otherwise hold the job
    # for the 6-hour default
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            flag: --dmg
            pattern: '*.dmg'
          - name: macos-x64
            os: macos-15-intel
            flag: --dmg
            pattern: '*.dmg'
          - name: windows-x64
            os: windows-latest
            flag: --setup
            pattern: '*-setup.exe'
          - name: linux-x64
            os: ubuntu-24.04
            flag: --appimage
            pattern: '*.AppImage'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/verify_installer.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: installer

      - name: Install and run it like a new user (G1/G2)
        run: |
          inst="$(find installer -maxdepth 1 -type f -name '${{ matrix.pattern }}' | head -1)"
          [ -n "$inst" ] || { echo "no ${{ matrix.pattern }} in the installer artifact"; exit 1; }
          bash scripts/verify_installer.sh ${{ matrix.flag }} "$inst"

  publish:
    # Only when every target built and passed G1/G2: one release, nothing partial (§7 r14).
    # The `if` adds no status function, so the implicit success() of every need still holds;
    # it only skips publishing on a dry run (inputs is empty on a tag push).
    needs: [prepare, build, verify, build-hive]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the latest.json generator script)
        uses: actions/checkout@v5

      - name: Download all installers
        uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          path: artifacts

      # Kept out of artifacts/: the updater manifest is generated from that directory only.
      - name: Download the Hive package
        uses: actions/download-artifact@v7
        with:
          name: hive-package
          path: hive-package

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          find hive-package -type f -exec cp {} release/ \;
          ls -la release/

      # The Tauri updater manifest. Every platform must have its bundle and a non-empty
      # signature, or the publish fails (see gen-latest-json.sh).
      - name: Generate latest.json (updater manifest)
        run: |
          bash .github/scripts/gen-latest-json.sh \
            "${{ needs.prepare.outputs.version }}" \
            artifacts \
            release/latest.json
          echo "--- release/latest.json ---"
          cat release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "SwarmAI v${{ needs.prepare.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
