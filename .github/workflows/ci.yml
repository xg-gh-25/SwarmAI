name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: smoke import on Linux ────────────────────────────
  # Full test suite runs locally (macOS, 700+ tests, ~3min with xdist).
  # CI only verifies all modules import cleanly on Linux — catches missing
  # deps, syntax errors, and circular imports. DB integration tests need
  # ~/.swarm-ai/ filesystem + async SQLite lifecycle that's flaky on CI.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Create .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Smoke import — all Python modules (Linux)
        working-directory: ./backend
        run: python ../scripts/smoke_import.py

      - name: Lint SKILL.md metadata
        run: python scripts/lint_skills.py

      - name: Build BVT test list
        id: test-list
        working-directory: ./backend
        # CI is a BARE git checkout on a Linux runner — no ~/.swarm-ai workspace,
        # no AWS creds, no built code-graph, no live corpus. The BVT is therefore
        # an ALLOWLIST, not a denylist: a small curated set of pure OS-layer logic
        # tests (guards, classifiers, validators, parsers, scorers, admission rules)
        # that self-verify in that environment. SSOT = tests/bvt_manifest.txt.
        #
        # WHY an allowlist replaced the old "run all files MINUS a grep blacklist":
        # the denylist grew to ~4000 tests as new fs/async/subprocess test files
        # landed; any that HANG on the runner ride the per-test --timeout until the
        # 10-min job wall kills the whole run. A denylist can never bound runtime —
        # every new heavy file silently re-breaks CI. An allowlist bounds it by
        # construction. Import/syntax/circular breaks are covered by smoke_import.py;
        # deployed-system quality lives in the eval OS, not here.
        run: |
          # Read the manifest → space-separated existing test paths.
          FILES=""
          while IFS= read -r line; do
            line="${line%%#*}"                       # strip inline comments
            line="$(echo "$line" | tr -d '[:space:]')"
            [ -z "$line" ] && continue
            f="tests/$line"
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            else
              echo "::error::bvt_manifest.txt lists a missing file: $line"
              exit 1
            fi
          done < tests/bvt_manifest.txt
          echo "files=$FILES" >> $GITHUB_OUTPUT
          COUNT=$(echo $FILES | wc -w)
          echo "BVT: running $COUNT curated test files"

      - name: Run BVT tests
        working-directory: ./backend
        # Blocking gate. The allowlist keeps this fast + green in a bare checkout.
        # --timeout is a hang-guard only (thread method interrupts blocked workers).
        run: |
          SWARMAI_SUITE=1 python -m pytest -n 0 --timeout=60 --timeout-method=thread \
            -q --tb=short -p no:cacheprovider \
            -m "not slow and not pbt" \
            ${{ steps.test-list.outputs.files }}
        timeout-minutes: 8

  # ── Frontend: typecheck + build (fast, ~1min) ───────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Install backend (for seed DB generation)
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          cp .env.example .env

      - name: TypeScript typecheck
        working-directory: ./desktop
        run: npx tsc --noEmit

      # URL path contract gate (run_a1f4c2d8) — the AST twin of urlContract.test.ts.
      # SCOPED config on purpose: `npm run lint` (the full ruleset) is RED on 30
      # pre-existing no-explicit-any / no-unused-vars errors, so it cannot gate
      # anything today. `lint:contract` carries ONLY the double-`/api`-prefix rules and
      # is green, so the class is enforced NOW instead of waiting on that cleanup.
      # Before this step existed the rule was in eslint.config.js but NOTHING ran it —
      # a guard that never executes (the failure mode this repo hit 6 times).
      - name: URL path contract (double /api prefix)
        working-directory: ./desktop
        run: npm run lint:contract

      - name: Run frontend tests
        working-directory: ./desktop
        run: npx vitest run --reporter=verbose
        timeout-minutes: 5

      - name: Build frontend
        working-directory: ./desktop
        run: npm run build

  # ── Backend Windows: smoke import (~1min) ────────────────────
  # Catches Unix-only imports (fcntl, resource, grp) that crash on Windows.
  # Full test suite is Linux-only; this just verifies all modules load.
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        shell: bash
        run: |
          pip install uv
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/Scripts" >> $GITHUB_PATH
          cp .env.example .env

      - name: Smoke import — all Python modules (Windows)
        working-directory: ./backend
        shell: bash
        run: python ../scripts/smoke_import.py

      # Rust cross-platform compile gate (native Windows MSVC). CI never
      # cargo-compiled the Tauri shell, so a #[cfg(target_os)] mismatch (a
      # macOS-only symbol referenced on a path that compiles everywhere) stayed
      # invisible until the tag-triggered release.yml build-windows — v1.28.0
      # shipped with NO Windows assets because of exactly this (E0425/E0433 in
      # spawn_daemon_health_watchdog). `cargo check` (not build — no bundling,
      # ~2-3min) catches that whole class at push time on the real MSVC target.
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust typecheck (Windows MSVC) — catch cross-platform cfg breaks
        working-directory: ./desktop/src-tauri
        shell: bash
        run: cargo check --quiet --all-targets

  # ── Version consistency ───────────
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check all version files match
        run: bash scripts/sync-version.sh check

      # Commit-trailer identity gate REMOVED 2026-08-16. It enforced a cosmetic
      # signature (Co-Authored-By: Swarm), not code quality/security, and could not
      # self-enforce: core.hooksPath redirects git to the corporate git-defender hook
      # set, shadowing the repo-local prepare-commit-msg trailer rewrite, so every
      # direct/parallel-session commit landed trailer-less and required a manual
      # ENFORCED_FROM amnesty (4 in 3 days). Recurring toil for zero quality signal.
      # (fetch-depth: 0 was dropped with it — sync-version.sh reads only worktree
      # files, no git history.) The PreToolUse commit_trailer_gate in security_hooks.py
      # still enforces the trailer at COMMIT time (prevention); this only removed the
      # CI detection half. scripts/check_commit_trailers.py is kept for optional local use.

  # ── Code-security boundary gate (bandit HIGH + detect-secrets) ────────────
  # Server-side HARD gate: fails the job on any NEW high-severity finding or
  # secret not in the committed baselines (bandit-baseline.json / .secrets.baseline).
  # SSOT with the local wrapper — both invoke scripts/security_scan.py.
  # NOTE: this only BLOCKS MERGE once registered as a required status check in the
  # repo's branch-protection settings (a GitHub setting, not a file). Until then it
  # runs and reports but does not gate merge. See run_4b007e00 delivery notes.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deps live in backend/pyproject.toml; install there (each job installs
      # independently). bandit + detect-secrets are pinned in [dev].
      - name: Install security tools
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install bandit==1.9.4 detect-secrets==1.5.0
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      # Run the scan from the REPO ROOT (not ./backend): the scanner anchors its
      # baselines to repo root and bandit/detect-secrets resolve paths relative to
      # CWD. Running elsewhere would silently ignore the baselines (Gate-1 BLOCKER-3).
      - name: Scan for new HIGH findings + secrets
        run: python scripts/security_scan.py
