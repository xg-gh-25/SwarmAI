name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: smoke import on Linux ────────────────────────────
  # Full test suite runs locally (macOS, 700+ tests, ~3min with xdist).
  # CI only verifies all modules import cleanly on Linux — catches missing
  # deps, syntax errors, and circular imports. DB integration tests need
  # ~/.swarm-ai/ filesystem + async SQLite lifecycle that's flaky on CI.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Create .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Smoke import — all Python modules (Linux)
        working-directory: ./backend
        run: python ../scripts/smoke_import.py

      - name: Lint SKILL.md metadata
        run: python scripts/lint_skills.py

      - name: Build non-DB test list
        id: test-list
        working-directory: ./backend
        # CI runners lack WAL-mode SQLite optimization → "database is locked"
        # on any test that touches the DB. Instead of a brittle ignore list,
        # dynamically find test files that DON'T import database/sqlite modules.
        # Also skip: macOS-only (launchd), native deps (ffmpeg).
        run: |
          # All test files that import database/sqlite — skip these
          DB_FILES=$(grep -rl 'from.*database\|import.*sqlite\|SQLiteDatabase\|aiosqlite' tests/ --include='test_*.py' | sort)

          # Also catch tests that reference ~/.swarm-ai/ paths (filesystem-dependent)
          FS_FILES=$(grep -rl '\.swarm-ai\|swarm_data_dir\|SWARM_DATA' tests/ --include='test_*.py' | sort)

          # Catch tests using DB fixtures from conftest.py (indirect DB dependency).
          # These tests don't import database modules directly but use fixtures
          # like db_session, test_db, etc. that are defined in conftest.py.
          DB_FIXTURES=$(grep -l 'from.*database\|import.*sqlite\|SQLiteDatabase\|aiosqlite' tests/conftest.py >/dev/null 2>&1 && \
            grep -oP '(?<=def )\w+(?=\()' tests/conftest.py | head -20 || true)
          FIXTURE_USERS=""
          if [ -n "$DB_FIXTURES" ]; then
            for fixture in $DB_FIXTURES; do
              FIXTURE_USERS="$FIXTURE_USERS $(grep -rl "$fixture" tests/ --include='test_*.py' 2>/dev/null || true)"
            done
          fi

          # Additional skips: macOS-only (launchd), native deps (ffmpeg)
          EXTRA_SKIP="tests/test_daemon_sidecar_robustness.py tests/test_daemon_sidecar_fixes.py tests/test_voice_transcribe.py"

          # Build --ignore flags (deduplicated)
          ALL_SKIP=$(echo $DB_FILES $FS_FILES $FIXTURE_USERS $EXTRA_SKIP | tr ' ' '\n' | sort -u)
          IGNORES=""
          for f in $ALL_SKIP; do
            [ -f "$f" ] && IGNORES="$IGNORES --ignore=$f"
          done
          echo "ignores=$IGNORES" >> $GITHUB_OUTPUT

          # Count for logging
          SKIP_COUNT=$(echo "$IGNORES" | tr ' ' '\n' | grep -c ignore || true)
          ALL_COUNT=$(ls tests/test_*.py | wc -l)
          echo "Skipping $SKIP_COUNT DB/platform test files, running $((ALL_COUNT - SKIP_COUNT))/$ALL_COUNT"

      - name: Run non-DB tests
        working-directory: ./backend
        # Tests now block the pipeline. DB-dependent tests are already excluded
        # by the dynamic ignore list above — remaining tests should always pass.
        run: |
          SWARMAI_SUITE=1 python -m pytest -n 0 --timeout=120 -q --tb=short \
            --override-ini="maxfail=10" \
            -m "not slow and not pbt" \
            ${{ steps.test-list.outputs.ignores }}
        timeout-minutes: 10

  # ── Frontend: typecheck + build (fast, ~1min) ───────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Install backend (for seed DB generation)
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          cp .env.example .env

      - name: TypeScript typecheck
        working-directory: ./desktop
        run: npx tsc --noEmit

      # URL path contract gate (run_a1f4c2d8) — the AST twin of urlContract.test.ts.
      # SCOPED config on purpose: `npm run lint` (the full ruleset) is RED on 30
      # pre-existing no-explicit-any / no-unused-vars errors, so it cannot gate
      # anything today. `lint:contract` carries ONLY the double-`/api`-prefix rules and
      # is green, so the class is enforced NOW instead of waiting on that cleanup.
      # Before this step existed the rule was in eslint.config.js but NOTHING ran it —
      # a guard that never executes (the failure mode this repo hit 6 times).
      - name: URL path contract (double /api prefix)
        working-directory: ./desktop
        run: npm run lint:contract

      - name: Run frontend tests
        working-directory: ./desktop
        run: npx vitest run --reporter=verbose
        timeout-minutes: 5

      - name: Build frontend
        working-directory: ./desktop
        run: npm run build

  # ── Backend Windows: smoke import (~1min) ────────────────────
  # Catches Unix-only imports (fcntl, resource, grp) that crash on Windows.
  # Full test suite is Linux-only; this just verifies all modules load.
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        shell: bash
        run: |
          pip install uv
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/Scripts" >> $GITHUB_PATH
          cp .env.example .env

      - name: Smoke import — all Python modules (Windows)
        working-directory: ./backend
        shell: bash
        run: python ../scripts/smoke_import.py

      # Rust cross-platform compile gate (native Windows MSVC). CI never
      # cargo-compiled the Tauri shell, so a #[cfg(target_os)] mismatch (a
      # macOS-only symbol referenced on a path that compiles everywhere) stayed
      # invisible until the tag-triggered release.yml build-windows — v1.28.0
      # shipped with NO Windows assets because of exactly this (E0425/E0433 in
      # spawn_daemon_health_watchdog). `cargo check` (not build — no bundling,
      # ~2-3min) catches that whole class at push time on the real MSVC target.
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust typecheck (Windows MSVC) — catch cross-platform cfg breaks
        working-directory: ./desktop/src-tauri
        shell: bash
        run: cargo check --quiet --all-targets

  # ── Version consistency check ───────────────────────────────
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check all version files match
        run: bash scripts/sync-version.sh check

  # ── Code-security boundary gate (bandit HIGH + detect-secrets) ────────────
  # Server-side HARD gate: fails the job on any NEW high-severity finding or
  # secret not in the committed baselines (bandit-baseline.json / .secrets.baseline).
  # SSOT with the local wrapper — both invoke scripts/security_scan.py.
  # NOTE: this only BLOCKS MERGE once registered as a required status check in the
  # repo's branch-protection settings (a GitHub setting, not a file). Until then it
  # runs and reports but does not gate merge. See run_4b007e00 delivery notes.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deps live in backend/pyproject.toml; install there (each job installs
      # independently). bandit + detect-secrets are pinned in [dev].
      - name: Install security tools
        working-directory: ./backend
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install bandit==1.9.4 detect-secrets==1.5.0
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      # Run the scan from the REPO ROOT (not ./backend): the scanner anchors its
      # baselines to repo root and bandit/detect-secrets resolve paths relative to
      # CWD. Running elsewhere would silently ignore the baselines (Gate-1 BLOCKER-3).
      - name: Scan for new HIGH findings + secrets
        run: python scripts/security_scan.py
