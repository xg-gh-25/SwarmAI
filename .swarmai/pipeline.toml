# SwarmAI repo settings for pipeline runs (docs/design/2026-10-24-swarmai-usable-by-anyone.md
# §3.3.6). Any repo can declare the same fields; nothing here is special to SwarmAI.

[landing]
author = "swarm"
trailer = "Co-Authored-By: Swarm <swarm@swarmai.dev>"

[worktree]
# Each listed dir becomes a real dir in the worktree whose entries link to the main
# checkout's (core/run_worktree.link_entries): an npm ci there installs into the worktree
# and leaves the main checkout's node_modules alone. An npm install <pkg> there can still
# change a linked @scope/ or .bin/ folder of the main checkout: add packages in the main
# checkout.
# backend/.venv: the dev shim (backend/bin/python-backend) and the tests need the backend's
# interpreter. A pip install inside a worktree still writes into the linked lib/ and so
# changes the main checkout's venv: install in the main checkout.
link = ["desktop/node_modules", "backend/.venv"]

[hive_return]
# Changes a Hive run made here are marked for the reviewer, who reads them with care
# before landing (docs/design/2026-10-28-project-agent-flow.md §7 ⑨; an agent lands them
# once reviewed, except the person-only paths in core/hive_return PERSON_ONLY, which every
# repository has and this list cannot remove): code that guards the agent,
# the agent's own configuration and context, what runs at build or in CI, the manifests.
protected = [
  "backend/core/security_hooks.py", "backend/core/hook_builder.py", "backend/hooks/**",
  "backend/core/project_agent_session.py", "backend/core/tool_risk.py",
  ".claude/**", "CLAUDE.md", "AGENTS.md", "**/AGENTS.md", "backend/context/**",
  "scripts/**", "backend/scripts/**", ".github/**", "prod.sh", "hive/**",
  "backend/pyproject.toml", "backend/requirements*.txt", "desktop/package.json",
  "desktop/package-lock.json", "desktop/src-tauri/**", "desktop/vite.config.*", "desktop/vitest.config.*",
  "**/package.json", "**/conftest.py", "backend/uv.lock", "**/*.lock", ".swarmai/**",
  "**/CLAUDE.md", "**/.claude/**",
]
