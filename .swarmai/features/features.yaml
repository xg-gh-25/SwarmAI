schema: 1
features:
  - id: first-run-setup-q8rx
    title: A fresh install opens the setup wizard, and Configure later reaches the chat
    reach: Start SwarmAI for the first time
    expect: The Setup Wizard asks to connect an AWS account (ADA or AWS SSO); Configure later opens the chat
    target: app
    spec: specs/first-run-setup-q8rx.spec.ts
  - id: pipeline-view-vmna
    title: Open the Pipeline view from the left nav
    reach: Click Pipeline in the left nav
    expect: The Pipeline panel opens inside the window and Close dismisses it
    target: app
    spec: specs/pipeline-view-vmna.spec.ts
  - id: todo-view-55s5
    title: Open ToDo from the left nav
    reach: Click ToDo in the left nav
    expect: The ToDo panel opens inside the window and Close dismisses it
    target: app
    spec: specs/todo-view-55s5.spec.ts
  - id: jobs-view-k98s
    title: Open Jobs & Runs from the left nav
    reach: Click Jobs & Runs in the left nav
    expect: The Jobs & Runs panel opens inside the window and Close dismisses it
    target: app
    spec: specs/jobs-view-k98s.spec.ts
  - id: settings-view-ze9a
    title: Open Settings and close it with Escape
    reach: Click Settings in the left nav
    expect: Settings opens inside the window with its sections; Escape closes it
    target: app
    spec: specs/settings-view-ze9a.spec.ts
  - id: brain-hub-bvcc
    title: Brain Hub shows the two built-in Brains
    reach: Click Brain Hub in the left nav
    expect: The SwarmAI Brain and the General Brain are shown, with New Brain
    target: app
    spec: specs/brain-hub-bvcc.spec.ts
  - id: capabilities-view-6qa4
    title: Apps & Capabilities lists the built-in apps
    reach: Click Apps & Capabilities in the left nav
    expect: The Apps view lists app cards, with Skills, Experts and Connections views to switch to
    target: app
    spec: specs/capabilities-view-6qa4.spec.ts
  - id: chat-tab-draft-nfu9
    title: Each chat tab keeps its own unsent draft
    reach: Type in the chat input, then click New Session, then switch back
    expect: The new tab starts empty; the first tab still holds what was typed
    target: app
    spec: specs/chat-tab-draft-nfu9.spec.ts
  - id: no-account-banner-6atk
    title: With no AWS account, the banner leads to Settings
    reach: Open SwarmAI with no account connected
    expect: A banner says no AWS account is connected; Open settings opens Settings
    target: app
    spec: specs/no-account-banner-6atk.spec.ts
  - id: api-health-q56c
    title: The backend answers health checks
    target: app
    run: [curl, -sf, "http://127.0.0.1:{port.api}/health"]
  - id: chat-send-stream-h4kw
    title: Send a message and watch the reply stream in
    reach: Type a message in a new chat tab and press Enter
    expect: The reply appears in full, the input is free again, and the reply is still there after a reload
    target: app
    spec: specs/chat-send-stream-h4kw.spec.ts
  - id: chat-tool-card-m2rp
    title: A tool call shows as a step with its command, then the answer that uses it
    reach: Ask for something the agent runs a command for
    expect: A Worked group with 1 step; opened, it shows Bash and the command; the answer quotes the output
    target: app
    spec: specs/chat-tool-card-m2rp.spec.ts
  - id: chat-tabs-apart-x7tn
    title: Two tabs stream at the same time and keep their own replies
    reach: Send in one tab, open a new tab while it streams, send there too
    expect: The second tab finishes while the first still streams; each tab shows only its own reply
    target: app
    spec: specs/chat-tabs-apart-x7tn.spec.ts
  - id: chat-stop-p9ds
    title: Stop a reply while it streams
    reach: Press Stop while the reply streams
    expect: Streaming ends at once, the turn says Stopped by you, nothing more is added to it, and the next message gets its answer
    target: app
    spec: specs/chat-stop-p9ds.spec.ts
  - id: chat-model-error-b3qz
    title: A request the model refuses shows one error and the chat goes on
    reach: Send a message the model refuses
    expect: The error is shown once with how to go on; no spinner stays; the next message gets its answer; after a reload the error is still shown, once
    target: app
    spec: specs/chat-model-error-b3qz.spec.ts
  - id: chat-thinking-t5wq
    title: A reply that thinks first shows its thought and the chat goes on
    reach: Send a message the model thinks about before it answers
    expect: The thought is shown with the answer; the next message, which sends the thought back, gets its answer
    target: app
    spec: specs/chat-thinking-t5wq.spec.ts
