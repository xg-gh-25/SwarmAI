# owns (schema 2): which changes replay which walk. A path no feature owns replays all of
# them (the app shell, chat page, i18n, services, packages, most of backend/core). Two
# groups own code no walk exercises past start-up: api-health-q56c owns backend parts
# that only load at start-up (Inbox, Hive and Swarm Out, eval, job handlers, CLI
# scripts), and no-account-banner-6atk, the walk that loads the UI, owns the overlays no
# walk opens (each a lazy chunk). The chat walks co-own the turn path's gates, recall
# and prompt sources (run_protocol, ingestion, feature_map, skills, context).
schema: 2
