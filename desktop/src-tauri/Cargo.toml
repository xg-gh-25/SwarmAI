[package]
name = "swarmai"
version = "2.0.1"
description = "SwarmAI - Human directs. AI delivers."
authors = ["REDACTED_NAME"]
edition = "2021"

[lib]
name = "swarmai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Integrated-terminal PTY engine (wezterm's portable-pty). The ~180-line glue in
# src/terminal.rs is vendored from Tnze/tauri-plugin-pty (MIT); portable-pty
# itself is the real cross-platform PTY engine and is depended on directly.
portable-pty = { version = "0.9", features = ["serde_support"] }
# One-tap screen capture (macOS → ScreenCaptureKit under the hood). Powers the
# `screen_capture_current_display` command: grabs the display the cursor is on
# and writes a PNG under ~/.swarm-ai/tmp/screenshots/ for the chat attachment pipeline.
xcap = "0.9"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# portpicker removed — daemon uses fixed port 18321, no dynamic port allocation
futures = "0.3"
# Pin transitive `time` (pulled via cookie 0.18.1 -> tauri). time 0.3.52 changed
# Parsable::parse to 2 args and breaks cookie 0.18.1 compile (E0061). Resolver-level
# pin so no `cargo update` (incl. our auto-bump pipeline) can re-select 0.3.52.
# Remove when cookie ships a 0.3.52-compatible release.
time = "=0.3.51"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
