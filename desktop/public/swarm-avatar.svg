  <!-- honeycomb cell (swarm DNA) -->
  <polygon points="100,30 162,65 162,135 100,170 38,135 38,65" fill="url(#swarmHex)"/>
  <!-- negative-space S monogram -->
  <path d="M128 74 C128 60 114 54 100 54 C84 54 73 63 73 76 C73 88 84 92 100 95 C116 98 127 102 127 114 C127 127 115 133 100 133 C86 133 73 127 72 114"
        fill="none" stroke="#101527" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
