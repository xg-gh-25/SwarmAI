<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1320" width="1920" height="1320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0e14"/>
      <stop offset="100%" style="stop-color:#10131a"/>
    </linearGradient>
    <marker id="arrowMuted" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7B89A8"/>
    </marker>
    <marker id="arrowWheat" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#C9A96E"/>
    </marker>
    <marker id="arrowSage" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6FA88B"/>
    </marker>
  </defs>
  <rect width="1920" height="1320" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="72" font-family="Inter, -apple-system, Arial" font-size="40" font-weight="700" fill="#E8E4E0">SwarmAI Eval OS</text>
  <text x="80" y="108" font-family="Inter, -apple-system, Arial" font-size="21" fill="#8B8D94">Decoupled system-level subsystem · proprioception, not external testing · three layers: golden exam + real-session harvest + online scoring</text>
  <text x="80" y="138" font-family="Inter, -apple-system, Arial" font-size="18" fill="#C9A96E">Never run by the agent &#183; never inside a coding pipeline (that would test the OLD binary)</text>

  <!-- ================= (1) WRITE ================= -->
  <rect x="80" y="180" width="410" height="360" rx="12" fill="#13151C" stroke="#2A2E3A" stroke-width="1.5"/>
  <text x="104" y="222" font-family="Inter, -apple-system, Arial" font-size="24" font-weight="700" fill="#C9A96E">&#9312; WRITE &#183; bridge-in</text>
  <text x="104" y="252" font-family="Inter, -apple-system, Arial" font-size="16" fill="#8B8D94">s_golden-case &#8212; the ONLY sanctioned write</text>

  <rect x="104" y="274" width="362" height="96" rx="8" fill="#171A24" stroke="#2A2E3A"/>
  <text x="120" y="300" font-family="Inter, -apple-system, Arial" font-size="15" fill="#A8B0C0">sources</text>
  <text x="120" y="324" font-family="monospace" font-size="14" fill="#B8B4AF">&#8226; corrections.jsonl (user catches)</text>
  <text x="120" y="345" font-family="monospace" font-size="14" fill="#B8B4AF">&#8226; session behaviors (real trajectories)</text>
  <text x="120" y="366" font-family="monospace" font-size="14" fill="#B8B4AF">&#8226; manual authoring</text>

  <rect x="104" y="384" width="362" height="140" rx="8" fill="#1A1610" stroke="#3A3222"/>
  <text x="120" y="410" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#D4AA6B">4-gate admission</text>
  <text x="120" y="434" font-family="monospace" font-size="13.5" fill="#B8B4AF">1 &#183; schema   2 &#183; duplicate</text>
  <text x="120" y="456" font-family="monospace" font-size="13.5" fill="#B8B4AF">3 &#183; non-vacuous   4 &#183; privacy &#9733;</text>
  <text x="120" y="482" font-family="monospace" font-size="13" fill="#8B8D94">ADD &#8594; private by default</text>
  <text x="120" y="502" font-family="monospace" font-size="13" fill="#8B8D94">PROMOTE &#8594; privacy-checked</text>

  <!-- arrow WRITE -> GOLDEN -->
  <line x1="490" y1="360" x2="560" y2="360" stroke="#C9A96E" stroke-width="2" marker-end="url(#arrowWheat)"/>

  <!-- ================= (2) GOLDEN SET ================= -->
  <rect x="560" y="180" width="470" height="500" rx="12" fill="#13151C" stroke="#2A2E3A" stroke-width="1.5"/>
  <text x="584" y="222" font-family="Inter, -apple-system, Arial" font-size="24" font-weight="700" fill="#6FA88B">&#9313; GOLDEN SET &#183; source of truth</text>
  <text x="584" y="250" font-family="monospace" font-size="14" fill="#8B8D94">Eval/ &#8212; top-level in SwarmWS (sibling of Projects/)</text>

  <rect x="584" y="266" width="212" height="92" rx="8" fill="#171A24" stroke="#2A4A3A"/>
  <text x="600" y="292" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#6FA88B">Public &#183; git-tracked</text>
  <text x="600" y="316" font-family="monospace" font-size="13" fill="#B8B4AF">golden_set.yaml</text>
  <text x="600" y="340" font-family="monospace" font-size="12.5" fill="#8B8D94">shareable, no private data</text>

  <rect x="808" y="266" width="198" height="92" rx="8" fill="#1A1610" stroke="#3A2A2A"/>
  <text x="824" y="292" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#C75B4A">Private &#183; gitignored</text>
  <text x="824" y="316" font-family="monospace" font-size="12.5" fill="#B8B4AF">golden_set.private.yaml</text>
  <text x="824" y="340" font-family="monospace" font-size="12.5" fill="#8B8D94">never leaves the box</text>

  <text x="584" y="392" font-family="Inter, -apple-system, Arial" font-size="16" font-weight="600" fill="#A8B0C0">every case tagged on 4 orthogonal axes</text>

  <rect x="584" y="408" width="422" height="60" rx="6" fill="#171A24" stroke="#2A2E3A"/>
  <text x="600" y="432" font-family="Inter, -apple-system, Arial" font-size="14" font-weight="600" fill="#8BAFD4">Category (15)</text>
  <text x="600" y="454" font-family="monospace" font-size="12" fill="#8B8D94">decision compliance recall safety memory runtime_health &#8230;</text>

  <rect x="584" y="476" width="422" height="60" rx="6" fill="#171A24" stroke="#2A2E3A"/>
  <text x="600" y="500" font-family="Inter, -apple-system, Arial" font-size="14" font-weight="600" fill="#C9A96E">Dimension (6)</text>
  <text x="600" y="522" font-family="monospace" font-size="12" fill="#8B8D94">factual_accuracy judgment_quality context_utility compliance capability recovery</text>

  <rect x="584" y="544" width="208" height="56" rx="6" fill="#171A24" stroke="#2A2E3A"/>
  <text x="600" y="568" font-family="Inter, -apple-system, Arial" font-size="14" font-weight="600" fill="#A8B0C0">Tier</text>
  <text x="600" y="588" font-family="monospace" font-size="12" fill="#8B8D94">draft&#8594;active&#8594;stable</text>

  <rect x="800" y="544" width="206" height="56" rx="6" fill="#171A24" stroke="#2A2E3A"/>
  <text x="816" y="568" font-family="Inter, -apple-system, Arial" font-size="14" font-weight="600" fill="#A8B0C0">Method</text>
  <text x="816" y="588" font-family="monospace" font-size="11.5" fill="#8B8D94">programmatic &#183; llm &#183; behavior</text>

  <rect x="584" y="612" width="422" height="52" rx="6" fill="#12171C" stroke="#2A3A3A"/>
  <text x="600" y="636" font-family="Inter, -apple-system, Arial" font-size="13" font-weight="600" fill="#6FA88B">GUARD &#183; _validate_case_taxonomy (load-time, warn-not-raise)</text>
  <text x="600" y="656" font-family="monospace" font-size="12" fill="#8B8D94">category &amp; dimension axes independent &#183; each maps to a report bucket (bijective)</text>

  <!-- arrow GOLDEN -> EXECUTE -->
  <line x1="1030" y1="420" x2="1100" y2="420" stroke="#6FA88B" stroke-width="2" marker-end="url(#arrowSage)"/>

  <!-- ================= (3) EXECUTE ================= -->
  <rect x="1100" y="180" width="740" height="500" rx="12" fill="#13151C" stroke="#2A2E3A" stroke-width="1.5"/>
  <text x="1124" y="222" font-family="Inter, -apple-system, Arial" font-size="24" font-weight="700" fill="#8BAFD4">&#9314; EXECUTE &#183; eval_runner</text>
  <text x="1124" y="250" font-family="monospace" font-size="14" fill="#C75B4A">&#9938; runtime reads NO DDD &#183; same env as agent &#183; reads real rules files</text>
  <text x="1124" y="274" font-family="monospace" font-size="13.5" fill="#8B8D94">spawn real agent &#183; score each case 0&#8594;100 &#183; code_digest binds score to a commit</text>

  <rect x="1124" y="292" width="228" height="200" rx="8" fill="#171A24" stroke="#2A3A2E"/>
  <text x="1140" y="318" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#6FA88B">Programmatic</text>
  <text x="1140" y="338" font-family="monospace" font-size="12" fill="#8B8D94">deterministic &#183; cheap &#183; $0</text>
  <text x="1140" y="366" font-family="monospace" font-size="12.5" fill="#B8B4AF">canary_pass</text>
  <text x="1140" y="388" font-family="monospace" font-size="12.5" fill="#B8B4AF">file_contains</text>
  <text x="1140" y="410" font-family="monospace" font-size="12.5" fill="#B8B4AF">keyword_match</text>
  <text x="1140" y="432" font-family="monospace" font-size="12.5" fill="#B8B4AF">trajectory_exact / in_order / any_order</text>
  <text x="1140" y="454" font-family="monospace" font-size="12.5" fill="#B8B4AF">runtime_health (fault-injection)</text>
  <text x="1140" y="478" font-family="monospace" font-size="12" fill="#6B6E76">objective pass/fail</text>

  <rect x="1364" y="292" width="228" height="200" rx="8" fill="#171A24" stroke="#3A3222"/>
  <text x="1380" y="318" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#C9A96E">LLM Judge</text>
  <text x="1380" y="338" font-family="monospace" font-size="12" fill="#8B8D94">model-graded &#183; subjective</text>
  <text x="1380" y="366" font-family="monospace" font-size="12.5" fill="#B8B4AF">goal_success</text>
  <text x="1380" y="388" font-family="monospace" font-size="12.5" fill="#B8B4AF">quality_score</text>
  <text x="1380" y="414" font-family="monospace" font-size="12" fill="#6B6E76">rubric-based grading</text>
  <text x="1380" y="454" font-family="monospace" font-size="12" fill="#C75B4A">&#9888; judge-infra fail</text>
  <text x="1380" y="474" font-family="monospace" font-size="12" fill="#C75B4A">&#8594; ERRORED, excluded from score</text>

  <rect x="1604" y="292" width="212" height="200" rx="8" fill="#171A24" stroke="#2A2E3A"/>
  <text x="1620" y="318" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#8BAFD4">Behavior</text>
  <text x="1620" y="338" font-family="monospace" font-size="12" fill="#8B8D94">spawns real agent</text>
  <text x="1620" y="366" font-family="monospace" font-size="12.5" fill="#B8B4AF">trajectory_capture</text>
  <text x="1620" y="392" font-family="monospace" font-size="12" fill="#6B6E76">captures real tool trajectory</text>
  <text x="1620" y="420" font-family="monospace" font-size="12" fill="#6B6E76">costly &#183; weekly cadence</text>

  <rect x="1124" y="508" width="692" height="60" rx="8" fill="#12171C" stroke="#2A3A3A"/>
  <text x="1140" y="534" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="700" fill="#6FA88B">&#9733; BVT &#183; Spine Probe</text>
  <text x="1140" y="556" font-family="monospace" font-size="13" fill="#B8B4AF">&#8220;alive &#8800; correct&#8221; &#8212; asserts SUBSTANCE (fill ratio, both legs ran), not existence</text>

  <rect x="1124" y="584" width="692" height="72" rx="8" fill="#171A24" stroke="#2A2E3A"/>
  <text x="1140" y="610" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="600" fill="#A8B0C0">Run Report &#8594; EvalHistory/ (per-run snapshot, git-bound)</text>
  <text x="1140" y="634" font-family="monospace" font-size="13" fill="#8B8D94">overall score + per-dimension + BVT green/red + code_digest</text>

  <!-- ================= (4) CONSUME / TRIGGERS ================= -->
  <rect x="80" y="720" width="1760" height="300" rx="12" fill="#13151C" stroke="#2A2E3A" stroke-width="1.5"/>
  <text x="104" y="762" font-family="Inter, -apple-system, Arial" font-size="24" font-weight="700" fill="#C9A96E">&#9315; CONSUME &#183; TRIGGERS &#8212; the ONLY 3 ways eval runs</text>
  <text x="104" y="790" font-family="monospace" font-size="15" fill="#C75B4A">never the agent &#183; never mid-pipeline (eval_command_guard enforces)</text>

  <rect x="104" y="810" width="550" height="190" rx="8" fill="#1A1010" stroke="#3A2A2A"/>
  <text x="124" y="840" font-family="Inter, -apple-system, Arial" font-size="18" font-weight="700" fill="#E8694E">CI gate &#183; post-push</text>
  <text x="124" y="866" font-family="monospace" font-size="13.5" fill="#B8B4AF">ci_eval_gate &#183; git-bound via code_digest</text>
  <text x="124" y="890" font-family="monospace" font-size="13.5" fill="#B8B4AF">HARD stop &#183; blocks merge on regression</text>
  <text x="124" y="920" font-family="monospace" font-size="13" fill="#8B8D94">formal confirmation of an</text>
  <text x="124" y="940" font-family="monospace" font-size="13" fill="#8B8D94">already-qualified change</text>

  <rect x="684" y="810" width="550" height="190" rx="8" fill="#1A1610" stroke="#3A3222"/>
  <text x="704" y="840" font-family="Inter, -apple-system, Arial" font-size="18" font-weight="700" fill="#D4AA6B">Deploy &#183; release</text>
  <text x="704" y="866" font-family="monospace" font-size="13.5" fill="#B8B4AF">prod.sh release &#183; hard-stop gate</text>
  <text x="704" y="890" font-family="monospace" font-size="13.5" fill="#B8B4AF">no ship if BVT red / below baseline</text>
  <text x="704" y="920" font-family="monospace" font-size="13" fill="#8B8D94">scores the binary about to ship</text>

  <rect x="1264" y="810" width="552" height="190" rx="8" fill="#12171C" stroke="#2A3A3A"/>
  <text x="1284" y="840" font-family="Inter, -apple-system, Arial" font-size="18" font-weight="700" fill="#6FA88B">Scheduled &#183; drift watch</text>
  <text x="1284" y="866" font-family="monospace" font-size="13.5" fill="#B8B4AF">Monday 12:30 ICT (cron 30 4 * * 1)</text>
  <text x="1284" y="890" font-family="monospace" font-size="13.5" fill="#B8B4AF">machine on, creds fresh &#183; never gates</text>
  <text x="1284" y="920" font-family="monospace" font-size="13" fill="#8B8D94">BVT-red / score-drop &#8594; Slack alert</text>
  <text x="1284" y="948" font-family="monospace" font-size="12.5" fill="#6B6E76">weekly &#8212; behavior cases spawn real agents (slow/costly)</text>

  <!-- report -> consume arrow -->
  <line x1="1460" y1="680" x2="1460" y2="720" stroke="#7B89A8" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <text x="1475" y="708" font-family="monospace" font-size="12" fill="#6B6E76">Dashboard (7 tabs) reads these snapshots &#8212; pure projection</text>

  <!-- ================= LAYER 2+3: REAL-SESSION QUALITY LOOP (shipped 2026-07-28) ================= -->
  <rect x="80" y="1050" width="1760" height="230" rx="12" fill="#101820" stroke="#2A3A3A" stroke-width="1.5"/>
  <text x="104" y="1092" font-family="Inter, -apple-system, Arial" font-size="24" font-weight="700" fill="#6FA88B">Layer &#9313;&#9314; &#183; REAL-SESSION QUALITY LOOP</text>
  <text x="104" y="1120" font-family="monospace" font-size="15" fill="#8B8D94">weekly job &#183; closes the loop: online scoring (&#9314;) feeds golden harvest (&#9313;) feeds recurrence-prevention (&#9312;)</text>

  <!-- 5-step flow boxes -->
  <rect x="104" y="1140" width="300" height="110" rx="8" fill="#12171C" stroke="#2A3A3A"/>
  <text x="120" y="1168" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="700" fill="#8BAFD4">&#9314; sample sessions</text>
  <text x="120" y="1192" font-family="monospace" font-size="13" fill="#B8B4AF">up to 10 owner sessions/wk</text>
  <text x="120" y="1212" font-family="monospace" font-size="13" fill="#B8B4AF">with-correction OR turn-anomaly</text>
  <text x="120" y="1234" font-family="monospace" font-size="12.5" fill="#6B6E76">most likely to carry signal</text>

  <line x1="404" y1="1195" x2="452" y2="1195" stroke="#6FA88B" stroke-width="2" marker-end="url(#arrowSage)"/>

  <rect x="452" y="1140" width="300" height="110" rx="8" fill="#12171C" stroke="#2A3A3A"/>
  <text x="468" y="1168" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="700" fill="#8BAFD4">&#9314; score (2 judges)</text>
  <text x="468" y="1192" font-family="monospace" font-size="13" fill="#B8B4AF">goal-success + tool-selection</text>
  <text x="468" y="1212" font-family="monospace" font-size="13" fill="#B8B4AF">+ attribution dimension</text>
  <text x="468" y="1234" font-family="monospace" font-size="12.5" fill="#6B6E76">&lt;0.6 &#8594; low-score, drift radar</text>

  <line x1="752" y1="1195" x2="800" y2="1195" stroke="#6FA88B" stroke-width="2" marker-end="url(#arrowSage)"/>

  <rect x="800" y="1140" width="300" height="110" rx="8" fill="#12171C" stroke="#2A3A3A"/>
  <text x="816" y="1168" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="700" fill="#6FA88B">&#9313; harvest DRAFT</text>
  <text x="816" y="1192" font-family="monospace" font-size="13" fill="#B8B4AF">low-scorer &#8594; golden draft</text>
  <text x="816" y="1212" font-family="monospace" font-size="13" fill="#B8B4AF">tier=draft &#183; passes refs gate</text>
  <text x="816" y="1234" font-family="monospace" font-size="12.5" fill="#6B6E76">assertion-style expectation</text>

  <line x1="1100" y1="1195" x2="1148" y2="1195" stroke="#6FA88B" stroke-width="2" marker-end="url(#arrowSage)"/>

  <rect x="1148" y="1140" width="300" height="110" rx="8" fill="#1A1610" stroke="#3A3222"/>
  <text x="1164" y="1168" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="700" fill="#D4AA6B">&#128100; human ratify</text>
  <text x="1164" y="1192" font-family="monospace" font-size="13" fill="#B8B4AF">Session Quality tab: Promote</text>
  <text x="1164" y="1212" font-family="monospace" font-size="13" fill="#B8B4AF">draft&#8594;active (kept private)</text>
  <text x="1164" y="1234" font-family="monospace" font-size="12.5" fill="#C75B4A">system NEVER auto-promotes</text>

  <line x1="1448" y1="1195" x2="1496" y2="1195" stroke="#6FA88B" stroke-width="2" marker-end="url(#arrowSage)"/>

  <rect x="1496" y="1140" width="320" height="110" rx="8" fill="#12171C" stroke="#2A3A3A"/>
  <text x="1512" y="1168" font-family="Inter, -apple-system, Arial" font-size="15" font-weight="700" fill="#6FA88B">&#9312; prevent recurrence</text>
  <text x="1512" y="1192" font-family="monospace" font-size="13" fill="#B8B4AF">active case runs every cycle</text>
  <text x="1512" y="1212" font-family="monospace" font-size="13" fill="#B8B4AF">real crash &#8594; permanent regression</text>
  <text x="1512" y="1234" font-family="monospace" font-size="12.5" fill="#6B6E76">discover &#8594; crystallize &#8594; guard</text>

  <!-- feedback arc: the loop feeds back into (1) WRITE sources (session behaviors) -->
  <path d="M 900 1140 C 640 1000, 120 760, 78 360" fill="none" stroke="#6FA88B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowSage)"/>
  <text x="520" y="1030" font-family="monospace" font-size="13" fill="#6FA88B">harvested drafts flow back into &#9312; WRITE &#183; sources (session behaviors)</text>
</svg>
