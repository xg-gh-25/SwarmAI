<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/swarm-avatar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwarmAI</title>
    <meta name="color-scheme" content="light dark" />
    <!-- FOUC Prevention: Apply theme + accent before CSS loads.
         Also sets .no-transitions to prevent CSS transition on first paint. -->
    <script>
      (function() {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem('theme');
          var accent = localStorage.getItem('accentColor');
          var resolved = theme === 'light' ? 'light'
            : theme === 'dark' ? 'dark'
            : (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
          d.classList.add(resolved, 'no-transitions');
          if (accent && accent !== 'blue') d.dataset.accent = accent;
        } catch (e) {
          document.documentElement.classList.add('dark', 'no-transitions');
        }
      })();
    </script>
    <!-- Fonts loaded locally via npm packages - see main.tsx -->
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
