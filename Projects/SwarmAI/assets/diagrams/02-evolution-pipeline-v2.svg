  <rect width="800" height="580" fill="#1a1a2e" rx="8"/>
  <text x="400" y="36" fill="#f39c12" font-size="18" font-weight="bold" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Evolution Pipeline v2: MINE &#x2192; ASSESS &#x2192; ACT &#x2192; AUDIT</text>
  <text x="400" y="54" fill="#95a5a6" font-size="12" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Confidence-gated self-improvement with data-driven deployment</text>
