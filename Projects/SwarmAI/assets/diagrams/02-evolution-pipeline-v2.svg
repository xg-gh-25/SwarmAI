  <text x="640" y="318" fill="#e74c3c" font-size="10" font-weight="bold" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">LOW  &lt; 0.3  &#x2192;  Log Only</text>
  <text x="640" y="346" fill="#95a5a6" font-size="10" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Insufficient data, keep observing</text>
