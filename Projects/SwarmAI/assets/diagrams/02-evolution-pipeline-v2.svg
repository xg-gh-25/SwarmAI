  <text x="555" y="117" fill="#95a5a6" font-size="11" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">EvolutionOptimizer</text>
  <text x="555" y="133" fill="#95a5a6" font-size="11" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">applies changes</text>
