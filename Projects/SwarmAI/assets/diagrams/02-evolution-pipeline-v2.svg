  <text x="497" y="482" fill="#95a5a6" font-size="10" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">KEEP  &#x2192;  promote</text>
  <text x="497" y="498" fill="#95a5a6" font-size="10" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">REVERT  &#x2192;  rollback</text>
  <text x="497" y="514" fill="#95a5a6" font-size="10" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">ITERATE  &#x2192;  re-mine</text>
