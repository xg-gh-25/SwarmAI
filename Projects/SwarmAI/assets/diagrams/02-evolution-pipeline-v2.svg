  <text x="105" y="118" fill="#95a5a6" font-size="10" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">DailyActivity logs</text>
  <text x="105" y="136" fill="#95a5a6" font-size="10" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Session transcripts</text>
