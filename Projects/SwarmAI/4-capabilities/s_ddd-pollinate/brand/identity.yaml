# DDD Brand Identity — fill this with YOUR project's brand before pollinating.
# This is a TEMPLATE shipped with the DDD-native pollinate. The DDD that owns this
# skill supplies its own identity here (name/tagline/colors/logo). The technical
# defaults below (typography sizes, LUFS target, voice backends) are generic and
# safe to keep. Source the brand values from THIS DDD's ② PRODUCT.md.
#
# Placeholders {{...}} MUST be replaced. Everything else has a working default.

brand:
  name: "{{PROJECT_NAME}}"
  tagline: "{{TAGLINE}}"
  tagline_en: "{{TAGLINE_EN}}"
  emoji: "{{EMOJI}}"                 # e.g. "🐝" — one glyph used as compact logo
  author: "{{PROJECT_AUTHOR}}"       # PDF /Author metadata; your name/org
  link: "{{PROJECT_LINK}}"           # canonical URL (repo/site) — omit if none
  logo:
    primary: "{{EMOJI}} {{PROJECT_NAME}}"
    compact: "{{EMOJI}}"
    full: "{{EMOJI}} {{PROJECT_NAME}} | {{TAGLINE}}"

colors:
  # Replace with your brand palette. Defaults are neutral, not SwarmAI-specific.
  primary: "{{COLOR_PRIMARY}}"       # e.g. "#FF6B35" — hero text + CTA accent
  secondary: "{{COLOR_SECONDARY}}"   # e.g. "#1B2838" — depth/professional
  accent: "{{COLOR_ACCENT}}"         # e.g. "#4ECDC4" — highlight
  background_light: "#FAFAFA"        # generic off-white (safe default)
  background_dark: "#1A1A2E"         # generic charcoal (safe default)
  text: "#2D3436"                    # near-black (safe default)
  success: "#00B894"
  warning: "#FDCB6E"

typography:
  # Generic cross-platform defaults — safe to keep as-is.
  chinese: "PingFang SC"
  chinese_fallback: "Noto Sans SC"
  english: "Inter"
  code: "SF Mono, JetBrains Mono, Menlo, Monaco"
  data: "DIN Pro Bold"
  sizes:
    hero: 96
    section: 80
    card_title: 38
    body: 32
    caption: 24
    code: 28

voice:
  # Generic TTS defaults — keep unless the DDD has a brand voice.
  default_backend: "polly"
  default_voice_zh: "Zhiyu"      # neural, cmn-CN
  default_voice_en: "Ruth"       # generative, en-US
  fallback_backend: "edge"       # free fallback when AWS creds unavailable
  default_rate: "+0%"
  style: "professional-casual, direct"
  note: "Keep the same voice across all this DDD's content for brand consistency."

audio:
  bgm_volume: 0.05               # relative gain on top of master
  bgm_target_lufs: -23           # YouTube integrated loudness standard
  bgm_note: "Target -23 LUFS for YouTube compliance."
  default_bgm: "{{BGM_NAME_OR_NONE}}"   # supply your own asset, or omit BGM

# Optional per-domain visual overrides — add entries keyed by this DDD's own domains.
# Each: theme (light/dark), primary_override (accent color), visual_note.
domain_themes: {}

# Optional content-series naming — name your DDD's content lines here.
# Each: name, format (long video / short video / mixed), platforms list.
series: {}
