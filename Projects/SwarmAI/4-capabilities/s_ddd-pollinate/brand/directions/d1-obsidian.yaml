# D1: Obsidian (黑曜石)
# Mood: 专业冷峻 — "深夜工作室，屏幕微光"
# Use for: 技术解读、架构分享、深度分析、代码片段、数据指标
# Backward-compatible with existing dark+gold poster theme

id: d1
name: Obsidian
name_cn: 黑曜石
mood: "深夜工作室，屏幕微光"

# ─── Semantic Tokens ───────────────────────────────────────
tokens:
  bg-deep: "#0A0A0B"                    # Near-OLED black canvas
  bg-elevated: "#111113"                 # Card/container surface
  bg-surface: "rgba(255,255,255,0.03)"   # Subtle surface tint
  border: "rgba(255,255,255,0.06)"       # Dividers, card borders
  accent: "#D4A853"                      # Gold — primary highlight
  accent-dim: "rgba(212,168,83,0.15)"    # Gold at low opacity (tag bg)
  accent-glow: "rgba(212,168,83,0.06)"   # Radial glow effect
  text-primary: "#FFFFFF"                # Headlines
  text-secondary: "rgba(255,255,255,0.7)" # Body text
  text-muted: "rgba(255,255,255,0.4)"    # Captions, metadata
  accent-secondary: "#D4A853"            # Same as accent (single-accent direction)

# ─── Typography ────────────────────────────────────────────
typography:
  headline-font: "PingFang SC"
  headline-weight: 600
  body-font: "PingFang SC"
  body-weight: 300
  code-font: "SF Mono"
  en-display: "Inter"
  en-display-weight: 600

# ─── Visual Elements ───────────────────────────────────────
visual_elements:
  - "Radial gold glow behind hero text (accent-glow, 200px radius)"
  - "1px vertical dividers with gold gradient (fade to transparent at ends)"
  - "Geometric ring/orb decorations (accent at 8% opacity)"
  - "Gold left-border (3px) for pullquotes"
  - "Dot dividers: 6px circle, accent at 30% opacity"

# ─── Divider Alternation ──────────────────────────────────
dividers:
  - type: line
    spec: "1px × 60px, linear-gradient(to bottom, transparent, accent, transparent)"
  - type: dot
    spec: "6px circle, accent at 30% opacity"

# ─── Card Variety (6 styles, never consecutive repeat) ─────
card_styles:
  1: "Full dramatic — gold left-border on body"
  2: "Visual accent — abstract geometric (rings/orbs)"
  3: "Contained card — border + 16px radius + watermark"
  4: "Centered manifesto — minimal, text-only"
  5: "Pullquote — gold-tinted quote block"
  6: "Finale — elevated bg + geometric accent"

# ─── Content Affinity ─────────────────────────────────────
content_triggers:
  strong:
    - "has_code_blocks"
    - "is_technical_architecture"
    - "is_system_design"
  moderate:
    - "has_data_metrics"
    - "is_deep_analysis"
    - "is_engineering_philosophy"
  weak:
    - "is_general_thought_piece"

# ─── CSS Quick Reference (for LLM injection) ──────────────
css_snippet: |
  :root {
    --bg-deep: #0A0A0B;
    --bg-elevated: #111113;
    --bg-surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.06);
    --accent: #D4A853;
    --accent-dim: rgba(212,168,83,0.15);
    --accent-glow: rgba(212,168,83,0.06);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.7);
    --text-muted: rgba(255,255,255,0.4);
  }
