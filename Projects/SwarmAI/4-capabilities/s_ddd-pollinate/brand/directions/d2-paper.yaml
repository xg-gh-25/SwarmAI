# D2: Paper (纸质)
# Mood: Apple 极简 — "苹果店里翻杂志"
# Use for: 商业洞察、方法论、清晰表达、少观点高密度
# Key trait: Light weight headlines (300), generous whitespace, NO decorations

id: d2
name: Paper
name_cn: 纸质
mood: "苹果店里翻杂志"

# ─── Semantic Tokens ───────────────────────────────────────
tokens:
  bg-deep: "#FAFAF8"                     # Warm near-white
  bg-elevated: "#FFFFFF"                  # Pure white card
  bg-surface: "rgba(0,0,0,0.02)"         # Subtle warm gray
  border: "rgba(0,0,0,0.06)"             # Hairline borders
  accent: "#E17055"                      # Warm coral
  accent-dim: "rgba(225,112,85,0.08)"    # Coral at low opacity
  accent-glow: "rgba(225,112,85,0.04)"   # Subtle warm glow
  text-primary: "#1A1A1A"               # Near-black (never pure #000)
  text-secondary: "rgba(0,0,0,0.6)"     # Body text
  text-muted: "rgba(0,0,0,0.35)"        # Captions
  accent-secondary: "#E17055"            # Same as accent (single-accent direction)

# ─── Typography ────────────────────────────────────────────
typography:
  headline-font: "PingFang SC"
  headline-weight: 300                   # KEY: light, not bold
  body-font: "PingFang SC"
  body-weight: 400
  code-font: "SF Mono"
  en-display: "Inter"
  en-display-weight: 300

# ─── Visual Elements ───────────────────────────────────────
visual_elements:
  - "Diffused box-shadow (0 24px 60px -20px rgba(0,0,0,0.08))"
  - "Thin hairline borders (0.5px, border color)"
  - "Generous whitespace (section spacing 120px+)"
  - "NO decorative elements — content IS the decoration"
  - "Coral accent only for CTAs and key emphasis"

# ─── Divider Alternation ──────────────────────────────────
dividers:
  - type: hairline
    spec: "0.5px full-width, rgba(0,0,0,0.06)"
  - type: space
    spec: "120px vertical spacing (no visible divider)"

# ─── Card Variety ──────────────────────────────────────────
card_styles:
  1: "White card — diffused shadow, 16px radius"
  2: "Text-only — no container, pure typography"
  3: "Subtle surface — bg-surface background, no border"
  4: "Coral accent line — thin top-border accent"
  5: "Pull number — oversized stat in text-muted"
  6: "Centered statement — single sentence, large type"

# ─── Content Affinity ─────────────────────────────────────
content_triggers:
  strong:
    - "is_business_insight"
    - "is_methodology"
    - "has_few_points_high_impact"
  moderate:
    - "is_clean_framework"
    - "needs_premium_feel"
    - "is_product_announcement"
  weak:
    - "is_technical_deep_dive"

# ─── CSS Quick Reference ──────────────────────────────────
css_snippet: |
  :root {
    --bg-deep: #FAFAF8;
    --bg-elevated: #FFFFFF;
    --bg-surface: rgba(0,0,0,0.02);
    --border: rgba(0,0,0,0.06);
    --accent: #E17055;
    --accent-dim: rgba(225,112,85,0.08);
    --accent-glow: rgba(225,112,85,0.04);
    --text-primary: #1A1A1A;
    --text-secondary: rgba(0,0,0,0.6);
    --text-muted: rgba(0,0,0,0.35);
  }
