<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <rect width="800" height="520" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">Pollinate in the Agent Harness</text>
  <text x="400" y="55" fill="#58a6ff" font-size="11" text-anchor="middle">Same harness, same context system, same DDD — different engine</text>

  <!-- Outer harness container -->
  <rect x="50" y="70" width="700" height="420" rx="12" fill="#1e2330" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="95" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">SwarmAI Agent Harness</text>

  <!-- Trigger sources (top) -->
  <rect x="80" y="110" width="150" height="50" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="155" y="132" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">User Request</text>
  <text x="155" y="148" fill="#e6edf3" font-size="8" text-anchor="middle">"pollinate this message"</text>

  <rect x="250" y="110" width="150" height="50" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="325" y="132" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">Scheduled Job</text>
  <text x="325" y="148" fill="#e6edf3" font-size="8" text-anchor="middle">Weekly content calendar</text>

  <rect x="420" y="110" width="150" height="50" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="495" y="132" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">Signal Pipeline</text>
  <text x="495" y="148" fill="#e6edf3" font-size="8" text-anchor="middle">News = content opportunity</text>

  <rect x="590" y="110" width="140" height="50" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="660" y="132" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">Pipeline Event</text>
  <text x="660" y="148" fill="#e6edf3" font-size="8" text-anchor="middle">Feature shipped</text>

  <!-- Arrows to Pollinate -->
  <line x1="155" y1="160" x2="300" y2="195" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP7)"/>
  <line x1="325" y1="160" x2="360" y2="195" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP7)"/>
  <line x1="495" y1="160" x2="440" y2="195" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP7)"/>
  <line x1="660" y1="160" x2="500" y2="195" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrowP7)"/>

  <!-- Pollinate Skill (center) -->
  <rect x="240" y="195" width="320" height="70" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="2"/>
  <text x="400" y="220" fill="#7ee787" font-size="14" font-weight="bold" text-anchor="middle">s_pollinate</text>
  <text x="400" y="240" fill="#e6edf3" font-size="10" text-anchor="middle">8-Stage Content Engine</text>
  <text x="400" y="255" fill="#e6edf3" font-size="9" text-anchor="middle">EVALUATE - THINK - PLAN - PRODUCE - REVIEW - REFINE - DELIVER - REFLECT</text>

  <!-- Context system (left) -->
  <rect x="80" y="195" width="140" height="70" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="220" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">Context System</text>
  <text x="150" y="238" fill="#e6edf3" font-size="8" text-anchor="middle">MEMORY.md</text>
  <text x="150" y="252" fill="#e6edf3" font-size="8" text-anchor="middle">STEERING.md</text>

  <!-- Arrow from context to pollinate -->
  <line x1="220" y1="230" x2="240" y2="230" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrowB7)"/>

  <!-- Hooks (right) -->
  <rect x="580" y="195" width="140" height="70" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="1.5"/>
  <text x="650" y="220" fill="#f78166" font-size="10" font-weight="bold" text-anchor="middle">Hooks</text>
  <text x="650" y="238" fill="#e6edf3" font-size="8" text-anchor="middle">Pre/post-stage</text>
  <text x="650" y="252" fill="#e6edf3" font-size="8" text-anchor="middle">Quality validation</text>

  <!-- Arrow from hooks to pollinate -->
  <line x1="580" y1="230" x2="560" y2="230" stroke="#f78166" stroke-width="1" marker-end="url(#arrowO7)"/>

  <!-- DDD Layer -->
  <rect x="200" y="290" width="400" height="80" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="315" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">DDD Knowledge Layer</text>

  <rect x="220" y="330" width="85" height="28" rx="4" fill="#1e2330" stroke="#58a6ff" stroke-width="1"/>
  <text x="262" y="348" fill="#58a6ff" font-size="8" text-anchor="middle">PRODUCT.md</text>

  <rect x="315" y="330" width="70" height="28" rx="4" fill="#1e2330" stroke="#7ee787" stroke-width="1"/>
  <text x="350" y="348" fill="#7ee787" font-size="8" text-anchor="middle">TECH.md</text>

  <rect x="395" y="330" width="105" height="28" rx="4" fill="#1e2330" stroke="#f78166" stroke-width="1"/>
  <text x="447" y="348" fill="#f78166" font-size="8" text-anchor="middle">IMPROVEMENT.md</text>

  <rect x="510" y="330" width="80" height="28" rx="4" fill="#1e2330" stroke="#d2a8ff" stroke-width="1"/>
  <text x="550" y="348" fill="#d2a8ff" font-size="8" text-anchor="middle">PROJECT.md</text>

  <!-- Bidirectional arrow Pollinate <-> DDD -->
  <line x1="400" y1="265" x2="400" y2="290" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="420" y="280" fill="#d2a8ff" font-size="8">read/write</text>

  <!-- Output Storage -->
  <rect x="200" y="400" width="400" height="70" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="400" y="425" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">Output: Knowledge/Pollinate/</text>

  <rect x="220" y="438" width="70" height="22" rx="4" fill="#1e2330" stroke="#7ee787" stroke-width="0.5"/>
  <text x="255" y="453" fill="#e6edf3" font-size="8" text-anchor="middle">Posters</text>

  <rect x="300" y="438" width="60" height="22" rx="4" fill="#1e2330" stroke="#7ee787" stroke-width="0.5"/>
  <text x="330" y="453" fill="#e6edf3" font-size="8" text-anchor="middle">Videos</text>

  <rect x="370" y="438" width="75" height="22" rx="4" fill="#1e2330" stroke="#7ee787" stroke-width="0.5"/>
  <text x="407" y="453" fill="#e6edf3" font-size="8" text-anchor="middle">Narratives</text>

  <rect x="455" y="438" width="60" height="22" rx="4" fill="#1e2330" stroke="#7ee787" stroke-width="0.5"/>
  <text x="485" y="453" fill="#e6edf3" font-size="8" text-anchor="middle">Shorts</text>

  <rect x="525" y="438" width="65" height="22" rx="4" fill="#1e2330" stroke="#7ee787" stroke-width="0.5"/>
  <text x="557" y="453" fill="#e6edf3" font-size="8" text-anchor="middle">READMEs</text>

  <!-- Arrow Pollinate -> Output -->
  <line x1="400" y1="370" x2="400" y2="400" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrowG7)"/>

  <!-- Parallel engine note -->
  <rect x="80" y="400" width="105" height="70" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="132" y="425" fill="#58a6ff" font-size="9" font-weight="bold" text-anchor="middle">Also in harness:</text>
  <text x="132" y="443" fill="#e6edf3" font-size="8" text-anchor="middle">s_pipeline</text>
  <text x="132" y="457" fill="#e6edf3" font-size="8" text-anchor="middle">(Code engine)</text>

  <rect x="615" y="400" width="105" height="70" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="667" y="425" fill="#f78166" font-size="9" font-weight="bold" text-anchor="middle">Shared:</text>
  <text x="667" y="443" fill="#e6edf3" font-size="8" text-anchor="middle">Same DDD</text>
  <text x="667" y="457" fill="#e6edf3" font-size="8" text-anchor="middle">Same context</text>

  <defs>
    <marker id="arrowB7" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG7" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7ee787"/>
    </marker>
    <marker id="arrowO7" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#f78166"/>
    </marker>
    <marker id="arrowP7" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#d2a8ff"/>
    </marker>
  </defs>
</svg>