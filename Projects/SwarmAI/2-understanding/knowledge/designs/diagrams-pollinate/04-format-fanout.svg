<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="sans-serif">
  <rect width="800" height="480" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">Multi-Format Fan-Out</text>
  <text x="400" y="55" fill="#7ee787" font-size="11" text-anchor="middle">One message, multiple formats, each optimized for its channel</text>

  <!-- Input message -->
  <rect x="250" y="75" width="300" height="45" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="2"/>
  <text x="400" y="95" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Core Message</text>
  <text x="400" y="111" fill="#e6edf3" font-size="9" text-anchor="middle">"DDD makes AI that never forgets your context"</text>

  <!-- Format Selection Engine -->
  <path d="M 400 120 L 400 145" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowB4)"/>

  <rect x="270" y="148" width="260" height="45" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="168" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="middle">Format Selection Engine</text>
  <text x="400" y="184" fill="#e6edf3" font-size="9" text-anchor="middle">Audience x Channel x Message Type</text>

  <!-- Fan-out lines -->
  <path d="M 400 193 L 100 240" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <path d="M 400 193 L 240 240" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <path d="M 400 193 L 400 240" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <path d="M 400 193 L 560 240" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <path d="M 400 193 L 700 240" fill="none" stroke="#7ee787" stroke-width="1.2"/>

  <!-- Format 1: Poster -->
  <rect x="40" y="240" width="120" height="130" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="100" y="265" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">Poster</text>
  <line x1="55" y1="275" x2="145" y2="275" stroke="#7ee787" stroke-width="0.5" opacity="0.5"/>
  <text x="100" y="295" fill="#e6edf3" font-size="8" text-anchor="middle">Visual hook in 2s</text>
  <text x="100" y="310" fill="#e6edf3" font-size="8" text-anchor="middle">One key insight</text>
  <text x="100" y="325" fill="#e6edf3" font-size="8" text-anchor="middle">Brand colors</text>
  <text x="100" y="345" fill="#58a6ff" font-size="8" text-anchor="middle">Social media</text>
  <text x="100" y="360" fill="#58a6ff" font-size="8" text-anchor="middle">LinkedIn, Twitter</text>

  <!-- Format 2: Video -->
  <rect x="180" y="240" width="120" height="130" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="240" y="265" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">Video</text>
  <line x1="195" y1="275" x2="285" y2="275" stroke="#7ee787" stroke-width="0.5" opacity="0.5"/>
  <text x="240" y="295" fill="#e6edf3" font-size="8" text-anchor="middle">Story arc (30-60s)</text>
  <text x="240" y="310" fill="#e6edf3" font-size="8" text-anchor="middle">Hook-Problem-Solve</text>
  <text x="240" y="325" fill="#e6edf3" font-size="8" text-anchor="middle">Visual storyboard</text>
  <text x="240" y="345" fill="#58a6ff" font-size="8" text-anchor="middle">YouTube, TikTok</text>
  <text x="240" y="360" fill="#58a6ff" font-size="8" text-anchor="middle">Product demo</text>

  <!-- Format 3: Narrative -->
  <rect x="340" y="240" width="120" height="130" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="400" y="265" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">Narrative</text>
  <line x1="355" y1="275" x2="445" y2="275" stroke="#7ee787" stroke-width="0.5" opacity="0.5"/>
  <text x="400" y="295" fill="#e6edf3" font-size="8" text-anchor="middle">Long-form depth</text>
  <text x="400" y="310" fill="#e6edf3" font-size="8" text-anchor="middle">Thought leadership</text>
  <text x="400" y="325" fill="#e6edf3" font-size="8" text-anchor="middle">Technical credibility</text>
  <text x="400" y="345" fill="#58a6ff" font-size="8" text-anchor="middle">Blog, Medium</text>
  <text x="400" y="360" fill="#58a6ff" font-size="8" text-anchor="middle">Newsletter</text>

  <!-- Format 4: Shorts -->
  <rect x="500" y="240" width="120" height="130" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="560" y="265" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">Shorts</text>
  <line x1="515" y1="275" x2="605" y2="275" stroke="#7ee787" stroke-width="0.5" opacity="0.5"/>
  <text x="560" y="295" fill="#e6edf3" font-size="8" text-anchor="middle">Hooks + quotes</text>
  <text x="560" y="310" fill="#e6edf3" font-size="8" text-anchor="middle">Snippet-ready</text>
  <text x="560" y="325" fill="#e6edf3" font-size="8" text-anchor="middle">Shareable standalone</text>
  <text x="560" y="345" fill="#58a6ff" font-size="8" text-anchor="middle">Twitter threads</text>
  <text x="560" y="360" fill="#58a6ff" font-size="8" text-anchor="middle">Story format</text>

  <!-- Format 5: README -->
  <rect x="640" y="240" width="120" height="130" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="700" y="265" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">README</text>
  <line x1="655" y1="275" x2="745" y2="275" stroke="#7ee787" stroke-width="0.5" opacity="0.5"/>
  <text x="700" y="295" fill="#e6edf3" font-size="8" text-anchor="middle">Technical audience</text>
  <text x="700" y="310" fill="#e6edf3" font-size="8" text-anchor="middle">Feature-focused</text>
  <text x="700" y="325" fill="#e6edf3" font-size="8" text-anchor="middle">Quick-start ready</text>
  <text x="700" y="345" fill="#58a6ff" font-size="8" text-anchor="middle">GitHub, Docs</text>
  <text x="700" y="360" fill="#58a6ff" font-size="8" text-anchor="middle">Developer portal</text>

  <!-- Delivery Package -->
  <rect x="150" y="400" width="500" height="60" rx="8" fill="#1e2330" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="400" y="425" fill="#d2a8ff" font-size="12" font-weight="bold" text-anchor="middle">Delivery Package</text>
  <text x="400" y="445" fill="#e6edf3" font-size="9" text-anchor="middle">All formats + metadata + channel-specific publishing instructions + analytics hooks</text>

  <!-- Arrows to delivery -->
  <line x1="100" y1="370" x2="250" y2="400" stroke="#d2a8ff" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="240" y1="370" x2="310" y2="400" stroke="#d2a8ff" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="400" y1="370" x2="400" y2="400" stroke="#d2a8ff" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="560" y1="370" x2="490" y2="400" stroke="#d2a8ff" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="700" y1="370" x2="550" y2="400" stroke="#d2a8ff" stroke-width="0.8" stroke-dasharray="3,2"/>

  <defs>
    <marker id="arrowB4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>