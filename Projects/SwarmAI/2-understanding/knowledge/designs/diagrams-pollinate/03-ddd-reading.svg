<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <rect width="800" height="520" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">How Pollinate Reads DDD Knowledge</text>
  <text x="400" y="55" fill="#58a6ff" font-size="11" text-anchor="middle">Every stage reads the right context at the right time</text>

  <!-- DDD Docs (left column) -->
  <rect x="40" y="80" width="200" height="100" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="105" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">PRODUCT.md</text>
  <text x="140" y="125" fill="#e6edf3" font-size="9" text-anchor="middle">Brand positioning</text>
  <text x="140" y="139" fill="#e6edf3" font-size="9" text-anchor="middle">Target audience</text>
  <text x="140" y="153" fill="#e6edf3" font-size="9" text-anchor="middle">Messaging pillars</text>
  <text x="140" y="167" fill="#e6edf3" font-size="9" text-anchor="middle">Tone of voice, non-goals</text>

  <rect x="40" y="200" width="200" height="100" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="2"/>
  <text x="140" y="225" fill="#7ee787" font-size="13" font-weight="bold" text-anchor="middle">TECH.md</text>
  <text x="140" y="245" fill="#e6edf3" font-size="9" text-anchor="middle">Product capabilities</text>
  <text x="140" y="259" fill="#e6edf3" font-size="9" text-anchor="middle">Technical differentiators</text>
  <text x="140" y="273" fill="#e6edf3" font-size="9" text-anchor="middle">Architecture highlights</text>
  <text x="140" y="287" fill="#e6edf3" font-size="9" text-anchor="middle">What is real vs planned</text>

  <rect x="40" y="320" width="200" height="100" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="2"/>
  <text x="140" y="345" fill="#f78166" font-size="13" font-weight="bold" text-anchor="middle">IMPROVEMENT.md</text>
  <text x="140" y="365" fill="#e6edf3" font-size="9" text-anchor="middle">Past messaging failures</text>
  <text x="140" y="379" fill="#e6edf3" font-size="9" text-anchor="middle">Underperforming channels</text>
  <text x="140" y="393" fill="#e6edf3" font-size="9" text-anchor="middle">Audience complaints</text>
  <text x="140" y="407" fill="#e6edf3" font-size="9" text-anchor="middle">What not to repeat</text>

  <rect x="40" y="440" width="200" height="70" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="2"/>
  <text x="140" y="465" fill="#d2a8ff" font-size="13" font-weight="bold" text-anchor="middle">PROJECT.md</text>
  <text x="140" y="485" fill="#e6edf3" font-size="9" text-anchor="middle">Current campaign context</text>
  <text x="140" y="499" fill="#e6edf3" font-size="9" text-anchor="middle">Launch timeline, metrics</text>

  <!-- Stages (right side) -->
  <!-- EVALUATE -->
  <rect x="340" y="85" width="180" height="36" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="430" y="108" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">EVALUATE</text>
  <!-- Arrow from PRODUCT.md to EVALUATE -->
  <line x1="240" y1="115" x2="340" y2="103" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#arrowB3)"/>

  <!-- THINK -->
  <rect x="340" y="135" width="180" height="36" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="430" y="158" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">THINK</text>
  <!-- Arrow from PROJECT.md to THINK -->
  <path d="M 140 440 L 280 440 L 280 153 L 340 153" fill="none" stroke="#d2a8ff" stroke-width="1.2" marker-end="url(#arrowP3)"/>

  <!-- PLAN -->
  <rect x="340" y="185" width="180" height="36" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="430" y="208" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">PLAN</text>
  <!-- Arrow from TECH.md to PLAN -->
  <line x1="240" y1="235" x2="340" y2="203" stroke="#7ee787" stroke-width="1.2" marker-end="url(#arrowG3)"/>

  <!-- PRODUCE -->
  <rect x="340" y="235" width="180" height="36" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="1.5"/>
  <text x="430" y="258" fill="#7ee787" font-size="11" font-weight="bold" text-anchor="middle">PRODUCE</text>

  <!-- REVIEW -->
  <rect x="340" y="285" width="180" height="36" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="1.5"/>
  <text x="430" y="308" fill="#f78166" font-size="11" font-weight="bold" text-anchor="middle">REVIEW</text>
  <!-- Arrow from all DDD to REVIEW -->
  <line x1="240" y1="145" x2="340" y2="295" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowB3)"/>
  <line x1="240" y1="260" x2="340" y2="300" stroke="#7ee787" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowG3)"/>
  <line x1="240" y1="365" x2="340" y2="305" stroke="#f78166" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowO3)"/>

  <!-- REFINE -->
  <rect x="340" y="335" width="180" height="36" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="1.5"/>
  <text x="430" y="358" fill="#f78166" font-size="11" font-weight="bold" text-anchor="middle">REFINE</text>

  <!-- DELIVER -->
  <rect x="340" y="385" width="180" height="36" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="430" y="408" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="middle">DELIVER</text>

  <!-- REFLECT -->
  <rect x="340" y="435" width="180" height="36" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="430" y="458" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="middle">REFLECT</text>

  <!-- Write-back from REFLECT -->
  <path d="M 340 453 L 270 453 L 270 395 L 240 395" fill="none" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arrowP3)"/>
  <text x="275" y="425" fill="#d2a8ff" font-size="9" font-weight="bold" transform="rotate(-90, 275, 425)">WRITES BACK</text>

  <!-- Right side annotations -->
  <rect x="560" y="80" width="210" height="190" rx="8" fill="#1e2330" stroke="#e6edf3" stroke-width="0.5"/>
  <text x="665" y="105" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Stage Reads:</text>

  <text x="580" y="130" fill="#58a6ff" font-size="9">EVALUATE</text>
  <text x="640" y="130" fill="#e6edf3" font-size="9">PRODUCT.md (is this on-brand?)</text>

  <text x="580" y="152" fill="#d2a8ff" font-size="9">THINK</text>
  <text x="620" y="152" fill="#e6edf3" font-size="9">PROJECT.md (current campaign)</text>

  <text x="580" y="174" fill="#7ee787" font-size="9">PLAN</text>
  <text x="615" y="174" fill="#e6edf3" font-size="9">TECH.md (what to highlight)</text>

  <text x="580" y="196" fill="#f78166" font-size="9">REVIEW</text>
  <text x="625" y="196" fill="#e6edf3" font-size="9">ALL 4 docs (full conformance)</text>

  <text x="580" y="218" fill="#f78166" font-size="9">REFINE</text>
  <text x="625" y="218" fill="#e6edf3" font-size="9">IMPROVEMENT.md (past failures)</text>

  <text x="580" y="240" fill="#d2a8ff" font-size="9">REFLECT</text>
  <text x="628" y="240" fill="#e6edf3" font-size="9">Writes learnings back to DDD</text>
  <text x="580" y="258" fill="#d2a8ff" font-size="9" font-style="italic">         (closes the loop)</text>

  <!-- Bottom note -->
  <rect x="560" y="300" width="210" height="60" rx="8" fill="#1e2330" stroke="#d2a8ff" stroke-width="1"/>
  <text x="665" y="322" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">Key Insight</text>
  <text x="665" y="340" fill="#e6edf3" font-size="9" text-anchor="middle">DDD is read-write, not read-only.</text>
  <text x="665" y="354" fill="#e6edf3" font-size="9" text-anchor="middle">Every run improves future runs.</text>

  <defs>
    <marker id="arrowB3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7ee787"/>
    </marker>
    <marker id="arrowO3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#f78166"/>
    </marker>
    <marker id="arrowP3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#d2a8ff"/>
    </marker>
  </defs>
</svg>