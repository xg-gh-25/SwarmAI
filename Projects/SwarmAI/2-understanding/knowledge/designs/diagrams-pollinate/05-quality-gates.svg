<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <rect width="800" height="520" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e6edf3" font-size="18" font-weight="bold" text-anchor="middle">5-Gate Brand Conformance</text>
  <text x="400" y="55" fill="#f78166" font-size="11" text-anchor="middle">Content must pass all gates before delivery (parallel to Pipeline's 6-Layer Push-Ready Gate)</text>

  <!-- Input content -->
  <rect x="300" y="72" width="200" height="36" rx="8" fill="#2d333b" stroke="#e6edf3" stroke-width="1"/>
  <text x="400" y="95" fill="#e6edf3" font-size="11" text-anchor="middle">Draft Content</text>

  <!-- Arrow down -->
  <line x1="400" y1="108" x2="400" y2="125" stroke="#e6edf3" stroke-width="1.5"/>

  <!-- Gate 1: Brand Voice -->
  <rect x="120" y="128" width="560" height="60" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="2"/>
  <rect x="120" y="128" width="8" height="60" rx="4" fill="#58a6ff"/>
  <text x="160" y="152" fill="#58a6ff" font-size="13" font-weight="bold">Gate 1: Brand Voice Consistency</text>
  <text x="160" y="172" fill="#e6edf3" font-size="9">Does the tone match PRODUCT.md voice guidelines? No corporate jargon unless specified. No self-congratulation.</text>
  <text x="620" y="165" fill="#58a6ff" font-size="9" text-anchor="middle">Reads: PRODUCT.md</text>

  <!-- Arrow -->
  <line x1="400" y1="188" x2="400" y2="202" stroke="#7ee787" stroke-width="1.5"/>
  <text x="415" y="198" fill="#7ee787" font-size="8">PASS</text>

  <!-- Gate 2: Audience Alignment -->
  <rect x="120" y="205" width="560" height="60" rx="8" fill="#2d333b" stroke="#7ee787" stroke-width="2"/>
  <rect x="120" y="205" width="8" height="60" rx="4" fill="#7ee787"/>
  <text x="160" y="229" fill="#7ee787" font-size="13" font-weight="bold">Gate 2: Audience Pain Point Alignment</text>
  <text x="160" y="249" fill="#e6edf3" font-size="9">Is the message framed around what the target audience cares about? Not what we want to say — what they need to hear.</text>
  <text x="620" y="242" fill="#7ee787" font-size="9" text-anchor="middle">Reads: PROJECT.md</text>

  <!-- Arrow -->
  <line x1="400" y1="265" x2="400" y2="279" stroke="#7ee787" stroke-width="1.5"/>
  <text x="415" y="275" fill="#7ee787" font-size="8">PASS</text>

  <!-- Gate 3: Technical Accuracy -->
  <rect x="120" y="282" width="560" height="60" rx="8" fill="#2d333b" stroke="#f78166" stroke-width="2"/>
  <rect x="120" y="282" width="8" height="60" rx="4" fill="#f78166"/>
  <text x="160" y="306" fill="#f78166" font-size="13" font-weight="bold">Gate 3: Technical Accuracy</text>
  <text x="160" y="326" fill="#e6edf3" font-size="9">Are all product claims verified against TECH.md? No imagined capabilities. No exaggerated performance.</text>
  <text x="620" y="319" fill="#f78166" font-size="9" text-anchor="middle">Reads: TECH.md</text>

  <!-- Arrow -->
  <line x1="400" y1="342" x2="400" y2="356" stroke="#7ee787" stroke-width="1.5"/>
  <text x="415" y="352" fill="#7ee787" font-size="8">PASS</text>

  <!-- Gate 4: Originality -->
  <rect x="120" y="359" width="560" height="60" rx="8" fill="#2d333b" stroke="#d2a8ff" stroke-width="2"/>
  <rect x="120" y="359" width="8" height="60" rx="4" fill="#d2a8ff"/>
  <text x="160" y="383" fill="#d2a8ff" font-size="13" font-weight="bold">Gate 4: Messaging Originality</text>
  <text x="160" y="403" fill="#e6edf3" font-size="9">Is this substantially different from last 5 pieces on same topic? No messaging fatigue. Fresh angle required.</text>
  <text x="620" y="396" fill="#d2a8ff" font-size="9" text-anchor="middle">Reads: IMPROVEMENT.md</text>

  <!-- Arrow -->
  <line x1="400" y1="419" x2="400" y2="433" stroke="#7ee787" stroke-width="1.5"/>
  <text x="415" y="429" fill="#7ee787" font-size="8">PASS</text>

  <!-- Gate 5: Format Suitability -->
  <rect x="120" y="436" width="560" height="60" rx="8" fill="#2d333b" stroke="#58a6ff" stroke-width="2"/>
  <rect x="120" y="436" width="8" height="60" rx="4" fill="#58a6ff"/>
  <text x="160" y="460" fill="#58a6ff" font-size="13" font-weight="bold">Gate 5: Format Suitability</text>
  <text x="160" y="480" fill="#e6edf3" font-size="9">Does the chosen format serve the message? (Not the other way around.) Is this the right channel for this audience?</text>
  <text x="620" y="473" fill="#58a6ff" font-size="9" text-anchor="middle">Reads: PROJECT.md</text>

  <!-- Final output -->
  <line x1="400" y1="496" x2="400" y2="510" stroke="#7ee787" stroke-width="2" marker-end="url(#arrowG5)"/>

  <!-- Fail path (right side) -->
  <path d="M 680 158 L 730 158 L 730 380 L 680 380" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="745" y="270" fill="#f78166" font-size="9" text-anchor="middle" transform="rotate(90, 745, 270)">FAIL: Return to REFINE stage</text>

  <defs>
    <marker id="arrowG5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#7ee787"/>
    </marker>
  </defs>
</svg>