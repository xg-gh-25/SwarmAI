  <text x="67" y="155" text-anchor="middle" fill="#8b8ba0" font-size="7">Value check</text>

  <line x1="105" y1="142" x2="115" y2="142" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <rect x="117" y="120" width="70" height="45" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
