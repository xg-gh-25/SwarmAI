  <text x="152" y="155" text-anchor="middle" fill="#8b8ba0" font-size="7">Persona map</text>

  <line x1="187" y1="142" x2="197" y2="142" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <rect x="199" y="120" width="70" height="45" rx="6" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="234" y="140" text-anchor="middle" fill="#d2a8ff" font-size="8" font-weight="bold">MESSAGE</text>
