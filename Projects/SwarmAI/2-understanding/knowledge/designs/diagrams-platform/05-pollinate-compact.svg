  <text x="562" y="140" text-anchor="middle" fill="#d2a8ff" font-size="8" font-weight="bold">DELIVER</text>
  <text x="562" y="155" text-anchor="middle" fill="#8b8ba0" font-size="7">Package</text>

  <line x1="597" y1="142" x2="617" y2="142" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arr5)"/>

  <rect x="619" y="120" width="70" height="45" rx="6" fill="#1a2e1a" stroke="#7ee787" stroke-width="1.5"/>
