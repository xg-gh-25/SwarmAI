  <text x="360" y="215" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">5-Gate Brand Conformance (at QUALITY stage)</text>

  <rect x="140" y="225" width="440" height="42" rx="6" fill="#12122a" stroke="#58a6ff" stroke-width="1"/>
  <text x="200" y="242" text-anchor="middle" fill="#e6edf3" font-size="8">1. Voice Match</text>
  <text x="310" y="242" text-anchor="middle" fill="#e6edf3" font-size="8">2. Audience Fit</text>
  <text x="420" y="242" text-anchor="middle" fill="#e6edf3" font-size="8">3. Visual Consistency</text>
  <text x="240" y="258" text-anchor="middle" fill="#e6edf3" font-size="8">4. Message Alignment</text>
  <text x="420" y="258" text-anchor="middle" fill="#e6edf3" font-size="8">5. Platform Compliance</text>

