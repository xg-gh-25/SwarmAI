  <text x="125" y="359" text-anchor="middle" fill="#e6edf3" font-size="9">Poster</text>

  <rect x="185" y="342" width="90" height="25" rx="5" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="230" y="359" text-anchor="middle" fill="#e6edf3" font-size="9">Video Script</text>

  <rect x="290" y="342" width="90" height="25" rx="5" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="335" y="359" text-anchor="middle" fill="#e6edf3" font-size="9">Narrative</text>

  <rect x="395" y="342" width="90" height="25" rx="5" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="440" y="359" text-anchor="middle" fill="#e6edf3" font-size="9">Short-form</text>

  <rect x="500" y="342" width="90" height="25" rx="5" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="545" y="359" text-anchor="middle" fill="#e6edf3" font-size="9">README</text>

  <rect x="605" y="342" width="90" height="25" rx="5" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="650" y="359" text-anchor="middle" fill="#e6edf3" font-size="9">Social</text>

  <!-- DDD Write (bottom) -->
  <line x1="654" y1="165" x2="654" y2="395" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arr5g)"/>
  <rect x="550" y="395" width="200" height="35" rx="8" fill="#0d2b1a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="650" y="417" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">REFLECT -> Channel 3 -> DDD grows</text>
