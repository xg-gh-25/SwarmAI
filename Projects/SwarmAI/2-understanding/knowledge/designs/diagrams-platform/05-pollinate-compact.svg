<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif">
  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d2a8ff"/>
    </marker>
    <marker id="arr5b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
    <marker id="arr5g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7ee787"/>
    </marker>
  </defs>
  <rect width="780" height="440" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Super Marketer: Pollinate (8 Stages)</text>
  <text x="390" y="48" text-anchor="middle" fill="#8b8ba0" font-size="10">Vision: Message First, Format Follows / Goal: Brand-Correct Content from One Sentence</text>

  <!-- DDD Read (top) -->
  <rect x="250" y="60" width="280" height="35" rx="8" fill="#0d2240" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="390" y="82" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">DDD READS: Brand voice, audience, product context</text>
  <line x1="390" y1="95" x2="390" y2="115" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr5b)"/>

