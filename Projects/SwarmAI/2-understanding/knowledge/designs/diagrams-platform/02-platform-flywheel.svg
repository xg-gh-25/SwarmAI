<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="28" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">The Platform Flywheel: How Knowledge Compounds</text>

  <!-- ================================================================== -->
  <!-- CENTER: DDD (the hub) -->
  <!-- ================================================================== -->
  <ellipse cx="400" cy="250" rx="95" ry="55" fill="#0a1f10" stroke="#7ee787" stroke-width="1.5"/>
  <text x="400" y="235" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">DDD</text>
  <text x="400" y="250" fill="#e6edf3" font-size="9" text-anchor="middle">Knowledge Layer</text>
  <text x="400" y="265" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.7">4 docs × N projects</text>
  <text x="400" y="280" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.7">Health-monitored</text>

  <!-- ================================================================== -->
  <!-- TOP-RIGHT: Delivery Engines (consumers) -->
  <!-- ================================================================== -->
  <rect x="580" y="60" width="190" height="110" rx="10" fill="#221a30" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="675" y="82" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">DELIVERY ENGINES</text>
  <text x="675" y="96" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.6">(Consumers)</text>

  <rect x="592" y="104" width="80" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="0.6"/>
  <text x="632" y="122" fill="#e6edf3" font-size="8" text-anchor="middle">Pipeline</text>

  <rect x="680" y="104" width="80" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="0.6"/>
  <text x="720" y="122" fill="#e6edf3" font-size="8" text-anchor="middle">Pollinate</text>

  <rect x="592" y="136" width="168" height="24" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.4" stroke-dasharray="3,2"/>
  <text x="676" y="152" fill="#e6edf3" font-size="7.5" text-anchor="middle" fill-opacity="0.5">Future: Analyst, Operator...</text>

  <!-- Arrow: DDD → Engines (READS) -->
  <path d="M 490 220 Q 550 160 580 130" fill="none" stroke="#7ee787" stroke-width="1.2" marker-end="url(#arrG)"/>
  <text x="555" y="160" fill="#7ee787" font-size="8" font-weight="bold">READS</text>
  <text x="555" y="172" fill="#e6edf3" font-size="7" fill-opacity="0.7">domain context</text>

  <!-- ================================================================== -->
  <!-- BOTTOM-RIGHT: REFLECT (engine output → channels) -->
  <!-- ================================================================== -->
  <rect x="590" y="340" width="180" height="70" rx="10" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="680" y="362" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">REFLECT</text>
  <text x="680" y="378" fill="#e6edf3" font-size="8" text-anchor="middle">Structured lessons</text>
  <text x="680" y="392" fill="#e6edf3" font-size="8" text-anchor="middle">Patterns, failures, insights</text>
  <text x="680" y="404" fill="#e6edf3" font-size="7" text-anchor="middle" fill-opacity="0.6">→ Ch 3a (Pipeline) / Ch 3b (Pollinate)</text>

  <!-- Arrow: Engines → REFLECT -->
  <path d="M 675 170 L 675 338" fill="none" stroke="#d2a8ff" stroke-width="1" marker-end="url(#arrP)"/>
  <text x="685" y="260" fill="#d2a8ff" font-size="7.5" fill-opacity="0.8">delivers</text>
  <text x="685" y="272" fill="#d2a8ff" font-size="7.5" fill-opacity="0.8">then reflects</text>

  <!-- ================================================================== -->
  <!-- LEFT: 8 Feed Channels (producers) -->
  <!-- ================================================================== -->
  <rect x="30" y="100" width="210" height="300" rx="10" fill="#1a100c" stroke="#f78166" stroke-width="1.2"/>
  <text x="135" y="120" fill="#f78166" font-size="10" font-weight="bold" text-anchor="middle">8 FEED CHANNELS</text>
  <text x="135" y="134" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.6">(Producers — flywheel fuel)</text>

  <!-- Channel list -->
  <text x="45" y="158" fill="#58a6ff" font-size="8">Ch 1: Code Changes</text>
  <text x="45" y="176" fill="#7ee787" font-size="8">Ch 2: External Learning</text>
  <text x="45" y="194" fill="#d2a8ff" font-size="8" font-weight="bold">Ch 3a: Pipeline REFLECT</text>
  <text x="45" y="212" fill="#d2a8ff" font-size="8" font-weight="bold">Ch 3b: Pollinate REFLECT</text>
  <text x="45" y="230" fill="#7ee787" font-size="8">Ch 4: Industry Signals</text>
  <text x="45" y="248" fill="#f78166" font-size="8">Ch 5: Conversation</text>
  <text x="45" y="266" fill="#f78166" font-size="8" font-weight="bold">Ch 6: Corrections</text>
  <text x="45" y="284" fill="#58a6ff" font-size="8">Ch 7: Code Intelligence</text>

  <!-- Divider -->
  <line x1="45" y1="298" x2="225" y2="298" stroke="#e6edf3" stroke-width="0.3" stroke-opacity="0.3"/>

  <text x="135" y="318" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.7">Zero human maintenance.</text>
  <text x="135" y="333" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.7">All extracted from</text>
  <text x="135" y="348" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.7">normal work.</text>

  <!-- Priority indicator -->
  <text x="135" y="375" fill="#f78166" font-size="7.5" text-anchor="middle" fill-opacity="0.8">Priority: Ch6 (human) > Ch3 (engines) > rest</text>
  <text x="135" y="390" fill="#7ee787" font-size="7.5" text-anchor="middle" fill-opacity="0.8">Signal: Ch3 (richest) > Ch1 (automated)</text>

  <!-- Arrow: Channels → Cultivation -->
  <path d="M 240 250 L 278 250" fill="none" stroke="#f78166" stroke-width="1.2" marker-end="url(#arrO)"/>

  <!-- ================================================================== -->
  <!-- MIDDLE-LEFT: Cultivation Engine (the bridge) -->
  <!-- ================================================================== -->
  <rect x="280" y="340" width="160" height="75" rx="8" fill="#1a0f0a" stroke="#f78166" stroke-width="1"/>
  <text x="360" y="360" fill="#f78166" font-size="9" font-weight="bold" text-anchor="middle">CULTIVATION</text>
  <text x="360" y="375" fill="#e6edf3" font-size="8" text-anchor="middle">Propose → Approve</text>
  <text x="360" y="390" fill="#e6edf3" font-size="8" text-anchor="middle">→ Write to DDD</text>
  <text x="360" y="405" fill="#e6edf3" font-size="7" text-anchor="middle" fill-opacity="0.6">(30s human approval)</text>

  <!-- Arrow: Channels → Cultivation -->
  <path d="M 135 400 Q 200 420 280 385" fill="none" stroke="#f78166" stroke-width="1" marker-end="url(#arrO)"/>

  <!-- Arrow: REFLECT → Channels (feedback) -->
  <path d="M 590 390 Q 450 440 440 385" fill="none" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrP)"/>
  <text x="500" y="430" fill="#d2a8ff" font-size="7.5" fill-opacity="0.8">feeds Ch 3a/3b</text>

  <!-- Arrow: Cultivation → DDD -->
  <path d="M 380 340 Q 390 310 395 305" fill="none" stroke="#7ee787" stroke-width="1.2" marker-end="url(#arrG)"/>
  <text x="365" y="325" fill="#7ee787" font-size="7.5">grows</text>

  <!-- ================================================================== -->
  <!-- BOTTOM: Harness (subtle foundation) -->
  <!-- ================================================================== -->
  <rect x="130" y="440" width="540" height="45" rx="8" fill="#0a1420" stroke="#58a6ff" stroke-width="0.6"/>
  <text x="400" y="460" fill="#58a6ff" font-size="9" text-anchor="middle">AGENT HARNESS (Foundation)</text>
  <text x="400" y="475" fill="#e6edf3" font-size="8" text-anchor="middle" fill-opacity="0.6">Context System | 4-Tier Memory | Self-Evolution | Hooks | Tools + SDK</text>

  <!-- ================================================================== -->
  <!-- CROSS-ENGINE FLOW (subtle) -->
  <!-- ================================================================== -->
  <rect x="530" y="230" width="150" height="50" rx="6" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.4" stroke-dasharray="3,2"/>
  <text x="605" y="248" fill="#e6edf3" font-size="7.5" text-anchor="middle" fill-opacity="0.7">Cross-engine compound:</text>
  <text x="605" y="261" fill="#7ee787" font-size="7" text-anchor="middle" fill-opacity="0.7">Pipeline finds → DDD → Pollinate markets</text>
  <text x="605" y="273" fill="#d2a8ff" font-size="7" text-anchor="middle" fill-opacity="0.7">Pollinate learns → DDD → Pipeline prioritizes</text>

  <!-- ================================================================== -->
  <!-- COMPOUND INDICATOR (top-left) -->
  <!-- ================================================================== -->
  <rect x="30" y="42" width="200" height="48" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.6"/>
  <text x="130" y="60" fill="#7ee787" font-size="8.5" text-anchor="middle" font-weight="bold">COMPOUND EFFECT</text>
  <text x="130" y="74" fill="#e6edf3" font-size="7.5" text-anchor="middle" fill-opacity="0.8">Session 1: DDD = sparse</text>
  <text x="130" y="85" fill="#e6edf3" font-size="7.5" text-anchor="middle" fill-opacity="0.8">Session 100: DDD = 100x richer</text>

  <!-- Arrow markers (smaller) -->
  <defs>
    <marker id="arrG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7ee787"/>
    </marker>
    <marker id="arrP" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#d2a8ff"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f78166"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
