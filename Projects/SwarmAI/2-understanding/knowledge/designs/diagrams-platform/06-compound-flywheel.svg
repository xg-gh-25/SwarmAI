<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" font-family="sans-serif">
  <defs>
    <marker id="arr6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
    <marker id="arr6g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7ee787"/>
    </marker>
    <marker id="arr6o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f78166"/>
    </marker>
    <marker id="arr6p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d2a8ff"/>
    </marker>
  </defs>
  <rect width="750" height="550" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">The Compound Flywheel: Every Session Makes All Future Sessions Smarter</text>

  <!-- DDD Center -->
  <ellipse cx="375" cy="275" rx="95" ry="75" fill="#0d2240" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="375" y="255" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">DDD</text>
  <text x="375" y="275" text-anchor="middle" fill="#e6edf3" font-size="9">Knowledge Layer</text>
  <text x="375" y="293" text-anchor="middle" fill="#8b8ba0" font-size="8">Self-growing</text>
  <text x="375" y="307" text-anchor="middle" fill="#8b8ba0" font-size="8">domain expertise</text>

  <!-- 8 Channels (left arc) -->
  <rect x="30" y="70" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="88" text-anchor="middle" fill="#f78166" font-size="8">1. Code Changes</text>

  <rect x="30" y="108" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="126" text-anchor="middle" fill="#f78166" font-size="8">2. External Learning</text>

  <rect x="30" y="146" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="164" text-anchor="middle" fill="#f78166" font-size="8">3. Pipeline Delivery</text>

  <rect x="30" y="184" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="202" text-anchor="middle" fill="#f78166" font-size="8">4. Industry Signals</text>

  <rect x="30" y="222" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="240" text-anchor="middle" fill="#f78166" font-size="8">5. Conversation</text>

  <rect x="30" y="260" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="278" text-anchor="middle" fill="#f78166" font-size="8">6. Corrections</text>

  <rect x="30" y="298" width="150" height="28" rx="6" fill="#2b1810" stroke="#f78166" stroke-width="1.2"/>
  <text x="105" y="316" text-anchor="middle" fill="#f78166" font-size="8">7. Code Intelligence</text>

  <!-- Arrows: Channels -> DDD -->
  <line x1="180" y1="84" x2="295" y2="230" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>
  <line x1="180" y1="122" x2="292" y2="240" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>
  <line x1="180" y1="160" x2="288" y2="252" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>
  <line x1="180" y1="198" x2="285" y2="263" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>
  <line x1="180" y1="236" x2="282" y2="272" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>
  <line x1="180" y1="274" x2="282" y2="278" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>
  <line x1="180" y1="312" x2="285" y2="290" stroke="#f78166" stroke-width="1.5" marker-end="url(#arr6o)"/>

  <!-- Engines (right side) -->
  <rect x="550" y="160" width="170" height="70" rx="8" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="2"/>
  <text x="635" y="185" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Super Builder</text>
  <text x="635" y="202" text-anchor="middle" fill="#e6edf3" font-size="9">Autonomous Pipeline</text>
  <text x="635" y="218" text-anchor="middle" fill="#8b8ba0" font-size="8">Push-ready code delivery</text>

  <rect x="550" y="260" width="170" height="70" rx="8" fill="#2d1b4e" stroke="#d2a8ff" stroke-width="2"/>
  <text x="635" y="285" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Super Marketer</text>
  <text x="635" y="302" text-anchor="middle" fill="#e6edf3" font-size="9">Pollinate</text>
  <text x="635" y="318" text-anchor="middle" fill="#8b8ba0" font-size="8">Brand-correct content</text>

  <rect x="550" y="360" width="170" height="50" rx="8" fill="#1e1e3a" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="635" y="385" text-anchor="middle" fill="#8b8ba0" font-size="10">Future Engines</text>
  <text x="635" y="400" text-anchor="middle" fill="#666" font-size="8">Analyst, Operator, ...</text>

  <!-- Arrows: DDD -> Engines (consume) -->
  <line x1="465" y1="245" x2="548" y2="195" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="468" y1="275" x2="548" y2="290" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="465" y1="310" x2="548" y2="380" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr6)"/>

  <!-- Feedback: Engines -> Channel 3 (via REFLECT) -->
  <path d="M550,220 Q520,220 500,180 Q480,140 400,100 Q320,60 180,155" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr6p)"/>
  <path d="M550,320 Q520,340 500,360 Q460,380 350,370 Q240,360 180,310" fill="none" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr6p)"/>

  <!-- Cross-engine flow -->
  <rect x="560" y="237" width="150" height="18" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="635" y="250" text-anchor="middle" fill="#7ee787" font-size="7">Cross-engine knowledge flow</text>

  <!-- Compound effect visualization (bottom) -->
  <rect x="50" y="370" width="450" height="165" rx="8" fill="#12122a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="275" y="395" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="bold">Compound Effect Over Time</text>

  <!-- Timeline -->
  <line x1="80" y1="430" x2="470" y2="430" stroke="#555" stroke-width="1"/>
  <text x="80" y="445" fill="#8b8ba0" font-size="8">Session 1</text>
  <text x="200" y="445" fill="#8b8ba0" font-size="8">Session 10</text>
  <text x="340" y="445" fill="#8b8ba0" font-size="8">Session 50</text>
  <text x="440" y="445" fill="#8b8ba0" font-size="8">Session 100</text>

  <!-- Growth curve -->
  <path d="M80,425 Q150,420 200,410 Q280,395 340,370 Q400,340 470,300" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="480" y="303" fill="#7ee787" font-size="8">DDD richness</text>

  <!-- Regular AI line (flat) -->
  <line x1="80" y1="425" x2="470" y2="425" stroke="#f78166" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="480" y="428" fill="#f78166" font-size="8">Regular AI (flat)</text>

  <!-- Key examples -->
  <text x="80" y="470" fill="#e6edf3" font-size="9">Pipeline discovers new pattern -> TECH.md -> Pollinate markets capability</text>
  <text x="80" y="488" fill="#e6edf3" font-size="9">Pollinate finds audience pain -> PRODUCT.md -> Pipeline prioritizes fix</text>
  <text x="80" y="506" fill="#e6edf3" font-size="9">User corrects once -> All future sessions follow correction</text>
  <text x="80" y="524" fill="#7ee787" font-size="9" font-weight="bold">Each engine delivery makes EVERY engine smarter -- via shared DDD</text>
</svg>