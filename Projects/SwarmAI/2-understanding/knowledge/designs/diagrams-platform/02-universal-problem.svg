<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="sans-serif">
  <rect width="750" height="420" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">The Universal Bottleneck: Domain-Blindness Across All AI Delivery</text>

  <!-- Three delivery types -->
  <rect x="40" y="60" width="200" height="120" rx="8" fill="#2b1015" stroke="#f78166" stroke-width="1.5"/>
  <text x="140" y="85" text-anchor="middle" fill="#f78166" font-size="12" font-weight="bold">Code Delivery</text>
  <text x="140" y="108" text-anchor="middle" fill="#e6edf3" font-size="9">Technically correct implementation</text>
  <text x="140" y="123" text-anchor="middle" fill="#e6edf3" font-size="9">that violates project conventions,</text>
  <text x="140" y="138" text-anchor="middle" fill="#e6edf3" font-size="9">repeats past mistakes, misses</text>
  <text x="140" y="153" text-anchor="middle" fill="#e6edf3" font-size="9">established patterns</text>
  <text x="140" y="172" text-anchor="middle" fill="#f78166" font-size="9">Domain-wrong code</text>

  <rect x="275" y="60" width="200" height="120" rx="8" fill="#2b1015" stroke="#f78166" stroke-width="1.5"/>
  <text x="375" y="85" text-anchor="middle" fill="#f78166" font-size="12" font-weight="bold">Content Delivery</text>
  <text x="375" y="108" text-anchor="middle" fill="#e6edf3" font-size="9">Well-written content that uses</text>
  <text x="375" y="123" text-anchor="middle" fill="#e6edf3" font-size="9">wrong brand voice, targets</text>
  <text x="375" y="138" text-anchor="middle" fill="#e6edf3" font-size="9">wrong audience, contradicts</text>
  <text x="375" y="153" text-anchor="middle" fill="#e6edf3" font-size="9">prior messaging</text>
  <text x="375" y="172" text-anchor="middle" fill="#f78166" font-size="9">Off-brand content</text>

  <rect x="510" y="60" width="200" height="120" rx="8" fill="#2b1015" stroke="#f78166" stroke-width="1.5"/>
  <text x="610" y="85" text-anchor="middle" fill="#f78166" font-size="12" font-weight="bold">Analysis Delivery</text>
  <text x="610" y="108" text-anchor="middle" fill="#e6edf3" font-size="9">Rigorous analysis that ignores</text>
  <text x="610" y="123" text-anchor="middle" fill="#e6edf3" font-size="9">organizational context, prior</text>
  <text x="610" y="138" text-anchor="middle" fill="#e6edf3" font-size="9">decisions, stakeholder dynamics,</text>
  <text x="610" y="153" text-anchor="middle" fill="#e6edf3" font-size="9">known constraints</text>
  <text x="610" y="172" text-anchor="middle" fill="#f78166" font-size="9">Context-deaf analysis</text>

  <!-- Root cause arrow -->
  <line x1="140" y1="185" x2="375" y2="220" stroke="#f78166" stroke-width="1.5"/>
  <line x1="375" y1="185" x2="375" y2="220" stroke="#f78166" stroke-width="1.5"/>
  <line x1="610" y1="185" x2="375" y2="220" stroke="#f78166" stroke-width="1.5"/>

  <!-- Root cause box -->
  <rect x="200" y="220" width="350" height="55" rx="8" fill="#3b1520" stroke="#f78166" stroke-width="2"/>
  <text x="375" y="242" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">Same Root Cause</text>
  <text x="375" y="262" text-anchor="middle" fill="#e6edf3" font-size="10">Smart but amnesiac: no persistent domain knowledge</text>

  <!-- Why existing approaches fail -->
  <rect x="40" y="295" width="200" height="55" rx="6" fill="#1e1e3a" stroke="#555" stroke-width="1"/>
  <text x="140" y="315" text-anchor="middle" fill="#8b8ba0" font-size="10">Documentation dies</text>
  <text x="140" y="333" text-anchor="middle" fill="#666" font-size="9">Maintenance cost > benefit</text>

  <rect x="275" y="295" width="200" height="55" rx="6" fill="#1e1e3a" stroke="#555" stroke-width="1"/>
  <text x="375" y="315" text-anchor="middle" fill="#8b8ba0" font-size="10">Knowledge trapped per-project</text>
  <text x="375" y="333" text-anchor="middle" fill="#666" font-size="9">No cross-project routing</text>

  <rect x="510" y="295" width="200" height="55" rx="6" fill="#1e1e3a" stroke="#555" stroke-width="1"/>
  <text x="610" y="315" text-anchor="middle" fill="#8b8ba0" font-size="10">RAG retrieves, doesn't judge</text>
  <text x="610" y="333" text-anchor="middle" fill="#666" font-size="9">Finds text, lacks understanding</text>

  <!-- Solution -->
  <rect x="175" y="370" width="400" height="40" rx="8" fill="#0d2240" stroke="#58a6ff" stroke-width="2"/>
  <text x="375" y="395" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Solution: DDD -- Domain expertise as self-growing infrastructure</text>
</svg>