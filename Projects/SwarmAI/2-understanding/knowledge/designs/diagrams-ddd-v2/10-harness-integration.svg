<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="sans-serif">
  <!-- Background -->
  <rect width="780" height="700" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="390" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">DDD in the Agent Harness Runtime</text>

  <!-- Outer frame: Agent Harness -->
  <rect x="20" y="45" width="740" height="640" rx="10" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="40" y="68" fill="#58a6ff" font-size="13" font-weight="bold">AGENT HARNESS (Runtime Framework)</text>

  <!-- Row 1: Context System (11 files) -->
  <rect x="40" y="80" width="700" height="100" rx="8" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <text x="55" y="100" fill="#7ee787" font-size="12" font-weight="bold">System Prompt / Context Management (11 Files, P0-P10)</text>

  <!-- File boxes -->
  <rect x="55" y="110" width="65" height="35" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="87" y="125" fill="#e6edf3" font-size="8" text-anchor="middle">P0-P2</text>
  <text x="87" y="137" fill="#e6edf3" font-size="7" text-anchor="middle">Identity</text>

  <rect x="130" y="110" width="65" height="35" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="162" y="125" fill="#e6edf3" font-size="8" text-anchor="middle">P3-P5</text>
  <text x="162" y="137" fill="#e6edf3" font-size="7" text-anchor="middle">Agent/User</text>

  <rect x="205" y="110" width="65" height="35" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="237" y="125" fill="#e6edf3" font-size="8" text-anchor="middle">P6</text>
  <text x="237" y="137" fill="#e6edf3" font-size="7" text-anchor="middle">Tools</text>

  <rect x="280" y="110" width="80" height="35" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="320" y="125" fill="#d2a8ff" font-size="8" text-anchor="middle">P7 MEMORY</text>
  <text x="320" y="137" fill="#d2a8ff" font-size="7" text-anchor="middle">Tier 2: Agent</text>

  <rect x="370" y="110" width="80" height="35" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="410" y="125" fill="#f78166" font-size="8" text-anchor="middle">P8 EVOLUTION</text>
  <text x="410" y="137" fill="#f78166" font-size="7" text-anchor="middle">Self-improve</text>

  <rect x="460" y="110" width="95" height="35" rx="4" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="507" y="125" fill="#58a6ff" font-size="8" text-anchor="middle">P9 KNOWLEDGE</text>
  <text x="507" y="137" fill="#58a6ff" font-size="7" text-anchor="middle">Tier 3: Common</text>

  <rect x="565" y="110" width="155" height="35" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="2"/>
  <text x="642" y="122" fill="#7ee787" font-size="8" text-anchor="middle">P10 PROJECTS.md</text>
  <text x="642" y="134" fill="#7ee787" font-size="7" text-anchor="middle">Entity Index + Registry</text>
  <text x="642" y="145" fill="#f78166" font-size="7" text-anchor="middle">DDD ENTRY POINT</text>

  <!-- Row 2: Four-Tier Knowledge Pyramid -->
  <rect x="40" y="195" width="420" height="185" rx="8" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="55" y="215" fill="#d2a8ff" font-size="12" font-weight="bold">Four-Tier Knowledge Pyramid</text>

  <!-- Tier 1 -->
  <rect x="60" y="225" width="380" height="28" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="70" y="243" fill="#e6edf3" font-size="9">Tier 1: DailyActivity — raw session logs (30d TTL)</text>

  <!-- Tier 2 -->
  <rect x="60" y="258" width="380" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="70" y="276" fill="#d2a8ff" font-size="9">Tier 2: MEMORY.md — agent behavioral recall (permanent)</text>

  <!-- Tier 3 -->
  <rect x="60" y="291" width="380" height="28" rx="4" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1"/>
  <text x="70" y="309" fill="#58a6ff" font-size="9">Tier 3: Knowledge/ — workspace common knowledge (research, designs, references)</text>

  <!-- Tier 4 -->
  <rect x="60" y="324" width="380" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="70" y="342" fill="#7ee787" font-size="9" font-weight="bold">Tier 4: DDD — authoritative per-project domain expertise</text>

  <!-- Promotion arrows -->
  <text x="445" y="242" fill="#f78166" font-size="8">distill</text>
  <line x1="440" y1="245" x2="440" y2="268" stroke="#f78166" stroke-width="1" marker-end="url(#arr)"/>
  <text x="445" y="276" fill="#f78166" font-size="8">enrich</text>
  <line x1="440" y1="280" x2="440" y2="302" stroke="#f78166" stroke-width="1" marker-end="url(#arr)"/>
  <text x="445" y="310" fill="#f78166" font-size="8">cultivate</text>
  <line x1="440" y1="313" x2="440" y2="335" stroke="#f78166" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Row 2 right: Self-Evolution -->
  <rect x="480" y="195" width="260" height="185" rx="8" fill="none" stroke="#f78166" stroke-width="1.5"/>
  <text x="495" y="215" fill="#f78166" font-size="12" font-weight="bold">Self-Evolution Loop</text>

  <rect x="495" y="228" width="230" height="25" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="505" y="245" fill="#e6edf3" font-size="9">Corrections → EVOLUTION.md</text>

  <rect x="495" y="258" width="230" height="25" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="505" y="275" fill="#e6edf3" font-size="9">→ Channel 6 → IMPROVEMENT.md</text>

  <rect x="495" y="288" width="230" height="25" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="505" y="305" fill="#e6edf3" font-size="9">DDD maturity → competence signal</text>

  <rect x="495" y="318" width="230" height="25" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="505" y="335" fill="#e6edf3" font-size="9">Rejections → steeringify → rules</text>

  <text x="610" y="362" fill="#d2a8ff" font-size="8" text-anchor="middle">Bidirectional: Evolution + DDD</text>

  <!-- Row 3: Hooks -->
  <rect x="40" y="395" width="700" height="120" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="55" y="415" fill="#58a6ff" font-size="12" font-weight="bold">Session Hooks (run at session end, zero runtime overhead)</text>

  <rect x="55" y="427" width="165" height="45" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="137" y="443" fill="#7ee787" font-size="9" text-anchor="middle" font-weight="bold">context_health_hook</text>
  <text x="137" y="456" fill="#e6edf3" font-size="8" text-anchor="middle">Health scores</text>
  <text x="137" y="467" fill="#e6edf3" font-size="8" text-anchor="middle">Entity Index refresh</text>

  <rect x="230" y="427" width="165" height="45" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="312" y="443" fill="#d2a8ff" font-size="9" text-anchor="middle" font-weight="bold">daily_activity_hook</text>
  <text x="312" y="456" fill="#e6edf3" font-size="8" text-anchor="middle">JSONL sidecar</text>
  <text x="312" y="467" fill="#e6edf3" font-size="8" text-anchor="middle">Channel 5 + 6 feed</text>

  <rect x="405" y="427" width="165" height="45" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="487" y="443" fill="#f78166" font-size="9" text-anchor="middle" font-weight="bold">evolution_hook</text>
  <text x="487" y="456" fill="#e6edf3" font-size="8" text-anchor="middle">Corrections → Ch6</text>
  <text x="487" y="467" fill="#e6edf3" font-size="8" text-anchor="middle">Competence tracking</text>

  <rect x="580" y="427" width="145" height="45" rx="4" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1"/>
  <text x="652" y="443" fill="#58a6ff" font-size="9" text-anchor="middle" font-weight="bold">distillation_hook</text>
  <text x="652" y="456" fill="#e6edf3" font-size="8" text-anchor="middle">Tier 1 → Tier 2</text>
  <text x="652" y="467" fill="#e6edf3" font-size="8" text-anchor="middle">Tier 1 → Tier 4 bridge</text>

  <text x="390" y="500" fill="#e6edf3" font-size="9" text-anchor="middle" font-style="italic">All hooks: existing infrastructure. Cultivation = new consumer of existing signals.</text>

  <!-- Row 4: DDD Documents -->
  <rect x="40" y="525" width="700" height="75" rx="8" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="55" y="545" fill="#7ee787" font-size="12" font-weight="bold">DDD Documents — Tier 4 (per project, filesystem + git)</text>

  <rect x="60" y="555" width="155" height="32" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="137" y="575" fill="#7ee787" font-size="10" text-anchor="middle">PRODUCT.md</text>

  <rect x="225" y="555" width="155" height="32" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="302" y="575" fill="#7ee787" font-size="10" text-anchor="middle">TECH.md</text>

  <rect x="390" y="555" width="155" height="32" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="467" y="575" fill="#7ee787" font-size="10" text-anchor="middle">IMPROVEMENT.md</text>

  <rect x="555" y="555" width="155" height="32" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="632" y="575" fill="#7ee787" font-size="10" text-anchor="middle">PROJECT.md</text>

  <!-- Bottom summary -->
  <rect x="40" y="615" width="700" height="55" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="390" y="633" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="bold">KEY: DDD adds ZERO new infrastructure. New CONSUMER of existing harness signals.</text>
  <text x="390" y="648" fill="#e6edf3" font-size="9" text-anchor="middle">Context loader reads DDD (Tier 4). KNOWLEDGE.md indexes Tier 3. Hooks feed cultivation.</text>
  <text x="390" y="663" fill="#e6edf3" font-size="9" text-anchor="middle">Memory pipeline bridges Tier 1→2→4. Knowledge/ enriches DDD via Channel 2. Evolution cross-pollinates.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f78166"/>
    </marker>
  </defs>
</svg>
