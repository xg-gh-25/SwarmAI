<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="sans-serif">
  <rect width="760" height="480" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Quality Convergence Loop Feeding DDD</text>

  <!-- Pipeline stages (left column) -->
  <text x="100" y="65" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Pipeline Stages</text>

  <rect x="35" y="80" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="101" text-anchor="middle" fill="#58a6ff" font-size="10">EVALUATE</text>

  <rect x="35" y="125" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="146" text-anchor="middle" fill="#58a6ff" font-size="10">THINK</text>

  <rect x="35" y="170" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="191" text-anchor="middle" fill="#58a6ff" font-size="10">PLAN</text>

  <rect x="35" y="215" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="236" text-anchor="middle" fill="#58a6ff" font-size="10">BUILD</text>

  <rect x="35" y="260" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="281" text-anchor="middle" fill="#58a6ff" font-size="10">REVIEW</text>

  <rect x="35" y="305" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="326" text-anchor="middle" fill="#58a6ff" font-size="10">TEST</text>

  <rect x="35" y="350" width="130" height="34" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="2"/>
  <text x="100" y="371" text-anchor="middle" fill="#d2a8ff" font-size="10">REFLECT</text>

  <!-- Arrows between stages -->
  <line x1="100" y1="114" x2="100" y2="125" stroke="#58a6ff" stroke-width="1"/>
  <line x1="100" y1="159" x2="100" y2="170" stroke="#58a6ff" stroke-width="1"/>
  <line x1="100" y1="204" x2="100" y2="215" stroke="#58a6ff" stroke-width="1"/>
  <line x1="100" y1="249" x2="100" y2="260" stroke="#58a6ff" stroke-width="1"/>
  <line x1="100" y1="294" x2="100" y2="305" stroke="#58a6ff" stroke-width="1"/>
  <line x1="100" y1="339" x2="100" y2="350" stroke="#58a6ff" stroke-width="1"/>

  <!-- DDD reads (right arrows from stages) -->
  <text x="260" y="65" text-anchor="middle" fill="#7ee787" font-size="11">Reads DDD</text>

  <line x1="165" y1="97" x2="215" y2="97" stroke="#7ee787" stroke-width="1" stroke-dasharray="3"/>
  <text x="230" y="101" fill="#7ee787" font-size="8">context</text>
  <line x1="165" y1="142" x2="215" y2="142" stroke="#7ee787" stroke-width="1" stroke-dasharray="3"/>
  <text x="230" y="146" fill="#7ee787" font-size="8">patterns</text>
  <line x1="165" y1="187" x2="215" y2="187" stroke="#7ee787" stroke-width="1" stroke-dasharray="3"/>
  <text x="230" y="191" fill="#7ee787" font-size="8">constraints</text>
  <line x1="165" y1="232" x2="215" y2="232" stroke="#7ee787" stroke-width="1" stroke-dasharray="3"/>
  <text x="230" y="236" fill="#7ee787" font-size="8">conventions</text>
  <line x1="165" y1="277" x2="215" y2="277" stroke="#7ee787" stroke-width="1" stroke-dasharray="3"/>
  <text x="230" y="281" fill="#7ee787" font-size="8">standards</text>
  <line x1="165" y1="322" x2="215" y2="322" stroke="#7ee787" stroke-width="1" stroke-dasharray="3"/>
  <text x="230" y="326" fill="#7ee787" font-size="8">past failures</text>

  <!-- REFLECT generates proposals -->
  <line x1="165" y1="367" x2="340" y2="367" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="337,363 345,367 337,371" fill="#d2a8ff"/>
  <text x="252" y="360" text-anchor="middle" fill="#d2a8ff" font-size="9">Generates proposals</text>

  <!-- Proposal box -->
  <rect x="345" y="340" width="130" height="55" rx="8" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="410" y="362" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="bold">Proposals</text>
  <text x="410" y="380" text-anchor="middle" fill="#e6edf3" font-size="8">Lessons learned</text>
  <text x="410" y="392" text-anchor="middle" fill="#e6edf3" font-size="8">Pattern updates</text>

  <!-- Approval gate -->
  <line x1="475" y1="367" x2="520" y2="367" stroke="#f78166" stroke-width="1.5"/>
  <polygon points="517,363 525,367 517,371" fill="#f78166"/>

  <rect x="525" y="347" width="80" height="40" rx="6" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="565" y="372" text-anchor="middle" fill="#f78166" font-size="10" font-weight="bold">APPROVE</text>

  <!-- DDD (right side, large) -->
  <rect x="530" y="80" width="190" height="230" rx="8" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="625" y="105" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="bold">DDD Knowledge</text>

  <rect x="548" y="118" width="155" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="625" y="136" text-anchor="middle" fill="#e6edf3" font-size="9">PRODUCT.md (strategic)</text>

  <rect x="548" y="153" width="155" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="625" y="171" text-anchor="middle" fill="#e6edf3" font-size="9">TECH.md (tactical)</text>

  <rect x="548" y="188" width="155" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="625" y="206" text-anchor="middle" fill="#e6edf3" font-size="9">IMPROVEMENT.md (historical)</text>

  <rect x="548" y="223" width="155" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="0.8"/>
  <text x="625" y="241" text-anchor="middle" fill="#e6edf3" font-size="9">PROJECT.md (operational)</text>

  <!-- Maturity indicator -->
  <rect x="548" y="265" width="155" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="0.8"/>
  <text x="625" y="283" text-anchor="middle" fill="#d2a8ff" font-size="9">Maturity: Growing -> Mature</text>

  <!-- Arrow from Approval to DDD -->
  <path d="M 605 347 L 625 310" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <polygon points="622,313 627,307 620,310" fill="#7ee787"/>
  <text x="640" y="335" fill="#7ee787" font-size="8">Writes</text>

  <!-- Feedback loop: DDD back to pipeline (large curve) -->
  <path d="M 530 195 Q 400 50, 165 97" fill="none" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="5"/>
  <polygon points="168,94 162,100 167,99" fill="#7ee787"/>
  <text x="350" y="52" text-anchor="middle" fill="#7ee787" font-size="10">Next session reads richer DDD</text>

  <!-- GOAL.md + BACKLOG.md -->
  <rect x="340" y="430" width="200" height="35" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="440" y="452" text-anchor="middle" fill="#58a6ff" font-size="10">GOAL.md + BACKLOG.md enable cross-session memory</text>

  <!-- Arrow from goal to pipeline -->
  <path d="M 340 447 Q 200 447, 100 384" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3"/>
  <polygon points="103,387 97,381 101,385" fill="#58a6ff"/>
</svg>