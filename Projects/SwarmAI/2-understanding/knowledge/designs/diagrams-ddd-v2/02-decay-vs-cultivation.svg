<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" font-family="sans-serif">
  <rect width="750" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Documentation Decay vs Cultivation Flywheel</text>

  <!-- Divider -->
  <line x1="375" y1="50" x2="375" y2="380" stroke="#e6edf3" stroke-width="0.5" stroke-dasharray="6"/>

  <!-- LEFT: Decay Spiral -->
  <text x="188" y="65" text-anchor="middle" fill="#f78166" font-size="14" font-weight="bold">DECAY SPIRAL</text>
  <text x="188" y="82" text-anchor="middle" fill="#e6edf3" font-size="10">Traditional documentation lifecycle</text>

  <!-- Decay nodes -->
  <rect x="118" y="100" width="140" height="36" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="188" y="123" text-anchor="middle" fill="#f78166" font-size="11">Write docs</text>

  <rect x="118" y="160" width="140" height="36" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="188" y="183" text-anchor="middle" fill="#f78166" font-size="11">Team forgets to update</text>

  <rect x="118" y="220" width="140" height="36" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="188" y="243" text-anchor="middle" fill="#f78166" font-size="11">Docs drift from code</text>

  <rect x="118" y="280" width="140" height="36" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="188" y="303" text-anchor="middle" fill="#f78166" font-size="11">Trust erodes</text>

  <rect x="118" y="340" width="140" height="36" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1.5"/>
  <text x="188" y="363" text-anchor="middle" fill="#f78166" font-size="11">Nobody reads them</text>

  <!-- Decay arrows -->
  <line x1="188" y1="136" x2="188" y2="160" stroke="#f78166" stroke-width="1.2"/>
  <polygon points="184,157 188,163 192,157" fill="#f78166"/>
  <line x1="188" y1="196" x2="188" y2="220" stroke="#f78166" stroke-width="1.2"/>
  <polygon points="184,217 188,223 192,217" fill="#f78166"/>
  <line x1="188" y1="256" x2="188" y2="280" stroke="#f78166" stroke-width="1.2"/>
  <polygon points="184,277 188,283 192,277" fill="#f78166"/>
  <line x1="188" y1="316" x2="188" y2="340" stroke="#f78166" stroke-width="1.2"/>
  <polygon points="184,337 188,343 192,337" fill="#f78166"/>

  <!-- Spiral back arrow -->
  <path d="M 258 358 C 310 358, 310 110, 258 110" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="4"/>
  <polygon points="260,113 255,108 258,115" fill="#f78166"/>
  <text x="300" y="235" fill="#f78166" font-size="9" transform="rotate(90, 300, 235)">Repeat every project</text>

  <!-- RIGHT: Cultivation Flywheel -->
  <text x="562" y="65" text-anchor="middle" fill="#7ee787" font-size="14" font-weight="bold">CULTIVATION FLYWHEEL</text>
  <text x="562" y="82" text-anchor="middle" fill="#e6edf3" font-size="10">Self-sustaining knowledge lifecycle</text>

  <!-- Flywheel - circular arrangement -->
  <circle cx="562" cy="235" r="120" fill="none" stroke="#7ee787" stroke-width="1" stroke-dasharray="4"/>

  <!-- Flywheel nodes -->
  <rect x="522" y="100" width="80" height="32" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="562" y="120" text-anchor="middle" fill="#7ee787" font-size="10">Work</text>

  <rect x="632" y="155" width="80" height="32" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="672" y="175" text-anchor="middle" fill="#7ee787" font-size="10">Extract</text>

  <rect x="652" y="230" width="80" height="32" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="692" y="250" text-anchor="middle" fill="#7ee787" font-size="10">Propose</text>

  <rect x="622" y="305" width="80" height="32" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="662" y="325" text-anchor="middle" fill="#58a6ff" font-size="10">Approve</text>

  <rect x="522" y="340" width="80" height="32" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="562" y="360" text-anchor="middle" fill="#7ee787" font-size="10">DDD Grows</text>

  <rect x="432" y="280" width="80" height="32" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="472" y="300" text-anchor="middle" fill="#d2a8ff" font-size="10">Compound</text>

  <!-- Flywheel arrows -->
  <path d="M 590 132 Q 625 140, 638 155" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <polygon points="636,152 641,158 634,157" fill="#7ee787"/>

  <path d="M 700 187 Q 710 210, 705 230" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <polygon points="702,227 708,233 700,232" fill="#7ee787"/>

  <path d="M 705 262 Q 698 285, 690 305" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <polygon points="687,302 693,308 686,307" fill="#7ee787"/>

  <path d="M 632 337 Q 605 348, 590 350" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <polygon points="593,347 587,353 592,352" fill="#7ee787"/>

  <path d="M 530 360 Q 490 345, 475 312" fill="none" stroke="#7ee787" stroke-width="1.2"/>
  <polygon points="477,315 472,309 478,311" fill="#7ee787"/>

  <path d="M 455 280 Q 445 210, 525 132" fill="none" stroke="#d2a8ff" stroke-width="1.2"/>
  <polygon points="522,135 528,129 525,136" fill="#d2a8ff"/>

  <!-- Center label -->
  <text x="562" y="230" text-anchor="middle" fill="#e6edf3" font-size="10">Zero</text>
  <text x="562" y="244" text-anchor="middle" fill="#e6edf3" font-size="10">maintenance</text>
  <text x="562" y="258" text-anchor="middle" fill="#e6edf3" font-size="10">cost</text>
</svg>