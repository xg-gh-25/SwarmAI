<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="sans-serif">
  <!-- Background -->
  <rect width="780" height="520" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="390" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Pipeline Runtime — Inside the Agent Harness</text>

  <!-- Outer frame: Agent Session -->
  <rect x="20" y="45" width="740" height="460" rx="10" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="40" y="68" fill="#58a6ff" font-size="13" font-weight="bold">AGENT SESSION (single process, single context window)</text>

  <!-- Row 1: Context already loaded -->
  <rect x="40" y="82" width="700" height="70" rx="8" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <text x="55" y="102" fill="#7ee787" font-size="11" font-weight="bold">CONTEXT (already loaded at session start — pipeline doesn't "fetch" it)</text>

  <rect x="55" y="112" width="90" height="28" rx="4" fill="#1a1a2e" stroke="#e6edf3" stroke-width="0.8"/>
  <text x="100" y="130" fill="#e6edf3" font-size="8" text-anchor="middle">P0-P6 (rules)</text>

  <rect x="155" y="112" width="90" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="200" y="130" fill="#d2a8ff" font-size="8" text-anchor="middle">P7 MEMORY</text>

  <rect x="255" y="112" width="90" height="28" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1.2"/>
  <text x="300" y="130" fill="#f78166" font-size="8" text-anchor="middle">P8 EVOLUTION</text>

  <rect x="355" y="112" width="105" height="28" rx="4" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="407" y="130" fill="#58a6ff" font-size="8" text-anchor="middle">P9 KNOWLEDGE</text>

  <rect x="470" y="112" width="120" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="530" y="130" fill="#7ee787" font-size="8" text-anchor="middle">P10 PROJECTS + DDD</text>

  <rect x="600" y="112" width="120" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="660" y="130" fill="#d2a8ff" font-size="8" text-anchor="middle">User preferences</text>

  <!-- Row 2: Pipeline as skill -->
  <rect x="40" y="165" width="700" height="195" rx="8" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="55" y="185" fill="#d2a8ff" font-size="11" font-weight="bold">PIPELINE EXECUTION (skill: s_autonomous-pipeline, same agent, role-switching)</text>

  <!-- 9 stages compact -->
  <rect x="55" y="195" width="670" height="40" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1"/>
  <text x="60" y="212" fill="#58a6ff" font-size="9" font-weight="bold">9 Stages (sequential, single agent switches roles)</text>
  <text x="60" y="227" fill="#e6edf3" font-size="8">EVALUATE → THINK → PLAN → BUILD → REVIEW → TEST → ADVERSARIAL (sub-agent) → DELIVER → REFLECT</text>

  <!-- Convergence Loop -->
  <rect x="55" y="245" width="670" height="40" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="60" y="262" fill="#7ee787" font-size="9" font-weight="bold">Quality Convergence Loop (iterate until push-ready)</text>
  <text x="60" y="277" fill="#e6edf3" font-size="8">Candidate → 6-Layer Gate → pass? → Push-Ready / fail? → identify gap → targeted fix → re-verify</text>

  <!-- Tools accessed -->
  <rect x="55" y="295" width="320" height="50" rx="6" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="65" y="312" fill="#f78166" font-size="9" font-weight="bold">Tools (via SDK + MCP)</text>
  <text x="65" y="326" fill="#e6edf3" font-size="8">Read/Write files, Run tests, Git operations,</text>
  <text x="65" y="338" fill="#e6edf3" font-size="8">Grep/Search, Bash commands, Sub-agent spawn</text>

  <!-- DDD access -->
  <rect x="385" y="295" width="340" height="50" rx="6" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="395" y="312" fill="#7ee787" font-size="9" font-weight="bold">DDD Access (on-demand reads per stage)</text>
  <text x="395" y="326" fill="#e6edf3" font-size="8">PRODUCT.md, TECH.md, IMPROVEMENT.md, PROJECT.md</text>
  <text x="395" y="338" fill="#e6edf3" font-size="8">+ Cross-project pulls via Entity Index</text>

  <!-- Row 3: Write-back path -->
  <rect x="40" y="375" width="700" height="70" rx="8" fill="none" stroke="#f78166" stroke-width="1.5"/>
  <text x="55" y="395" fill="#f78166" font-size="11" font-weight="bold">WRITE-BACK PATH (REFLECT → Cultivation → DDD)</text>

  <!-- Flow boxes -->
  <rect x="55" y="405" width="130" height="28" rx="4" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="120" y="423" fill="#d2a8ff" font-size="9" text-anchor="middle">REFLECT output</text>

  <line x1="190" y1="419" x2="210" y2="419" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="215" y="405" width="140" height="28" rx="4" fill="#1a1a2e" stroke="#f78166" stroke-width="1"/>
  <text x="285" y="423" fill="#f78166" font-size="9" text-anchor="middle">Cultivation proposals</text>

  <line x1="360" y1="419" x2="380" y2="419" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="385" y="405" width="120" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1"/>
  <text x="445" y="423" fill="#7ee787" font-size="9" text-anchor="middle">Approval gate</text>

  <line x1="510" y1="419" x2="530" y2="419" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="535" y="405" width="130" height="28" rx="4" fill="#1a1a2e" stroke="#7ee787" stroke-width="1.5"/>
  <text x="600" y="423" fill="#7ee787" font-size="9" text-anchor="middle">DDD updated</text>

  <!-- Bottom: Why not separate -->
  <rect x="40" y="458" width="700" height="37" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="390" y="474" fill="#d2a8ff" font-size="10" text-anchor="middle" font-weight="bold">WHY IN-SESSION: Zero context transfer cost. Full tool access. No state sync. No separate infra.</text>
  <text x="390" y="488" fill="#e6edf3" font-size="9" text-anchor="middle">Tradeoff: shares context window with user. Managed by convergence loop budget awareness (max iterations).</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e6edf3"/>
    </marker>
  </defs>
</svg>
