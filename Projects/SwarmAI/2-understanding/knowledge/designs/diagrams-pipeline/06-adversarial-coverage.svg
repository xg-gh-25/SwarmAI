<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="sans-serif">
  <rect width="780" height="420" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Adversarial Review: Coverage Gap</text>
  <text x="390" y="50" text-anchor="middle" fill="#e6edf3" font-size="10" opacity="0.7">What the builder sees vs what the adversarial reviewer catches</text>

  <!-- LEFT: Builder's View -->
  <text x="195" y="80" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Builder's View</text>
  <text x="195" y="98" text-anchor="middle" fill="#e6edf3" font-size="9" opacity="0.7">(same context, same assumptions)</text>

  <rect x="40" y="110" width="310" height="250" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- What builder checks -->
  <rect x="60" y="125" width="270" height="30" rx="6" fill="#1e2a3a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="195" y="144" text-anchor="middle" fill="#7ee787" font-size="10">Tests pass (unit + integration)</text>

  <rect x="60" y="165" width="270" height="30" rx="6" fill="#1e2a3a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="195" y="184" text-anchor="middle" fill="#7ee787" font-size="10">Code compiles, types check</text>

  <rect x="60" y="205" width="270" height="30" rx="6" fill="#1e2a3a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="195" y="224" text-anchor="middle" fill="#7ee787" font-size="10">Happy path works correctly</text>

  <rect x="60" y="245" width="270" height="30" rx="6" fill="#1e2a3a" stroke="#7ee787" stroke-width="1.5"/>
  <text x="195" y="264" text-anchor="middle" fill="#7ee787" font-size="10">Matches spec from PLAN stage</text>

  <!-- Blind spots -->
  <rect x="60" y="290" width="270" height="55" rx="6" fill="none" stroke="#f78166" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="195" y="308" text-anchor="middle" fill="#f78166" font-size="10" font-weight="bold">BLIND SPOTS</text>
  <text x="195" y="326" text-anchor="middle" fill="#f78166" font-size="9">Cannot see own assumptions</text>
  <text x="195" y="340" text-anchor="middle" fill="#f78166" font-size="9">Builder bias: "it works for me"</text>

  <!-- Divider -->
  <line x1="390" y1="70" x2="390" y2="400" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- RIGHT: Adversarial View -->
  <text x="585" y="80" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">Adversarial View</text>
  <text x="585" y="98" text-anchor="middle" fill="#e6edf3" font-size="9" opacity="0.7">(fresh context, no builder bias)</text>

  <rect x="430" y="110" width="320" height="250" rx="8" fill="none" stroke="#f78166" stroke-width="1.5"/>

  <!-- What adversarial catches -->
  <rect x="450" y="125" width="280" height="30" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="590" y="144" text-anchor="middle" fill="#f78166" font-size="10">State machine gaps (missing transitions)</text>

  <rect x="450" y="165" width="280" height="30" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="590" y="184" text-anchor="middle" fill="#f78166" font-size="10">Cross-boundary errors (module interfaces)</text>

  <rect x="450" y="205" width="280" height="30" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="590" y="224" text-anchor="middle" fill="#f78166" font-size="10">Happy-path assumptions (edge cases ignored)</text>

  <rect x="450" y="245" width="280" height="30" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="590" y="264" text-anchor="middle" fill="#f78166" font-size="10">Concurrency / race conditions</text>

  <rect x="450" y="285" width="280" height="30" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="590" y="304" text-anchor="middle" fill="#f78166" font-size="10">Silent failures (errors swallowed)</text>

  <rect x="450" y="325" width="280" height="30" rx="6" fill="#1e2a3a" stroke="#f78166" stroke-width="1.5"/>
  <text x="590" y="344" text-anchor="middle" fill="#f78166" font-size="10">Convention violations (DDD anti-patterns)</text>

  <!-- Architecture position -->
  <rect x="150" y="375" width="480" height="35" rx="8" fill="#1e2a3a" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="390" y="397" text-anchor="middle" fill="#d2a8ff" font-size="10">Dual position: Stage 7 of pipeline + Layer 4 of Push-Ready Gate</text>
</svg>