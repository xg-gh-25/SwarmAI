# SwarmAI — Delivery Contract (⑤): the asset this DDD GOVERNs.
# Paradigm: DDD = portable capability package (2026-07-19 design doc).
#
# RETROFIT (why this file was missing): the SwarmAI DDD was created 2026-03-23,
# BEFORE the governed-assets paradigm (2026-07-19), so it had no bindings.yaml and
# the P6 gate mis-read it as a "0-asset pure-knowledge brain". It is NOT — SWARMAI.md
# canonically calls it "a code-repo brain for the SwarmAI product source". A freshly
# built code-intel.json already sits at the project root (⑥ projection of that source),
# which contradicted the "no code-repo asset" reading. This file declares the source.
#
# SELF-HOSTED case (unique among the DDDs): the governed repo IS the codebase this
# daemon runs from — the worktree already exists locally, no clone needed. Ownership
# follows the package: the product source + its design knowledge (②) travel together.

ddd_spec_version: "1.0"
brain_kind: code-repo            # read-out spectrum example, NOT a rigid type enum

governed_assets:
  - kind: code-repo
    name: swarmai
    description: >-
      The SwarmAI product source (backend FastAPI daemon + desktop Tauri/React + hive)
      — github.com/xg-gh-25/SwarmAI (PUBLIC). The DDD GOVERNs it (指+治), never CONTAINS
      it; the ⑥ refresher projects it into the code-intel.json already at the project
      root. This is the SELF-HOSTED repo — the very codebase this daemon runs from.

# JOBS (governed asset kind: job — NOT a 7th section). SwarmAI's scheduled jobs are
# platform system-jobs (Services/swarm-jobs), not DDD-owned domain jobs → none here.
jobs: []

# ── Repo delivery contract (§3.6) ───────────────────────────────────────────────
bindings:
  - repo: swarmai
    kind: external                 # public github repo (git-clonable); NOT Amazon-internal
    clone: "https://github.com/xg-gh-25/SwarmAI.git"
    worktree: /Users/gawan/Desktop/SwarmAI-Workspace/swarmai   # self-hosted: already present, no clone
    delivery_contract:
      remote_kind: self-hosted-main   # main-only auto-commit, no PR/CR (STEERING #5: commit=auto, push=user)
      build_system: local-script      # built by prod.sh / npm run build:all (command recorded in deploy_pipeline)
      branch: main
      version_set: null
      deploy_pipeline: "prod.sh (build/deploy) · s_swarm-build / s_swarm-daemon / s_swarm-release"
      refresh_policy: on-develop   # ⑤ policy: ⑥ regenerates code-intel.json on develop
      review_path: s_autonomous-pipeline   # SwarmAI's review = the pipeline's Gate-2 adversarial (main-only, no external CR/PR)
      auto_send: manual-push       # STEERING #5: commit=auto, push=user decision

# Enablement skills (aim.json native_skills: s_ddd-*, s_ai-ready-repo) are NOT governed
# assets — they are SwarmAI-platform capabilities. On SwarmAI the official built-in
# version wins (tier: built-in > ddd). SwarmAI has no DDD-owned domain skill-set.
